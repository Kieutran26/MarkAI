<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth Practice — Vibecode Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101010;--bgc:#181818;--bgi:#131313;
  --bd:#272727;--tx:#e0e0e0;--txm:#707070;--txd:#3a3a3a;
  --ac:#E88C2E;--acl:#ffb05c;
  --abg:rgba(232,140,46,.08);--abg2:rgba(232,140,46,.18);
  --success:#22c55e;--error:#ef4444;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Space Grotesk',sans-serif;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--tx);min-height:100vh;padding:24px 16px;
}
.pr{max-width:900px;margin:0 auto}
.pr-h{margin-bottom:24px;border-left:2px solid var(--ac);padding-left:16px}
.pr-g{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ac);font-weight:700;letter-spacing:1px;margin-bottom:4px}
.pr-d{font-size:13px;color:var(--txm)}

.pr-card{background:var(--bgc);border:1px solid var(--bd);padding:24px;position:relative;border-radius:3px}

.role-sel{display:flex;gap:10px;margin-bottom:24px}
.role-b{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:8px 16px;background:var(--bg);border:1px solid var(--bd);color:var(--txm);cursor:pointer;transition:all .2s;text-transform:uppercase;flex:1;text-align:center}
.role-b.on{border-color:var(--ac);color:var(--ac);background:var(--abg)}

.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
@media(max-width:600px){.res-grid{grid-template-columns:repeat(2,1fr)}}

.res-c{background:var(--bgi);border:1px solid var(--bd);padding:16px;text-align:center;cursor:pointer;transition:all .2s;border-radius:2px;position:relative}
.res-c:hover{border-color:var(--txm)}
.res-c.ok{border-color:var(--success);background:rgba(34,197,94,.05)}
.res-c.no{border-color:var(--error);background:rgba(239,68,68,.05)}

.res-n{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
.res-d{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--txm)}
.res-st{position:absolute;top:6px;right:8px;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700}

.fb{padding:12px 16px;border:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--txm);margin-bottom:16px;background:var(--bg)}
.fb.ok{border-color:var(--success);color:var(--success)}
.fb.no{border-color:var(--error);color:var(--error)}

.matrix{width:100%;border-collapse:collapse;margin-top:20px;font-family:'JetBrains Mono',monospace;font-size:10px}
.matrix th,.matrix td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
.matrix th{color:var(--txm);font-weight:500}
.matrix .hl{color:var(--ac);background:var(--abg)}

/* Badge Hint - Vibecode Style */
.btn-hint {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--ac);
  color: #000;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px;
  padding: 2px 6px;
  border-radius: 2px;
  white-space: nowrap;
  pointer-events: none;
  animation: pulseTop 2s infinite;
  z-index: 999;
  font-weight: 700;
}
.btn-hint::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 4px solid var(--ac);
}
@keyframes pulseTop {
  0% { transform: translateX(-50%) scale(1); }
  50% { transform: translateX(-50%) scale(1.08); }
  100% { transform: translateX(-50%) scale(1); }
}
</style>
</head>
<body>

<main class="pr">
  <div class="pr-h">
    <div class="pr-g">AUTH LABORATORY</div>
    <p class="pr-d">Thử nghiệm phân quyền (Authorization) với các vai trò khác nhau.</p>
  </div>

  <div class="pr-card">
    <div class="role-sel">
      <button class="role-b on" onclick="setRole('user')">User</button>
      <button class="role-b" onclick="setRole('admin')">Admin</button>
      <button class="role-b" onclick="setRole('guest')">Guest</button>
    </div>

    <div class="res-grid" id="resGrid"></div>

    <div id="fb" class="fb">Chọn một vai trò và thử truy cập các tài nguyên bên dưới.</div>

    <table class="matrix" id="matrix">
      <thead>
        <tr>
          <th>Tài nguyên</th>
          <th>Guest</th>
          <th>User</th>
          <th>Admin</th>
        </tr>
      </thead>
      <tbody id="mBody"></tbody>
    </table>
  </div>
</main>

<script>
const resources = [
  { id:'dash', name:'Dashboard', desc:'Trang tổng quan' },
  { id:'prof', name:'Profile', desc:'Hồ sơ cá nhân' },
  { id:'anal', name:'Analytics', desc:'Dữ liệu phân tích' },
  { id:'sett', name:'Settings', desc:'Cài đặt hệ thống' },
  { id:'user', name:'User Mgmt', desc:'Quản lý người dùng' }
];

const perms = {
  guest: { dash:false, prof:false, anal:false, sett:false, user:false },
  user:  { dash:true,  prof:true,  anal:true,  sett:false, user:false },
  admin: { dash:true,  prof:true,  anal:true,  sett:true,  user:true  }
};

let curRole = 'user';
let results = {};

function setRole(r) {
    curRole = r;
    results = {};
    document.querySelectorAll('.role-b').forEach(b => b.classList.toggle('on', b.textContent.toLowerCase() === r));
    
    // Hide hint
    const hint = document.querySelector('.btn-hint');
    if (hint) hint.style.display = 'none';
    
    render();
}

function check(id) {
    results[id] = perms[curRole][id];
    render();
}

function render() {
    const grid = document.getElementById('resGrid');
    grid.innerHTML = resources.map(r => {
        const st = results[r.id];
        const cls = st === true ? 'ok' : st === false ? 'no' : '';
        const txt = st === true ? 'GRANTED' : st === false ? 'DENIED' : '';
        const hint = r.id === 'dash' && st === undefined
          ? '<div class="btn-hint">Click me!</div>'
          : '';
        return `
            <div class="res-c ${cls}" onclick="check('${r.id}')">
                ${hint}
                <span class="res-st">${txt}</span>
                <span class="res-n">${r.name}</span>
                <span class="res-d">${r.desc}</span>
            </div>
        `;
    }).join('');

    const fb = document.getElementById('fb');
    const checked = Object.keys(results).length;
    if(checked === 0) {
        fb.className = 'fb';
        fb.textContent = `Vai trò hiện tại: ${curRole.toUpperCase()}. Nhấp để kiểm tra quyền.`;
    } else {
        const denied = Object.values(results).filter(v => !v).length;
        if(denied > 0) {
            fb.className = 'fb no';
            fb.textContent = `Role ${curRole.toUpperCase()} bị chặn ${denied} tài nguyên. Đây là Authorization FAILED.`;
        } else {
            fb.className = 'fb ok';
            fb.textContent = `Role ${curRole.toUpperCase()} được cấp quyền truy cập. Authorization GRANTED.`;
        }
    }

    const mBody = document.getElementById('mBody');
    mBody.innerHTML = resources.filter(r => results[r.id] !== undefined).map(r => `
        <tr>
            <td>${r.name}</td>
            <td class="${curRole==='guest'?'hl':''}">${perms.guest[r.id]?'OK':'—'}</td>
            <td class="${curRole==='user'?'hl':''}">${perms.user[r.id]?'OK':'—'}</td>
            <td class="${curRole==='admin'?'hl':''}">${perms.admin[r.id]?'OK':'—'}</td>
        </tr>
    `).join('');
}

setRole('user');
</script>
</body>
</html>
