<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Border Demo — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#0f0f12;--bg-card:#16161b;--fg:#e8e4dc;--muted:#6e6e7a;
    --accent:#e88c2e;--accent-soft:rgba(232,140,46,.12);
    --accent-border:rgba(232,140,46,.3);--border:#282830;
    --surface:#1c1c23;--shape-lt:#33333d;--bar-m:#44444f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--fg);
    font-family:'Space Grotesk',sans-serif;line-height:1.6;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:20px 20px;pointer-events:none;z-index:0;
  }

  #app-root{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:24px}

  .sec-lbl{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    letter-spacing:2px;text-transform:uppercase;color:var(--muted);
    margin-bottom:20px;display:flex;align-items:center;gap:10px;
  }
  .sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

  .sim-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
  @media(max-width:600px){.sim-grid{grid-template-columns:1fr}}

  .sc{
    background:var(--bg-card);border:1px solid var(--border);
    padding:20px 14px 18px;cursor:pointer;position:relative;overflow:hidden;
    transition:border-color .3s,background .3s;
  }
  .sc::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:var(--accent);transform:scaleX(1);transform-origin:left;
    transition:transform .35s ease;
  }
  .sc:hover{border-color:var(--accent-border)}
  .sc{border-color:var(--accent-border);background:var(--surface)}

  .sc-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .sc-num{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    color:var(--accent);background:var(--accent-soft);
    border:1px solid var(--accent-border);padding:1px 6px;border-radius:2px;
  }
  .sc-tag{
    font-size:14px;font-weight:600;letter-spacing:-.3px;color:var(--fg);
  }
  .sc::after{
    content:'';position:absolute;top:14px;right:14px;width:5px;height:5px;
    background:var(--accent);border-radius:50%;animation:dp 2.4s ease-in-out infinite;
  }
  @keyframes dp{0%,100%{opacity:.3}50%{opacity:1}}

  .sc-demo{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:90px;align-items:center;margin-bottom:12px}
  .b-sample{width:44px;height:36px;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:border .4s ease;position:relative}
  .b-sample .b-lbl{font-family:'JetBrains Mono',monospace;font-size:7px;color:var(--muted);opacity:0;transition:opacity .3s;position:absolute;bottom:-12px;white-space:nowrap}
  .sc.on .b-sample .b-lbl{opacity:.7}

  .ins{
    margin-top:14px;font-size:11.5px;color:var(--muted);line-height:1.55;
    padding-left:12px;border-left:2px solid var(--border);
  }
  .ins strong{color:var(--accent);font-weight:600}

  @media(max-width:480px){
    #app-root{padding:14px}
    .ins{padding:14px 16px}
  }
</style>
</head>
<body>

<div id="app-root">
  <section aria-label="Mô phỏng border">
    <div class="sim-grid" id="simGrid"></div>
  </section>
</div>

<script>
  const styles = ['none','solid','dashed','dotted','double','groove','ridge'];
  const widths = [1,2,4,6,8];
  const colors = [
    {name:'black',val:'#1a1a1a'},
    {name:'white',val:'#e8e4dc'},
    {name:'accent',val:'#e88c2e'},
    {name:'muted',val:'#6e6e7a'},
    {name:'red',val:'#c43a3a'},
    {name:'green',val:'#3a9e5c'}
  ];

  const presets = [
    {
      num:'01', name:'Style',
      ins:'Style quyết định kiểu đường viền. <strong>"none"</strong> = không hiển thị. <strong>"solid"</strong> = nét liền. <strong>"dashed"</strong> = nét đứt. Đây là thuộc tính bắt buộc.',
      async build(el){
        el.innerHTML = styles.slice(0, 5).map(s=>`<div class="b-sample" style="border:2px ${s} var(--fg)"><span class="b-lbl">${s}</span></div>`).join('');
        const samples = el.querySelectorAll('.b-sample');
        while(true) {
          for(let s of samples) {
            s.style.borderColor = 'var(--accent)';
            await new Promise(r=>setTimeout(r, 600));
            s.style.borderColor = 'var(--fg)';
            await new Promise(r=>setTimeout(r, 200));
          }
        }
      }
    },
    {
      num:'02', name:'Width',
      ins:'Width là <strong>độ dày</strong> của đường viền (px). 1px = siêu mảnh. 4-8px = dày. Không có tác dụng nếu style là <strong>"none"</strong>.',
      async build(el){
        el.innerHTML = widths.map(w=>`<div class="b-sample" style="border:${w}px solid var(--fg)"><span class="b-lbl">${w}px</span></div>`).join('');
        const samples = el.querySelectorAll('.b-sample');
        while(true) {
          for(let s of samples) {
            s.style.transform = 'scale(1.1)';
            s.style.borderColor = 'var(--accent)';
            await new Promise(r=>setTimeout(r, 800));
            s.style.transform = 'scale(1)';
            s.style.borderColor = 'var(--fg)';
            await new Promise(r=>setTimeout(r, 400));
          }
        }
      }
    },
    {
      num:'03', name:'Color',
      ins:'Color quyết định <strong>màu sắc</strong>. Mặc định theo màu chữ. Dùng màu để phân biệt trạng thái: <strong>xám</strong> = normal, <strong>cam</strong> = active.',
      async build(el){
        el.innerHTML = colors.slice(0, 5).map(c=>`<div class="b-sample" style="border:2px solid ${c.val}"><span class="b-lbl">${c.name}</span></div>`).join('');
        const samples = el.querySelectorAll('.b-sample');
        while(true) {
          for(let s of samples) {
            s.style.boxShadow = '0 0 10px ' + s.style.borderColor;
            await new Promise(r=>setTimeout(r, 700));
            s.style.boxShadow = 'none';
            await new Promise(r=>setTimeout(r, 300));
          }
        }
      }
    },
    {
      num:'04', name:'Sides',
      ins:'Có thể đặt riêng từng cạnh (top, right, bottom, left). Dùng shorthand <strong>"border: 1px solid"</strong> để đặt nhanh cả 4 cạnh.',
      async build(el){
        el.innerHTML = `
          <div class="b-sample" id="bs-all" style="border:2px solid var(--fg)"><span class="b-lbl">all</span></div>
          <div class="b-sample" id="bs-top" style="border-top:3px solid var(--accent);border-right:1px dashed var(--muted);border-bottom:1px dashed var(--muted);border-left:1px dashed var(--muted)"><span class="b-lbl">top</span></div>
          <div class="b-sample" id="bs-y" style="border-top:2px solid var(--accent);border-bottom:2px solid var(--accent)"><span class="b-lbl">y-axis</span></div>
        `;
        const bAll = el.querySelector('#bs-all');
        const bTop = el.querySelector('#bs-top');
        const bY = el.querySelector('#bs-y');
        while(true) {
          bAll.style.borderColor = 'var(--accent)'; await new Promise(r=>setTimeout(r, 1000));
          bAll.style.borderColor = 'var(--fg)';
          bTop.style.borderTopColor = 'var(--fg)'; await new Promise(r=>setTimeout(r, 1000));
          bTop.style.borderTopColor = 'var(--accent)';
          bY.style.borderTopColor = 'var(--fg)'; bY.style.borderBottomColor = 'var(--fg)'; await new Promise(r=>setTimeout(r, 1000));
          bY.style.borderTopColor = 'var(--accent)'; bY.style.borderBottomColor = 'var(--accent)';
        }
      }
    }
  ];

  const simGrid = document.getElementById('simGrid');
  const insT = document.getElementById('insT');
  let activeI = 0;
  let autoTimer;

  function renderSim() {
    simGrid.innerHTML = presets.map((p, ci) => `
      <div class="sc" data-i="${ci}" tabindex="0" role="button">
        <div class="sc-top">
          <span class="sc-num">${p.num}</span>
          <h2 class="sc-tag">${p.name}</h2>
        </div>
        <div class="sc-demo" id="sd${ci}"></div>
        <p class="ins">${p.ins}</p>
      </div>`).join('');

    presets.forEach((p, i) => p.build(document.getElementById('sd'+i)));

    simGrid.querySelectorAll('.sc').forEach(c => {
      c.addEventListener('click', () => {
        clearInterval(autoTimer);
        activateCard(+c.dataset.i);
      });
    });
  }

  renderSim();
</script>
</body>
</html>
