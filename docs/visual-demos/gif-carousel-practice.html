<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel / Slider — Practice</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#131110;--fg:#e8e0d4;--muted:#706b64;--accent:#d4712a;--card:#1c1a18;--card-alt:#242120;--border:#302c28;--border-hi:#44403a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,rgba(212,113,42,.035) 0%,transparent 55%),radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 100%,16px 16px;font-family:'Space Grotesk',sans-serif;color:var(--fg);padding:12px 16px;min-height:auto;overflow:hidden}

.pw{width:100%;background:var(--card);border:1px solid var(--border);padding:20px 24px;position:relative;z-index:1}
.pw-h{font-size:15px;font-weight:700;margin-bottom:2px}.pw-h span{color:var(--accent)}
.pw-s{font-size:11px;color:var(--muted);margin-bottom:14px}
.mbs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.mb{padding:6px 12px;border:2px solid var(--border);background:var(--card-alt);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);cursor:pointer;transition:all .2s}.mb:hover{border-color:var(--border-hi)}.mb.on{border-color:var(--accent);color:var(--accent);background:rgba(212,113,42,.08)}
.pcv{position:relative;height:160px;overflow:hidden;border:1px solid var(--border);background:var(--card-alt);margin-bottom:8px}
.pct{display:flex;height:100%;transition:transform .45s cubic-bezier(.4,0,.2,1)}
.pcs{height:100%;display:flex;flex-direction:column;justify-content:center;padding:14px 18px;position:relative;overflow:hidden;flex-shrink:0;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .4s}
.pcs .sa{position:absolute;top:0;left:0;width:3px;height:100%}
.pcs .sl{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--muted);margin-bottom:3px}
.pcs .st{font-size:18px;font-weight:800;line-height:1.1}
.pcs .sd2{font-size:10px;color:var(--muted);margin-top:5px}
.pca{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;background:rgba(19,17,16,.85);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);z-index:5;cursor:pointer;transition:all .2s;user-select:none}.pca:hover{color:var(--accent);border-color:var(--accent)}.pca.l{left:6px}.pca.r{right:6px}
.pcd{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
.pcdot{width:16px;height:2px;background:var(--border);cursor:pointer;transition:all .2s}.pcdot.on{background:var(--accent);width:26px}
.pcp{height:2px;background:var(--border);margin-bottom:10px;overflow:hidden;display:none}
.pcpf{height:100%;width:0%;background:var(--accent)}
.pfb{font-family:'JetBrains Mono',monospace;font-size:11px;min-height:18px;color:var(--muted);transition:color .2s;line-height:1.4}.pfb.w{color:var(--accent)}
.pht{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);opacity:.65}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:520px){.pw{padding:16px}.mbs{gap:4px}.mb{padding:5px 8px;font-size:9px}.pcv{height:130px}}
</style>
</head>
<body>

<div class="pw">
  <div class="pw-h">Thực hành — <span>Chế độ Carousel</span></div>
  <div class="pw-s">Chọn chế độ → dùng mũi tên hoặc dots để điều hướng</div>
  <div class="mbs" id="mbs">
    <button class="mb on" data-m="0">Single</button>
    <button class="mb" data-m="1">Multiple</button>
    <button class="mb" data-m="2">Center</button>
    <button class="mb" data-m="3">Autoplay</button>
  </div>
  <div class="pcv" id="pcv">
    <div class="pct" id="pct"></div>
    <div class="pca l" id="pcal">&#8249;</div>
    <div class="pca r" id="pcar">&#8250;</div>
  </div>
  <div class="pcd" id="pcd"></div>
  <div class="pcp" id="pcp"><div class="pcpf" id="pcpf"></div></div>
  <div class="pfb" id="pfb">Single Item — 1 slide visible, navigate with arrows</div>
  <div class="pht">Hint: Chuyển chế độ → để ý cách slide trượt khác nhau, đặc biệt ở Center mode</div>
</div>

<script>
/* ===== DATA ===== */
const SD=[
  {l:'TRAVEL',t:'Swiss Alps',d:'Discover mountain landscapes',bg:'#252018',ac:'#d4712a'},
  {l:'ROAD TRIP',t:'Coastal Roads',d:'Scenic drives along the coast',bg:'#182220',ac:'#2a9a7a'},
  {l:'NATURE',t:'Forest Escape',d:'Immerse in ancient forests',bg:'#1a2018',ac:'#4a9a3a'},
  {l:'EXPERIENCE',t:'Northern Lights',d:'Witness the aurora borealis',bg:'#1a1815',ac:'#d4a12a'}
];

/* ===== HELPERS ===== */
function mkPS(s){return `<div class="pcs" style="background:${s.bg}"><div class="sa" style="background:${s.ac}"></div><span class="sl">${s.l}</span><span class="st" style="color:${s.ac}">${s.t}</span><span class="sd2">${s.d}</span></div>`;}
function pdots(n,on){let h='';for(let i=0;i<n;i++)h+=`<span class="pcdot${i===on?' on':''}" data-i="${i}"></span>`;return h;}

/* ===== PRACTICE ===== */
let pm=0,ps=0,apt=null,app=0;
const pct=document.getElementById('pct'),pcd=document.getElementById('pcd'),pcp=document.getElementById('pcp'),pcpf=document.getElementById('pcpf'),pfb=document.getElementById('pfb');
const MODES=['Single Item — 1 slide visible, navigate with arrows','Multiple Items — 3 slides visible, slide to see more','Center Mode — center item focused, sides dimmed','Autoplay — slides advance automatically with progress'];
const MAXS=[3,1,3,3];

function buildP(){
  pct.innerHTML=SD.map(s=>mkPS(s)).join('');
  updateP();
}
function maxP(){return MAXS[pm];}
function updateP(){
  const slides=pct.children;
  // Set widths
  for(let i=0;i<slides.length;i++){
    if(pm===0||pm===3)slides[i].style.flex='0 0 100%';
    else if(pm===1)slides[i].style.flex='0 0 33.333%';
    else slides[i].style.flex='0 0 42%';
  }
  // Track transform
  if(pm===0||pm===3)pct.style.transform='translateX(-'+ps*100+'%)';
  else if(pm===1)pct.style.transform='translateX(-'+ps*33.333+'%)';
  else pct.style.transform='translateX('+(29-ps*42)+'%)';
  // Center transforms
  for(let i=0;i<slides.length;i++){
    if(pm===2){
      if(i===ps){slides[i].style.transform='scale(1.06)';slides[i].style.opacity='1';slides[i].style.zIndex='3';}
      else{slides[i].style.transform='scale(0.88)';slides[i].style.opacity='0.35';slides[i].style.zIndex='1';}
    }else{slides[i].style.transform='';slides[i].style.opacity='';slides[i].style.zIndex='';}
  }
  // Dots
  const nd=pm===1?SD.length-2:SD.length;
  pcd.innerHTML=pdots(nd,ps);
  pcd.querySelectorAll('.pcdot').forEach(d=>d.addEventListener('click',()=>{ps=+d.dataset.i;updateP();restartAP();}));
  // Progress bar
  pcp.style.display=pm===3?'block':'none';
  // Arrows visibility
  document.getElementById('pcal').style.display=(pm===3)?'none':'flex';
  document.getElementById('pcar').style.display=(pm===3)?'none':'flex';
  // Feedback
  pfb.textContent=MODES[pm];
  pfb.className='pfb'+(pm===2?' w':'');
}
function pNext(){if(ps<maxP()){ps++;updateP();restartAP();}}
function pPrev(){if(ps>0){ps--;updateP();restartAP();}}
function stopAP(){if(apt){clearInterval(apt);apt=null;}app=0;pcpf.style.width='0%';}
function startAP(){stopAP();apt=setInterval(()=>{app+=2;if(app>=100){app=0;if(ps<maxP())ps++;else ps=0;updateP();}pcpf.style.width=app+'%';},40);}
function restartAP(){if(pm===3)startAP();}

// Mode buttons
document.getElementById('mbs').addEventListener('click',e=>{
  const b=e.target.closest('.mb');if(!b)return;
  const m=+b.dataset.m;if(m===pm)return;
  document.querySelectorAll('.mb').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  pm=m;ps=0;stopAP();
  updateP();
  if(pm===3)startAP();
});

// Arrows
document.getElementById('pcal').addEventListener('click',pPrev);
document.getElementById('pcar').addEventListener('click',pNext);

/* ===== INIT ===== */
buildP();
</script>
</body>
</html>
