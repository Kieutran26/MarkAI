<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corner Radius Practice — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#0f0f12;--bg-card:#16161b;--fg:#e8e4dc;--muted:#6e6e7a;
    --accent:#e88c2e;--accent-soft:rgba(232,140,46,.12);
    --accent-border:rgba(232,140,46,.3);--border:#282830;
    --surface:#1c1c23;--shape-lt:#33333d;--bar-m:#44444f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--fg);
    font-family:'Space Grotesk',sans-serif;line-height:1.6;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:20px 20px;pointer-events:none;z-index:0;
  }

  #app-root{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:24px}

  .pg{font-size:15px;color:var(--fg);opacity:.8;margin-bottom:22px;line-height:1.6}
  .pg span{color:var(--accent);font-weight:600}

  .sl-sec{margin-bottom:28px}
  .sl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .sl-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .sl-val{
    font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:600;
    color:var(--accent);
  }

  .sl-wrap{position:relative;height:34px}
  .sl-track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:4px;background:var(--border);z-index:0}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:34px;background:transparent;
    outline:none;cursor:pointer;position:absolute;top:0;left:0;z-index:2;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;
    background:var(--accent);border:2px solid var(--bg);margin-top:-7px;cursor:grab;
  }
  input[type=range]::-moz-range-thumb{
    width:18px;height:18px;background:var(--accent);
    border:2px solid var(--bg);cursor:grab;border-radius:0;
  }

  .pvg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:600px){.pvg{grid-template-columns:repeat(2,1fr)}}

  .pvi{
    background:var(--bg-card);border:1px solid var(--border);
    padding:20px 14px;display:flex;flex-direction:column;gap:12px;align-items:center;
    transition:border-color .3s;
  }
  .pvi-l{
    font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;
    text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);width:100%;text-align:left;
  }

  .sh-btn{width:100%;height:32px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:1px}
  .sh-card{width:100%;height:60px;background:var(--surface);border:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:4px}
  .sh-card-t{height:6px;width:60%;background:var(--muted);opacity:.4}
  .sh-card-p{height:4px;width:100%;background:var(--muted);opacity:.2}
  .sh-input{width:100%;height:32px;background:var(--bg);border:1px solid var(--border);padding:0 10px;display:flex;align-items:center}
  .sh-input::after{content:'|';color:var(--accent);font-size:12px;animation:blink 1s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  .sh-av{width:48px;height:48px;background:var(--shape-lt);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}

  .vfb{
    border:1px solid var(--border);background:var(--bg-card);
    padding:16px 20px;display:flex;align-items:center;gap:15px;
  }
  .vtag{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
    color:var(--bg);background:var(--accent);padding:4px 10px;
    white-space:nowrap;transition:background .3s;
  }
  .vdesc{font-size:13px;color:var(--fg);opacity:.7;line-height:1.4}

  .presets{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .pre-btn{
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;
    color:var(--muted);background:var(--bg);border:1px solid var(--border);
    padding:6px 12px;cursor:pointer;transition:all .2s;
  }
  .pre-btn:hover, .pre-btn.on{color:var(--fg);border-color:var(--accent);background:var(--accent-soft)}

</style>
</head>
<body>

<div id="app-root">
  <section aria-label="Thực hành Corner Radius">
    <p class="pg">
      <span>Thực hành:</span> Kéo slider và quan sát sự thay đổi cảm giác của giao diện.
    </p>

    <div class="sl-sec">
      <div class="sl-head">
        <span class="sl-lbl">Radius (px)</span>
        <span class="sl-val" id="sV">0px</span>
      </div>
      <div class="sl-wrap">
        <div class="sl-track"></div>
        <input type="range" id="sR" min="0" max="999" step="1" value="0">
      </div>
    </div>

    <div class="presets" id="presets">
      <button class="pre-btn" onclick="setR(0)">0px</button>
      <button class="pre-btn" onclick="setR(4)">4px</button>
      <button class="pre-btn" onclick="setR(8)">8px</button>
      <button class="pre-btn" onclick="setR(12)">12px</button>
      <button class="pre-btn" onclick="setR(24)">24px</button>
      <button class="pre-btn" onclick="setR(999)">Full</button>
    </div>

    <div class="pvg">
      <div class="pvi">
        <span class="pvi-l">Button</span>
        <div class="sh-btn radius-el">SUBMIT</div>
      </div>
      <div class="pvi">
        <span class="pvi-l">Card</span>
        <div class="sh-card radius-el">
          <div class="sh-card-t"></div>
          <div class="sh-card-p"></div>
          <div class="sh-card-p" style="width:80%"></div>
        </div>
      </div>
      <div class="pvi">
        <span class="pvi-l">Input</span>
        <div class="sh-input radius-el"></div>
      </div>
      <div class="pvi">
        <span class="pvi-l">Avatar</span>
        <div class="sh-av radius-el">AV</div>
      </div>
    </div>

    <div class="vfb">
      <span class="vtag" id="vtag">SHARP</span>
      <span class="vdesc" id="vdesc">Giao diện kỹ thuật, data-heavy, "nghiêm túc"</span>
    </div>
  </section>
</div>

<script>
  const sR = document.getElementById('sR');
  const sV = document.getElementById('sV');
  const vtag = document.getElementById('vtag');
  const vdesc = document.getElementById('vdesc');
  const els = document.querySelectorAll('.radius-el');
  const preBtns = document.querySelectorAll('.pre-btn');

  function setR(v) {
    sR.value = v;
    update(v);
  }

  function update(v) {
    v = parseInt(v);
    sV.textContent = v + 'px';
    
    els.forEach(el => {
      if (el.classList.contains('sh-av') && v >= 24) {
        el.style.borderRadius = '50%';
      } else {
        el.style.borderRadius = v + 'px';
      }
    });

    preBtns.forEach(btn => {
      const btnV = parseInt(btn.textContent);
      btn.classList.toggle('on', btnV === v || (btn.textContent === 'Full' && v === 999));
    });

    let vt = 'SHARP', vd = 'Giao diện kỹ thuật, data-heavy, "nghiêm túc"';
    if (v > 0 && v <= 6) {
      vt = 'SMALL'; vd = 'Công cụ, dashboard, "nhanh gọn chuyên nghiệp"';
    } else if (v > 6 && v <= 16) {
      vt = 'MEDIUM'; vd = 'Sản phẩm tiêu dùng, SaaS, "thân thiện đáng tin"';
    } else if (v > 16) {
      vt = 'LARGE / FULL'; vd = 'Thân thiện, playful, chat UI, "bạn bè"';
    }
    
    vtag.textContent = vt;
    vdesc.textContent = vd;
  }

  sR.addEventListener('input', (e) => update(e.target.value));
  
  // init
  update(0);
</script>
</body>
</html>
