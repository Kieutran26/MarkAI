<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Practice — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#0f0f12;--bg-card:#16161b;--fg:#e8e4dc;--muted:#6e6e7a;
    --accent:#e88c2e;--accent-soft:rgba(232,140,46,.12);
    --accent-border:rgba(232,140,46,.3);--border:#282830;
    --surface:#1c1c23;--success:#e88c2e;--success-soft:rgba(232,140,46,.12);
    --error:#c43a3a;--error-soft:rgba(196,58,58,.12);--error-border:rgba(196,58,58,.3);
    --warning:#c49030;--warning-soft:rgba(196,144,48,.1);
    --sql-kw:#cf5c26;--sql-str:#e88c2e;--sql-num:#3a7ec4;--sql-fn:#c49030;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--fg);
    font-family:'Space Grotesk',sans-serif;line-height:1.6;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:20px 20px;pointer-events:none;z-index:0;
  }

  #app-root{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:24px}

  .pg{font-size:15px;color:var(--fg);opacity:.8;margin-bottom:8px;line-height:1.6}
  .pg span{color:var(--accent);font-weight:600}
  .pg-sub{font-size:13px;color:var(--muted);opacity:.6;margin-bottom:22px}

  .prac-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  @media(max-width:760px){.prac-grid{grid-template-columns:1fr}}

  .prac-panel{background:var(--bg-card);border:1px solid var(--border);overflow:hidden}
  .prac-panel-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .prac-panel-head i{font-size:10px;color:var(--accent)}
  .prac-panel-head span{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}

  .crud-btns{padding:12px;display:flex;gap:6px;flex-wrap:wrap}
  .crud-btn{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;
    padding:8px 14px;border:1px solid var(--border);background:transparent;
    cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:6px;
    color:var(--fg);
  }
  .crud-btn:hover{background:var(--surface)}
  .crud-btn.sel{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent)}
  .crud-btn .c{font-size:9px;opacity:.5}
  .crud-btn.sel .c{opacity:1}

  .op-inputs{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .op-inputs label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);opacity:.6}
  .op-inputs input, .op-inputs select{
    font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 8px;
    background:var(--bg);border:1px solid var(--border);color:var(--fg);width:90px;
  }
  .op-go{
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;
    padding:5px 12px;background:var(--accent-soft);border:1px solid var(--accent-border);
    color:var(--accent);cursor:pointer;transition:all .25s;
  }

  .sql-preview{padding:12px 14px;min-height:80px;background:var(--bg);border-top:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7;white-space:pre-wrap}
  .sql-preview .placeholder{color:var(--muted);opacity:.3}
  .kw{color:var(--sql-kw);font-weight:600}
  .str{color:var(--sql-str)}
  .num{color:var(--sql-num)}
  .tbl{color:var(--sql-fn)}
  .op{color:var(--muted)}
  .cmt{color:var(--muted);opacity:.4}

  .itable{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace}
  .itable-head{display:flex;background:var(--accent-soft);border-bottom:1px solid var(--accent-border)}
  .itable-hcell{flex:1;padding:6px 8px;font-size:9px;font-weight:600;color:var(--accent);text-align:center;border-right:1px solid var(--accent-border)}
  .itable-body{min-height:120px}
  .itable-row{display:flex;border-bottom:1px solid rgba(40,40,48,.5);transition:all .4s ease}
  .itable-row.hl-row{background:rgba(58,126,196,.1)}
  .itable-cell{flex:1;padding:5px 8px;font-size:10px;color:var(--fg);opacity:.75;text-align:center;border-right:1px solid rgba(40,40,48,.3)}
  .itable-cell.pk{color:#cf5c26;font-weight:500}

  .op-fb{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;min-height:40px}
  .op-fb.ok{background:var(--success-soft);color:var(--success)}
  .op-fb.no{background:var(--error-soft);color:var(--error)}
  .op-fb.info{background:rgba(58,126,196,.1);color:#3a7ec4}

  .hint{font-size:12px;color:var(--muted);opacity:.5;margin-top:10px;display:flex;align-items:center;gap:6px}
  .hint i{font-size:10px;color:var(--accent)}

  .new-row{animation:rowIn .4s ease}
  @keyframes rowIn{from{opacity:0;transform:translateY(-10px);background:var(--accent-soft)}to{opacity:1;transform:translateY(0);background:transparent}}
  .del-row{animation:rowOut .4s ease forwards}
  @keyframes rowOut{to{opacity:0;transform:translateX(20px);max-height:0;padding:0;overflow:hidden}}
</style>
</head>
<body>

<div id="app-root">
  <section aria-label="Thực hành CRUD">
    <p class="pg"><span>Mục tiêu:</span> Thực hành 4 thao tác CRUD (Create, Read, Update, Delete) trên bảng users.</p>
    <p class="pg-sub">Xem SQL chạy ngầm phía sau và bảng thay đổi ra sao trong thời gian thực.</p>

    <div class="prac-grid">
      <div>
        <div class="prac-panel">
          <div class="prac-panel-head"><i class="fa-solid fa-terminal"></i><span>Thao tác</span></div>
          <div class="crud-btns" id="crudBtns">
            <button class="crud-btn sel" data-op="select"><span class="c">R</span> SELECT</button>
            <button class="crud-btn" data-op="insert"><span class="c">C</span> INSERT</button>
            <button class="crud-btn" data-op="update"><span class="c">U</span> UPDATE</button>
            <button class="crud-btn" data-op="delete"><span class="c">D</span> DELETE</button>
          </div>
          <div class="op-inputs" id="opInputs"></div>
          <div class="sql-preview" id="sqlPreview"></div>
          <div class="op-fb" id="opFb" style="display:none"></div>
        </div>
      </div>
      <div>
        <div class="prac-panel">
          <div class="prac-panel-head"><i class="fa-solid fa-table"></i><span>users — Live Preview</span></div>
          <div class="itable">
            <div class="itable-head">
              <div class="itable-hcell">id</div>
              <div class="itable-hcell">name</div>
              <div class="itable-hcell">role</div>
            </div>
            <div class="itable-body" id="itableBody"></div>
          </div>
        </div>
      </div>
    </div>
    <p class="hint"><i class="fa-solid fa-arrow-up-right"></i> Mẹo: Thử INSERT một user mới, rồi SELECT để lọc. Thử UPDATE đổi role, hoặc DELETE để xóa.</p>
  </section>
</div>

<script>
  let tableData = [
    {id:1,name:'An Nguyen',role:'admin'},
    {id:2,name:'Binh Tran',role:'user'},
    {id:3,name:'Chi Le',role:'user'}
  ];
  let nextId = 4;
  let currentOp = 'select';

  const crudBtns = document.getElementById('crudBtns');
  const opInputs = document.getElementById('opInputs');
  const sqlPreview = document.getElementById('sqlPreview');
  const opFb = document.getElementById('opFb');
  const itableBody = document.getElementById('itableBody');

  function renderTable(highlight) {
    if(tableData.length===0){
      itableBody.innerHTML='<div style="padding:20px;text-align:center;font-size:10px;color:var(--muted);opacity:.3">( bảng trống )</div>';
      return;
    }
    itableBody.innerHTML = tableData.map(r => {
      const hlClass = highlight === r.id ? ' hl-row' : '';
      return `<div class="itable-row${hlClass}" id="row-${r.id}">
        <div class="itable-cell pk">${r.id}</div>
        <div class="itable-cell">${r.name}</div>
        <div class="itable-cell">${r.role}</div>
      </div>`;
    }).join('');
  }

  function showFb(type, msg) {
    opFb.style.display = 'flex';
    opFb.className = 'op-fb ' + type;
    opFb.innerHTML = `<span>${msg}</span>`;
  }

  function setSQL(html) { sqlPreview.innerHTML = html; }

  function pickOp(op) {
    currentOp = op;
    crudBtns.querySelectorAll('.crud-btn').forEach(b => b.classList.toggle('sel', b.dataset.op === op));
    renderInputs();
    renderSQL();
    opFb.style.display = 'none';
    renderTable();
  }

  function renderInputs() {
    switch(currentOp) {
      case 'select':
        opInputs.innerHTML = `<label>Role:</label>
          <select id="selRole"><option value="*">Tất cả</option><option value="admin">admin</option><option value="user">user</option></select>
          <button class="op-go" onclick="execSelect()">Thực thi</button>`;
        break;
      case 'insert':
        opInputs.innerHTML = `<input id="insName" placeholder="Tên" style="width:110px"><input id="insRole" placeholder="role" value="user" style="width:70px">
          <button class="op-go" onclick="execInsert()">Thực thi</button>`;
        break;
      case 'update':
        opInputs.innerHTML = `<label>ID:</label><input id="updId" type="number" style="width:50px">
          <label>Role:</label><input id="updRole" value="admin" style="width:70px">
          <button class="op-go" onclick="execUpdate()">Thực thi</button>`;
        break;
      case 'delete':
        opInputs.innerHTML = `<label>ID:</label><input id="delId" type="number" style="width:50px">
          <button class="op-go" onclick="execDelete()" style="color:var(--error);background:var(--error-soft);border-color:var(--error-border)">Xóa</button>`;
        break;
    }
  }

  function renderSQL() {
    switch(currentOp) {
      case 'select': setSQL(`<span class="kw">SELECT</span> <span class="op">*</span> <span class="kw">FROM</span> <span class="tbl">users</span> <span class="kw">WHERE</span> role <span class="op">=</span> <span class="str">'..'</span><span class="op">;</span>`); break;
      case 'insert': setSQL(`<span class="kw">INSERT INTO</span> <span class="tbl">users</span> <span class="op">(name, role)</span> <span class="kw">VALUES</span> <span class="op">(</span><span class="str">'..'</span><span class="op">,</span> <span class="str">'..'</span><span class="op">);</span>`); break;
      case 'update': setSQL(`<span class="kw">UPDATE</span> <span class="tbl">users</span> <span class="kw">SET</span> role <span class="op">=</span> <span class="str">'..'</span> <span class="kw">WHERE</span> id <span class="op">=</span> <span class="num">..</span><span class="op">;</span>`); break;
      case 'delete': setSQL(`<span class="kw">DELETE FROM</span> <span class="tbl">users</span> <span class="kw">WHERE</span> id <span class="op">=</span> <span class="num">..</span><span class="op">;</span>`); break;
    }
  }

  window.execSelect = () => {
    const role = document.getElementById('selRole').value;
    if(role === '*') {
      setSQL(`<span class="kw">SELECT</span> <span class="op">*</span> <span class="kw">FROM</span> <span class="tbl">users</span><span class="op">;</span>`);
      renderTable();
      showFb('ok', `SELECT trả về ${tableData.length} dòng`);
    } else {
      const filtered = tableData.filter(r => r.role === role);
      setSQL(`<span class="kw">SELECT</span> <span class="op">*</span> <span class="kw">FROM</span> <span class="tbl">users</span> <span class="kw">WHERE</span> role <span class="op">=</span> <span class="str">'${role}'</span><span class="op">;</span>`);
      itableBody.innerHTML = tableData.map(r => {
        const hl = r.role === role ? ' hl-row' : '';
        return `<div class="itable-row${hl}"><div class="itable-cell pk">${r.id}</div><div class="itable-cell">${r.name}</div><div class="itable-cell">${r.role}</div></div>`;
      }).join('');
      showFb('info', `Tìm thấy ${filtered.length} dòng khớp`);
    }
  };

  window.execInsert = () => {
    const name = document.getElementById('insName').value;
    const role = document.getElementById('insRole').value;
    if(!name) return;
    const id = nextId++;
    tableData.push({id, name, role});
    setSQL(`<span class="kw">INSERT INTO</span> <span class="tbl">users</span> <span class="kw">VALUES</span> <span class="op">(</span><span class="num">${id}</span><span class="op">,</span> <span class="str">'${name}'</span><span class="op">,</span> <span class="str">'${role}'</span><span class="op">);</span>`);
    renderTable(id);
    document.getElementById('row-'+id)?.classList.add('new-row');
    showFb('ok', `Đã thêm user "${name}"`);
  };

  window.execUpdate = () => {
    const id = parseInt(document.getElementById('updId').value);
    const role = document.getElementById('updRole').value;
    const row = tableData.find(r => r.id === id);
    if(!row) { showFb('no', 'Không tìm thấy ID'); return; }
    row.role = role;
    setSQL(`<span class="kw">UPDATE</span> <span class="tbl">users</span> <span class="kw">SET</span> role <span class="op">=</span> <span class="str">'${role}'</span> <span class="kw">WHERE</span> id <span class="op">=</span> <span class="num">${id}</span><span class="op">;</span>`);
    renderTable(id);
    showFb('ok', `Đã cập nhật role cho ID ${id}`);
  };

  window.execDelete = () => {
    const id = parseInt(document.getElementById('delId').value);
    const idx = tableData.findIndex(r => r.id === id);
    if(idx === -1) { showFb('no', 'Không tìm thấy ID'); return; }
    document.getElementById('row-'+id)?.classList.add('del-row');
    setSQL(`<span class="kw">DELETE FROM</span> <span class="tbl">users</span> <span class="kw">WHERE</span> id <span class="op">=</span> <span class="num">${id}</span><span class="op">;</span>`);
    setTimeout(() => {
      tableData.splice(idx, 1);
      renderTable();
      showFb('warn', `Đã xóa ID ${id}`);
    }, 400);
  };

  crudBtns.querySelectorAll('.crud-btn').forEach(b => b.addEventListener('click', () => pickOp(b.dataset.op)));
  pickOp('select');
</script>
</body>
</html>
