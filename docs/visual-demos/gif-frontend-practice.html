<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontend Practice — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#0f0f12;--bg-card:#16161b;--fg:#e8e4dc;--muted:#6e6e7a;
    --accent:#e88c2e;--accent-soft:rgba(232,140,46,.12);
    --accent-border:rgba(232,140,46,.3);--border:#282830;
    --surface:#1c1c23;--success:#3a9e5c;--success-soft:rgba(58,158,92,.12);
    --error:#c43a3a;--error-soft:rgba(196,58,58,.12);
    --fe:#e88c2e;--be:#3a7ec4;--both:#8a6ec4;
    --fe-soft:rgba(232,140,46,.1);--be-soft:rgba(58,126,196,.1);--both-soft:rgba(138,110,196,.1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--fg);
    font-family:'Space Grotesk',sans-serif;line-height:1.6;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:20px 20px;pointer-events:none;z-index:0;
  }

  #app-root{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:24px}

  .pg{font-size:15px;color:var(--fg);opacity:.8;margin-bottom:8px;line-height:1.6}
  .pg span{color:var(--accent);font-weight:600}
  .pg-sub{font-size:13px;color:var(--muted);opacity:.6;margin-bottom:22px}

  .cat-bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
  @media(max-width:560px){.cat-bins{grid-template-columns:1fr}}

  .cat-bin{background:var(--bg-card);border:1px solid var(--border);min-height:120px;transition:border-color .3s,background .3s}
  .cat-bin.drag-over{background:var(--surface)}
  .cat-bin-head{padding:10px 12px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .cat-dot{width:8px;height:8px;flex-shrink:0}
  .cat-bin-head span{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
  .cat-bin-body{padding:8px;display:flex;flex-direction:column;gap:4px;min-height:60px}

  .cat-bin.fe .cat-dot{background:var(--fe)}.cat-bin.fe .cat-bin-head span{color:var(--fe)}
  .cat-bin.be .cat-dot{background:var(--be)}.cat-bin.be .cat-bin-head span{color:var(--be)}
  .cat-bin.both .cat-dot{background:var(--both)}.cat-bin.both .cat-bin-head span{color:var(--both)}

  .task-pool{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
  .task-item{
    padding:8px 14px;background:var(--bg-card);border:1px solid var(--border);
    font-size:12px;font-weight:500;color:var(--fg);cursor:grab;
    transition:all .25s;user-select:none;touch-action:none;
  }
  .task-item:hover{border-color:var(--accent-border);background:var(--surface)}
  .task-item.dragging{opacity:.4;border-color:var(--accent)}
  .task-item.placed{opacity:.35;cursor:default;pointer-events:none}

  .placed-item{
    padding:6px 10px;font-size:11px;font-weight:500;border:1px solid;
    display:flex;align-items:center;gap:6px;animation:placeIn .3s ease;
  }
  @keyframes placeIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
  .placed-item.fe{border-color:rgba(232,140,46,.2);background:var(--fe-soft);color:var(--fe)}
  .placed-item.be{border-color:rgba(58,126,196,.2);background:var(--be-soft);color:var(--be)}
  .placed-item.both{border-color:rgba(138,110,196,.2);background:var(--both-soft);color:var(--both)}
  .placed-item .undo{cursor:pointer;opacity:.5;transition:opacity .2s;font-size:10px}

  .result-box{border:1px solid var(--border);padding:18px 22px;margin-top:20px;display:none;align-items:center;gap:14px}
  .result-box.show{display:flex}
  .result-box.ok{border-color:rgba(58,158,92,.3);background:var(--success-soft)}
  .result-box.no{border-color:rgba(196,58,58,.3);background:var(--error-soft)}
  .result-icon{font-size:20px;flex-shrink:0}
  .result-box.ok .result-icon{color:var(--success)}
  .result-box.no .result-icon{color:var(--error)}
  .result-text{font-size:14px;line-height:1.5}

  .reset-btn{
    font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:500;
    padding:8px 16px;border:1px solid var(--border);background:transparent;
    color:var(--muted);cursor:pointer;transition:all .25s;margin-top:12px;
  }
  .reset-btn:hover{border-color:var(--accent-border);color:var(--fg)}

  .progress-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:right;margin-bottom:8px}

  @media(max-width:480px){
    #app-root{padding:14px}
    .cat-bins{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div id="app-root">
  <section aria-label="Thực hành phân biệt frontend vs backend">
    <p class="pg"><span>Mục tiêu:</span> Kéo mỗi task vào đúng nhóm — Frontend, Backend, hay Cả hai.</p>
    <p class="pg-sub">Phân biệt được ranh giới frontend/backend là kỹ năng cơ bản của Marketer công nghệ.</p>

    <div class="progress-count" id="progCount">0 / 8 đã phân loại</div>
    <div class="task-pool" id="taskPool"></div>

    <div class="cat-bins" id="catBins">
      <div class="cat-bin fe" data-cat="fe">
        <div class="cat-bin-head"><div class="cat-dot"></div><span>Frontend</span></div>
        <div class="cat-bin-body" id="binFe"></div>
      </div>
      <div class="cat-bin be" data-cat="be">
        <div class="cat-bin-head"><div class="cat-dot"></div><span>Backend</span></div>
        <div class="cat-bin-body" id="binBe"></div>
      </div>
      <div class="cat-bin both" data-cat="both">
        <div class="cat-bin-head"><div class="cat-dot"></div><span>Cả hai</span></div>
        <div class="cat-bin-body" id="binBoth"></div>
      </div>
    </div>

    <div class="result-box" id="resultBox">
      <div class="result-icon"></div>
      <div class="result-text" id="resultText"></div>
    </div>

    <button class="reset-btn" id="resetBtn"><i class="fa-solid fa-rotate-left"></i> Đặt lại</button>
  </section>
</div>

<script>
const tasks = [
  {id:'t1',text:'Màu nút bấm',answer:'fe'},
  {id:'t2',text:'Lưu đơn hàng vào DB',answer:'be'},
  {id:'t3',text:'Layout trang chủ',answer:'fe'},
  {id:'t4',text:'Xử lý thanh toán',answer:'be'},
  {id:'t5',text:'Form đăng nhập',answer:'both'},
  {id:'t6',text:'Animation hover',answer:'fe'},
  {id:'t7',text:'Gửi email xác nhận',answer:'be'},
  {id:'t8',text:'Tìm kiếm sản phẩm',answer:'both'}
];

let placed = {};
const taskPool = document.getElementById('taskPool');
const binFe = document.getElementById('binFe');
const binBe = document.getElementById('binBe');
const binBoth = document.getElementById('binBoth');
const progCount = document.getElementById('progCount');
const resultBox = document.getElementById('resultBox');
const resultText = document.getElementById('resultText');
const resetBtn = document.getElementById('resetBtn');

function renderTasks(){
  taskPool.innerHTML = tasks.map(t=>`<div class="task-item" draggable="true" data-id="${t.id}" id="item-${t.id}">${t.text}</div>`).join('');
  placed={};
  binFe.innerHTML='';binBe.innerHTML='';binBoth.innerHTML='';
  resultBox.classList.remove('show','ok','no');
  progCount.textContent='0 / '+tasks.length+' đã phân loại';
  attachDrag();
}

function attachDrag(){
  document.querySelectorAll('.task-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{
      item.classList.add('dragging');
      e.dataTransfer.setData('text/plain',item.dataset.id);
    });
    item.addEventListener('dragend',()=>item.classList.remove('dragging'));
  });

  document.querySelectorAll('.cat-bin').forEach(bin=>{
    bin.addEventListener('dragover',e=>{e.preventDefault();bin.classList.add('drag-over')});
    bin.addEventListener('dragleave',()=>bin.classList.remove('drag-over'));
    bin.addEventListener('drop',e=>{
      e.preventDefault();bin.classList.remove('drag-over');
      const id=e.dataTransfer.getData('text/plain');
      if(id) placeItem(id,bin.dataset.cat);
    });
  });
}

function placeItem(id,cat){
  if(placed[id])return;
  const task=tasks.find(t=>t.id===id);
  placed[id]=cat;
  document.getElementById('item-'+id).classList.add('placed');
  const binEl = cat==='fe'?binFe:cat==='be'?binBe:binBoth;
  const div=document.createElement('div');
  div.className='placed-item '+cat;
  div.innerHTML=`${task.text}<span class="undo" style="margin-left:auto;cursor:pointer;opacity:.5" data-id="${id}"><i class="fa-solid fa-xmark"></i></span>`;
  div.querySelector('.undo').addEventListener('click',()=>undoPlace(id));
  binEl.appendChild(div);
  const count=Object.keys(placed).length;
  progCount.textContent=count+' / '+tasks.length+' đã phân loại';
  if(count===tasks.length)checkResult();
}

function undoPlace(id){
  delete placed[id];
  document.getElementById('item-'+id).classList.remove('placed');
  document.querySelectorAll('.placed-item').forEach(el=>{
    if(el.querySelector('.undo').dataset.id===id)el.remove();
  });
  progCount.textContent=Object.keys(placed).length+' / '+tasks.length+' đã phân loại';
  resultBox.classList.remove('show');
}

function checkResult(){
  let correct=0;
  tasks.forEach(t=>{if(placed[t.id]===t.answer)correct++});
  const allCorrect=correct===tasks.length;
  resultBox.classList.add('show',allCorrect?'ok':'no');
  resultBox.querySelector('.result-icon').innerHTML=allCorrect?'<i class="fa-solid fa-check-circle"></i>':'<i class="fa-solid fa-xmark-circle"></i>';
  resultText.textContent=allCorrect?'Chính xác! Bạn đã nắm vững ranh giới Frontend/Backend.':`${correct}/${tasks.length} đúng. Nhấp X để sửa lại.`;
}

resetBtn.addEventListener('click',renderTasks);
renderTasks();
</script>
</body>
</html>
