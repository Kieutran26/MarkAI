<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Spacing Practice — Vibecode Glossary</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #101010;
      --bgc: #181818;
      --bgi: #131313;
      --bd: #272727;
      --tx: #e0e0e0;
      --txm: #707070;
      --txd: #3a3a3a;
      --ac: #E88C2E;
      --acl: #f59e0b;
      --abg: rgba(232, 140, 46, .08);
      --abg2: rgba(232, 140, 46, .18);
      --success: #3a9e5c;
      --success-soft: rgba(58, 158, 92, .12);
      --warning: #c49030;
      --warning-soft: rgba(196, 144, 48, .1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--tx);
      padding: 20px 16px;
    }

    .pra {
      max-width: 940px;
      margin: 0 auto;
      background: var(--bgc);
      border: 1px solid var(--bd);
      border-radius: 3px;
      padding: 22px;
    }

    .ch {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .ch .n {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--ac);
      background: var(--abg);
      border: 1px solid var(--abg2);
      padding: 1px 6px;
      border-radius: 2px;
    }

    .ch h2 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.3px;
      text-transform: uppercase;
    }

    .pra-goal {
      font-size: 12.5px;
      color: var(--txm);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .pra-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
    }

    @media(max-width: 800px) {
      .pra-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Control Panel */
    .ctrl-group {
      margin-bottom: 24px;
    }

    .ctrl-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--txd);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 12px;
      display: block;
    }

    .ctx-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 10px 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--bd);
      background: var(--bgi);
      color: var(--txm);
      border-radius: 2px;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn:hover {
      border-color: var(--ac);
      color: var(--tx);
    }

    .btn.active {
      border-color: var(--ac);
      background: var(--abg);
      color: var(--ac);
      font-weight: 600;
    }

    /* Slider */
    .sl-wrap {
      position: relative;
      height: 32px;
      margin-bottom: 10px;
    }

    .sl-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: var(--bd);
    }

    .sl-zone {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: var(--abg2);
      border: 1px solid var(--ac);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .sl-zone.hit {
      background: var(--success-soft);
      border-color: var(--success);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 32px;
      background: transparent;
      outline: none;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--ac);
      border: 2px solid var(--bg);
      cursor: grab;
    }

    .sl-info {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--txm);
    }

    .val-cur {
      color: var(--ac);
      font-weight: 700;
      font-size: 14px;
    }

    /* Preview Area */
    .preview-box {
      background: #000;
      border: 1px solid var(--bd);
      border-radius: 3px;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .prev-lbl {
      position: absolute;
      top: 10px;
      left: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--txd);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .prev-text {
      font-weight: 700;
      text-transform: uppercase;
      transition: letter-spacing .12s ease;
      position: relative;
      z-index: 1;
      line-height: 1.4;
      text-align: center;
    }

    .prev-text.sz-h { font-size: clamp(24px, 5vw, 34px); }
    .prev-text.sz-b { font-size: 15px; font-weight: 400; text-transform: none; max-width: 520px; line-height: 1.7; }
    .prev-text.sz-l { font-size: clamp(28px, 6vw, 44px); color: var(--ac); }
    .prev-text.sz-c { font-size: 12px; font-weight: 400; text-transform: none; opacity: .8; }

    /* Prompt Box */
    .pr-box {
      background: var(--bgi);
      border: 1px solid var(--bd);
      border-radius: 3px;
      padding: 14px;
      margin-top: 18px;
    }

    .pr-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--txd);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .pr-txt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ac);
      line-height: 1.6;
    }

    .fb {
      margin-top: 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fb.ok { color: var(--success); }
    .fb.no { color: var(--warning); }
  </style>
</head>

<body>

  <section class="pra">
    <div class="ch"><span class="n">PRACTICE</span>
      <h2>Typography Spacing</h2>
    </div>
    <p class="pra-goal">Thực hành tinh chỉnh Letter Spacing cho các ngữ cảnh khác nhau. Vùng cam là giá trị khuyến nghị.</p>

    <div class="pra-grid">
      <!-- Controls -->
      <div>
        <div class="ctrl-group">
          <span class="ctrl-label">Ngữ cảnh (Context)</span>
          <div class="ctx-list" id="ctxList"></div>
        </div>

        <div class="ctrl-group">
          <div class="sl-info">
            <span class="ctrl-label">letter-spacing</span>
            <span class="val-cur" id="valCur">0px</span>
          </div>
          <div class="sl-wrap">
            <div class="sl-track"></div>
            <div class="sl-zone" id="slZone"></div>
            <input type="range" id="slRange" min="-2" max="20" step="0.5" value="0">
          </div>
          <div class="sl-info">
            <span>-2px</span>
            <span>0px</span>
            <span>20px</span>
          </div>
        </div>

        <div class="fb" id="fb"></div>
      </div>

      <!-- Preview -->
      <div>
        <div class="preview-box">
          <span class="prev-lbl" id="prevLbl">HEADLINE</span>
          <div class="prev-text sz-h" id="prevText">MỌI THỨ BẮT ĐẦU TỪ ĐÂU</div>
        </div>

        <div class="pr-box">
          <span class="pr-label">Prompt cho AI</span>
          <div class="pr-txt" id="promptTxt"></div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const ctxs = [
      { id: 'headline', name: 'Headline', range: [-1, 1], text: 'MỌI THỨ BẮT ĐẦU TỪ ĐÂU', sz: 'sz-h', hint: 'Tiêu đề lớn cần khít hơn' },
      { id: 'body', name: 'Body Text', range: [0, 0.5], text: 'Letter spacing ảnh hưởng đến tốc độ đọc. Khi khoảng cách quá rộng, mắt phải nhảy xa hơn.', sz: 'sz-b', hint: 'Text dài nên giữ mặc định' },
      { id: 'luxury', name: 'Luxury Logo', range: [8, 16], text: 'ATELIER', sz: 'sz-l', hint: 'Logo sang trọng thường rải chữ rộng' },
      { id: 'caption', name: 'Caption', range: [0.5, 2], text: 'Photo by @studio — Hanoi, 2024', sz: 'sz-c', hint: 'Chữ nhỏ cần thoáng một chút' }
    ];

    const ctxList = document.getElementById('ctxList');
    const slRange = document.getElementById('slRange');
    const slZone = document.getElementById('slZone');
    const valCur = document.getElementById('valCur');
    const prevText = document.getElementById('prevText');
    const prevLbl = document.getElementById('prevLbl');
    const promptTxt = document.getElementById('promptTxt');
    const fb = document.getElementById('fb');

    let cur = ctxs[0];

    function renderCtx() {
      ctxList.innerHTML = ctxs.map(c => `
        <button class="btn ${c.id === cur.id ? 'active' : ''}" data-id="${c.id}">
          ${c.name}
        </button>
      `).join('');
      
      ctxList.querySelectorAll('.btn').forEach(b => {
        b.addEventListener('click', () => {
          cur = ctxs.find(x => x.id === b.dataset.id);
          renderCtx();
          update();
        });
      });
    }

    function update() {
      const v = parseFloat(slRange.value);
      valCur.innerText = v + 'px';
      prevLbl.innerText = cur.id.toUpperCase();
      prevText.innerText = cur.text;
      prevText.className = 'prev-text ' + cur.sz;
      prevText.style.letterSpacing = v + 'px';
      
      // Update Zone
      const min = -2, max = 20, span = max - min;
      const left = ((cur.range[0] - min) / span) * 100;
      const width = ((cur.range[1] - cur.range[0]) / span) * 100;
      slZone.style.left = left + '%';
      slZone.style.width = width + '%';
      
      const isOk = v >= cur.range[0] && v <= cur.range[1];
      slZone.classList.toggle('hit', isOk);
      
      // Feedback
      if (isOk) {
        fb.innerHTML = `<i class="fa-solid fa-check-circle"></i> Vibe chuẩn cho ${cur.name.toLowerCase()}`;
        fb.className = 'fb ok';
      } else {
        fb.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${v < cur.range[0] ? 'Hơi chật' : 'Hơi loãng'}`;
        fb.className = 'fb no';
      }

      promptTxt.innerText = `Chỉnh letter-spacing của ${cur.name.toLowerCase()} thành ${v}px để ${cur.hint.toLowerCase()}.`;
    }

    slRange.addEventListener('input', update);
    renderCtx();
    update();
  </script>
</body>

</html>
