<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabbar Architect — Vibecode</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f12;--bg-card:#16161b;--accent:#E88C2E;--accent-dim:#92400e;
  --accent-glow:rgba(232,140,46,.12);--fg:#e8e4df;--fg-muted:#8a8580;
  --fg-dim:#5a5550;--border:#282830;--border-accent:#E88C2E;
  --success:#50fa7b;--font-mono:'JetBrains Mono',monospace;--font-sans:'Space Grotesk',sans-serif;--radius:4px;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);line-height:1.5;min-height:100vh;padding:24px;display:flex;justify-content:center;}
.page-wrapper{width:100%;max-width:940px;}

.header { border-left: 2px solid var(--accent); padding-left: 16px; margin-bottom: 24px; }
.header h1 { font-family: var(--font-mono); font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
.header p { font-size: 14px; color: var(--fg-muted); margin-top: 6px; }

/* ===== WORKSPACE ===== */
.ws-workspace{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:750px){.ws-workspace{grid-template-columns:1fr}}

.ws-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:16px}
.ws-panel-title{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--fg-dim);margin-bottom:4px}

/* Controls */
.control-group { display: flex; flex-direction: column; gap: 8px; }
.style-picker{display:flex;gap:6px;flex-wrap:wrap;}
.style-opt{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:.5px;color:var(--fg-dim);background:transparent;border:1px solid var(--border);padding:6px 12px;border-radius:2px;cursor:pointer;transition:all .25s}
.style-opt:hover{border-color:var(--fg-muted);color:var(--fg-muted)}
.style-opt.active{border-color:var(--border-accent);background:var(--accent-glow);color:var(--accent)}

.item-list{display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;padding-right:4px;}
.item-list::-webkit-scrollbar { width: 4px; }
.item-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.item-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:2px;}
.item-row-input{font-family:var(--font-mono);font-size:10px;color:var(--fg);background:transparent;border:none;outline:none;flex:1;min-width:0}
.item-row-del{font-family:var(--font-mono);font-size:11px;color:var(--fg-dim);cursor:pointer;border:none;background:none;transition:color .2s}
.item-row-del:hover{color:var(--accent)}

.add-btn{font-family:var(--font-mono);font-size:9px;font-weight:600;color:var(--fg-dim);background:transparent;border:1px dashed var(--border);padding:8px;border-radius:2px;cursor:pointer;width:100%;text-align:center;transition:all .2s}
.add-btn:hover{border-color:var(--fg-muted);color:var(--fg-muted)}

.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.toggle-label{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted)}
.toggle-switch{width:32px;height:16px;background:var(--border);border-radius:8px;cursor:pointer;position:relative;transition:background .3s;border:none;padding:0}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:10px;height:10px;background:var(--fg-dim);border-radius:50%;transition:all .3s}
.toggle-switch.on{background:var(--accent-dim)}
.toggle-switch.on::after{left:19px;background:var(--accent)}

/* Preview */
.preview-stage { flex: 1; background: #0d0d10; border: 1px solid var(--border); border-radius: 2px; position: relative; min-height: 240px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.preview-device { width: 220px; height: 200px; background: #000; border: 1px solid #222; border-radius: 8px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.mock-content { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.mock-box { height: 40px; background: #1a1a20; border-radius: 4px; }
.mock-line { height: 6px; background: #222; border-radius: 3px; width: 70%; }

/* Tabbar CSS */
.tabbar { display: flex; background: #16161b; border-top: 1px solid #282830; }
.tab-item { flex: 1; height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 7px; color: #555; cursor: pointer; transition: all 0.2s; }
.tab-item.active { color: var(--accent); }
.tab-item i { width: 14px; height: 14px; background: #333; border-radius: 2px; display: block; position: relative; }
.tab-item.active i { background: var(--accent); }
.badge { position: absolute; top: -4px; right: -4px; width: 6px; height: 6px; background: #ff5555; border-radius: 50%; border: 1px solid #000; }

.tabbar.scrollable { overflow-x: auto; justify-content: flex-start; }
.tabbar.scrollable .tab-item { flex: 0 0 60px; border-right: 1px solid #222; }

.segmented { margin: 12px; background: #111; border: 1px solid #222; border-radius: 6px; padding: 2px; display: flex; }
.seg-item { flex: 1; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #666; border-radius: 4px; cursor: pointer; }
.seg-item.active { background: #222; color: #fff; border: 1px solid #333; }

.prompt-output { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 2px; padding: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); white-space: pre-wrap; line-height: 1.6; }
.prompt-output strong { color: var(--accent); }

.hint-bar { font-size: 11px; color: var(--fg-dim); font-style: italic; margin-top: 12px; text-align: center; }

</style>
</head>
<body>

<div class="page-wrapper">
  <div class="header">
    <h1>Tabbar Architect</h1>
    <p>Cấu hình và tạo Prompt mẫu cho các loại Tab Bar khác nhau.</p>
  </div>

  <div class="ws-workspace">
    <!-- Config Panel -->
    <div class="ws-panel">
      <div class="control-group">
        <div class="ws-panel-title">Loại Tab Bar</div>
        <div class="style-picker" id="type-picker">
          <button class="style-opt active" data-type="bottom">Bottom</button>
          <button class="style-opt" data-type="top">Top</button>
          <button class="style-opt" data-type="scrollable">Scrollable</button>
          <button class="style-opt" data-type="segmented">Segmented</button>
        </div>
      </div>

      <div class="control-group">
        <div class="ws-panel-title">Danh sách Tab</div>
        <div class="item-list" id="item-list"></div>
        <button class="add-btn" id="add-btn">+ Thêm Tab mới</button>
      </div>

      <div class="control-group">
        <div class="ws-panel-title">Tùy chọn hiển thị</div>
        <div class="toggle-row">
          <span class="toggle-label">Hiện Icons (Chỉ Mobile)</span>
          <button class="toggle-switch on" id="toggle-icons"></button>
        </div>
        <div class="toggle-row">
          <span class="toggle-label">Hiện Thông báo (Badges)</span>
          <button class="toggle-switch" id="toggle-badges"></button>
        </div>
      </div>
    </div>

    <!-- Preview Panel -->
    <div style="display:flex; flex-direction:column; gap:20px;">
      <div class="ws-panel">
        <div class="ws-panel-title">Xem trước</div>
        <div class="preview-stage">
          <div class="preview-device" id="preview-device"></div>
        </div>
        <div class="hint-bar" id="type-hint">Bottom Tab Bar: Tối ưu cho thao tác một tay trên mobile.</div>
      </div>

      <div class="ws-panel">
        <div class="ws-panel-title">AI Prompt Builder</div>
        <div class="prompt-output" id="prompt-output"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const state = {
    type: 'bottom',
    items: ['Trang chủ', 'Tìm kiếm', 'Giỏ hàng', 'Cá nhân'],
    showIcons: true,
    showBadges: false,
    activeIdx: 0
  };

  const itemContainer = document.getElementById('item-list');
  const typePicker = document.getElementById('type-picker');
  const device = document.getElementById('preview-device');
  const promptOutput = document.getElementById('prompt-output');
  const typeHint = document.getElementById('type-hint');

  const hints = {
    bottom: "Bottom Tab Bar: Tối ưu cho thao tác một tay trên mobile. Thường dùng 3-5 mục chính.",
    top: "Top Tab Bar: Nằm dưới Header, dùng để phân loại nội dung trong cùng một bối cảnh.",
    scrollable: "Scrollable Tabs: Dành cho danh sách category dài, cho phép người dùng vuốt ngang.",
    segmented: "Segmented Control: Dùng để chuyển đổi các View nội bộ trong một component nhỏ."
  };

  function renderItems() {
    itemContainer.innerHTML = state.items.map((item, i) => `
      <div class="item-row">
        <input type="text" class="item-row-input" value="${item}" data-idx="${i}">
        <button class="item-row-del" data-idx="${i}">&times;</button>
      </div>
    `).join('');

    itemContainer.querySelectorAll('.item-row-input').forEach(input => {
      input.oninput = (e) => {
        state.items[e.target.dataset.idx] = e.target.value;
        updateAll();
      };
    });

    itemContainer.querySelectorAll('.item-row-del').forEach(btn => {
      btn.onclick = (e) => {
        if (state.items.length > 2) {
          state.items.splice(e.target.dataset.idx, 1);
          renderItems();
          updateAll();
        }
      };
    });
  }

  function renderPreview() {
    let html = `
      <div class="mock-content">
        <div class="mock-box"></div>
        <div class="mock-line"></div>
        <div class="mock-line"></div>
      </div>
    `;

    const tabsHtml = state.items.map((item, i) => {
      const activeClass = i === state.activeIdx ? 'active' : '';
      const icon = state.showIcons ? `<i>${state.showBadges && i === 2 ? '<span class="badge"></span>' : ''}</i>` : '';
      return `<div class="tab-item ${activeClass}" onclick="setActive(${i})">${icon}<span>${item}</span></div>`;
    }).join('');

    if (state.type === 'bottom') {
      html += `<div class="tabbar">${tabsHtml}</div>`;
    } else if (state.type === 'top') {
      html = `
        <div class="tabbar" style="border-top:none; border-bottom:1px solid #282830">${tabsHtml}</div>
        <div class="mock-content"><div class="mock-box"></div><div class="mock-line"></div></div>
      `;
    } else if (state.type === 'scrollable') {
      html = `
        <div class="tabbar scrollable" style="border-top:none; border-bottom:1px solid #282830">${tabsHtml}</div>
        <div class="mock-content"><div class="mock-box"></div><div class="mock-line"></div></div>
      `;
    } else if (state.type === 'segmented') {
      const segHtml = state.items.map((item, i) => {
        const activeClass = i === state.activeIdx ? 'active' : '';
        return `<div class="seg-item ${activeClass}" onclick="setActive(${i})">${item}</div>`;
      }).join('');
      html = `
        <div class="mock-content">
          <div class="mock-box" style="height:30px"></div>
          <div class="segmented">${segHtml}</div>
          <div class="mock-box"></div>
        </div>
      `;
    }

    device.innerHTML = html;
  }

  function renderPrompt() {
    const listStr = state.items.join(', ');
    let prompt = `<strong>Prompt:</strong> "Tạo một <strong>${state.type.toUpperCase()} Tab Bar</strong> với ${state.items.length} mục: <strong>${listStr}</strong>. `;
    
    if (state.type === 'bottom') prompt += `Mỗi mục bao gồm icon và text label bên dưới. `;
    if (state.showBadges) prompt += `Thêm badge thông báo (chấm đỏ) cho mục thứ 3. `;
    if (state.type === 'scrollable') prompt += `Cấu hình cho phép scroll ngang nếu danh sách tab dài vượt quá màn hình. `;
    if (state.type === 'segmented') prompt += `Thiết kế dạng Segmented Control nằm gọn trong card nội dung. `;
    
    prompt += `Sử dụng theme dark với màu accent hổ phách #E88C2E cho trạng thái Active."`;
    
    promptOutput.innerHTML = prompt;
  }

  window.setActive = (idx) => {
    state.activeIdx = idx;
    renderPreview();
  };

  function updateAll() {
    renderPreview();
    renderPrompt();
    typeHint.textContent = hints[state.type];
  }

  // Bind Type Picker
  typePicker.querySelectorAll('.style-opt').forEach(btn => {
    btn.onclick = (e) => {
      state.type = e.target.dataset.type;
      typePicker.querySelectorAll('.style-opt').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      updateAll();
    };
  });

  // Bind Add Button
  document.getElementById('add-btn').onclick = () => {
    if (state.items.length < 10) {
      state.items.push('Tab ' + (state.items.length + 1));
      renderItems();
      updateAll();
    }
  };

  // Bind Toggles
  document.getElementById('toggle-icons').onclick = function() {
    state.showIcons = !state.showIcons;
    this.classList.toggle('on');
    updateAll();
  };
  document.getElementById('toggle-badges').onclick = function() {
    state.showBadges = !state.showBadges;
    this.classList.toggle('on');
    updateAll();
  };

  // Init
  renderItems();
  updateAll();
</script>

</body>
</html>
