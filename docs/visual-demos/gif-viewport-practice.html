<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewport — Practice</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#131110;--fg:#ece8e1;--muted:#706b64;--accent:#d4712a;--accent-dim:rgba(212,113,42,.15);--card:#1c1a18;--card-alt:#242120;--border:#302c28;--border-hi:#44403a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:auto;overflow:hidden}
body{background:var(--bg);display:flex;flex-direction:column;align-items:center;font-family:'Space Grotesk',sans-serif;color:var(--fg);padding:12px 16px 24px}

.aw{width:100%}
.ab{width:100%;height:320px;background:var(--card);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;position:relative}

.hd{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.01)}
.hd-t{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2.5px}
.hd-v{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}

.la{position:relative;flex:1;background:var(--card-alt);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:20px}
.la::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:20px 20px;pointer-events:none}

/* Device frame */
.df{
  border:1.5px solid var(--accent);background:#0f0f11;overflow:hidden;
  box-shadow:0 0 0 9999px rgba(12,12,14,.45);
  transition:width .4s cubic-bezier(.4,0,.2,1),height .4s cubic-bezier(.4,0,.2,1);
  container-type:inline-size;container-name:dev;
}
.dr{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.08em;
  background:rgba(19,17,16,.88);padding:4px 14px;border:1px solid rgba(212,113,42,.25);
  white-space:nowrap;transition:opacity .3s;
}

/* Inner page content */
.ip{width:100%;height:100%;padding:clamp(3px,1.2cqw,8px);display:flex;flex-direction:column;gap:clamp(2px,.6cqw,5px)}
.in{
  display:flex;align-items:center;justify-content:space-between;
  padding:clamp(2px,.5cqw,4px) clamp(3px,.8cqw,6px);
  background:rgba(212,113,42,.08);border:1px solid rgba(212,113,42,.15);flex-shrink:0;
}
.inb{font-family:'JetBrains Mono',monospace;font-size:clamp(4px,1.4cqw,8px);color:var(--accent);font-weight:700;letter-spacing:.08em}
.inl{display:flex;gap:clamp(3px,.8cqw,6px)}
.inlk{width:clamp(10px,2.8cqw,28px);height:clamp(2px,.4cqw,3px);background:rgba(255,255,255,.15);transition:all .4s}
.inlk.off{width:0!important;opacity:0;overflow:hidden}
.ib{display:flex;gap:clamp(2px,.6cqw,5px);flex:1;min-height:0}
.im{flex:1;display:flex;flex-direction:column;gap:clamp(2px,.5cqw,4px);min-width:0}
.ih{height:clamp(6px,7cqw,18px);background:var(--fg);width:70%;flex-shrink:0;transition:height .7s}
.il{height:clamp(2px,1.8cqw,4px);background:rgba(255,255,255,.1);flex-shrink:0;transition:height .7s}
.il.w85{width:85%}.il.w65{width:65%}.il.w45{width:45%}
.ibtn{
  width:clamp(22px,16cqw,80px);height:clamp(5px,4.5cqw,18px);
  background:var(--accent);flex-shrink:0;margin-top:clamp(1px,.3cqw,3px);transition:all .7s;
}
.isb{
  width:clamp(25px,10cqw,100px);background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);flex-shrink:0;
  display:flex;flex-direction:column;gap:clamp(2px,.5cqw,4px);
  padding:clamp(2px,.6cqw,5px);
  transition:width .5s cubic-bezier(.4,0,.2,1),opacity .4s,padding .5s;
}
.isb.off{width:0!important;opacity:0;padding:0;overflow:hidden;border:none}
.sb{height:clamp(4px,5cqw,14px);background:rgba(255,255,255,.07);transition:height .7s}
.sb.w80{width:80%}.sb.w60{width:60%}

/* Info Footer */
.inf{padding:10px 14px;background:var(--card);border-top:1px solid var(--border);min-height:56px;display:flex;align-items:center}
.fb{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);line-height:1.5;flex:1}
.fb em{color:var(--fg);font-style:normal;font-weight:700}

/* Presets */
.dp{display:flex;gap:4px;padding:8px 16px;background:transparent;width:100%;margin-top:4px}
.db{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px 4px 6px;background:var(--card-alt);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;transition:all .25s;
}
.db:hover{border-color:var(--border-hi);color:var(--fg)}
.db.act{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}
.di{border:1.5px solid currentColor;transition:all .3s}
.di-m{width:8px;height:14px}.di-t{width:16px;height:12px}
.di-l{width:20px;height:12px}.di-d{width:24px;height:14px}

/* Slider */
.sl-w{width:100%;padding:16px;background:transparent}
input[type=range]{-webkit-appearance:none;width:100%;background:transparent}
input[type=range]::-webkit-slider-runnable-track{width:100%;height:2px;background:var(--border);border:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:14px;width:14px;border-radius:50%;background:var(--accent);cursor:pointer;margin-top:-6px;border:none;box-shadow:0 0 10px rgba(212,113,42,.3)}
input[type=range]:focus{outline:none}
</style>
</head>
<body>

<div class="aw">
<div class="ab">
  <div class="hd"><span class="hd-t">VIEWPORT TESTING</span><span class="hd-v" id="hv">MOBILE PRESSET</span></div>
  <div class="la">
    <div class="df" id="dev" style="width:24%; height:82%">
      <div class="ip">
        <div class="in">
          <div class="inb">BRAND</div>
          <div class="inl" id="nl">
            <div class="inlk"></div><div class="inlk off"></div><div class="inlk off"></div><div class="inlk off"></div>
          </div>
        </div>
        <div class="ib">
          <div class="im">
            <div class="ih"></div>
            <div class="il w85"></div><div class="il w65"></div><div class="il w45"></div>
            <div class="ibtn"></div>
          </div>
          <div class="isb off" id="sb">
            <div class="sb"></div><div class="sb w80"></div><div class="sb w60"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="dr" id="dr">375 × 667 px · Mobile phones</div>
  </div>
  <div class="inf">
    <div class="fb" id="fb">Viewport <em>375px</em> — quá hẹp để hiện sidebar, nav thu gọn còn 1 mục.</div>
  </div>
</div>

<div class="dp">
  <button class="db act" data-i="0"><div class="di di-m"></div><span>Mobile</span></button>
  <button class="db" data-i="1"><div class="di di-t"></div><span>Tablet</span></button>
  <button class="db" data-i="2"><div class="di di-l"></div><span>Laptop</span></button>
  <button class="db" data-i="3"><div class="di di-d"></div><span>Desktop</span></button>
</div>

<div class="sl-w">
  <input type="range" id="sl" min="20" max="100" value="24" step="1">
</div>

</div>

<script>
const V = [
  { w:24, h:82, label:'MOBILE', dims:'375 × 667 px', uc:'Mobile phones', fb:'Viewport <em>375px</em> — quá hẹp để hiện sidebar, nav thu gọn còn 1 mục.', nav:1, sb:false },
  { w:56, h:72, label:'TABLET', dims:'1024 × 768 px', uc:'Tablets', fb:'Viewport <em>1024px</em> — đủ rộng cho sidebar, nav hiện 3 mục.', nav:3, sb:true },
  { w:78, h:70, label:'LAPTOP', dims:'1366 × 768 px', uc:'Laptops', fb:'Viewport <em>1366px</em> — nav đầy đủ 4 mục, sidebar rộng rãi hơn.', nav:4, sb:true },
  { w:94, h:80, label:'DESKTOP', dims:'1920 × 1080 px', uc:'Desktop monitors', fb:'Viewport <em>1920px</em> — sidebar chiếm tỷ trọng lớn, nội dung dàn trải thoải mái.', nav:4, sb:true }
];

const dev=document.getElementById('dev'), hv=document.getElementById('hv'), dr=document.getElementById('dr'), fb=document.getElementById('fb');
const nl=document.getElementById('nl'), sb=document.getElementById('sb');
const sl=document.getElementById('sl'), dbs=document.querySelectorAll('.db');

function setNav(count){
  const links=nl.querySelectorAll('.inlk');
  links.forEach((l,i)=>l.classList.toggle('off', i>=count));
}

function update(w){
  dev.style.width = w + '%';
  
  // Find nearest preset
  let near = V[0], minD = 100;
  V.forEach(v=>{
    let d = Math.abs(v.w - w);
    if(d < minD){ minD = d; near = v; }
  });
  
  dev.style.height = near.h + '%';
  dr.textContent = near.dims + ' · ' + near.uc;
  fb.innerHTML = near.fb;
  hv.textContent = near.label + (minD < 2 ? ' PRESET' : ' CUSTOM');
  
  setNav(near.nav);
  sb.classList.toggle('off', !near.sb);
  
  dbs.forEach(b => b.classList.toggle('act', V[parseInt(b.dataset.i)].w === near.w && minD < 2));
}

sl.oninput = () => update(parseInt(sl.value));

dbs.forEach(b => {
  b.onclick = () => {
    const i = parseInt(b.dataset.i);
    const v = V[i];
    sl.value = v.w;
    update(v.w);
  };
});

// Init
update(24);
</script>
</body>
</html>
