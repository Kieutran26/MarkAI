<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index Practice — Layer Audit Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f12;
            --card-bg: #16161b;
            --amber: #E88C2E;
            --border: #2a2a32;
            --text: #e0e0e6;
            --muted: #707070;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .practice-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-top: 2px solid var(--amber);
            border-radius: 4px;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
            position: relative;
        }

        @media (max-width: 700px) {
            .practice-container {
                grid-template-columns: 1fr;
                max-height: 90vh;
                overflow-y: auto;
            }
        }

        .header {
            grid-column: 1 / -1;
            margin-bottom: 8px;
        }

        .header h2 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--amber);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .layer-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s var(--ease);
        }

        .layer-card:hover {
            border-color: #444;
            background: rgba(255, 255, 255, 0.05);
        }

        .layer-info {
            display: flex;
            flex-direction: column;
        }

        .layer-name {
            font-size: 13px;
            font-weight: 600;
        }

        .layer-desc {
            font-size: 10px;
            color: var(--muted);
        }

        .z-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #000;
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 3px;
        }

        .z-input-group span {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--muted);
        }

        .z-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--amber);
            width: 40px;
            text-align: center;
            background: transparent;
            border: none;
        }

        .btn-step {
            background: transparent;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 2px;
            opacity: 0.5;
            transition: 0.2s;
        }

        .btn-step:hover {
            opacity: 1;
            color: var(--amber);
        }

        /* Preview Area */
        .preview-area {
            background: #0a0a0c;
            border: 1px solid var(--border);
            border-radius: 4px;
            height: 320px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .stack-visual {
            position: relative;
            width: 180px;
            height: 120px;
            transform: rotateX(50deg) rotateZ(-30deg);
            transform-style: preserve-3d;
            transition: all 0.8s var(--ease);
        }

        .visual-layer {
            position: absolute;
            inset: 0;
            border: 1.5px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.5s var(--ease);
            pointer-events: none;
            border-radius: 2px;
        }

        .visual-layer::after {
            content: '';
            position: absolute;
            inset: 0;
            background: currentColor;
            opacity: 0.1;
        }

        /* Status Board */
        .status-board {
            grid-column: 1 / -1;
            background: rgba(232, 140, 46, 0.05);
            border-left: 2px solid var(--amber);
            padding: 12px 16px;
            margin-top: 8px;
        }

        .status-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--amber);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-msg {
            font-size: 12px;
            line-height: 1.5;
            color: var(--text);
        }

        .status-msg strong {
            color: var(--amber);
        }

        .audit-badge {
            position: absolute;
            top: 24px;
            right: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            padding: 4px 10px;
            border: 1px solid var(--amber);
            color: var(--amber);
            border-radius: 100px;
            text-transform: uppercase;
        }

        .hint {
            font-size: 10px;
            color: var(--muted);
            margin-top: 12px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="practice-container">
    <div id="audit-status" class="audit-badge">Checking...</div>

    <div class="header">
        <h2><span style="font-family: 'JetBrains Mono'; font-weight: 400; opacity: 0.5;">{ }</span> Z-INDEX AUDIT LAB</h2>
        <p>Phòng thí nghiệm kiểm định thứ tự lớp. Hãy sắp xếp để các thành phần không che lấp nhau sai logic.</p>
    </div>

    <div class="control-panel" id="layers-list">
        <!-- Dynamic layers -->
    </div>

    <div class="preview-area">
        <div class="stack-visual" id="stack-visual">
            <!-- Dynamic visual layers -->
        </div>
    </div>

    <div class="status-board">
        <div class="status-title">System Audit Log</div>
        <div id="audit-log" class="status-msg">Khởi tạo hệ thống... Đang chờ cấu hình z-index.</div>
    </div>

    <div class="hint">
        * Mẹo: Modal phải luôn trên Navbar, và Toast thông báo phải ở lớp cao nhất (Top-most).
    </div>
</div>

<script>
    const layers = [
        { id: 'content', name: 'Base Content', desc: 'Nội dung trang web', z: 0, color: '#444' },
        { id: 'navbar', name: 'Sticky Navbar', desc: 'Thanh điều hướng', z: 10, color: '#3498db' },
        { id: 'modal', name: 'Modal UI', desc: 'Cửa sổ bật lên', z: 5, color: '#9b59b6' },
        { id: 'toast', name: 'Toast Notif', desc: 'Thông báo nhanh', z: 20, color: '#2ecc71' }
    ];

    function render() {
        const list = document.getElementById('layers-list');
        const visual = document.getElementById('stack-visual');
        
        list.innerHTML = '';
        visual.innerHTML = '';

        // Sort layers for visual stacking (CSS z-index)
        const sorted = [...layers].sort((a, b) => a.z - b.z);

        layers.forEach((layer, index) => {
            // Render Control Card
            const card = document.createElement('div');
            card.className = 'layer-card';
            card.innerHTML = `
                <div class="layer-info">
                    <span class="layer-name">${layer.name}</span>
                    <span class="layer-desc">${layer.desc}</span>
                </div>
                <div class="z-input-group">
                    <button class="btn-step" onclick="changeZ(${index}, -10)">-</button>
                    <input type="text" class="z-value" value="${layer.z}" readonly>
                    <button class="btn-step" onclick="changeZ(${index}, 10)">+</button>
                    <span>z-index</span>
                </div>
            `;
            list.appendChild(card);

            // Render Visual Layer
            const vLayer = document.createElement('div');
            vLayer.className = 'visual-layer';
            // Scale z value for visual height (0 to 100px)
            const visualHeight = (layer.z / 100) * 150; 
            vLayer.style.transform = `translateZ(${visualHeight}px)`;
            vLayer.style.color = layer.color;
            vLayer.style.borderColor = layer.color;
            vLayer.style.zIndex = layer.z;
            vLayer.innerHTML = `<span>${layer.name}</span>`;
            visual.appendChild(vLayer);
        });

        audit();
    }

    function changeZ(index, delta) {
        layers[index].z = Math.max(0, Math.min(9999, layers[index].z + delta));
        render();
    }

    function audit() {
        const log = document.getElementById('audit-log');
        const badge = document.getElementById('audit-status');
        
        const navbar = layers.find(l => l.id === 'navbar');
        const modal = layers.find(l => l.id === 'modal');
        const toast = layers.find(l => l.id === 'toast');
        const content = layers.find(l => l.id === 'content');

        let issues = [];

        if (modal.z <= navbar.z) {
            issues.push("<strong>Navbar</strong> đang che mất <strong>Modal</strong>. Người dùng sẽ không thể tương tác với cửa sổ.");
        }
        if (toast.z <= modal.z) {
            issues.push("<strong>Toast</strong> thông báo nằm dưới <strong>Modal</strong>. Thông báo quan trọng sẽ bị ẩn.");
        }
        if (content.z >= navbar.z && navbar.z > 0) {
            issues.push("<strong>Content</strong> đè lên <strong>Navbar</strong>. Menu bị biến mất khi cuộn.");
        }

        if (issues.length === 0) {
            log.innerHTML = "Cấu trúc phân lớp hoàn hảo. Hệ thống đạt chuẩn <strong>Production Ready</strong>.";
            badge.innerText = "Verified";
            badge.style.color = "#2ecc71";
            badge.style.borderColor = "#2ecc71";
        } else {
            log.innerHTML = issues[0]; // Show first issue
            badge.innerText = "Issue Found";
            badge.style.color = "#e74c3c";
            badge.style.borderColor = "#e74c3c";
        }
    }

    render();
</script>

</body>
</html>
