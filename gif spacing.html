<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacing Styles — Animated Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0e0e11;
    --bg-card: #17171c;
    --fg: #f0ece4;
    --muted: #6b6b78;
    --accent: #e8753a;
    --accent-light: #f4a261;
    --bar-dark: #2a2a33;
    --bar-mid: #4a4a58;
    --border: #2a2a33;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
    min-height: auto;
    overflow-x: hidden;
    overflow-y: hidden;
  }

  /* === Nền atmosphere === */
  .bg-glow {
    position: fixed;
    top: -20%;
    right: -10%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(232,117,58,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow-2 {
    position: fixed;
    bottom: -15%;
    left: -5%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(244,162,97,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .bg-grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* === Header === */
  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 26px 24px 6px;
  }
  header .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(232,117,58,0.08);
    border: 1px solid rgba(232,117,58,0.15);
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -1.5px;
    color: var(--fg);
  }
  header h1 span {
    color: var(--accent);
  }
  header p {
    margin-top: 16px;
    color: var(--muted);
    font-size: 16px;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }

  /* === Tab navigation === */
  .tab-nav {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 12px 24px 6px;
    flex-wrap: wrap;
  }
  .tab-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    padding: 10px 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .tab-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .tab-btn:hover {
    border-color: rgba(232,117,58,0.3);
    color: var(--fg);
  }
  .tab-btn.active {
    border-color: var(--accent);
    color: #fff;
    background: rgba(232,117,58,0.12);
  }
  .tab-btn .num {
    color: var(--accent);
    font-weight: 500;
    margin-right: 6px;
  }
  .tab-btn.active .num {
    color: var(--accent-light);
  }

  /* === Main demo area === */
  main {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 12px 24px 24px;
  }

  /* === Demo panel === */
  .demo-panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    min-height: 250px;
    display: flex;
    align-items: center;
    gap: 48px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.4s ease;
  }
  .demo-panel:hover {
    border-color: rgba(232,117,58,0.2);
  }
  .demo-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,117,58,0.3), transparent);
  }

  /* === Vuông cam có chéo === */
  .square-wrap {
    flex-shrink: 0;
    width: 120px;
    height: 120px;
    position: relative;
  }
  .cross-square {
    width: 100%;
    height: 100%;
    background:
      repeating-linear-gradient(
        45deg,
        var(--accent),
        var(--accent) 3px,
        rgba(232,117,58,0.35) 3px,
        rgba(232,117,58,0.35) 6px
      );
    border-radius: 6px;
    position: relative;
    box-shadow: 0 8px 32px rgba(232,117,58,0.15);
    animation: squarePulse 3s ease-in-out infinite;
  }
  .cross-square::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 6px;
    border: 2px solid rgba(255,255,255,0.1);
  }
  @keyframes squarePulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(232,117,58,0.15); }
    50% { box-shadow: 0 8px 48px rgba(232,117,58,0.25); }
  }

  /* === Phần bars === */
  .bars-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0;
    position: relative;
    min-height: 145px;
    justify-content: center;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 16px;
    transition: margin-bottom 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    opacity: 0;
    transform: translateX(-20px);
  }
  .bar-row.visible {
    opacity: 1;
    transform: translateX(0);
    transition: opacity 0.5s ease, transform 0.5s ease, margin-bottom 0.7s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .bar {
    height: 12px;
    border-radius: 3px;
    transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
  }
  .bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,0.06));
    border-radius: 3px;
  }
  .bar.dark { background: var(--bar-dark); }
  .bar.mid { background: var(--bar-mid); }

  .bar-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    min-width: 50px;
    text-align: right;
    transition: all 0.5s ease;
    white-space: nowrap;
  }
  .bar-row.visible .bar-label {
    color: var(--accent-light);
  }

  /* === Thông tin style === */
  .style-info {
    position: absolute;
    bottom: 20px;
    left: 28px;
    text-align: left;
  }
  .style-info .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .style-info .value {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    transition: all 0.5s ease;
  }

  /* === Dải chỉ thị spacing === */
  .spacing-indicator {
    position: absolute;
    right: 12px;
    top: 0;
    bottom: 0;
    width: 2px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.6s ease 0.4s;
  }
  .spacing-indicator.show { opacity: 1; }
  .spacing-indicator .dot {
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
    margin-left: -1px;
  }

  @media (max-width: 800px) {
    .demo-panel { flex-direction: column; padding: 22px 18px; gap: 22px; }
  }

  /* === Auto-play toggle === */
  .auto-play-wrap {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
  }
  .ctrl-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    padding: 10px 22px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
  }
  .ctrl-btn:hover {
    border-color: var(--accent);
    color: var(--fg);
  }
  .ctrl-btn.playing {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,117,58,0.08);
  }
  .ctrl-btn i { font-size: 12px; }

  /* === Progress bar === */
  .progress-track {
    width: 200px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    align-self: center;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.1s linear;
  }

  /* === Toast === */
  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    transform: translateY(-20px);
    background: var(--bg-card);
    border: 1px solid var(--border);
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 13px;
    color: var(--fg);
    z-index: 100;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }
  .toast span { color: var(--accent); font-weight: 600; }

  /* === Fade-in entrance === */
  .fade-up {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .fade-up.in {
    opacity: 1;
    transform: translateY(0);
  }

  /* === Reduced motion === */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-glow-2"></div>
<div class="bg-grid"></div>

<header class="fade-up">
  <h1>4 Kiểu <span>Spacing</span></h1>
</header>

<nav class="tab-nav fade-up" aria-label="Chọn kiểu spacing">
  <button class="tab-btn active" data-index="0" aria-pressed="true"><span class="num">01</span>Tight</button>
  <button class="tab-btn" data-index="1" aria-pressed="false"><span class="num">02</span>Comfortable</button>
  <button class="tab-btn" data-index="2" aria-pressed="false"><span class="num">03</span>Loose</button>
  <button class="tab-btn" data-index="3" aria-pressed="false"><span class="num">04</span>Extra Loose</button>
</nav>

<main>
  <!-- Panel demo chính -->
  <section class="demo-panel fade-up" id="demoPanel" aria-live="polite">
    <div class="square-wrap">
      <div class="cross-square"></div>
    </div>
    <div class="bars-area" id="barsArea">
      <!-- Bars sẽ được render bằng JS -->
    </div>
    <div class="spacing-indicator" id="spacingIndicator">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="style-info">
      <div class="label">Khoảng cách</div>
      <div class="value" id="styleValue">4 — 8px</div>
    </div>
  </section>

  <!-- Điều khiển auto-play -->
  <div class="auto-play-wrap fade-up">
    <button class="ctrl-btn" id="autoPlayBtn" aria-label="Tự động phát">
      <i class="fa-solid fa-play"></i>
      <span>Tự động</span>
    </button>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <button class="ctrl-btn" id="resetBtn" aria-label="Đặt lại">
      <i class="fa-solid fa-rotate-left"></i>
      <span>Đặt lại</span>
    </button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // === Dữ liệu 4 kiểu spacing ===
  const spacingStyles = [
    {
      name: 'Tight Spacing',
      num: '01',
      range: '4 — 8px',
      gaps: [4, 6, 4, 8, 6],
      barWidths: ['85%', '100%', '65%', '90%', '75%'],
      barColors: ['dark', 'mid', 'dark', 'mid', 'dark'],
      barLabels: ['4', '6', '4', '8', '6'],
      miniGap: 4
    },
    {
      name: 'Comfortable Spacing',
      num: '02',
      range: '8 — 16px',
      gaps: [8, 12, 8, 16, 12],
      barWidths: ['90%', '70%', '100%', '80%', '95%'],
      barColors: ['mid', 'dark', 'mid', 'dark', 'mid'],
      barLabels: ['8', '12', '8', '16', '12'],
      miniGap: 8
    },
    {
      name: 'Loose Spacing',
      num: '03',
      range: '24 — 32px',
      gaps: [24, 32, 24, 28, 32],
      barWidths: ['75%', '100%', '85%', '95%', '60%'],
      barColors: ['dark', 'mid', 'dark', 'mid', 'dark'],
      barLabels: ['24', '32', '24', '28', '32'],
      miniGap: 16
    },
    {
      name: 'Extra Loose Spacing',
      num: '04',
      range: '40 — 56px',
      gaps: [40, 48, 40, 56, 48],
      barWidths: ['100%', '80%', '90%', '65%', '95%'],
      barColors: ['mid', 'dark', 'mid', 'dark', 'mid'],
      barLabels: ['40', '48', '40', '56', '48'],
      miniGap: 24
    }
  ];

  let currentIndex = 0;
  let autoPlaying = false;
  let autoTimer = null;
  let progressTimer = null;
  let progressValue = 0;
  const AUTO_INTERVAL = 3000; // 3 giây mỗi bước

  // === DOM refs ===
  const barsArea = document.getElementById('barsArea');
  const styleValue = document.getElementById('styleValue');
  const spacingIndicator = document.getElementById('spacingIndicator');
  const autoPlayBtn = document.getElementById('autoPlayBtn');
  const resetBtn = document.getElementById('resetBtn');
  const progressFill = document.getElementById('progressFill');
  const toastEl = document.getElementById('toast');
  const tabBtns = document.querySelectorAll('.tab-btn');
  const demoPanel = document.getElementById('demoPanel');

  // === Render bars vào panel ===
  function renderBars(style, animate = true) {
    barsArea.innerHTML = '';
    style.barWidths.forEach((w, i) => {
      const row = document.createElement('div');
      row.className = 'bar-row';
      // Khoảng cách giữa các bar (bar cuối không có margin-bottom)
      const marginBottom = i < style.gaps.length - 1 ? style.gaps[i] : 0;
      row.style.marginBottom = animate ? '0px' : marginBottom + 'px';

      row.innerHTML = `
        <div class="bar ${style.barColors[i]}" style="width:${animate ? '0%' : w}"></div>
        <div class="bar-label">${style.barLabels[i]}px</div>
      `;
      barsArea.appendChild(row);

      // Animation delay
      if (animate) {
        setTimeout(() => {
          row.classList.add('visible');
          row.style.marginBottom = marginBottom + 'px';
          row.querySelector('.bar').style.width = w;
        }, 60 + i * 100);
      } else {
        row.classList.add('visible');
      }
    });

    // Cập nhật spacing indicator
    spacingIndicator.classList.remove('show');
    if (animate) {
      setTimeout(() => spacingIndicator.classList.add('show'), 400);
    }

    // Cập nhật giá trị
    styleValue.style.opacity = '0';
    styleValue.style.transform = 'translateY(6px)';
    setTimeout(() => {
      styleValue.textContent = style.range;
      styleValue.style.opacity = '1';
      styleValue.style.transform = 'translateY(0)';
    }, 200);
  }

  // === Chuyển đổi ===
  function switchTo(index) {
    if (index === currentIndex) return;
    currentIndex = index;
    const style = spacingStyles[index];

    // Cập nhật tab buttons
    tabBtns.forEach((btn, i) => {
      btn.classList.toggle('active', i === index);
      btn.setAttribute('aria-pressed', i === index ? 'true' : 'false');
    });

    // Render bars với animation
    renderBars(style, true);

    // Toast
    showToast(`<span>${style.num}</span> — ${style.name}`);
  }

  // === Toast ===
  let toastTimeout = null;
  function showToast(html) {
    clearTimeout(toastTimeout);
    toastEl.innerHTML = html;
    toastEl.classList.add('show');
    toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  // === Auto-play ===
  function startAutoPlay() {
    autoPlaying = true;
    autoPlayBtn.classList.add('playing');
    autoPlayBtn.querySelector('i').className = 'fa-solid fa-pause';
    autoPlayBtn.querySelector('span').textContent = 'Tạm dừng';
    progressValue = 0;
    progressFill.style.width = '0%';

    clearInterval(autoTimer);
    clearInterval(progressTimer);

    progressTimer = setInterval(() => {
      progressValue += 100 / (AUTO_INTERVAL / 30);
      if (progressValue > 100) progressValue = 100;
      progressFill.style.width = progressValue + '%';
    }, 30);

    autoTimer = setInterval(() => {
      progressValue = 0;
      progressFill.style.width = '0%';
      const next = (currentIndex + 1) % spacingStyles.length;
      switchTo(next);
    }, AUTO_INTERVAL);
  }

  function stopAutoPlay() {
    autoPlaying = false;
    autoPlayBtn.classList.remove('playing');
    autoPlayBtn.querySelector('i').className = 'fa-solid fa-play';
    autoPlayBtn.querySelector('span').textContent = 'Tự động';
    clearInterval(autoTimer);
    clearInterval(progressTimer);
    progressFill.style.width = '0%';
    progressValue = 0;
  }

  autoPlayBtn.addEventListener('click', () => {
    if (autoPlaying) stopAutoPlay();
    else startAutoPlay();
  });

  resetBtn.addEventListener('click', () => {
    stopAutoPlay();
    switchTo(0);
    renderBars(spacingStyles[0], true);
    showToast('<span>00</span> — Đã đặt lại');
  });

  // === Tab buttons ===
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      switchTo(parseInt(btn.dataset.index));
    });
  });

  // === Keyboard navigation ===
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') {
      const next = (currentIndex + 1) % spacingStyles.length;
      switchTo(next);
    } else if (e.key === 'ArrowLeft') {
      const prev = (currentIndex - 1 + spacingStyles.length) % spacingStyles.length;
      switchTo(prev);
    } else if (e.key === ' ' && document.activeElement === document.body) {
      e.preventDefault();
      if (autoPlaying) stopAutoPlay();
      else startAutoPlay();
    }
  });

  // === Fade-in trên load ===
  function initFadeUps() {
    const elements = document.querySelectorAll('.fade-up');
    elements.forEach((el, i) => {
      setTimeout(() => el.classList.add('in'), 100 + i * 150);
    });
  }

  // === Khởi tạo ===
  function init() {
    renderBars(spacingStyles[0], false);
    // Delay để hiện bars ngay nhưng có hiệu ứng vào
    setTimeout(() => {
      renderBars(spacingStyles[0], true);
    }, 600);
    initFadeUps();
  }

  init();
</script>
</body>
</html>
