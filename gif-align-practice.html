<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Align Practice — Vibecode Glossary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
    --bg:#141413;--bg-card:#1c1c1a;--fg:#e8e0d4;--muted:#6e6a63;
    --accent:#d97706;--accent-dim:rgba(217,119,6,.12);
    --border:#2e2c28;--border-hi:#3e3b35;--slate:#33312d;--cream:#f5f0e8;
    --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);background-size:20px 20px}

.pr{padding:24px 20px 32px;max-width:920px;margin:0 auto}
.pr-h{margin-bottom:16px}
.pr-g{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:4px}
.pr-d{font-size:12px;color:var(--muted)}

.pr-layout{display:grid;grid-template-columns:300px 1fr;gap:20px}

.pr-ctrls{display:flex;flex-direction:column;gap:16px}
.ctrl-grp{display:flex;flex-direction:column;gap:8px}
.ctrl-l{font-family:var(--mono);font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.btn-grid.tr{grid-template-columns:1fr 1fr 1fr}

.pr-btn{font-family:var(--mono);font-size:10px;padding:8px;background:var(--bg);color:var(--muted);border:1px solid var(--border);cursor:pointer;transition:all .2s;text-align:center}
.pr-btn:hover{border-color:var(--border-hi);color:var(--fg)}
.pr-btn.on{background:var(--accent);color:#0e0e0d;border-color:var(--accent);font-weight:600}

.pr-prev{background:#0e0e0d;border:1px solid var(--border);position:relative;height:400px;display:flex;flex-direction:column;overflow:hidden}
.prev-cont{flex:1;display:flex;padding:20px;gap:12px;transition:all .4s cubic-bezier(.4,0,.2,1);position:relative}
.prev-cont::before{content:'';position:absolute;inset:20px;border:1px dashed rgba(255,255,255,0.05);pointer-events:none}

.p-card{width:80px;height:100px;background:var(--slate);border:1px solid var(--border-hi);display:flex;flex-direction:column;padding:8px;gap:6px;transition:all .4s}
.p-av{width:20px;height:20px;border-radius:50%;background:var(--border);transition:all .4s}
.p-t{height:6px;width:100%;background:var(--muted);border-radius:1px;transition:all .4s}
.p-b{height:12px;width:100%;background:var(--accent-dim);border:1px solid var(--accent);margin-top:auto}

.pr-f{font-family:var(--mono);font-size:11px;color:var(--fg);padding:14px 16px;margin-top:20px;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--accent);line-height:1.6}
.pr-f em{color:var(--accent);font-style:normal}

@media(max-width:800px){
    .pr-layout{grid-template-columns:1fr}
    .pr-prev{height:300px}
}
</style>
</head>
<body>

<main>
<section class="pr">
    <div class="pr-h">
        <div class="pr-g">Align Laboratory</div>
        <p class="pr-d">Thử nghiệm các thuộc tính căn lề và phân bổ không gian trong Flexbox.</p>
    </div>

    <div class="pr-layout">
        <div class="pr-ctrls">
            <div class="ctrl-grp">
                <div class="ctrl-l">Justify Content (Phân bổ ngang)</div>
                <div class="btn-grid tr">
                    <button class="pr-btn on" data-prop="jc" data-val="flex-start">start</button>
                    <button class="pr-btn" data-prop="jc" data-val="center">center</button>
                    <button class="pr-btn" data-prop="jc" data-val="flex-end">end</button>
                    <button class="pr-btn" data-prop="jc" data-val="space-between">between</button>
                    <button class="pr-btn" data-prop="jc" data-val="space-around">around</button>
                    <button class="pr-btn" data-prop="jc" data-val="space-evenly">evenly</button>
                </div>
            </div>

            <div class="ctrl-grp">
                <div class="ctrl-l">Align Items (Căn lề dọc)</div>
                <div class="btn-grid">
                    <button class="pr-btn on" data-prop="ai" data-val="flex-start">top</button>
                    <button class="pr-btn" data-prop="ai" data-val="center">middle</button>
                    <button class="pr-btn" data-prop="ai" data-val="flex-end">bottom</button>
                    <button class="pr-btn" data-prop="ai" data-val="stretch">stretch</button>
                </div>
            </div>

            <div class="ctrl-grp">
                <div class="ctrl-l">Card Content Align</div>
                <div class="btn-grid tr">
                    <button class="pr-btn on" data-prop="ta" data-val="flex-start">left</button>
                    <button class="pr-btn" data-prop="ta" data-val="center">center</button>
                    <button class="pr-btn" data-prop="ta" data-val="flex-end">right</button>
                </div>
            </div>
        </div>

        <div class="pr-prev">
            <div class="prev-cont" id="pcont" style="justify-content: flex-start; align-items: flex-start;">
                <div class="p-card" style="align-items: flex-start;">
                    <div class="p-av"></div>
                    <div class="p-t" style="width: 80%"></div>
                    <div class="p-t" style="width: 50%"></div>
                    <div class="p-b"></div>
                </div>
                <div class="p-card" style="height: 120px; align-items: flex-start;">
                    <div class="p-av"></div>
                    <div class="p-t" style="width: 90%"></div>
                    <div class="p-t" style="width: 60%"></div>
                    <div class="p-b"></div>
                </div>
                <div class="p-card" style="align-items: flex-start;">
                    <div class="p-av"></div>
                    <div class="p-t" style="width: 70%"></div>
                    <div class="p-t" style="width: 40%"></div>
                    <div class="p-b"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="pr-f" id="pf">
        Sử dụng <em>justify-content: flex-start</em> để xếp các phần tử từ đầu hàng.
    </div>
</section>
</main>

<script>
(function(){
    var pcont = document.getElementById('pcont');
    var cards = document.querySelectorAll('.p-card');
    var pf = document.getElementById('pf');
    var btns = document.querySelectorAll('.pr-btn');

    var state = {
        jc: 'flex-start',
        ai: 'flex-start',
        ta: 'flex-start'
    };

    function update() {
        pcont.style.justifyContent = state.jc;
        pcont.style.alignItems = state.ai;
        
        cards.forEach(function(card){
            card.style.alignItems = state.ta;
            if(state.ai === 'stretch') {
                card.style.height = '100%';
            } else {
                // Restore original heights if not stretch
                if(card.textContent === '') { // Just a trick to identify them or use index
                   // card.style.height = '100px'; 
                }
            }
        });

        // Specific fix for stretch vs fixed heights in demo
        cards[0].style.height = state.ai === 'stretch' ? '100%' : '100px';
        cards[1].style.height = state.ai === 'stretch' ? '100%' : '120px';
        cards[2].style.height = state.ai === 'stretch' ? '100%' : '100px';

        var msg = "";
        if(state.jc !== 'flex-start') msg = "justify-content: " + state.jc + "; ";
        if(state.ai !== 'flex-start') msg += "align-items: " + state.ai + "; ";
        if(state.ta !== 'flex-start') msg += "content-align: " + state.ta + ";";

        if(!msg) msg = "Mọi thứ đang ở trạng thái mặc định (flex-start).";
        pf.innerHTML = "CSS: <em>" + (msg || "mặc định") + "</em>";
    }

    btns.forEach(function(btn){
        btn.addEventListener('click', function(){
            var prop = btn.dataset.prop;
            var val = btn.dataset.val;

            // Update state
            state[prop] = val;

            // Update buttons
            document.querySelectorAll('.pr-btn[data-prop="'+prop+'"]').forEach(function(b){
                b.classList.remove('on');
            });
            btn.classList.add('on');

            update();
        });
    });

    update();
})();
</script>
</body>
</html>
