<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth Process — Editorial Demo</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0b0b0e;
    --fg: #e8e4dc;
    --muted: #6e6e7a;
    --accent: #e88c2e;
    --border: #222228;
    --card-bg: #141419;
    --surface: #1a1a21;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: var(--bg); 
    color: var(--fg); 
    font-family: 'Inter', sans-serif;
    padding: 20px 20px 80px;
    line-height: 1.5;
    min-height: auto;
  }
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.02) 1px,transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding-bottom: 28px;
    position: relative;
    z-index: 1;
  }

  #app-root {
    display: block;
  }

  /* Tabs */
  .tab-nav {
    display: inline-flex;
    border: 1px solid var(--border);
    margin-bottom: 20px;
    background: var(--card-bg);
  }
  .tab-btn {
    background: transparent;
    border: none;
    border-right: 1px solid var(--border);
    padding: 8px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tab-btn:last-child { border-right: none; }
  .tab-btn.active {
    background: var(--accent);
    color: #000;
  }
  .tab-btn.active .num { color: #000; }

  /* Grid */
  .process-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 24px;
  }

  /* Card */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 0;
    display: flex;
    min-height: 300px;
    position: relative;
    overflow: hidden;
  }

  .card-id {
    position: absolute;
    top: 15px;
    left: 15px;
    background: var(--accent);
    color: #000;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 6px;
    z-index: 10;
  }

  /* Split Layout */
  .card-visual {
    width: 45%;
    border-right: 1px solid var(--border);
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: rgba(255,255,255,0.01);
  }
  .card-content {
    width: 55%;
    padding: 28px 30px 34px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .card-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 24px;
    position: absolute;
    top: 18px;
    left: 60px;
  }

  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
    color: var(--fg);
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 18px;
  }

  /* Form Elements */
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: 1px solid var(--border);
    padding: 12px;
    background: var(--surface);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    margin-bottom: 16px;
    transition: all 0.2s;
  }
  .btn-google:hover { border-color: var(--accent); }
  .btn-google img { width: 18px; filter: grayscale(1) invert(1); }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 16px;
  }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .legal {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.55;
  }
  .legal a { color: var(--fg); text-decoration: underline; }

  .account-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    margin-bottom: 20px;
    gap: 12px;
  }
  .acc-info { display: flex; align-items: center; gap: 12px; overflow: hidden; }
  .acc-icon { width: 32px; height: 32px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .acc-email { font-size: 12px; font-weight: 500; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .btn-link {
      background: transparent;
      border: none;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-top: 8px;
    }

  /* Admin Form */
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; font-size: 11px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  .form-group input {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  .btn-submit {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 12px;
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
  }

  /* Visuals (CSS Illustrations) */
  .vis-landing {
    position: relative;
    width: 120px;
    height: 120px;
  }
  .vis-landing .circle { width: 60px; height: 60px; background: #fff; border-radius: 50%; position: absolute; bottom: 10px; left: 0; opacity: 0.9; }
  .vis-landing .square { width: 35px; height: 35px; background: var(--accent); position: absolute; top: 15px; left: 35px; z-index: 2; }
  .vis-landing .arc { width: 60px; height: 60px; background: rgba(255,255,255,0.1); border-top-right-radius: 60px; position: absolute; top: 25px; right: 0; }
  .vis-landing .dots { position: absolute; bottom: 15px; right: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .vis-landing .dots span { width: 2px; height: 2px; background: var(--muted); border-radius: 50%; }

  .vis-consent {
    width: 140px;
    height: 100px;
    border: 1px solid var(--border);
    border-radius: 4px;
    position: relative;
    padding-top: 15px;
    background: var(--surface);
  }
  .vis-consent::before { content: '...'; position: absolute; top: 2px; left: 8px; color: var(--muted); font-size: 12px; letter-spacing: 2px; }
  .vis-consent .g-icon { width: 28px; height: 28px; position: absolute; top: 30px; left: 50%; transform: translateX(-50%); filter: invert(1) grayscale(1) brightness(1.5); }
  .vis-consent .acc-placeholder { position: absolute; bottom: 10px; left: 10px; width: 34px; height: 34px; background: rgba(255,255,255,0.05); border-radius: 50%; }
  .vis-consent .line-placeholder { position: absolute; bottom: 22px; left: 50px; width: 50px; height: 4px; background: rgba(255,255,255,0.05); }
  .vis-consent .line-placeholder.short { bottom: 12px; width: 35px; }

  .vis-admin {
    position: relative;
    width: 120px;
    height: 120px;
  }
  .vis-admin .box { width: 75px; height: 75px; background: #fff; position: absolute; top: 15px; left: 10px; opacity: 0.9; }
  .vis-admin .box-orange { width: 35px; height: 35px; background: var(--accent); position: absolute; top: 60px; left: 70px; z-index: 2; }
  .vis-admin .zigzag { position: absolute; bottom: 10px; right: 0; width: 50px; height: 35px; border-left: 1px solid var(--fg); border-top: 1px solid var(--fg); }
  .vis-admin .dots { position: absolute; bottom: 10px; left: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .vis-admin .dots span { width: 2px; height: 2px; background: var(--muted); border-radius: 50%; }

  .vis-denied {
    position: relative;
    width: 100px;
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .vis-denied .padlock { width: 45px; height: 35px; background: var(--fg); border-radius: 4px; position: relative; margin-top: 15px; }
  .vis-denied .padlock::before { content: ''; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 28px; height: 28px; border: 5px solid var(--fg); border-bottom: none; border-top-left-radius: 14px; border-top-right-radius: 14px; }
  .vis-denied .padlock::after { content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 4px; height: 10px; background: var(--bg); border-radius: 2px; }
  .vis-denied .x-mark { position: absolute; bottom: 25px; right: 15px; width: 24px; height: 24px; background: var(--accent); border-radius: 50%; color: #000; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid var(--bg); z-index: 3; }
  .vis-denied .dots { position: absolute; bottom: 5px; left: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
  .vis-denied .dots span { width: 2px; height: 2px; background: var(--muted); border-radius: 50%; }

  .btn-back {
    display: inline-block;
    border: 1px solid var(--muted);
    padding: 10px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    text-decoration: none;
    color: var(--fg);
    margin-bottom: 20px;
      transition: all 0.2s;
    }
  .btn-back:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Fade animation */
  .fade-content {
    animation: fadeIn 0.4s ease-out forwards;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .intro-text {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 24px;
    max-width: 850px;
    color: var(--fg);
    font-weight: 400;
  }

  .tip-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 14px 16px;
    margin-top: 24px;
    margin-bottom: 24px;
    display: flex;
    gap: 15px;
    align-items: center;
    font-size: 13px;
    line-height: 1.6;
    color: var(--fg);
    max-width: 1000px;
    transition: all 0.3s ease;
  }
  .tip-box i {
    color: var(--accent);
    font-size: 14px;
  }
  .tip-box b {
    color: var(--accent);
    transition: all 0.3s ease;
  }

  .is-hidden { display: none !important; }

  @media (max-width: 850px) {
    .process-grid { grid-template-columns: 1fr; }
    .card { flex-direction: column; min-height: auto; }
    .card-visual, .card-content { width: 100%; border-right: none; }
    .card-visual { padding: 60px 20px 40px; border-bottom: 1px solid #eee; }
  }
</style>
</head>
<body>

<div id="app-root">
  <div class="container">
    <div class="intro-text">
      <span style="color:var(--accent);">Auth</span> gồm hai việc: xác minh bạn là ai <strong>(authentication)</strong>, rồi quyết định bạn được làm gì <strong>(authorization)</strong>. Nhầm lẫn hai việc này = prompt sai, debug sai, và hỏi dev sai câu hỏi.
    </div>

    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="0">
        <span class="num">01</span> USER (GOOGLE SIGN IN)
      </button>
      <button class="tab-btn" data-tab="1">
        <span class="num">02</span> ADMIN (ROLE-BASED ACCESS)
      </button>
    </nav>

    <div class="process-grid" id="processGrid">
      <!-- Cards will be rendered here -->
    </div>

    <div class="tip-box" id="tipBox">
      <i class="fa-solid fa-lightbulb"></i>
      <div id="tipContent"></div>
    </div>
  </div>
</div>

<script>
  const steps = [
    {
      tab: 0,
      id: '01',
      label: 'USER — LANDING',
      heading: 'Welcome',
      subtitle: 'Sign in to continue',
      visual: 'vis-landing',
      type: 'landing'
    },
    {
      tab: 0,
      id: '02',
      label: 'USER — GOOGLE CONSENT',
      heading: 'Choose an account',
      subtitle: 'to continue to our website',
      visual: 'vis-consent',
      type: 'consent'
    },
    {
      tab: 1,
      id: '03',
      label: 'ADMIN — LOGIN',
      heading: 'Admin Login',
      subtitle: 'Please sign in to continue',
      visual: 'vis-admin',
      type: 'admin'
    },
    {
      tab: 1,
      id: '04',
      label: 'ADMIN — ACCESS DENIED',
      heading: 'Access Denied',
      subtitle: 'You don\'t have permission to access the admin area.',
      visual: 'vis-denied',
      type: 'denied'
    }
  ];

  const tabBtns = document.querySelectorAll('.tab-btn');
  let activeTab = 0;

  function renderProcess(tabIndex) {
      const grid = document.getElementById('processGrid');
      grid.innerHTML = '';
      
      const filtered = steps.filter(s => s.tab === tabIndex);
      
      filtered.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = 'card fade-content';
        card.style.animationDelay = `${idx * 0.1}s`;
        
        let visualHtml = '';
        let contentHtml = '';
        
        if (s.type === 'landing') {
          visualHtml = `
            <div class="vis-landing">
              <div class="circle"></div>
              <div class="square"></div>
              <div class="arc"></div>
              <div class="dots">${'<span></span>'.repeat(16)}</div>
            </div>
          `;
          contentHtml = `
            <button class="btn-google" onclick="alert('Google Sign In initiated...')">
              <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png">
              Continue with Google
            </button>
            <div class="divider">or</div>
            <p class="legal">By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
          `;
        } else if (s.type === 'consent') {
          visualHtml = `
            <div class="vis-consent">
              <div class="g-icon"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" style="width:28px"></div>
              <div class="acc-placeholder"></div>
              <div class="line-placeholder"></div>
              <div class="line-placeholder short"></div>
            </div>
          `;
          contentHtml = `
            <div class="account-row" onclick="alert('Account selected: yourname@gmail.com')">
              <div class="acc-info">
                <div class="acc-icon"><i class="fa-solid fa-user"></i></div>
                <span class="acc-email">yourname@gmail.com</span>
              </div>
              <i class="fa-solid fa-chevron-right" style="font-size:12px; color:#ccc"></i>
            </div>
            <button class="btn-link" onclick="alert('Opening account selector...')">
              <i class="fa-solid fa-circle-user"></i> Use another account
            </button>
          `;
        } else if (s.type === 'admin') {
          visualHtml = `
            <div class="vis-admin">
              <div class="box"></div>
              <div class="box-orange"></div>
              <div class="zigzag"></div>
              <div class="dots">${'<span></span>'.repeat(16)}</div>
            </div>
          `;
          contentHtml = `
            <div class="form-group">
              <label>Email</label>
              <input type="text" value="admin@yourdomain.com" readonly>
            </div>
            <div class="form-group">
              <label>Password</label>
              <div style="position:relative">
                <input type="password" value="............" readonly>
                <i class="fa-solid fa-eye" style="position:absolute; right:10px; top:12px; font-size:12px; color:#aaa"></i>
              </div>
            </div>
            <button class="btn-submit" onclick="alert('Admin Login Attempted...')">Sign In</button>
          `;
        } else if (s.type === 'denied') {
          visualHtml = `
            <div class="vis-denied">
              <div class="padlock"></div>
              <div class="x-mark"><i class="fa-solid fa-xmark"></i></div>
              <div class="dots">${'<span></span>'.repeat(16)}</div>
            </div>
          `;
          contentHtml = `
            <a href="javascript:void(0)" class="btn-back" onclick="switchTab(1)">GO BACK</a>
            <p class="subtitle" style="margin-bottom:0">Contact your administrator if you believe this is a mistake.</p>
          `;
        }

        card.innerHTML = `
          <div class="card-id">0${idx + 1}</div>
          <div class="card-visual">
            <div class="card-label">${s.label}</div>
            ${visualHtml}
          </div>
          <div class="card-content">
            <h2 class="fade-content">${s.heading}</h2>
            <p class="subtitle fade-content">${s.subtitle}</p>
            <div class="fade-content" style="animation-delay: 0.2s">
              ${contentHtml}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

  const tipContent = {
    0: '<b>User Login:</b> Bạn thấy form đăng nhập. Ở đây, web hỏi "bạn là ai?". Nhấn Google = ủy quyền cho Google trả lời thay.',
    1: '<b>Admin Login:</b> Admin thường KHÔNG dùng Google. Phải nhập email + password trực tiếp vì đây là đường vào hệ thống nhạy cảm.'
  };

  function switchTab(index) {
    activeTab = index;
    tabBtns.forEach(b => b.classList.toggle('active', parseInt(b.dataset.tab) === index));
    
    const tipEl = document.getElementById('tipContent');
    tipEl.classList.remove('fade-content');
    void tipEl.offsetHeight; // trigger reflow
    tipEl.innerHTML = tipContent[index];
    tipEl.classList.add('fade-content');
    
    renderProcess(index);
  }

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      switchTab(parseInt(btn.dataset.tab));
    });
  });

  // Initial render
  switchTab(0);
</script>
</body>
</html>
