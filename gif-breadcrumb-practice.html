<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breadcrumb Practice — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f12;--fg:#e8e0d4;--muted:#706b64;--accent:#e88c2e;--accent-dim:rgba(232,140,46,.15);--card:#16161b;--card-alt:#1c1c22;--border:#282830;--border-hi:#44403a;--c1:#4a5a8a;--c2:#4a8a5a;--c3:#b89a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:16px 16px;font-family:'Space Grotesk',sans-serif;color:var(--fg);padding:12px 16px;min-height:auto;overflow:hidden}

.pw{width:100%;margin:0}
.pw-h{font-size:16px;font-weight:800;margin-bottom:4px}
.pw-h span{color:var(--accent)}
.pw-s{font-size:11px;color:var(--muted);margin-bottom:16px;line-height:1.4}

.pr-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.pr-b{padding:8px 14px;border:1px solid var(--border);background:var(--card);font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
.pr-b:hover{border-color:var(--accent);color:var(--fg)}
.pr-b.act{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}

.pr-prev{border:1px solid var(--border);background:var(--card);overflow:hidden;margin-bottom:16px}
.pr-prev-h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.01)}
.pr-prev-l{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:1.5px;font-weight:700}
.pr-prev-t{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;padding:2px 8px;border:1px solid var(--border);font-weight:700}

.pr-url{padding:10px 14px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);background:rgba(0,0,0,.2);word-break:break-all;line-height:1.4}
.pr-bc-area{padding:16px 14px;min-height:50px;display:flex;align-items:center}
.pr-bc{display:flex;align-items:center;flex-wrap:wrap}

.pr-bi{font-size:13px;opacity:0;transform:translateX(-4px);transition:all .25s;white-space:nowrap}.pr-bi.vis{opacity:1;transform:translateX(0)}
.pr-bi.cur{color:var(--accent);font-weight:700}.pr-bi:not(.cur){color:var(--muted)}
.pr-bi.dot{color:var(--accent);font-weight:700;letter-spacing:2px}
.pr-bs{margin:0 7px;color:var(--border-hi);font-size:12px;opacity:0;transition:opacity .2s}.pr-bs.vis{opacity:1}

.pr-fb{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);min-height:36px;margin-top:4px;line-height:1.5;padding:0 14px 14px}
.pr-fb strong{color:var(--fg)}

.pr-ht{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:20px;padding-top:10px;border-top:1px dashed var(--border);opacity:.6;line-height:1.4}

@media(max-width:520px){.pr-btns{gap:6px}.pr-b{padding:6px 10px;font-size:11px}}
</style>
</head>
<body>

<div class="pw">
    <div class="pw-h">Thực hành — <span>URL thành Breadcrumb</span></div>
    <div class="pw-s">Chọn kịch bản để thấy cách URL được parse thành các thành phần điều hướng trực quan.</div>
    
    <div class="pr-btns" id="prBtns"></div>
    
    <div class="pr-prev">
        <div class="pr-prev-h">
            <span class="pr-prev-l">REQUEST URL</span>
            <span class="pr-prev-t" id="prType"></span>
        </div>
        <div class="pr-url" id="prUrl"></div>
        <div class="pr-bc-area">
            <div class="pr-bc" id="prBc"></div>
        </div>
        <div class="pr-fb" id="prFb"></div>
    </div>
    
    <div class="pr-ht">Mẹo: Chú ý số lượng dấu "/" trong URL tương ứng với số lượng item trong Breadcrumb (trừ trường hợp Collapse).</div>
</div>

<script>
const SCENARIOS=[
    {label:'Sản phẩm',url:'/shop/laptops/macbook-pro-14',
     items:[{t:'Home'},{t:'Shop'},{t:'Laptops'},{t:'MacBook Pro 14',cur:true}],
     type:'HIERARCHY',sub:'E-COMMERCE',tc:'var(--accent)',
     fb:'<strong>Phân cấp:</strong> URL có 4 segment → 4 breadcrumb items. Mỗi segment đại diện cho một tầng trong phễu sản phẩm.'},
    {label:'Dashboard',url:'/dashboard/sales/overview',
     items:[{t:'Dashboard'},{t:'Sales'},{t:'Sales Overview',cur:true}],
     type:'LOCATION',sub:'APP NAV',tc:'var(--c1)',
     fb:'<strong>Vị trí:</strong> Trong app quản trị, breadcrumb giúp user xác định "tọa độ" thay vì phân cấp hàng hóa.'},
    {label:'Bài viết Blog',url:'/blog/ux-design/breadcrumb-guide',
     items:[{t:'Blog'},{t:'UX Design'},{t:'Breadcrumb Guide',cur:true}],
     type:'MULTI-LEVEL',sub:'CONTENT',tc:'var(--c2)',
     fb:'<strong>Nội dung:</strong> 3-4 cấp là mức chuẩn cho blog. Giúp user dễ dàng quay lại danh mục chủ đề (UX Design).'},
    {label:'Đường dẫn dài',url:'/shop/electronics/accessories/cables/adapters/usb-c-hub',
     items:[{t:'Home'},{t:'...',dot:true},{t:'USB-C Hub',cur:true}],
     type:'COLLAPSED',sub:'OVERFLOW',tc:'var(--c3)',
     fb:'<strong>Thu gọn:</strong> URL 6 segment → quá dài gây rối mắt. Ta dùng "..." để ẩn bớt các cấp trung gian, chỉ giữ Đầu và Cuối.'}
];

const prBtns=document.getElementById('prBtns');
const prUrl=document.getElementById('prUrl');
const prBc=document.getElementById('prBc');
const prType=document.getElementById('prType');
const prFb=document.getElementById('prFb');

SCENARIOS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='pr-b'+(i===0?' act':'');
    b.textContent=s.label;
    b.onclick=()=>renderPractice(i);
    prBtns.appendChild(b);
});

function renderPractice(idx){
    const s=SCENARIOS[idx];
    prBtns.querySelectorAll('.pr-b').forEach((b,j)=>b.classList.toggle('act',j===idx));
    prUrl.textContent=s.url;
    prType.textContent=s.type + ' · ' + s.sub;
    prType.style.color=s.tc;
    prType.style.borderColor=s.tc;
    
    prBc.innerHTML='';
    s.items.forEach((it,i)=>{
        if(i>0){
            const sep=document.createElement('span');
            sep.className='pr-bs';
            sep.textContent='›';
            prBc.appendChild(sep);
        }
        const item=document.createElement('span');
        item.className='pr-bi'+(it.cur?' cur':'')+(it.dot?' dot':'');
        item.textContent=it.t;
        prBc.appendChild(item);
    });

    requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
            prBc.querySelectorAll('.pr-bi,.pr-bs').forEach((el,i)=>{
                el.style.transitionDelay=(i*0.04)+'s';
                el.classList.add('vis');
            });
        });
    });

    prFb.innerHTML=s.fb;
}

renderPractice(0);
</script>
</body>
</html>
