<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breadcrumb Practice — Vibecode Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f12;
  --bgc: #16161b;
  --bgi: #121217;
  --bd: #282830;
  --tx: #e8e4dc;
  --txm: #707070;
  --ac: #E88C2E;
  --abg: rgba(232, 140, 46, 0.1);
  --abg2: rgba(232, 140, 46, 0.2);
  --success: #22c55e;
  --error: #ef4444;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Space Grotesk', sans-serif;
  background-color: var(--bg);
  background-image: 
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: 20px 20px;
  color: var(--tx);
  padding: 24px 16px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.pw {
  width: 100%;
  max-width: 940px;
}

.pw-h {
  margin-bottom: 24px;
  border-left: 2px solid var(--ac);
  padding-left: 16px;
}

.pw-g {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ac);
  font-weight: 700;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.pw-d {
  font-size: 13px;
  color: var(--txm);
}

.pr-card {
  background: var(--bgc);
  border: 1px solid var(--bd);
  border-radius: 3px;
  padding: 24px;
  position: relative;
  overflow: hidden;
}

.pr-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--ac);
}

.context-box {
  background: var(--bgi);
  border: 1px solid var(--bd);
  padding: 16px;
  margin-bottom: 24px;
  text-align: center;
}

.context-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--txm);
  text-transform: uppercase;
  margin-bottom: 8px;
  display: block;
}

.current-page {
  font-size: 20px;
  font-weight: 700;
  color: var(--tx);
}

.assembly-area {
  min-height: 44px;
  border: 1px dashed var(--bd);
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  margin-bottom: 24px;
  background: rgba(0,0,0,0.2);
  flex-wrap: wrap;
}

.crumb {
  font-size: 13px;
  padding: 4px 10px;
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 2px;
  cursor: pointer;
  color: var(--tx);
  transition: all 0.2s;
  animation: fadeIn 0.3s ease forwards;
}

.crumb:hover {
  border-color: var(--ac);
  color: var(--ac);
}

.crumb.selected {
  opacity: 0.5;
  pointer-events: none;
}

.sep {
  color: var(--bd);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}

.options-area {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.feedback {
  margin-top: 24px;
  padding: 12px;
  border-radius: 2px;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  opacity: 0;
  transition: opacity 0.3s;
  font-family: 'JetBrains Mono', monospace;
}

.feedback.show { opacity: 1; }
.feedback.success { background: rgba(34, 197, 94, 0.1); border: 1px solid var(--success); color: var(--success); }
.feedback.error { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); }

.controls {
  margin-top: 24px;
  display: flex;
  justify-content: flex-start;
}

.btn {
  padding: 6px 14px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 10px;
  font-weight: 600;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-reset {
  background: transparent;
  border: 1px solid var(--bd);
  color: var(--txm);
}

.btn-reset:hover { border-color: var(--tx); color: var(--tx); }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

</style>
</head>
<body>

<main class="pw">
  <div class="pw-h">
    <div class="pw-g">BREADCRUMB BUILDER</div>
    <p class="pw-d">Sắp xếp các "vụn bánh" theo đúng thứ tự phân cấp từ lớn đến nhỏ.</p>
  </div>

  <div class="pr-card">
    <div class="context-box">
      <span class="context-label">Trang hiện tại</span>
      <div class="current-page" id="target-page">iPhone 15 Pro</div>
    </div>

    <div class="assembly-area" id="assembly">
      <!-- Crumb items go here -->
    </div>

    <div class="options-area" id="options">
      <!-- Option buttons go here -->
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="controls">
      <button class="btn btn-reset" onclick="resetLevel()">LÀM LẠI</button>
    </div>
  </div>
</main>

<script>
const LEVELS = [
  {
    target: "iPhone 15 Pro",
    path: ["Home", "Electronics", "Apple", "Smartphones"],
    options: ["Smartphones", "Electronics", "Apple", "Home"]
  },
  {
    target: "Lịch sử giao dịch",
    path: ["Dashboard", "Tài khoản", "Ví điện tử"],
    options: ["Dashboard", "Ví điện tử", "Tài khoản"]
  },
  {
    target: "Xây dựng Brand cho SaaS",
    path: ["Blog", "Marketing", "Brand Strategy"],
    options: ["Blog", "Brand Strategy", "Marketing"]
  }
];

let currentLevel = 0;
let userPath = [];

function initLevel() {
  const level = LEVELS[currentLevel];
  document.getElementById('target-page').textContent = level.target;
  userPath = [];
  renderAssembly();
  renderOptions();
  hideFeedback();
}

function renderAssembly() {
  const container = document.getElementById('assembly');
  container.innerHTML = '';
  
  if (userPath.length === 0) {
    container.innerHTML = '<span style="color: var(--bd); font-size: 11px; font-family: \'JetBrains Mono\'">Bắt đầu từ cấp cao nhất...</span>';
    return;
  }

  userPath.forEach((text, i) => {
    const span = document.createElement('span');
    span.className = 'crumb';
    span.textContent = text;
    span.onclick = () => removeCrumb(i);
    container.appendChild(span);
    
    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = '/';
    container.appendChild(sep);
  });
  
  const active = document.createElement('span');
  active.className = 'crumb';
  active.style.color = 'var(--ac)';
  active.style.fontWeight = '600';
  active.style.borderColor = 'var(--ac)';
  active.style.pointerEvents = 'none';
  active.textContent = LEVELS[currentLevel].target;
  container.appendChild(active);
}

function renderOptions() {
  const container = document.getElementById('options');
  container.innerHTML = '';
  const options = LEVELS[currentLevel].options;
  
  options.forEach(text => {
    const isSelected = userPath.includes(text);
    const btn = document.createElement('button');
    btn.className = 'crumb' + (isSelected ? ' selected' : '');
    btn.textContent = text;
    btn.onclick = () => selectCrumb(text);
    container.appendChild(btn);
  });
}

function selectCrumb(text) {
  userPath.push(text);
  renderAssembly();
  renderOptions();
  checkProgress();
}

function removeCrumb(index) {
  userPath.splice(index, 1);
  renderAssembly();
  renderOptions();
  hideFeedback();
}

function checkProgress() {
  const level = LEVELS[currentLevel];
  if (userPath.length === level.path.length) {
    const isCorrect = userPath.every((val, index) => val === level.path[index]);
    if (isCorrect) {
      showFeedback('CHÍNH XÁC! Phân cấp rất logic.', 'success');
      setTimeout(() => {
        currentLevel = (currentLevel + 1) % LEVELS.length;
        initLevel();
      }, 2000);
    } else {
      showFeedback('SAI THỨ TỰ. Hãy kiểm tra lại cấu trúc cha-con.', 'error');
    }
  }
}

function showFeedback(text, type) {
  const fb = document.getElementById('feedback');
  fb.textContent = text;
  fb.className = 'feedback show ' + type;
}

function hideFeedback() {
  document.getElementById('feedback').className = 'feedback';
}

function resetLevel() {
  userPath = [];
  renderAssembly();
  renderOptions();
  hideFeedback();
}

initLevel();
</script>
</body>
</html>
