<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Group Strategist — Vibecode</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f12;
  --card-bg: #16161b;
  --accent: #E88C2E;
  --text: #e8e4dc;
  --text-muted: #707070;
  --border: #282830;
  --success: #50fa7b;
  --error: #ff5555;
  --font-main: 'Space Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding: 24px;
  display: flex;
  justify-content: center;
}

.w {
  width: 100%;
  max-width: 940px;
}

.header {
  border-left: 2px solid var(--accent);
  padding-left: 16px;
  margin-bottom: 32px;
}

.header h1 {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 700;
}

.header p {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 6px;
}

.game-container {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 24px;
}

@media (max-width: 850px) {
  .game-container { grid-template-columns: 1fr; }
}

/* Sidebar: Scenarios */
.scenarios-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.scenario-item {
  background: var(--card-bg);
  border: 1px solid var(--border);
  padding: 18px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.scenario-item:hover {
  border-color: #444;
  transform: translateX(4px);
}

.scenario-item.active {
  border-color: var(--accent);
  background: rgba(232, 140, 46, 0.04);
}

.scenario-item.completed {
  border-color: var(--success);
}

.scenario-item.completed::after {
  content: '✓';
  position: absolute;
  top: 12px;
  right: 12px;
  color: var(--success);
  font-weight: 700;
  font-size: 14px;
}

.scenario-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
}

.scenario-brief {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Main Panel */
.main-panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.main-panel::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent);
  z-index: 10;
}

.viewport {
  flex: 1;
  min-height: 240px;
  background: #0d0d10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  border-bottom: 1px solid var(--border);
  position: relative;
}

.viewport-label {
  position: absolute;
  top: 16px;
  left: 16px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: #444;
  text-transform: uppercase;
}

/* Preview Component Styling */
#preview-stage {
  transform: scale(1.1);
  transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.bg-shell {
  display: inline-flex;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.bg-node {
  background: #23232a;
  color: #888;
  padding: 10px 18px;
  font-size: 14px;
  border-right: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all 0.3s;
}

.bg-node:last-child { border-right: none; }
.bg-node.active { background: var(--accent); color: #fff; font-weight: 600; }
.bg-node.secondary { color: #666; }
.bg-node svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; }

/* Interaction Area */
.actions-panel {
  padding: 24px;
}

.panel-title {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  margin-bottom: 16px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 700;
}

.options-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.choice-btn {
  background: #1e1e24;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 12px 16px;
  text-align: left;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}

.choice-btn:hover:not(.disabled) {
  border-color: #555;
  color: var(--text);
  background: #25252d;
}

.choice-btn.selected {
  background: rgba(232, 140, 46, 0.1);
  border-color: var(--accent);
  color: var(--accent);
}

.choice-btn strong { display: block; font-size: 13px; margin-bottom: 2px; }
.choice-btn span { font-size: 10px; opacity: 0.6; }

/* Status & Feedback */
.status-area {
  padding: 16px 24px;
  font-size: 13px;
  line-height: 1.6;
  border-top: 1px solid var(--border);
  min-height: 80px;
  display: flex;
  align-items: center;
  background: #121217;
}

.status-area.correct { color: var(--success); border-top-color: var(--success); }
.status-area.wrong { color: var(--error); border-top-color: var(--error); }

.progress-track {
  height: 4px;
  background: #222;
  border-radius: 2px;
  margin-top: 32px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  box-shadow: 0 0 10px var(--accent);
}

/* Animations */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-in { animation: fadeInUp 0.4s ease forwards; }

</style>
</head>
<body>

<div class="w">
  <div class="header">
    <h1>Button Group Strategist</h1>
    <p>Áp dụng tư duy UX để lựa chọn cấu trúc nhóm nút bấm tối ưu cho từng kịch bản thực tế.</p>
  </div>

  <div class="game-container">
    <div class="scenarios-list" id="scenarios-root">
      <!-- Generated by JS -->
    </div>

    <div class="main-panel">
      <div class="viewport">
        <div class="viewport-label">Live Preview</div>
        <div id="preview-stage">
          <div style="color: #444; font-size: 12px; font-family: var(--font-mono);">[ Chọn kịch bản để bắt đầu ]</div>
        </div>
        <div id="context-hint" style="margin-top: 24px; font-size: 11.5px; color: var(--text-muted); text-align: center; max-width: 300px; font-style: italic;">
          <!-- Hint text -->
        </div>
      </div>

      <div class="actions-panel">
        <div class="panel-title">Lựa chọn giải pháp:</div>
        <div class="options-grid">
          <button class="choice-btn" data-variant="segmented">
            <strong>Segmented</strong>
            <span>Mutually Exclusive (Chọn 1)</span>
          </button>
          <button class="choice-btn" data-variant="toggle">
            <strong>Multi-Toggle</strong>
            <span>Independent (Chọn nhiều)</span>
          </button>
          <button class="choice-btn" data-variant="iconic">
            <strong>Iconic</strong>
            <span>Space Saving (Chỉ biểu tượng)</span>
          </button>
          <button class="choice-btn" data-variant="mixed">
            <strong>Mixed Hierarchy</strong>
            <span>Primary + Secondary actions</span>
          </button>
        </div>
      </div>

      <div class="status-area" id="feedback-log">
        Vui lòng chọn một kịch bản giao diện bên trái để bắt đầu bài thực hành.
      </div>
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-bar" id="progress-indicator"></div>
  </div>
</div>

<script>
const data = [
  {
    id: 's1',
    title: "Chế độ xem lịch",
    brief: "Người dùng cần chuyển đổi qua lại giữa các góc nhìn: Theo Ngày, Theo Tuần hoặc Theo Tháng.",
    target: "segmented",
    items: ["Daily", "Weekly", "Monthly"],
    hint: "Các chế độ xem này không thể tồn tại cùng lúc. Chọn một cái sẽ tắt cái kia.",
    correctLog: "<strong>Chính xác!</strong> Segmented Control là lựa chọn tốt nhất để chuyển đổi các trạng thái loại trừ nhau (Mutually Exclusive)."
  },
  {
    id: 's2',
    title: "Thanh soạn thảo",
    brief: "Người dùng muốn áp dụng định dạng cho văn bản: vừa in Đậm, vừa in Nghiêng và Gạch chân.",
    target: "toggle",
    items: ["B", "I", "U"],
    hint: "Người dùng có quyền bật hoặc tắt bất kỳ thuộc tính nào mà không ảnh hưởng đến các thuộc tính khác.",
    correctLog: "<strong>Đúng rồi!</strong> Multi-Toggle cho phép các nút hoạt động độc lập, hỗ trợ lựa chọn nhiều trạng thái cùng một lúc."
  },
  {
    id: 's3',
    title: "Công cụ ảnh nhỏ",
    brief: "Trong một ô soạn thảo ảnh cực hẹp, bạn cần đặt 3 lệnh: Cắt ảnh, Xoay ảnh và Xóa ảnh.",
    target: "iconic",
    items: [
      '<svg viewBox="0 0 24 24"><path d="M7 2v10m15 0H7m0 0v10m-5-5h5M17 2h3a2 2 0 012 2v3"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>',
      '<svg viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>'
    ],
    hint: "Diện tích quá nhỏ để hiển thị chữ. Hãy ưu tiên giải pháp tối giản không gian.",
    correctLog: "<strong>Tuyệt vời!</strong> Iconic Group giúp giao diện gọn gàng hơn. Đừng quên thêm Tooltip để người dùng vẫn hiểu ý nghĩa icon."
  },
  {
    id: 's4',
    title: "Nhóm nút Đăng bài",
    brief: "Bạn cần đặt nút 'Xuất bản' (quan trọng nhất) cạnh nút 'Lưu nháp' và một nút 'Cài đặt' thêm.",
    target: "mixed",
    items: [
      { text: "Publish", active: true },
      { text: "Draft", active: false },
      { text: '<svg viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>', active: false }
    ],
    hint: "Sử dụng màu sắc và kiểu dáng khác nhau để hướng người dùng vào hành động ưu tiên số 1.",
    correctLog: "<strong>Chuẩn xác!</strong> Mixed Hierarchy giúp dẫn dắt người dùng thực hiện hành động quan trọng nhất (Primary Action)."
  }
];

let activeIdx = -1;
let solved = new Set();

const root = document.getElementById('scenarios-root');
const stage = document.getElementById('preview-stage');
const hint = document.getElementById('context-hint');
const log = document.getElementById('feedback-log');
const progress = document.getElementById('progress-indicator');

function renderList() {
  root.innerHTML = '';
  data.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = `scenario-item ${activeIdx === i ? 'active' : ''} ${solved.has(i) ? 'completed' : ''}`;
    div.innerHTML = `
      <div class="scenario-title">${s.title}</div>
      <div class="scenario-brief">${s.brief}</div>
    `;
    div.onclick = () => selectScenario(i);
    root.appendChild(div);
  });
}

function selectScenario(index) {
  activeIdx = index;
  const s = data[index];
  
  renderList();
  
  stage.innerHTML = `<div style="color: #666; font-family: var(--font-mono); font-size: 11px;">[ Workspace Ready: ${s.title} ]</div>`;
  hint.textContent = `Gợi ý: ${s.hint}`;
  log.className = 'status-area';
  log.innerHTML = `Kịch bản: <strong>${s.title}</strong>. Bạn hãy chọn kiểu nhóm nút bấm phù hợp nhất bên dưới.`;
  
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
}

document.querySelectorAll('.choice-btn').forEach(btn => {
  btn.onclick = () => {
    if (activeIdx === -1) return;
    
    const variant = btn.dataset.variant;
    const s = data[activeIdx];
    
    document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    
    // Render preview based on choice
    renderPreview(variant, s.items);
    
    if (variant === s.target) {
      log.className = 'status-area correct animate-in';
      log.innerHTML = s.correctLog;
      solved.add(activeIdx);
      updateProgress();
      renderList();
    } else {
      log.className = 'status-area wrong animate-in';
      log.innerHTML = "Lựa chọn này chưa thực sự tối ưu cho kịch bản trên. Hãy thử lại dựa trên gợi ý!";
    }
  };
});

function renderPreview(variant, items) {
  let html = '<div class="bg-shell animate-in">';
  items.forEach((item, i) => {
    const content = typeof item === 'object' ? item.text : item;
    const activeClass = typeof item === 'object' ? (item.active ? 'active' : 'secondary') : (i === 0 ? 'active' : '');
    html += `<div class="bg-node ${activeClass}">${content}</div>`;
  });
  html += '</div>';
  stage.innerHTML = html;
}

function updateProgress() {
  const p = (solved.size / data.length) * 100;
  progress.style.width = `${p}%`;
  
  if (solved.size === data.length) {
    setTimeout(() => {
      log.innerHTML = "<strong>CHÚC MỪNG!</strong> Bạn đã nắm vững chiến lược sử dụng Button Group. Bạn đã sẵn sàng để 'vibecode' các giao diện chuyên nghiệp!";
    }, 600);
  }
}

renderList();
</script>

</body>
</html>
