<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cache Practice — Vibecode Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a18;
    --bg-card: #222220;
    --bg-elevated: #2a2a27;
    --fg: #e8e4dd;
    --fg-muted: #8a877e;
    --accent: #e88c2e;
    --accent-dim: #b97025;
    --amber: #c9922a;
    --green: #6b8f5e;
    --red: #b54a4a;
    --border: #3a3a36;
    --border-light: #4a4a45;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
  }

  .page-wrap {
    position: relative;
    z-index: 1;
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 20px;
  }

  .simulator-card {
    border: 1px solid var(--border);
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .card-head {
    border-bottom: 1px solid var(--border);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.02);
  }
  .card-head h2 {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .sim-content {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* Visualizer */
  .visualizer {
    height: 140px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-around;
    overflow: hidden;
  }

  .node {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 2;
  }
  .node-icon {
    width: 48px;
    height: 48px;
    border: 2px solid var(--border);
    background: var(--bg-card);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .node-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--fg-muted);
    text-transform: uppercase;
  }

  .node.active .node-icon {
    border-color: var(--accent);
    box-shadow: 0 0 15px rgba(232, 140, 46, 0.3);
  }
  .node.hit .node-icon {
    border-color: var(--green);
    box-shadow: 0 0 15px rgba(107, 143, 94, 0.3);
  }

  .connector-line {
    position: absolute;
    height: 2px;
    background: var(--border);
    width: 70%;
    top: 50px;
    z-index: 1;
  }

  .data-dot {
    width: 10px;
    height: 10px;
    background: var(--accent);
    position: absolute;
    top: 50px;
    left: 15%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 3;
    opacity: 0;
    transition: left 0.1s linear;
  }

  /* Controls */
  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 12px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  button:hover:not(:disabled) {
    background: var(--border);
    border-color: var(--fg-muted);
  }
  button:active:not(:disabled) {
    transform: scale(0.98);
  }
  button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
  }

  /* Stats & Logs */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 12px;
    text-align: center;
  }
  .stat-val {
    display: block;
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--amber);
  }
  .stat-label {
    font-size: 9px;
    color: var(--fg-muted);
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  .log-area {
    background: #000;
    border: 1px solid var(--border);
    padding: 12px;
    height: 120px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: #0f0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .log-entry {
    display: flex;
    justify-content: space-between;
    opacity: 0.8;
  }
  .log-hit { color: var(--green); }
  .log-miss { color: var(--red); }

  .cache-status-pill {
    font-family: var(--mono);
    font-size: 9px;
    padding: 2px 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .status-empty { color: var(--fg-muted); }
  .status-full { color: var(--green); border-color: var(--green); }

</style>
</head>
<body>

<div class="page-wrap">
  <div class="simulator-card">
    <div class="card-head">
      <h2>Thực hành: Mô phỏng Cache</h2>
      <div id="cacheStatusPill" class="cache-status-pill status-empty">CACHE TRỐNG</div>
    </div>
    
    <div class="sim-content">
      <!-- Visualizer -->
      <div class="visualizer">
        <div class="connector-line"></div>
        <div class="data-dot" id="dataDot"></div>
        
        <div class="node" id="nodeUser">
          <div class="node-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          <span class="node-label">Người dùng</span>
        </div>

        <div class="node" id="nodeCache">
          <div class="node-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4 8h-2V9h-2v2H9v2h2v2h2v-2h2v-2z"/></svg>
          </div>
          <span class="node-label">Cache</span>
        </div>

        <div class="node" id="nodeServer">
          <div class="node-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 13c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v8zM6 17c-1.1 0-2 .9-2 2v2h16v-2c0-1.1-.9-2-2-2H6z"/></svg>
          </div>
          <span class="node-label">Server</span>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-val" id="loadTime">0ms</span>
          <span class="stat-label">Thời gian tải</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="hitCount">0</span>
          <span class="stat-label">Cache Hits</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="missCount">0</span>
          <span class="stat-label">Cache Misses</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="btn-primary" id="fetchBtn">Tải dữ liệu (Fetch)</button>
        <button id="clearBtn">Xóa Cache</button>
      </div>

      <!-- Log -->
      <div class="log-area" id="logArea">
        <div class="log-entry"><span>> Sẵn sàng. Nhấn 'Fetch' để bắt đầu.</span></div>
      </div>
    </div>
  </div>
</div>

<script>
  let isCached = false;
  let hits = 0;
  let misses = 0;
  let isBusy = false;

  const dot = document.getElementById('dataDot');
  const fetchBtn = document.getElementById('fetchBtn');
  const clearBtn = document.getElementById('clearBtn');
  const logArea = document.getElementById('logArea');
  const pill = document.getElementById('cacheStatusPill');

  function addLog(msg, type = '') {
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + (type ? 'log-' + type : '');
    const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    entry.innerHTML = `<span>[${time}] ${msg}</span>`;
    logArea.prepend(entry);
  }

  async function animateRequest() {
    isBusy = true;
    fetchBtn.disabled = true;
    clearBtn.disabled = true;
    
    // User to Cache
    dot.style.opacity = 1;
    dot.style.background = 'var(--accent)';
    await moveDot(15, 50, 400);
    
    if (isCached) {
      // HIT
      addLog('Tìm thấy dữ liệu trong Cache!', 'hit');
      document.getElementById('nodeCache').classList.add('hit');
      dot.style.background = 'var(--green)';
      await sleep(300);
      
      // Cache back to User
      await moveDot(50, 15, 400);
      hits++;
      document.getElementById('hitCount').innerText = hits;
      document.getElementById('loadTime').innerText = '50ms';
      document.getElementById('nodeCache').classList.remove('hit');
    } else {
      // MISS
      addLog('Cache trống. Đang gọi tới Server...', 'miss');
      document.getElementById('nodeCache').classList.add('active');
      await sleep(300);
      
      // Cache to Server
      await moveDot(50, 85, 1000);
      document.getElementById('nodeServer').classList.add('active');
      addLog('Server đang xử lý...');
      await sleep(800);
      
      // Server back to Cache
      dot.style.background = 'var(--amber)';
      await moveDot(85, 50, 1000);
      document.getElementById('nodeServer').classList.remove('active');
      document.getElementById('nodeCache').classList.remove('active');
      
      addLog('Đã lưu vào Cache.');
      isCached = true;
      updatePill();
      
      // Cache back to User
      await moveDot(50, 15, 400);
      misses++;
      document.getElementById('missCount').innerText = misses;
      document.getElementById('loadTime').innerText = '1200ms';
    }

    dot.style.opacity = 0;
    isBusy = false;
    fetchBtn.disabled = false;
    clearBtn.disabled = false;
  }

  function moveDot(from, to, duration) {
    return new Promise(resolve => {
      const start = performance.now();
      function step(now) {
        const progress = Math.min((now - start) / duration, 1);
        const current = from + (to - from) * progress;
        dot.style.left = current + '%';
        if (progress < 1) requestAnimationFrame(step);
        else resolve();
      }
      requestAnimationFrame(step);
    });
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  function updatePill() {
    if (isCached) {
      pill.innerText = 'CACHE CÓ DỮ LIỆU';
      pill.className = 'cache-status-pill status-full';
    } else {
      pill.innerText = 'CACHE TRỐNG';
      pill.className = 'cache-status-pill status-empty';
    }
  }

  fetchBtn.onclick = animateRequest;
  
  clearBtn.onclick = () => {
    isCached = false;
    updatePill();
    addLog('Đã xóa Cache.');
    document.getElementById('loadTime').innerText = '0ms';
  };

</script>

</body>
</html>
