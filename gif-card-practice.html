<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Practice — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#0f0f12;--bg-card:#16161b;--fg:#e8e4dc;--muted:#6e6e7a;
  --accent:#e88c2e;--accent-soft:rgba(232,140,46,.12);
  --accent-border:rgba(232,140,46,.3);--border:#282830;
  --surface:#1c1c23;--success:#3a9e5c;--success-soft:rgba(58,158,92,.12);
  --warning:#c49030;--warning-soft:rgba(196,144,48,.1);
  --bar-d:#2a2a34;--bar-m:#44444f;--shape-lt:#33333d;
  --card-inner:#22222b;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font-family:'Space Grotesk',sans-serif;line-height:1.6;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:20px 20px;pointer-events:none;z-index:0;
}

#app-root{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:24px}

.pg{font-size:15px;color:var(--fg);opacity:.8;margin-bottom:22px;line-height:1.6}
.pg span{color:var(--accent);font-weight:600}

/* Toggle switches */
.toggle-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:28px}
.tgl{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border:1px solid var(--border);background:var(--bg-card);
  cursor:pointer;transition:all .25s;user-select:none;
}
.tgl:hover{border-color:var(--accent-border)}
.tgl.on{border-color:var(--accent);background:var(--accent-soft)}
.tgl-lbl{font-size:13px;color:var(--muted);transition:color .25s;display:flex;align-items:center;gap:8px}
.tgl.on .tgl-lbl{color:var(--fg)}
.tgl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .25s}
.tgl-sw{
  width:32px;height:18px;border:1px solid var(--border);background:var(--bg);
  position:relative;transition:all .25s;flex-shrink:0;
}
.tgl-sw::after{
  content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;
  background:var(--muted);transition:all .25s;
}
.tgl.on .tgl-sw{border-color:var(--accent);background:var(--accent-soft)}
.tgl.on .tgl-sw::after{left:16px;background:var(--accent)}

/* Preview area */
.prev{
  background:var(--bg-card);border:1px solid var(--border);
  padding:40px 28px;margin-bottom:18px;min-height:260px;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .3s;position:relative;overflow:hidden;
}
.prev::before{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.007) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.007) 1px,transparent 1px);
  background-size:16px 16px;pointer-events:none;
}
.prev.ok-b{border-color:rgba(58,158,92,.25)}
.prev-lbl{
  position:absolute;top:10px;left:14px;z-index:2;
  font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);opacity:.4;
}

/* Live card preview */
.live-card{
  width:280px;background:var(--card-inner);border:1px solid var(--border);
  overflow:hidden;position:relative;z-index:1;transition:all .35s ease;
}
@media(max-width:480px){.live-card{width:240px}}
.live-card-img{
  height:120px;background:var(--shape-lt);position:relative;overflow:hidden;
  transition:height .35s ease,opacity .3s;
}
.live-card-img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(232,140,46,.1),transparent 60%);
}
.live-card-badge{
  position:absolute;top:10px;left:10px;
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;
  letter-spacing:1.5px;text-transform:uppercase;
  color:#fff;background:var(--accent);padding:3px 8px;z-index:2;
}
.live-card-body{padding:16px}
.live-card-title{font-size:15px;font-weight:700;color:var(--fg);margin-bottom:8px}
.live-card-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.live-card-btn{
  display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;
  font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--accent);padding:8px 16px;border:1px solid var(--accent-border);
  background:var(--accent-soft);
}

/* Feedback */
.fb{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;font-size:13px;font-weight:500;
  border:1px solid var(--border);background:var(--bg-card);transition:all .3s;
}
.fb.ok{border-color:rgba(58,158,92,.4);color:var(--success);background:var(--success-soft)}
.fb.no{border-color:rgba(196,144,48,.3);color:var(--warning);background:var(--warning-soft)}
.fb.neutral{border-color:var(--border);color:var(--muted)}

.hint{font-size:12px;color:var(--muted);opacity:.5;margin-top:10px;display:flex;align-items:center;gap:6px}
.hint i{font-size:10px;color:var(--accent)}


@media(max-width:480px){
  #app-root{padding:14px}
  .prev{padding:32px 16px}
  .toggle-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="app-root">
  <section aria-label="Thực hành Card">
    <p class="pg">
      <span>Mục tiêu:</span> Bật/tắt từng phần tử để thấy card thay đổi thế nào khi thiếu đi một thành phần. Thử bỏ hết rồi thêm lại từng cái một.
    </p>

    <div class="toggle-grid" id="toggleGrid"></div>

    <div class="prev" id="prevBox">
      <span class="prev-lbl">LIVE PREVIEW</span>
      <div id="prevContent"></div>
    </div>

    <div class="fb neutral" id="fb">
      <i class="fa-solid fa-circle-info"></i>
      <span>Bật/tắt các phần tử ở trên</span>
    </div>
    <p class="hint" id="hintE">
      <i class="fa-solid fa-arrow-up-right"></i>
      Thử bỏ hết phần tử — card còn lại gì? Đó chính là "bộ khung" của card
    </p>
  </section>
</div>

<script>
const parts = [
  { id:'image', label:'Image', color:'var(--shape-lt)', default:false },
  { id:'badge', label:'Badge', color:'var(--accent)', default:false },
  { id:'title', label:'Title', color:'var(--fg)', default:false },
  { id:'desc', label:'Description', color:'var(--muted)', default:false },
  { id:'button', label:'Button', color:'var(--accent)', default:false }
];

let state = {};
const toggleGrid = document.getElementById('toggleGrid');
const prevContent = document.getElementById('prevContent');
const fb = document.getElementById('fb');

function initState() {
  parts.forEach(p => state[p.id] = p.default);
}

function renderToggles() {
  toggleGrid.innerHTML = parts.map(p => `
    <div class="tgl${state[p.id] ? ' on' : ''}" data-id="${p.id}" tabindex="0" role="switch" aria-checked="${state[p.id]}">
      <span class="tgl-lbl">
        <span class="tgl-dot" style="background:${state[p.id] ? p.color : 'var(--border)'}"></span>
        ${p.label}
      </span>
      <div class="tgl-sw"></div>
    </div>`).join('');

  toggleGrid.querySelectorAll('.tgl').forEach(t => {
    const handler = () => {
      state[t.dataset.id] = !state[t.dataset.id];
      renderToggles();
      renderPreview();
    };
    t.addEventListener('click', handler);
  });
}

function renderPreview() {
  const s = state;
  const count = Object.values(s).filter(Boolean).length;

  let html = `<div class="live-card">`;
  if (s.image) {
    html += `<div class="live-card-img">`;
    if (s.badge) html += `<span class="live-card-badge">Featured</span>`;
    html += `</div>`;
  }
  html += `<div class="live-card-body">`;
  if (s.title) html += `<div class="live-card-title">Card title goes here</div>`;
  if (s.desc) html += `<div class="live-card-desc">This is a short description that provides context for the card content.</div>`;
  if (s.button) html += `<span class="live-card-btn">Read more</span>`;
  html += `</div></div>`;

  prevContent.innerHTML = html;

  if (count === 0) {
    fb.className = 'fb no';
    fb.innerHTML = `<i class="fa-solid fa-ghost"></i><span>Card rỗng — đây chính là "bộ khung"</span>`;
  } else if (count === 5) {
    fb.className = 'fb ok';
    fb.innerHTML = `<i class="fa-solid fa-check"></i><span>Đầy đủ phần tử — đây là Featured Card</span>`;
  } else if (count <= 2) {
    fb.className = 'fb no';
    fb.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>Quá ít phần tử — card mất ngữ cảnh</span>`;
  } else {
    fb.className = 'fb neutral';
    fb.innerHTML = `<i class="fa-solid fa-eye"></i><span>${count}/5 phần tử — đang nhìn ổn rồi</span>`;
  }
}

initState();
renderToggles();
renderPreview();
</script>
</body>
</html>
