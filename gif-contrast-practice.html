<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrast Ratio — Practice</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#131110;--fg:#e8e0d4;--muted:#706b64;--accent:#cf5c27;--card:#1c1a18;--card-alt:#242120;--border:#302c28;--border-hi:#44403a;--pass:#2a6e4e;--pass-t:#7dcea0;--fail-bg:#4a2020;--fail-t:#c47070}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,rgba(207,92,39,.035) 0%,transparent 55%),radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 100%,16px 16px;font-family:'Space Grotesk',sans-serif;color:var(--fg);padding:12px;gap:16px}

.pw{width:100%;background:var(--card);border:2px solid var(--border);padding:20px 24px}
.pw-h{font-size:15px;font-weight:700;margin-bottom:2px}.pw-h span{color:var(--accent)}
.pw-s{font-size:11px;color:var(--muted);margin-bottom:14px}

.ctx-r{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.ctx-b{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;padding:6px 12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:6px}
.ctx-b:hover{border-color:var(--accent);color:var(--fg)}
.ctx-b.on{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

.sl-sec{margin-bottom:20px}
.sl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sl-lbl{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.sl-val{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--accent)}

.sl-wrap{position:relative;height:30px;display:flex;align-items:center}
.sl-track{position:absolute;left:0;right:0;height:4px;background:var(--border)}

input[type=range]{-webkit-appearance:none;width:100%;height:100%;background:transparent;outline:none;cursor:pointer;position:relative;z-index:2}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border:2px solid var(--card);cursor:grab;border-radius:0}

.met-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ratio-box{flex:1;min-width:140px;background:var(--card-alt);border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ratio-n{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--fg);line-height:1}
.ratio-n span{font-size:14px;font-weight:400;color:var(--muted)}
.ratio-lbl{font-size:8px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:4px}

.grades{flex:2;min-width:240px;display:flex;flex-direction:column;gap:6px}
.gr-row{display:flex;align-items:center;gap:8px}
.gr-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);min-width:90px}
.gr-bar{flex:1;height:4px;background:var(--border);position:relative}
.gr-fill{height:100%;transition:width .2s, background .2s}
.gr-val{font-family:'JetBrains Mono',monospace;font-size:9px;padding:2px 6px;min-width:44px;text-align:center;font-weight:700}
.gr-val.pass{background:var(--pass);color:var(--pass-t)}
.gr-val.fail{background:var(--fail-bg);color:var(--fail-t)}

.prev{background:var(--card-alt);border:1px solid var(--border);padding:24px;margin-bottom:16px;min-height:120px;display:flex;flex-direction:column;justify-content:center;transition:background .2s}
.pp-sm{font-size:13px;line-height:1.5;margin-bottom:6px}
.pp-lg{font-size:24px;font-weight:700;line-height:1.2}

.fb{padding:10px 14px;font-size:11px;border:1px solid var(--border);background:var(--card-alt);line-height:1.5;min-height:48px}
.fb em{color:var(--accent);font-style:normal;font-weight:700}

@media(max-width:520px){.pw{padding:16px}}
</style>
</head>
<body>

<div class="pw">
  <div class="pw-h">Thực hành — <span>Contrast Ratio</span></div>
  <div class="pw-s">Chọn nền → kéo slider đổi độ sáng text để tìm ratio đạt chuẩn WCAG</div>

  <div class="ctx-r" id="bgTog">
    <button class="ctx-b on" data-bg="dark"><i class="fa-solid fa-moon"></i> Nền Tối</button>
    <button class="ctx-b" data-bg="light"><i class="fa-solid fa-sun"></i> Nền Sáng</button>
  </div>

  <div class="sl-sec">
    <div class="sl-head">
      <span class="sl-lbl">text-brightness (hex)</span>
      <span class="sl-val" id="hexV">#ECE8E1</span>
    </div>
    <div class="sl-wrap">
      <div class="sl-track"></div>
      <input type="range" id="lSlider" min="0" max="255" value="236">
    </div>
  </div>

  <div class="met-row">
    <div class="ratio-box">
      <div class="ratio-n" id="rNum">16.01<span> : 1</span></div>
      <div class="ratio-lbl">contrast ratio</div>
    </div>
    <div class="grades" id="grades">
      <div class="gr-row">
        <span class="gr-lbl">AA Large Text</span>
        <div class="gr-bar"><div class="gr-fill" id="gf0"></div></div>
        <div class="gr-val" id="gb0">PASS</div>
      </div>
      <div class="gr-row">
        <span class="gr-lbl">AA Small Text</span>
        <div class="gr-bar"><div class="gr-fill" id="gf1"></div></div>
        <div class="gr-val" id="gb1">PASS</div>
      </div>
      <div class="gr-row">
        <span class="gr-lbl">AAA Large Text</span>
        <div class="gr-bar"><div class="gr-fill" id="gf2"></div></div>
        <div class="gr-val" id="gb2">PASS</div>
      </div>
      <div class="gr-row">
        <span class="gr-lbl">AAA Small Text</span>
        <div class="gr-bar"><div class="gr-fill" id="gf3"></div></div>
        <div class="gr-val" id="gb3">PASS</div>
      </div>
    </div>
  </div>

  <div class="prev" id="pprev">
    <div class="pp-sm" id="ppSm">Văn bản nhỏ 14px — đoạn mô tả ngắn cho sản phẩm.</div>
    <div class="pp-lg" id="ppLg">Tiêu đề lớn 24px bold</div>
  </div>

  <div class="fb" id="pfb"></div>
</div>

<script>
function lum(r,g,b){
  const [rs,gs,bs]=[r,g,b].map(c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)});
  return .2126*rs+.7152*gs+.0722*bs;
}
function cr(r1,g1,b1,r2,g2,b2){
  const l1=lum(r1,g1,b1),l2=lum(r2,g2,b2);
  return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);
}
function toHex(v){return v.toString(16).padStart(2,'0').toUpperCase()}

const lSlider=document.getElementById('lSlider'),hexV=document.getElementById('hexV'),rNum=document.getElementById('rNum'),grades=document.getElementById('grades');
const pprev=document.getElementById('pprev'),ppSm=document.getElementById('ppSm'),ppLg=document.getElementById('ppLg'),pfb=document.getElementById('pfb');
let bgMode='dark';

const BG={dark:[12,12,14],light:[245,245,240]};

function updatePrac(){
  const v=parseInt(lSlider.value);
  const hex='#'+toHex(v)+toHex(v)+toHex(v);
  hexV.textContent=hex;

  const[br,bg,bb]=BG[bgMode];
  const ratio=cr(v,v,v,br,bg,bb);
  rNum.innerHTML=ratio.toFixed(2)+'<span> : 1</span>';

  pprev.style.backgroundColor=bgMode==='dark'?'#0c0c0e':'#f5f5f0';
  ppSm.style.color=hex;
  ppLg.style.color=hex;

  const thresholds=[3, 4.5, 4.5, 7];
  thresholds.forEach((t,i)=>{
    const pass = ratio >= t;
    const fill = document.getElementById('gf'+i);
    const val = document.getElementById('gb'+i);
    fill.style.width = Math.min(100, (ratio/21)*100)+'%';
    fill.style.background = pass ? 'var(--pass)' : 'var(--fail-t)';
    val.className = 'gr-val ' + (pass?'pass':'fail');
    val.textContent = pass ? 'PASS' : 'FAIL';
  });

  let msg = '';
  if(ratio<3) msg = 'Ratio <em>'+ratio.toFixed(2)+'</em> — Quá thấp, không đạt chuẩn nào. Khó đọc cho tất cả người dùng.';
  else if(ratio<4.5) msg = 'Ratio <em>'+ratio.toFixed(2)+'</em> — Chỉ đạt AA cho chữ lớn. Chữ nhỏ vẫn khó đọc.';
  else if(ratio<7) msg = 'Ratio <em>'+ratio.toFixed(2)+'</em> — Đạt chuẩn AA cho cả chữ lớn và nhỏ. Chưa đạt AAA.';
  else msg = 'Ratio <em>'+ratio.toFixed(2)+'</em> — Tuyệt vời! Đạt cả chuẩn AA và AAA cho mọi kích thước chữ.';

  pfb.innerHTML = msg;
}

lSlider.oninput = updatePrac;

document.querySelectorAll('#bgTog .ctx-b').forEach(b=>b.addEventListener('click',()=>{
  bgMode=b.dataset.bg;
  document.querySelectorAll('#bgTog .ctx-b').forEach(x=>x.classList.toggle('on',x===b));
  updatePrac();
}));

updatePrac();
</script>
</body>
</html>
