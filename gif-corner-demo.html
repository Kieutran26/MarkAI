<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corner Radius Demo — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#0f0f12;--bg-card:#16161b;--fg:#e8e4dc;--muted:#6e6e7a;
    --accent:#e88c2e;--accent-soft:rgba(232,140,46,.12);
    --accent-border:rgba(232,140,46,.3);--border:#282830;
    --surface:#1c1c23;--shape-lt:#33333d;--bar-m:#44444f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--fg);
    font-family:'Space Grotesk',sans-serif;line-height:1.6;
    overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:radial-gradient(rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:20px 20px;pointer-events:none;z-index:0;
  }

  #app-root{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:24px}

  .sim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  @media(max-width:720px){.sim-grid{grid-template-columns:repeat(2,1fr)}}

  .sc{
    background:var(--bg-card);border:1px solid var(--border);
    padding:20px 14px 18px;cursor:pointer;position:relative;overflow:hidden;
    transition:border-color .3s,background .3s;
  }
  .sc::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:var(--accent);transform:scaleX(0);transform-origin:left;
    transition:transform .35s ease;
  }
  .sc:hover{border-color:var(--accent-border)}
  .sc.on{border-color:var(--accent);background:var(--surface)}
  .sc.on::before{transform:scaleX(1)}

  .sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .sc-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px}
  .sc-tag{
    font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;
    text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);transition:color .3s;
  }
  .sc.on .sc-tag{color:var(--accent)}

  .sc-shapes{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;min-height:110px;justify-content:center}
  .shape-row{display:flex;gap:8px;align-items:center}

  .sh{
    transition:border-radius .5s cubic-bezier(.4,0,.2,1),background .3s;
    flex-shrink:0;position:relative;
  }
  .sh.btn{width:100%;height:32px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:1px}
  .sh.card{width:100%;height:44px;background:var(--bg-card);border:1px solid var(--border)}
  .sh.input{width:100%;height:28px;background:var(--bg);border:1px solid var(--border)}
  .sh.av{width:32px;height:32px;background:var(--shape-lt);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--muted)}

  .sc-val{
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);
    text-align:center;transition:color .3s,font-weight .3s;
  }
  .sc.on .sc-val{color:var(--accent);font-weight:600}

  .ins{
    background:var(--surface);border:1px solid var(--border);
    padding:18px 22px;display:flex;align-items:flex-start;gap:12px;min-height:80px;
  }
  .ins-i{color:var(--accent);font-size:13px;margin-top:3px;flex-shrink:0}
  .ins-t{font-size:14px;color:var(--fg);opacity:.85;line-height:1.65;transition:opacity .25s,transform .25s}
  .ins-t.fading{opacity:0;transform:translateY(6px)}

  /* table */
  .sec-lbl{
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
    letter-spacing:2px;text-transform:uppercase;color:var(--muted);
    margin-bottom:15px;display:flex;align-items:center;gap:10px;
  }
  .sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
  .c-tab{width:100%;border-collapse:collapse;margin-top:10px;background:var(--bg-card);border:1px solid var(--border)}
  .c-tab th{background:var(--surface);text-align:left;padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;color:var(--muted);letter-spacing:1px;border-bottom:1px solid var(--border)}
  .c-tab td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border);color:var(--fg);opacity:.8}
  .c-tab tr:last-child td{border-bottom:none}
  .c-tab tr:hover td{background:rgba(255,255,255,.02)}
  .c-tab td strong{color:var(--accent);font-weight:600}

  @media(max-width:480px){
    #app-root{padding:14px}
    .ins{padding:14px 16px}
  }
</style>
</head>
<body>

<div id="app-root">
  <section aria-label="Mô phỏng Corner Radius">
    <div class="sim-grid" id="simGrid"></div>
    <div class="ins">
      <i class="fa-solid fa-lightbulb ins-i"></i>
      <p class="ins-t" id="insT">Đang tải...</p>
    </div>

    <div class="compare-wrap">
      <div class="sec-lbl" style="margin-top:40px">So sánh: Radius vs Corner</div>
      <table class="c-tab">
        <thead>
          <tr>
            <th>Đặc điểm</th>
            <th>Radius</th>
            <th>Corner</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>Bản chất</strong></td>
            <td>Con số cụ thể (px, %)</td>
            <td>Khái niệm điểm giao nhau</td>
          </tr>
          <tr>
            <td><strong>Phạm vi</strong></td>
            <td>Toàn bộ khung (Box)</td>
            <td>Từng góc/đường (Path)</td>
          </tr>
          <tr>
            <td><strong>Kiểu dáng</strong></td>
            <td>Chỉ bo tròn</td>
            <td>Tròn, vát, nhọn, mượt</td>
          </tr>
          <tr>
            <td><strong>Giao tiếp</strong></td>
            <td>"Bo bao nhiêu px?"</td>
            <td>"Góc này nhìn cứng quá"</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</div>

<script>
  const presets = [
    { num:'01', name:'Sharp', val:0,
      ins:'<strong>0px</strong> — Góc vuông hoàn toàn. Dùng cho: terminal, code editor, data table. Cảm giác: "đây là công cụ, không phải trang trí."' },
    { num:'02', name:'Small', val:4,
      ins:'<strong>4px</strong> — Vừa đủ bớt gai góc, vẫn giữ cảm giác "tool thật". Dùng cho: dashboard, admin panel, settings.' },
    { num:'03', name:'Medium', val:12,
      ins:'<strong>12px</strong> — Điểm cân bằng phổ biến nhất cho SaaS, app tiêu dùng, landing page. "Thân thiện nhưng chuyên nghiệp."' },
    { num:'04', name:'Full', val:999,
      ins:'<strong>999px</strong> — Bo hết cỡ (Pill). Dùng cho chat bubble, avatar, CTA playful. Cảm giác: "nói chuyện, không phải giao dịch."' }
  ];

  const simGrid = document.getElementById('simGrid');
  const insT = document.getElementById('insT');
  let activeI = 0;
  let autoTimer;

  function renderSim() {
    simGrid.innerHTML = presets.map((p, ci) => {
      const r = p.val;
      const rStr = r + 'px';
      return `
        <div class="sc" data-i="${ci}" tabindex="0" role="button">
          <div class="sc-top">
            <span class="sc-num">${p.num}</span>
            <span class="sc-tag">${p.name}</span>
          </div>
          <div class="sc-shapes">
            <div class="shape-row">
              <div class="sh btn" style="border-radius:${rStr}">BUTTON</div>
            </div>
            <div class="shape-row">
              <div class="sh card" style="border-radius:${rStr}"></div>
            </div>
            <div class="shape-row">
              <div class="sh input" style="border-radius:${rStr}"></div>
              <div class="sh av" style="border-radius:${rStr}">AV</div>
            </div>
          </div>
          <div class="sc-val">${rStr}</div>
        </div>`;
    }).join('');

    simGrid.querySelectorAll('.sc').forEach(c => {
      c.addEventListener('click', () => {
        clearInterval(autoTimer);
        activateCard(+c.dataset.i);
      });
    });
  }

  function activateCard(i) {
    activeI = i;
    simGrid.querySelectorAll('.sc').forEach((c, idx) => c.classList.toggle('on', idx === i));
    setIns(presets[i].ins);
  }

  function setIns(t) {
    insT.classList.add('fading');
    setTimeout(() => { 
      insT.innerHTML = t; 
      insT.classList.remove('fading'); 
    }, 250);
  }

  function startAuto() {
    activateCard(0);
    autoTimer = setInterval(() => {
      activeI = (activeI + 1) % presets.length;
      activateCard(activeI);
    }, 4500);
  }

  renderSim();
  startAuto();
</script>
</body>
</html>
