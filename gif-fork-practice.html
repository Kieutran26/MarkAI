<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fork (GitHub) — Animated Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101010;--bgc:#181818;--bgi:#131313;
  --bd:#272727;--tx:#e0e0e0;--txm:#707070;--txd:#3a3a3a;
  --ac:#d97706;--acl:#f59e0b;
  --abg:rgba(217,119,6,.08);--abg2:rgba(217,119,6,.18);
  --rd:#ef4444;--gn:#22c55e;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Space Grotesk',sans-serif;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--tx);min-height:100vh;padding:20px 16px 48px;
}
.mono{font-family:'JetBrains Mono',monospace}
.hd{max-width:900px;margin:0 auto 28px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hd h1{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1}
.hd .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ac);border:1px solid var(--ac);padding:2px 8px;border-radius:2px}
.hd .sub{width:100%;font-size:13px;color:var(--txm);margin-top:4px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ch .n{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--ac);background:var(--abg);border:1px solid rgba(217,119,6,.2);padding:1px 6px;border-radius:2px}
.ch h2{font-size:14px;font-weight:600;letter-spacing:-.3px}

/* ── REPO BOX ── */
.rbox{border:1px solid var(--bd);border-radius:2px;overflow:hidden;width:100%;max-width:210px}
.rbox-hd{padding:5px 8px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--bd);font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--txm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbox-hd .owner{color:var(--tx)}
.rbox-files{padding:7px 8px;display:flex;flex-direction:column;gap:3px}
.rf{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--tx);padding:1px 0}
.rf-dot{width:7px;height:7px;border-radius:1px;flex-shrink:0}
.rf.changed{background:var(--abg);border:1px solid rgba(217,119,6,.2);border-radius:2px;padding:2px 5px;margin:-2px -5px}

/* ═══════════════════════════════════════
   PRACTICE — STEP FLOW
   ═══════════════════════════════════════ */
.pra{max-width:900px;margin:0 auto;background:var(--bgc);border:1px solid var(--bd);border-radius:3px;padding:22px}
.pra .ch{margin-bottom:6px}
.pra-goal{font-size:12.5px;color:var(--txm);margin-bottom:18px;line-height:1.5}
.pra-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:660px){.pra-grid{grid-template-columns:1fr}}

/* steps */
.steps{display:flex;gap:6px;margin-bottom:16px}
.step-d{width:28px;height:28px;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--txd);transition:all .2s;flex-shrink:0}
.step-d.active{border-color:var(--ac);color:var(--acl);background:var(--abg2)}
.step-d.done{border-color:var(--ac);color:#fff;background:var(--ac)}
.step-line{flex:1;height:2px;background:var(--bd);align-self:center;border-radius:1px;position:relative;overflow:hidden}
.step-line-fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--ac);transition:width .3s}

.step-desc{font-size:13px;color:var(--tx);line-height:1.55;margin-bottom:16px;min-height:56px}
.step-desc .mono{color:var(--acl);font-size:11px}

.step-nav{display:flex;gap:8px}
.btn{padding:8px 16px;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;border:1px solid var(--bd);background:var(--bgi);color:var(--txm);border-radius:2px;cursor:pointer;transition:all .15s}
.btn:hover:not(:disabled){border-color:var(--ac);color:var(--acl);background:var(--abg)}
.btn:disabled{opacity:.3;cursor:default}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--acl);border-color:var(--acl)}

/* preview */
.pv-stage{background:var(--bgi);border:1px solid var(--bd);border-radius:3px;padding:20px 16px;min-height:200px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.pv-repo{transition:all .3s}
.pv-tag{position:absolute;top:8px;right:10px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--txd);padding:2px 6px;background:var(--bgc);border:1px solid var(--bd);border-radius:2px}
.pv-arrow{width:2px;height:0;background:repeating-linear-gradient(to bottom,var(--ac) 0 3px,transparent 3px 6px);position:relative;transition:height .3s}
.pv-arrow::after{content:'';position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid var(--ac)}
.pv-pr-arrow{display:flex;align-items:center;gap:4px;margin-top:4px;opacity:0;transition:opacity .3s}
.pv-pr-arrow svg{width:14px;height:14px;stroke:var(--ac);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pv-pr-arrow span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--acl)}
.pv-pr-arrow.show{opacity:1}

.pr-box{background:var(--bgi);border:1px solid var(--bd);border-radius:3px;padding:12px 14px;margin-top:14px}
.pr-box .cfg-l{display:block;margin-bottom:8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--txd);text-transform:uppercase;letter-spacing:.5px}
.pr-txt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--acl);line-height:1.55;word-break:break-word}

.hint{font-size:11px;color:var(--txd);line-height:1.4;padding:8px 10px;background:var(--bgi);border-radius:2px;border-left:2px solid var(--bd);margin-top:14px}

/* ── SUMMARY ── */
.sum{max-width:900px;margin:20px auto 0;padding:16px 18px;border:1px solid var(--bd);border-radius:3px;background:var(--bgc);font-size:12.5px;color:var(--txm);line-height:1.6}
.sum strong{color:var(--acl);font-weight:600}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>


<!-- ═══ PRACTICE ═══ -->

<!-- ═══ PRACTICE ═══ -->
<section class="pra" aria-label="Thực hành">
  <div class="ch"><span class="n">PRACTICE</span><h2>Theo dấu Fork</h2></div>
  <p class="pra-goal">Click qua từng bước để thấy chuyện gì xảy ra khi bạn fork một repo trên GitHub.</p>

  <div class="pra-grid">
    <!-- ── CONTROLS ── -->
    <div>
      <!-- Step indicators -->
      <div class="steps" id="steps">
        <div class="step-d active" data-s="0">1</div>
        <div class="step-line"><div class="step-line-fill" id="sl0"></div></div>
        <div class="step-d" data-s="1">2</div>
        <div class="step-line"><div class="step-line-fill" id="sl1"></div></div>
        <div class="step-d" data-s="2">3</div>
        <div class="step-line"><div class="step-line-fill" id="sl2"></div></div>
        <div class="step-d" data-s="3">4</div>
        <div class="step-line"><div class="step-line-fill" id="sl3"></div></div>
        <div class="step-d" data-s="4">5</div>
      </div>

      <!-- Description -->
      <div class="step-desc" id="stepDesc"></div>

      <!-- Navigation -->
      <div class="step-nav">
        <button class="btn" id="prevBtn" disabled>Trước</button>
        <button class="btn primary" id="nextBtn">Tiếp</button>
      </div>

      <div class="hint">Click "Tiếp" để đi qua từng bước. Quan sát bên phải thấy repo thay đổi thế nào.</div>
    </div>

    <!-- ── PREVIEW ── -->
    <div>
      <div class="pv-stage" id="pvStage">
        <span class="pv-tag" id="pvTag">GitHub</span>
        <!-- Content rendered by JS -->
      </div>
      <div class="pr-box">
        <span class="cfg-l">Nói với dev</span>
        <div class="pr-txt" id="prTxt"></div>
      </div>
    </div>
  </div>
</section>


</body>

<script>
(function(){
  /* ── STEP DATA ── */
  var steps = [
    {
      desc: 'Đây là <span class="mono">team-brand/landing-page</span> — repo gốc trên GitHub của team. Bạn muốn thử sửa nhưng <strong>không có quyền</strong> push trực tiếp.',
      tag: 'GitHub — repo gốc',
      prompt: 'Repo gốc: team-brand/landing-page. Mình không có quyền push trực tiếp.',
      html: '<div class="rbox pv-repo"><div class="rbox-hd"><span class="owner">team-brand</span>/landing-page</div><div class="rbox-files"><div class="rf"><span class="rf-dot" style="background:#f59e0b"></span>index.html</div><div class="rf"><span class="rf-dot" style="background:#22c55e"></span>style.css</div><div class="rf"><span class="rf-dot" style="background:#b45309"></span>script.js</div></div></div>'
    },
    {
      desc: 'Nhấn <span class="mono">Fork</span> → GitHub tạo bản copy hoàn toàn dưới account <span class="mono">you/landing-page</span>. Bản gốc không hề bị thay đổi.',
      tag: 'GitHub — fork tạo xong',
      prompt: 'Repo gốc: team-brand/landing-page. Mình không có quyền push trực tiếp. Đã fork sang you/landing-page.',
      html: '<div class="rbox pv-repo"><div class="rbox-hd"><span class="owner">team-brand</span>/landing-page</div><div class="rbox-files"><div class="rf"><span class="rf-dot" style="background:#f59e0b"></span>index.html</div><div class="rf"><span class="rf-dot" style="background:#22c55e"></span>style.css</div><div class="rf"><span class="rf-dot" style="background:#b45309"></span>script.js</div></div></div><div class="pv-arrow" style="height:20px"></div><div class="rbox pv-repo" style="border-color:var(--ac)"><div class="rbox-hd"><span class="owner">you</span>/landing-page <span style="color:var(--ac);font-size:8px;margin-left:4px">forked</span></div><div class="rbox-files"><div class="rf"><span class="rf-dot" style="background:#f59e0b"></span>index.html</div><div class="rf"><span class="rf-dot" style="background:#22c55e"></span>style.css</div><div class="rf"><span class="rf-dot" style="background:#b45309"></span>script.js</div></div></div>'
    },
    {
      desc: 'Trong bản fork, bạn sửa <span class="mono">index.html</span> — thêm hero section mới. File được highlight để thấy đây là thay đổi của bạn.',
      tag: 'GitHub — fork đã sửa',
      prompt: 'Repo gốc: team-brand/landing-page. Mình không có quyền push trực tiếp. Đã fork sang you/landing-page. Đã sửa index.html — thêm hero section.',
      html: '<div class="rbox pv-repo"><div class="rbox-hd"><span class="owner">team-brand</span>/landing-page</div><div class="rbox-files"><div class="rf"><span class="rf-dot" style="background:#f59e0b"></span>index.html</div><div class="rf"><span class="rf-dot" style="background:#22c55e"></span>style.css</div><div class="rf"><span class="rf-dot" style="background:#b45309"></span>script.js</div></div></div><div class="pv-arrow" style="height:20px"></div><div class="rbox pv-repo" style="border-color:var(--ac)"><div class="rbox-hd"><span class="owner">you</span>/landing-page <span style="color:var(--gn);font-size:8px;margin-left:4px">1 commit</span></div><div class="rbox-files"><div class="rf changed"><span class="rf-dot" style="background:#f59e0b"></span>index.html <span style="color:var(--ac);font-size:9px;margin-left:auto">+12</span></div><div class="rf"><span class="rf-dot" style="background:#22c55e"></span>style.css</div><div class="rf"><span class="rf-dot" style="background:#b45309"></span>script.js</div></div></div>'
    },
    {
      desc: 'Tạo <span class="mono">Pull Request</span> — gửi đề xuất từ fork về repo gốc. Chủ repo gốc sẽ thấy diff và quyết định merge hay không.',
      tag: 'GitHub — PR đã tạo',
      prompt: 'Repo gốc: team-brand/landing-page. Đã fork sang you/landing-page, sửa index.html. Tạo PR đề xuất merge vào main.',
      html: '<div class="rbox pv-repo"><div class="rbox-hd"><span class="owner">team-brand</span>/landing-page <span style="color:var(--ac);font-size:8px;margin-left:4px">1 open PR</span></div><div class="rbox-files"><div class="rf"><span class="rf-dot" style="background:#f59e0b"></span>index.html</div><div class="rf"><span class="rf-dot" style="background:#22c55e"></span>style.css</div><div class="rf"><span class="rf-dot" style="background:#b45309"></span>script.js</div></div></div><div class="pv-pr-arrow show"><svg viewBox="0 0 24 24"><polyline points="7 17 17 7"/><polyline points="7 7 17 7 17 17"/></svg><span>Pull Request</span></div><div class="rbox pv-repo" style="border-color:var(--ac)"><div class="rbox-hd"><span class="owner">you</span>/landing-page <span style="color:var(--gn);font-size:8px;margin-left:4px">1 commit</span></div><div class="rbox-files"><div class="rf changed"><span class="rf-dot" style="background:#f59e0b"></span>index.html <span style="color:var(--ac);font-size:9px;margin-left:auto">+12</span></div><div class="rf"><span class="rf-dot" style="background:#22c55e"></span>style.css</div><div class="rf"><span class="rf-dot" style="background:#b45309"></span>script.js</div></div></div>'
    },
    {
      desc: 'Chủ repo gốc duyệt và nhấn <span class="mono">Merge</span>. Thay đổi từ fork được ghép vào bản gốc. Cả hai repo đều có hero section mới.',
      tag: 'GitHub — đã merge',
      prompt: 'Repo gốc: team-brand/landing-page. Fork you/landing-page, sửa index.html, tạo PR. Đã merge thành công vào main.',
      html: '<div class="rbox pv-repo" style="border-color:var(--gn)"><div class="rbox-hd"><span class="owner">team-brand</span>/landing-page <span style="color:var(--gn);font-size:8px;margin-left:4px">merged</span></div><div class="rbox-files"><div class="rf changed"><span class="rf-dot" style="background:#f59e0b"></span>index.html <span style="color:var(--gn);font-size:9px;margin-left:auto">+12</span></div><div class="rf"><span class="rf-dot" style="background:#22c55e"></span>style.css</div><div class="rf"><span class="rf-dot" style="background:#b45309"></span>script.js</div></div></div><div class="pv-pr-arrow show"><svg viewBox="0 0 24 24" style="stroke:var(--gn)"><circle cx="12" cy="12" r="10"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/></svg><span style="color:var(--gn)">Merged</span></div><div class="rbox pv-repo" style="border-color:var(--ac)"><div class="rbox-hd"><span class="owner">you</span>/landing-page <span style="color:var(--gn);font-size:8px;margin-left:4px">synced</span></div><div class="rbox-files"><div class="rf changed"><span class="rf-dot" style="background:#f59e0b"></span>index.html <span style="color:var(--gn);font-size:9px;margin-left:auto">+12</span></div><div class="rf"><span class="rf-dot" style="background:#22c55e"></span>style.css</div><div class="rf"><span class="rf-dot" style="background:#b45309"></span>script.js</div></div></div>'
    }
  ];

  var current = 0;
  var $desc = document.getElementById('stepDesc');
  var $tag = document.getElementById('pvTag');
  var $stage = document.getElementById('pvStage');
  var $prTxt = document.getElementById('prTxt');
  var $prev = document.getElementById('prevBtn');
  var $next = document.getElementById('nextBtn');
  var $dots = document.querySelectorAll('.step-d');
  var $lines = [document.getElementById('sl0'),document.getElementById('sl1'),document.getElementById('sl2'),document.getElementById('sl3')];

  function render(){
    var s = steps[current];
    $desc.innerHTML = s.desc;
    $tag.textContent = s.tag;

    /* keep pv-tag, replace inner content */
    var inner = $stage.querySelectorAll('.rbox,.pv-arrow,.pv-pr-arrow');
    inner.forEach(function(el){ el.remove(); });
    $tag.insertAdjacentHTML('afterend', s.html);

    /* fix arrow height if exists */
    var arrow = $stage.querySelector('.pv-arrow');
    if(arrow) arrow.style.height = '20px';

    $prTxt.textContent = s.prompt;

    /* dots */
    $dots.forEach(function(d,i){
      d.className = 'step-d';
      if(i < current) d.classList.add('done');
      else if(i === current) d.classList.add('active');
    });

    /* lines */
    $lines.forEach(function(l,i){
      l.style.width = i < current ? '100%' : '0';
    });

    /* buttons */
    $prev.disabled = current === 0;
    $next.disabled = current === steps.length - 1;
    $next.textContent = current === steps.length - 1 ? 'Hoàn thành' : 'Tiếp';
  }

  $next.addEventListener('click', function(){
    if(current < steps.length - 1){ current++; render(); }
  });
  $prev.addEventListener('click', function(){
    if(current > 0){ current--; render(); }
  });

  /* init */
  render();
})();
</script>
</body>
</html>
