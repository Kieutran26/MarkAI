<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Practice — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131110;--fg:#e8e0d4;--muted:#706b64;--accent:#d4712a;--accent-dim:#8b3a1a;
  --card:#1c1a18;--card-alt:#242120;--border:#302c28;--border-hi:#44403a;
  --c0:#d4712a;--c1:#b89a2a;--c2:#4a8a5a;
  --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow-x:hidden}

#app-root{padding:0}

/* ===== PRACTICE ===== */
.pw{width:100%;background:var(--card);border:none;padding:20px 24px}
.pw-h{font-size:15px;font-weight:700;margin-bottom:2px}.pw-h span{color:var(--accent)}
.pw-s{font-size:11px;color:var(--muted);margin-bottom:14px}

.pp{border:1px solid var(--border);background:var(--card-alt);overflow:hidden;margin-bottom:14px;position:relative}
.pp-lbl{font-family:var(--mono);font-size:8px;color:var(--muted);letter-spacing:2px;padding:8px 20px 0;opacity:.4}
.pp-viz{position:relative;height:140px;margin:6px 20px 14px}

.pp-gl{position:absolute;inset:0;display:grid;pointer-events:none}
.pp-glc{border-right:1px solid rgba(212,113,42,.15)}.pp-glc:last-child{border-right:none}

.pp-gc{position:relative;z-index:1;display:grid;height:100%}
.pp-b{background:rgba(36,33,32,.9);border:1px solid var(--border);border-left:3px solid var(--c0);padding:4px 8px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;transition:all .25s}
.pp-b.c1{border-left-color:var(--c1)}.pp-b.c2{border-left-color:var(--c2)}
.pp-bs{font-family:var(--mono);font-size:7px;color:var(--muted);opacity:.7}
.pp-bt{font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.slr{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.sr{display:flex;align-items:center;gap:12px}
.sl{font-size:12px;min-width:70px;font-weight:500}
.sv{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:52px;text-align:right;font-weight:700}

input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:var(--border);outline:none;border:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border:2px solid var(--bg);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--accent);border:2px solid var(--bg);cursor:pointer;border-radius:0}

.pfb{font-family:var(--mono);font-size:11px;min-height:18px;color:var(--muted);transition:color .2s;line-height:1.4}
.pfb.w{color:var(--accent)}
.pht{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);opacity:.65}

@media(max-width:520px){
  .pw{padding:16px}
  .sl{min-width:56px;font-size:11px}
  .sr{gap:8px}
}
</style>
</head>
<body>
<div id="app-root">
    <div class="pw">
        <div class="pw-h">Thực hành — <span>Thay đổi Grid</span></div>
        <div class="pw-s">Kéo slider để thấy layout thay đổi realtime</div>
        
        <div class="pp">
            <div class="pp-lbl">PREVIEW</div>
            <div class="pp-viz">
                <div class="pp-gl" id="pL"></div>
                <div class="pp-gc" id="pC"></div>
            </div>
        </div>

        <div class="slr">
            <div class="sr">
                <span class="sl">Columns</span>
                <input type="range" id="sCol" min="4" max="16" value="12" step="1">
                <span class="sv" id="vCol">12</span>
            </div>
            <div class="sr">
                <span class="sl">Gap</span>
                <input type="range" id="sGap" min="0" max="48" value="18" step="2">
                <span class="sv" id="vGap">18px</span>
            </div>
        </div>

        <div class="pfb" id="pfb">&nbsp;</div>
        <div class="pht">Hint: Giữ nguyên gap, chỉ thay columns — thấy span 5 đổi từ 42% sang 83% rộng</div>
    </div>
</div>

<script>
const COLORS=['c0','c1','c2'];
const P_ITEMS=[
    {s:5,t:'Tiêu đề chính',c:0},
    {s:3,t:'Mô tả ngắn',c:1},
    {s:4,t:'Card A',c:0},
    {s:4,t:'Card B',c:1},
    {s:4,t:'Card C',c:2}
];

const pL=document.getElementById('pL');
const pC=document.getElementById('pC');
const pfb=document.getElementById('pfb');
const sCol=document.getElementById('sCol');
const sGap=document.getElementById('sGap');
const vCol=document.getElementById('vCol');
const vGap=document.getElementById('vGap');

function renderPractice(){
    const cols=+sCol.value, gap=+sGap.value;
    vCol.textContent=cols;
    vGap.textContent=gap+'px';

    /* Render Column Guides */
    pL.style.gridTemplateColumns='repeat('+cols+',1fr)';
    pL.style.gap=gap+'px';
    pL.innerHTML='';
    for(let i=0;i<cols;i++){
        const d=document.createElement('div');
        d.className='pp-glc';
        pL.appendChild(d);
    }

    /* Render Content Blocks */
    pC.style.gridTemplateColumns='repeat('+cols+',1fr)';
    pC.style.gap=gap+'px';
    pC.innerHTML='';
    P_ITEMS.forEach(it=>{
        const es=Math.min(it.s,cols);
        const d=document.createElement('div');
        d.className='pp-b '+COLORS[it.c];
        d.style.gridColumn='span '+es;
        d.innerHTML='<span class="pp-bs">span '+it.s+(es!==it.s?' → '+es:'')+'</span><span class="pp-bt">'+it.t+'</span>';
        pC.appendChild(d);
    });

    /* Live Feedback */
    const pct=Math.round(P_ITEMS[0].s/cols*100);
    pfb.textContent=cols+' cột · gap '+gap+'px · "span '+P_ITEMS[0].s+'" = '+pct+'% chiều rộng';
    pfb.className='pfb'+(pct>60?' w':'');
}

sCol.addEventListener('input', renderPractice);
sGap.addEventListener('input', renderPractice);

// Init
renderPractice();
</script>
</body>
</html>
