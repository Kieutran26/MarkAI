<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section — 4 Layout Patterns</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0c0c0e;
            --bg-subtle: #131315;
            --fg: #ece8e1;
            --muted: #706b64;
            --accent: #e88c2e;
            --card: #1a1a1e;
            --border: #26262a;
            --mono: 'Space Mono', monospace;
            --sans: 'Space Grotesk', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Nền tối + grid nhẹ + glow trên cùng */
            background-image:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(207,92,39,0.04) 0%, transparent 100%),
                linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
            background-size: 100% 100%, 28px 28px, 28px 28px;
            overflow: hidden;
        }

        .wrapper {
            width: 100%;
            max-width: 880px;
            padding: 20px;
            transform-origin: center center;
        }

        /* === Thanh tiêu đề === */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px 12px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tag {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .tag-sep { color: var(--border); }
        .tag-accent {
            color: var(--accent);
            border: 1px solid rgba(207,92,39,0.35);
            padding: 2px 8px;
        }

        /* === Khung preview === */
        .preview {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 7;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        /* Grid nhẹ bên trong preview */
        .preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
            z-index: 1;
        }

        /* === Badge tên layout === */
        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 30;
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--bg);
            background: var(--accent);
            padding: 3px 9px;
            line-height: 1.7;
            white-space: nowrap;
            transition: background 0.35s, color 0.35s;
        }

        /* === Các phần tử hero === */
        .h-heading {
            position: absolute;
            z-index: 10;
            font-weight: 700;
            line-height: 1.08;
            color: var(--fg);
            white-space: nowrap;
            transition:
                left 0.65s cubic-bezier(0.4,0,0.2,1),
                top 0.65s cubic-bezier(0.4,0,0.2,1),
                width 0.65s cubic-bezier(0.4,0,0.2,1),
                font-size 0.65s cubic-bezier(0.4,0,0.2,1),
                text-align 0.3s,
                color 0.35s ease;
            transition-delay: 0s;
        }
        .h-body {
            position: absolute;
            z-index: 10;
            font-weight: 400;
            line-height: 1.55;
            color: var(--muted);
            transition:
                left 0.65s cubic-bezier(0.4,0,0.2,1),
                top 0.65s cubic-bezier(0.4,0,0.2,1),
                width 0.65s cubic-bezier(0.4,0,0.2,1),
                font-size 0.65s cubic-bezier(0.4,0,0.2,1),
                text-align 0.3s,
                color 0.35s ease;
            transition-delay: 0.04s;
        }
        .h-btns {
            position: absolute;
            z-index: 10;
            display: flex;
            gap: 8px;
            transition:
                left 0.65s cubic-bezier(0.4,0,0.2,1),
                top 0.65s cubic-bezier(0.4,0,0.2,1),
                transform 0.65s cubic-bezier(0.4,0,0.2,1);
            transition-delay: 0.08s;
        }
        .h-btns.is-center { transform: translateX(-50%); }

        .btn-p {
            font-family: var(--mono);
            font-size: clamp(8px, 1vw, 11px);
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 7px 16px;
            background: var(--accent);
            color: var(--bg);
            border: none;
            cursor: default;
            white-space: nowrap;
            transition: background 0.35s, color 0.35s;
        }
        .btn-s {
            font-family: var(--mono);
            font-size: clamp(8px, 1vw, 11px);
            font-weight: 400;
            letter-spacing: 0.08em;
            padding: 7px 16px;
            background: transparent;
            color: var(--fg);
            border: 1px solid var(--border);
            cursor: default;
            white-space: nowrap;
            transition: color 0.35s, border-color 0.35s;
        }

        /* === Trạng thái inverted (overlay) === */
        .preview.inverted .h-heading { color: #0c0c0e; }
        .preview.inverted .h-body   { color: rgba(12,12,14,0.6); }
        .preview.inverted .btn-p    { background: #0c0c0e; color: var(--fg); }
        .preview.inverted .btn-s    { color: #0c0c0e; border-color: rgba(12,12,14,0.5); }
        .preview.inverted .badge    { background: #0c0c0e; color: var(--accent); }

        /* === Khối decorative === */
        .deco {
            position: absolute;
            z-index: 5;
            background: var(--accent);
            /* Vệt chéo nhẹ — chỉ thấy rõ khi deco lớn */
            background-image: repeating-linear-gradient(
                -45deg,
                transparent,
                transparent 5px,
                rgba(0,0,0,0.03) 5px,
                rgba(0,0,0,0.03) 10px
            );
            transition:
                left 0.65s cubic-bezier(0.4,0,0.2,1),
                top 0.65s cubic-bezier(0.4,0,0.2,1),
                width 0.65s cubic-bezier(0.4,0,0.2,1),
                height 0.65s cubic-bezier(0.4,0,0.2,1);
        }

        /* === Thanh dưới: dots + insight === */
        .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding: 0 2px;
            min-height: 20px;
        }
        .dots { display: flex; gap: 6px; }
        .dot {
            width: 22px;
            height: 3px;
            background: var(--border);
            border: none;
            padding: 0;
            cursor: pointer;
            transition: background 0.3s;
        }
        .dot:hover { background: var(--muted); }
        .dot.active { background: var(--accent); }

        .insight {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.02em;
            max-width: 56%;
            text-align: right;
            line-height: 1.5;
            transition: opacity 0.25s;
        }

        /* === Counter góc phải preview === */
        .counter {
            position: absolute;
            bottom: 10px;
            right: 12px;
            z-index: 30;
            font-family: var(--mono);
            font-size: 9px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.1em;
            transition: color 0.35s;
        }
        .preview.inverted .counter { color: rgba(12,12,14,0.2); }

        /* === Controls === */
        .ctr { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 0 0; }
        .ctr-b { padding: 6px 12px; background: var(--bg-subtle); border: 1px solid var(--border); color: var(--muted); font-family: var(--mono); font-size: 9px; font-weight: 700; cursor: pointer; transition: all 0.2s; letter-spacing: 1px; }
        .ctr-b:hover { border-color: var(--muted); color: var(--fg); }
        .ctr-b.act { border-color: var(--accent); color: var(--accent); background: rgba(207,92,39,0.1); }
        .pp-b { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 4px; transition: transform 0.2s; }
        .pp-b:active { transform: scale(0.92); }
        .pp-i { width: 12px; height: 12px; fill: var(--bg); }

        /* === Mobile === */
        @media (max-width: 640px) {
            .wrapper { padding: 14px; }
            .h-heading { white-space: normal; }
            .insight { display: none; }
            .bottom { justify-content: center; }
            .top-bar-left .tag:nth-child(n+3) { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper" id="wrapper">
        <!-- Thanh tiêu đề -->
        <div class="top-bar">
            <div class="top-bar-left">
                <span class="tag">hero section</span>
                <span class="tag tag-sep">/</span>
                <span class="tag">layout patterns</span>
            </div>
            <span class="tag tag-accent">4 VARIANTS</span>
        </div>

        <!-- Khung preview mô phỏng -->
        <div class="preview" id="preview">
            <div class="badge" id="badge">01 LEFT ALIGNED</div>
            <div class="h-heading" id="heading">Build products that scale.</div>
            <div class="h-body" id="body">Powerful infrastructure for modern teams. Deploy, scale, and ship faster.</div>
            <div class="h-btns" id="btns">
                <button class="btn-p">GET STARTED</button>
                <button class="btn-s">LEARN MORE →</button>
            </div>
            <div class="deco" id="deco"></div>
            <div class="counter" id="counter">1 / 4</div>
        </div>

        <!-- Dots + insight -->
        <div class="bottom">
            <div class="insight" id="insight" style="text-align: left;">Text bám trái — dễ đọc nhất, layout phổ biến nhất cho SaaS</div>
        </div>

        <div class="ctr">
            <button class="ctr-b act" data-i="0">LEFT</button>
            <button class="ctr-b" data-i="1">CENTERED</button>
            <button class="ctr-b" data-i="2">SPLIT</button>
            <button class="ctr-b" data-i="3">OVERLAY</button>
            <button class="pp-b" id="pp" title="Play/Pause">
                <svg class="pp-i" id="pp-i" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
            </button>
        </div>
    </div>

    <script>
        /* ===== Tham chiếu DOM ===== */
        const $ = id => document.getElementById(id);
        const heading = $('heading');
        const body    = $('body');
        const btns    = $('btns');
        const deco    = $('deco');
        const badge   = $('badge');
        const preview = $('preview');
        const counter = $('counter');
        const insight = $('insight');
        const ctrBs   = document.querySelectorAll('.ctr-b');
        const ppB     = $('pp');
        const ppI     = $('pp-i');
        const wrapper = $('wrapper');

        /* ===== Định nghĩa 4 trạng thái layout ===== */
        const layouts = [
            {
                label: '01 LEFT ALIGNED',
                insight: 'Text bám trái — dễ đọc nhất, layout phổ biến nhất cho SaaS',
                h: { left:'7%', top:'28%', w:'50%', align:'left', fs:'clamp(20px,3.4vw,34px)' },
                b: { left:'7%', top:'47%', w:'43%', align:'left', fs:'clamp(10px,1.35vw,14px)' },
                btn: { left:'7%', top:'64%', center:false },
                d: { left:'66%', top:'20%', w:'28%', h:'54%' },
                inv: false
            },
            {
                label: '02 CENTERED',
                insight: 'Căn giữa — tạo cảm giác cân bằng, hợp landing page đơn giản',
                h: { left:'10%', top:'25%', w:'80%', align:'center', fs:'clamp(20px,3.4vw,34px)' },
                b: { left:'18%', top:'44%', w:'64%', align:'center', fs:'clamp(10px,1.35vw,14px)' },
                btn: { left:'50%', top:'62%', center:true },
                d: { left:'44%', top:'13%', w:'12%', h:'3%' },
                inv: false
            },
            {
                label: '03 SPLIT LAYOUT',
                insight: 'Chia đôi — một bên content, một bên visual, phân bổ đều',
                h: { left:'4%', top:'28%', w:'40%', align:'left', fs:'clamp(16px,2.6vw,26px)' },
                b: { left:'4%', top:'47%', w:'36%', align:'left', fs:'clamp(9px,1.15vw,12px)' },
                btn: { left:'4%', top:'64%', center:false },
                d: { left:'50%', top:'0%', w:'50%', h:'100%' },
                inv: false
            },
            {
                label: '04 OVERLAY LAYOUT',
                insight: 'Text đè lên nền — tiết kiệm space, tạo chiều sâu visual',
                h: { left:'10%', top:'28%', w:'80%', align:'center', fs:'clamp(22px,3.6vw,36px)' },
                b: { left:'18%', top:'47%', w:'64%', align:'center', fs:'clamp(10px,1.35vw,14px)' },
                btn: { left:'50%', top:'64%', center:true },
                d: { left:'5%', top:'8%', w:'90%', h:'80%' },
                inv: true
            }
        ];

        let current = 0;
        let timer = null;
        let isPaused = false;

        /* ===== Áp dụng trạng thái layout ===== */
        function apply(i) {
            const l = layouts[i];

            // Heading
            heading.style.left = l.h.left;
            heading.style.top  = l.h.top;
            heading.style.width = l.h.w;
            heading.style.textAlign = l.h.align;
            heading.style.fontSize = l.h.fs;

            // Body
            body.style.left = l.b.left;
            body.style.top  = l.b.top;
            body.style.width = l.b.w;
            body.style.textAlign = l.b.align;
            body.style.fontSize = l.b.fs;

            // Buttons
            btns.style.left = l.btn.left;
            btns.style.top  = l.btn.top;
            btns.classList.toggle('is-center', l.btn.center);

            // Khối decorative
            deco.style.left   = l.d.left;
            deco.style.top    = l.d.top;
            deco.style.width  = l.d.w;
            deco.style.height = l.d.h;

            // Trạng thái inverted (overlay)
            preview.classList.toggle('inverted', l.inv);

            // Badge + counter
            badge.textContent   = l.label;
            counter.textContent = (i + 1) + ' / 4';

            // Buttons active state
            ctrBs.forEach((b, idx) => b.classList.toggle('act', idx === i));

            // Insight
            insight.style.opacity = '0';
            setTimeout(() => {
                insight.textContent = l.insight;
                insight.style.opacity = '1';
            }, 200);
        }

        /* ===== Tự động chuyển ===== */
        function next() {
            if(isPaused) return;
            current = (current + 1) % layouts.length;
            apply(current);
        }

        function startLoop() {
            clearInterval(timer);
            timer = setInterval(next, 3200);
        }

        function togglePP() {
            isPaused = !isPaused;
            ppI.innerHTML = isPaused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
        }

        /* ===== Event Listeners ===== */
        ctrBs.forEach(b => {
            b.addEventListener('click', () => {
                current = parseInt(b.dataset.i);
                apply(current);
                isPaused = true;
                ppI.innerHTML = '<path d="M8 5v14l11-7z"/>';
                startLoop();
            });
        });

        ppB.addEventListener('click', togglePP);

        /* ===== Responsive scaling ===== */
        function scale() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const targetW = 880;
            const targetH = 440; // Adjusted for shallower aspect ratio
            const s = Math.min(w / targetW, h / targetH, 1);
            wrapper.style.transform = `scale(${s})`;
        }
        window.addEventListener('resize', scale);
        scale();

        /* ===== Khởi động ===== */
        apply(0);
        startLoop();
    </script>
</body>
</html>
