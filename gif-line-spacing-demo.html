<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Line Spacing Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{--bg:#0f0f12;--bg-card:#17171c;--fg:#e8e4dc;--muted:#6e6e7a;--accent:#e88c2e;--accent-soft:rgba(232,140,46,.13);--accent-border:rgba(232,140,46,.3);--border:#2a2a33;--surface:#1e1e25}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:'Space Grotesk',sans-serif}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:22px 22px;pointer-events:none;z-index:0}
  .entry{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:24px 24px 10px}
  .sec-label{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:20px;display:flex;align-items:center;gap:10px}
  .sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
  .sim-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
  @media(max-width:700px){.sim-cards{grid-template-columns:repeat(2,1fr)}}
  .sim-card{background:var(--bg-card);border:1px solid var(--border);padding:22px 14px 18px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .3s,background .3s}
  .sim-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
  .sim-card:hover{border-color:var(--accent-border)}
  .sim-card.active{border-color:var(--accent);background:var(--surface)}
  .sim-card.active::before{transform:scaleX(1)}
  .c-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;margin-bottom:4px}
  .c-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:20px;transition:color .3s}
  .sim-card.active .c-name{color:var(--accent)}
  .lines-wrap{position:relative;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:14px}
  .line-text{font-size:18px;font-weight:700;text-transform:uppercase;text-align:center;display:flex;flex-direction:column}
  .line-item{display:block;opacity:0;transform:translateY(10px);animation:lineIn .35s ease forwards}
  @keyframes lineIn{to{opacity:1;transform:translateY(0)}}
  .gap-shapes{position:absolute;inset:0;pointer-events:none}
  .gap-shape{position:absolute;left:0;right:0;background:rgba(232,140,46,.12);border-top:1px solid rgba(232,140,46,.2);border-bottom:1px solid rgba(232,140,46,.2);opacity:0;transition:opacity .3s ease}
  .sim-card.active .gap-shape{opacity:1}
  .c-val{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);text-align:center;transition:color .3s,font-weight .3s}
  .sim-card.active .c-val{color:var(--accent);font-weight:600}
  .insight-box{background:var(--surface);border:1px solid var(--border);padding:18px 22px;display:flex;align-items:flex-start;gap:12px;margin-bottom:24px}
  .ins-icon{color:var(--accent);font-size:13px;margin-top:3px;flex-shrink:0}
  .ins-text{font-size:14px;color:var(--fg);opacity:.85;line-height:1.65;transition:opacity .25s,transform .25s}
  .ins-text.fading{opacity:0;transform:translateY(6px)}
  .fu{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
  .fu.in{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div id="app-root">
<div class="entry">
  <h1 style="font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-1px;margin-bottom:20px;">Line Spacing</h1>
  <section class="fu" aria-label="Line spacing demo">
    <div class="sec-label">01 - Demo</div>
    <div class="sim-cards" id="simCards"></div>
    <div class="insight-box">
      <i class="fa-solid fa-lightbulb ins-icon"></i>
      <p class="ins-text" id="insText">Chọn một mức line spacing để xem giải thích.</p>
    </div>
  </section>
</div>
</div>
<script>
  const presets=[
    {num:'01',name:'Tight',val:1.1,lines:['LINE','SPACING'],ins:'Line spacing khít 1.1 hợp cho heading ngắn để tạo cảm giác chặt chẽ.'},
    {num:'02',name:'Normal',val:1.5,lines:['LINE','SPACING'],ins:'Mức 1.5 là vùng an toàn cho body text vì giúp mắt di chuyển giữa các dòng dễ hơn.'},
    {num:'03',name:'Wide',val:1.9,lines:['LINE','SPACING'],ins:'Line spacing rộng 1.9 tạo nhiều khoảng thở, hợp cho quote hoặc đoạn mở đầu cần cảm giác sang.'},
    {num:'04',name:'Extra Wide',val:2.4,lines:['LINE','SPACING'],ins:'Mức 2.4 rất thoáng, chỉ nên dùng như một điểm nhấn thay vì cho đoạn văn dài.'}
  ];
  const simCardsEl=document.getElementById('simCards');
  const insTextEl=document.getElementById('insText');
  let activeIdx=-1;

  function renderSim(){
    simCardsEl.innerHTML=presets.map((p,ci)=>{
      const items=p.lines.map((l,li)=>`<span class="line-item" style="animation-delay:${(ci*.1)+(li*.08)+.4}s">${l}</span>`).join('');
      return `<div class="sim-card" data-i="${ci}" tabindex="0" role="button">
        <div class="c-num">${p.num}</div>
        <div class="c-name">${p.name}</div>
        <div class="lines-wrap">
          <div class="line-text" style="line-height:${p.val}">${items}</div>
          <div class="gap-shapes"></div>
        </div>
        <div class="c-val">${p.val}</div>
      </div>`;
    }).join('');
    simCardsEl.querySelectorAll('.sim-card').forEach(c=>c.addEventListener('click',()=>activateCard(+c.dataset.i)));
  }

  function activateCard(i){
    simCardsEl.querySelectorAll('.sim-card').forEach(c=>c.classList.remove('active'));
    if(activeIdx===i){activeIdx=-1;setIns('Chọn một mức line spacing để xem giải thích.');return;}
    activeIdx=i;
    const card=simCardsEl.querySelector(`[data-i="${i}"]`);
    card.classList.add('active');
    drawGaps(card);
    setIns(presets[i].ins);
  }

  function drawGaps(card){
    const cont=card.querySelector('.gap-shapes');
    const items=card.querySelectorAll('.line-item');
    cont.innerHTML='';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const wrapR=card.querySelector('.lines-wrap').getBoundingClientRect();
      for(let i=0;i<items.length-1;i++){
        const r1=items[i].getBoundingClientRect();
        const r2=items[i+1].getBoundingClientRect();
        const shape=document.createElement('div');
        shape.className='gap-shape';
        shape.style.top=(r1.bottom-wrapR.top)+'px';
        shape.style.height=(r2.top-r1.bottom)+'px';
        cont.appendChild(shape);
      }
    }));
  }

  function setIns(text){
    insTextEl.classList.add('fading');
    setTimeout(()=>{insTextEl.textContent=text;insTextEl.classList.remove('fading');},250);
  }

  function initFU(){
    document.querySelectorAll('.fu').forEach((el,i)=>setTimeout(()=>el.classList.add('in'),60+i*110));
  }

  renderSim();
  initFU();
</script>
</body>
</html>
