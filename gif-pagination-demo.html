<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagination — Animated</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f12;--fg:#e8e0d4;--muted:#706b64;--accent:#d4712a;--accent-dim:rgba(212,113,42,.15);--card:#16161b;--card-alt:#1c1c22;--border:#282830;--border-hi:#44403a;--ok:#4a8a5a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:16px 16px;display:flex;flex-direction:column;align-items:center;font-family:'Space Grotesk',sans-serif;color:var(--fg);padding:12px 16px 4px;overflow:hidden}

.aw{width:100%}
.ab{width:100%;height:320px;background:var(--card);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;position:relative}

.hd{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.01)}
.hd-t{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2.5px}
.hd-f{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}

.la{position:relative;flex:1;background:linear-gradient(rgba(255,255,255,.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:30px 30px;overflow:hidden}
.fr{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 20px;opacity:0;pointer-events:none;transition:opacity .3s}.fr.show{opacity:1;pointer-events:auto}
.si{opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}.fr.show .si{opacity:1;transform:translateY(0)}

.fl{font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}

/* Table */
.tb{width:100%;border-collapse:collapse;margin-bottom:8px}
.tb th{font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;color:var(--muted);letter-spacing:1px;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border);text-transform:uppercase}
.tb td{font-size:9px;padding:4px 6px;border-bottom:1px solid rgba(48,44,40,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.tb tr.ch td{opacity:.25}
.st-b{display:inline-block;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;border:1px solid var(--border)}
.st-a{background:rgba(74,138,90,.12);border-color:var(--ok);color:var(--ok)}
.st-i{color:var(--muted)}

/* Pagination controls */
.pg{display:flex;align-items:center;gap:4px;justify-content:center;padding:6px 0 0;flex-shrink:0}
.pn{min-width:24px;height:24px;border:1px solid var(--border);background:var(--card-alt);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);cursor:default;transition:all .25s}
.pn.act{background:var(--accent);border-color:var(--accent);color:#000}
.pn.flash{border-color:var(--accent);color:var(--accent)}
.pa{min-width:auto;padding:0 8px;font-size:8px;font-family:'Space Grotesk',sans-serif;font-weight:600}
.pgi{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);padding:0 6px}
.lm-btn{padding:0 16px;height:28px;border:1px solid var(--border);background:var(--card-alt);font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:default;transition:all .25s;margin:0 auto}
.lm-btn.flash{border-color:var(--accent);color:var(--accent)}

.inf{padding:8px 14px;background:var(--card);border-top:1px solid var(--border);min-height:72px}
.dn{font-size:14px;font-weight:800;line-height:1.1;color:var(--fg)}
.ds{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.dd{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}

.pt{height:2px;background:var(--border)}.pf{height:100%;background:var(--accent);width:0%}

/* Controls */
.ctr{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px 4px;background:transparent}
.ctr-b{padding:6px 12px;background:var(--card-alt);border:1px solid var(--border);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:1px}
.ctr-b:hover{border-color:var(--border-hi);color:var(--fg)}
.ctr-b.act{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

.pp-b{width:32px;height:32px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:4px;transition:transform .2s;flex-shrink:0}
.pp-b:active{transform:scale(.92)}
.pp-bi{width:12px;height:12px;fill:#000}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="aw">
<div class="ab" id="ab">
  <div class="hd"><span class="hd-t">PAGINATION</span><span class="hd-f" id="hf">01 / 04</span></div>
  <div class="la" id="la">
    <div class="fr" id="f0"></div>
    <div class="fr" id="f1"></div>
    <div class="fr" id="f2"></div>
    <div class="fr" id="f3"></div>
  </div>
  <div class="inf">
    <div class="dn" id="dn">Numeric</div>
    <div class="ds" id="ds">SỐ TRANG RÕ RÀNG</div>
    <div class="dd" id="dd">Hiển thị tất cả số trang — user chọn trực tiếp trang muốn xem</div>
  </div>
  <div class="pt"><div class="pf" id="pf"></div></div>
</div>

<div class="ctr">
    <button class="ctr-b act" data-i="0">NUMERIC</button>
    <button class="ctr-b" data-i="1">PREV/NEXT</button>
    <button class="ctr-b" data-i="2">FIRST/LAST</button>
    <button class="ctr-b" data-i="3">LOAD MORE</button>
    <button class="pp-b" id="pp" title="Play/Pause">
        <svg class="pp-bi" id="pp-bi" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
    </button>
</div>
</div>

<script>
/* ===== DATA ===== */
const ROWS=[
  {n:'Linh Nguyen',e:'linh@brand.co',r:'Designer',s:'a'},
  {n:'Minh Tran',e:'minh@brand.co',r:'Developer',s:'a'},
  {n:'Hoa Pham',e:'hoa@brand.co',r:'Manager',s:'i'},
  {n:'Tuan Le',e:'tuan@brand.co',r:'Marketer',s:'a'},
  {n:'Mai Vu',e:'mai@brand.co',r:'Analyst',s:'i'},
  {n:'Hung Dao',e:'hung@brand.co',r:'Designer',s:'a'},
  {n:'Yen Ngo',e:'yen@brand.co',r:'Developer',s:'a'},
  {n:'Son Bui',e:'son@brand.co',r:'Support',s:'i'},
  {n:'Lan Ho',e:'lan@brand.co',r:'Sales',s:'a'},
  {n:'Khoa Dinh',e:'khoa@brand.co',r:'PM',s:'a'},
  {n:'Trang Ly',e:'trang@brand.co',r:'Designer',s:'a'},
  {n:'Phuc Vo',e:'phuc@brand.co',r:'Developer',s:'i'},
  {n:'Thao Tran',e:'thao@brand.co',r:'Marketing',s:'a'},
  {n:'Duc Nguyen',e:'duc@brand.co',r:'Analyst',s:'a'},
  {n:'Gia Bui',e:'gia@brand.co',r:'Sales',s:'i'},
  {n:'Ngoc Pham',e:'ngoc@brand.co',r:'Support',s:'a'},
  {n:'Hai Vu',e:'hai@brand.co',r:'Developer',s:'a'},
  {n:'Nhi Le',e:'nhi@brand.co',r:'Designer',s:'i'},
  {n:'Bao Tran',e:'bao@brand.co',r:'PM',s:'a'},
  {n:'Cam Dao',e:'cam@brand.co',r:'Marketing',s:'a'}
];
const PP=4,TP=Math.ceil(ROWS.length/PP);
const INFO=[
  {nm:'Numeric',sz:'SỐ TRANG RÕ RÀNG',dc:'Hiển thị tất cả số trang — user chọn trực tiếp trang muốn xem'},
  {nm:'Prev / Next',sz:'TRƯỚC / SAU',dc:'Chỉ 2 nút — đơn giản nhưng không nhảy được đến trang xa'},
  {nm:'First / Last',sz:'ĐẦU / CUỐI',dc:'Thêm nút nhảy đến trang đầu/cuối — tốt cho dataset lớn'},
  {nm:'Load More',sz:'TẢI THÊM',dc:'Không chia trang — cứ bấm là thêm data vào cuối danh sách'}
];

/* ===== HELPERS ===== */
function statusBadge(s){return `<span class="st-b ${s==='a'?'st-a':'st-i'}">${s==='a'?'Active':'Inactive'}</span>`}
function tableHTML(page,animated){
  const start=page*PP;
  const rows=ROWS.slice(start,start+PP).map((r,i)=>{
    const ch=animated?' class="ch"':'';
    return `<tr${ch}><td>${r.n}</td><td>${r.e}</td><td>${r.r}</td><td>${statusBadge(r.s)}</td></tr>`;
  }).join('');
  return rows;
}

/* ===== BUILD FRAMES ===== */
function buildFrames(){
  // F0: Numeric
  let pg0='<div class="pg">';
  for(let i=0;i<TP;i++)pg0+=`<span class="pn${i===0?' act':''}" id="p0n${i}">${i+1}</span>`;
  pg0+='</div>';
  document.getElementById('f0').innerHTML=`<div class="fl si">01 NUMERIC PAGINATION</div><div class="si"><table class="tb"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody id="tb0">${tableHTML(0,false)}</tbody></table>${pg0}</div>`;

  // F1: Prev/Next
  document.getElementById('f1').innerHTML=`<div class="fl si">02 PREVIOUS / NEXT</div><div class="si"><table class="tb"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody id="tb1">${tableHTML(0,false)}</tbody></table><div class="pg"><span class="pn pa" id="p1prev">&lsaquo; Previous</span><span class="pgi" id="p1info">Page 1 of ${TP}</span><span class="pn pa" id="p1next">Next &rsaquo;</span></div></div>`;

  // F2: First/Last
  document.getElementById('f2').innerHTML=`<div class="fl si">03 FIRST / LAST</div><div class="si"><table class="tb"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody id="tb2">${tableHTML(0,false)}</tbody></table><div class="pg"><span class="pn pa" id="p2first">&laquo; First</span><span class="pn pa" id="p2prev">&lsaquo; Prev</span><span class="pgi" id="p2info">Page 1 of ${TP}</span><span class="pn pa" id="p2next">Next &rsaquo;</span><span class="pn pa" id="p2last">Last &raquo;</span></div></div>`;

  // F3: Load More
  document.getElementById('f3').innerHTML=`<div class="fl si">04 LOAD MORE</div><div class="si"><table class="tb"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody id="tb3">${tableHTML(0,false)}</tbody></table><div style="padding-top:6px"><div class="lm-btn" id="p3lm">Load more</div></div></div>`;
}
buildFrames();

/* ===== ANIMATION ===== */
const frs=[0,1,2,3].map(i=>document.getElementById('f'+i));
const el={dn:document.getElementById('dn'),ds:document.getElementById('ds'),dd:document.getElementById('dd'),hf:document.getElementById('hf'),pf:document.getElementById('pf')};
const ctrBs=document.querySelectorAll('.ctr-b');
const ppB=document.getElementById('pp');
const ppI=document.getElementById('pp-bi');

let cur=0,pa=null,t0=0,isPaused=false,ftimers=[];
const DUR=3500;

function setTB(id,page){
  const target = document.getElementById(id);
  if(!target) return;
  target.innerHTML=tableHTML(page,true);
  setTimeout(()=>{target.querySelectorAll('.ch').forEach(r=>r.classList.remove('ch'))},50)
}

function runF(fi){
  ftimers.forEach(t=>clearTimeout(t));ftimers=[];
  if(fi===0){
    setTB('tb0',0);
    ftimers.push(setTimeout(()=>{setTB('tb0',1);document.getElementById('p0n0')?.classList.remove('act');document.getElementById('p0n1')?.classList.add('act')},900));
    ftimers.push(setTimeout(()=>{setTB('tb0',2);document.getElementById('p0n1')?.classList.remove('act');document.getElementById('p0n2')?.classList.add('act')},1900));
  }else if(fi===1){
    setTB('tb1',0);
    ftimers.push(setTimeout(()=>{setTB('tb1',1);const info=document.getElementById('p1info');if(info)info.textContent='Page 2 of '+TP;const prev=document.getElementById('p1prev');if(prev){prev.classList.add('flash');setTimeout(()=>prev.classList.remove('flash'),400)}},900));
  }else if(fi===2){
    setTB('tb2',0);
    ftimers.push(setTimeout(()=>{setTB('tb2',1);const info=document.getElementById('p2info');if(info)info.textContent='Page 2 of '+TP;const next=document.getElementById('p2next');if(next){next.classList.add('flash');setTimeout(()=>next.classList.remove('flash'),400)}},900));
  }else{
    setTB('tb3',0);
    ftimers.push(setTimeout(()=>{
      const tb = document.getElementById('tb3');
      if(tb){
        tb.innerHTML+=tableHTML(1,true).replace(/<tr class="ch">/g,'<tr>');
        setTimeout(()=>{tb.querySelectorAll('.ch').forEach(r=>r.classList.remove('ch'))},50);
      }
      const lm=document.getElementById('p3lm');
      if(lm){lm.classList.add('flash');setTimeout(()=>lm.classList.remove('flash'),400)}
    },1000));
  }
}

function apply(i){
  cur=i;
  const s=INFO[i];el.dn.textContent=s.nm;el.ds.textContent=s.sz;el.dd.textContent=s.dc;
  el.hf.textContent='0'+(i+1)+' / 04';
  ctrBs.forEach((b,j)=>b.classList.toggle('act',j===i));
  
  frs.forEach(f=>f.classList.remove('show'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    frs[i].classList.add('show');
    runF(i);
  }));
}

function tk(n){
    if(isPaused) return;
    const p=Math.min(100,(n-t0)/DUR*100);
    el.pf.style.width=p+'%';
    if(p<100)pa=requestAnimationFrame(tk);
    else next();
}
function startProg2(){t0=performance.now();el.pf.style.transition='none';el.pf.style.width='0%';pa=requestAnimationFrame(tk)}
function next(){if(isPaused)return;cur=(cur+1)%4;apply(cur);startProg2()}

function togglePP(){
    isPaused=!isPaused;
    ppI.innerHTML=isPaused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
    if(!isPaused){
        t0=performance.now() - (parseFloat(el.pf.style.width||0)/100*DUR);
        pa=requestAnimationFrame(tk);
    }
}

ctrBs.forEach(b=>{
    b.onclick=()=>{
        isPaused=true;
        ppI.innerHTML='<path d="M8 5v14l11-7z"/>';
        apply(parseInt(b.dataset.i));
        el.pf.style.width='0%';
    }
});

ppB.onclick=togglePP;

apply(0);
startProg2();

document.addEventListener('visibilitychange',()=>{
    if(document.hidden){cancelAnimationFrame(pa);ftimers.forEach(t=>clearTimeout(t));}
    else if(!isPaused){t0=performance.now() - (parseFloat(el.pf.style.width||0)/100*DUR);pa=requestAnimationFrame(tk);}
});
</script>
</body>
</html>
