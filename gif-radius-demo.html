<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radius / Corner — Animated</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#131110;--fg:#e8e0d4;--muted:#706b64;--accent:#d4712a;--accent-dim:rgba(212,113,42,.15);--card:#1c1a18;--card-alt:#242120;--border:#302c28;--border-hi:#44403a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:auto;overflow:hidden}
body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,rgba(212,113,42,.035) 0%,transparent 55%),radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 100%,16px 16px;display:flex;flex-direction:column;align-items:center;font-family:'Space Grotesk',sans-serif;color:var(--fg);padding:12px 16px 4px}

.aw{width:100%}
.ab{width:100%;height:320px;background:var(--card);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;position:relative}

.hd{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.01)}
.hd-t{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2.5px}
.hd-f{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.la{position:relative;flex:1;background:linear-gradient(rgba(255,255,255,.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:30px 30px;overflow:hidden}

.fr{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s}.fr.show{opacity:1;pointer-events:auto}
.cw{flex:1;display:flex;flex-direction:column;padding:10px 24px 0;min-height:0;justify-content:center;align-items:center}

/* Radius specific preview */
.rpw{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;width:100%;max-width:500px}
.rpc{background:var(--card-alt);border:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:10px;transition:all .4s cubic-bezier(.4,0,.2,1)}
.rpc-h{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.rpc-b{width:100%;height:32px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;transition:all .4s cubic-bezier(.4,0,.2,1)}
.rpc-i{width:100%;height:28px;background:var(--bg);border:1px solid var(--border);transition:all .4s cubic-bezier(.4,0,.2,1)}
.rpc-c{width:100%;height:60px;background:var(--bg);border:1px solid var(--border);transition:all .4s cubic-bezier(.4,0,.2,1)}

/* Info */
.inf{padding:8px 14px;background:var(--card);border-top:1px solid var(--border);min-height:72px}
.dn{font-size:14px;font-weight:800;line-height:1.1;color:var(--fg)}
.ds{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);margin-top:2px;text-transform:uppercase;letter-spacing:1px}
.dd{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}

.pt{height:2px;background:var(--border)}.pf{height:100%;background:var(--accent);width:0%}

/* Controls */
.ctr{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px 4px;background:transparent}
.ctr-b{padding:6px 12px;background:var(--card-alt);border:1px solid var(--border);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:1px}
.ctr-b:hover{border-color:var(--border-hi);color:var(--fg)}
.ctr-b.act{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

.pp-b{width:32px;height:32px;border-radius:50%;background:var(--accent);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-left:4px;transition:transform .2s;flex-shrink:0}
.pp-b:active{transform:scale(.92)}
.pp-i{width:12px;height:12px;fill:#000}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="aw">
<div class="ab" id="ab">
  <div class="hd"><span class="hd-t">CORNER RADIUS</span><span class="hd-f" id="hf">01 / 04</span></div>
  <div class="la" id="la">
    <!-- F0: Sharp -->
    <div class="fr" id="f0">
      <div class="cw">
        <div class="rpw">
          <div class="rpc" style="border-radius:0"><div class="rpc-h">0px</div><div class="rpc-b" style="border-radius:0">BUTTON</div><div class="rpc-i" style="border-radius:0"></div><div class="rpc-c" style="border-radius:0"></div></div>
          <div class="rpc" style="border-radius:0"><div class="rpc-h">0px</div><div class="rpc-b" style="border-radius:0">ACTION</div><div class="rpc-i" style="border-radius:0"></div><div class="rpc-c" style="border-radius:0"></div></div>
        </div>
      </div>
    </div>
    <!-- F1: Subtle -->
    <div class="fr" id="f1">
      <div class="cw">
        <div class="rpw">
          <div class="rpc" style="border-radius:4px"><div class="rpc-h">4px</div><div class="rpc-b" style="border-radius:4px">BUTTON</div><div class="rpc-i" style="border-radius:4px"></div><div class="rpc-c" style="border-radius:4px"></div></div>
          <div class="rpc" style="border-radius:4px"><div class="rpc-h">4px</div><div class="rpc-b" style="border-radius:4px">ACTION</div><div class="rpc-i" style="border-radius:4px"></div><div class="rpc-c" style="border-radius:4px"></div></div>
        </div>
      </div>
    </div>
    <!-- F2: Rounded -->
    <div class="fr" id="f2">
      <div class="cw">
        <div class="rpw">
          <div class="rpc" style="border-radius:12px"><div class="rpc-h">12px</div><div class="rpc-b" style="border-radius:12px">BUTTON</div><div class="rpc-i" style="border-radius:12px"></div><div class="rpc-c" style="border-radius:12px"></div></div>
          <div class="rpc" style="border-radius:12px"><div class="rpc-h">12px</div><div class="rpc-b" style="border-radius:12px">ACTION</div><div class="rpc-i" style="border-radius:12px"></div><div class="rpc-c" style="border-radius:12px"></div></div>
        </div>
      </div>
    </div>
    <!-- F3: Full -->
    <div class="fr" id="f3">
      <div class="cw">
        <div class="rpw">
          <div class="rpc" style="border-radius:24px"><div class="rpc-h">24px</div><div class="rpc-b" style="border-radius:24px">BUTTON</div><div class="rpc-i" style="border-radius:24px"></div><div class="rpc-c" style="border-radius:24px"></div></div>
          <div class="rpc" style="border-radius:32px"><div class="rpc-h">50% / Circle</div><div class="rpc-b" style="border-radius:32px">ACTION</div><div class="rpc-i" style="border-radius:32px"></div><div class="rpc-c" style="border-radius:32px"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="inf">
    <div class="dn" id="dn">Sharp</div>
    <div class="ds" id="ds">GÓC VUÔNG 0PX</div>
    <div class="dd" id="dd">Góc vuông sắc cạnh, không bo — tạo cảm giác kỹ thuật, cứng cáp và chính xác.</div>
  </div>
  <div class="pt"><div class="pf" id="pf"></div></div>
</div>

<div class="ctr">
    <button class="ctr-b act" data-i="0">SHARP</button>
    <button class="ctr-b" data-i="1">SUBTLE</button>
    <button class="ctr-b" data-i="2">ROUNDED</button>
    <button class="ctr-b" data-i="3">PILL</button>
    <button class="pp-b" id="pp" title="Play/Pause">
        <svg class="pp-i" id="pp-i" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
    </button>
</div>
</div>

<script>
const INFO=[
  {nm:'Sharp',sz:'GÓC VUÔNG 0PX',dc:'Góc vuông sắc cạnh, không bo — tạo cảm giác kỹ thuật, cứng cáp và chính xác. Thường thấy trong phong cách Brutalist.'},
  {nm:'Subtle',sz:'BO NHẸ 4PX',dc:'Mức bo tiêu chuẩn, giúp element bớt "gai" nhưng vẫn giữ được sự ngay ngắn. Hầu hết các website SaaS/Tech dùng mức này.'},
  {nm:'Rounded',sz:'BO RÕ RỆT 12PX',dc:'Góc bo lớn, tạo cảm giác mềm mại, thân thiện và dễ tiếp cận hơn. Thường dùng trên Landing page, mobile app.'},
  {nm:'Full / Pill',sz:'BO CỰC MẠNH 24PX+',dc:'Góc bo tối đa tạo hình viên thuốc (pill) hoặc hình tròn — vibe năng động. Dùng cho Button CTA, Tag hoặc Avatar.'}
];

const frs=[0,1,2,3].map(i=>document.getElementById('f'+i));
const el={dn:document.getElementById('dn'),ds:document.getElementById('ds'),dd:document.getElementById('dd'),hf:document.getElementById('hf'),pf:document.getElementById('pf')};
const ctrBs=document.querySelectorAll('.ctr-b');
const ppB=document.getElementById('pp');
const ppI=document.getElementById('pp-i');

let cur=0,pa=null,t0=0,isPaused=false;
const DUR=3500;

function apply(i){
  cur=i;
  const s=INFO[i];el.dn.textContent=s.nm;el.ds.textContent=s.sz;el.dd.textContent=s.dc;
  el.hf.textContent='0'+(i+1)+' / 04';
  ctrBs.forEach((b,j)=>b.classList.toggle('act',j===i));
  
  frs.forEach(f=>f.classList.remove('show'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    frs[i].classList.add('show');
  }));
}

function tk(n){
    if(isPaused) return;
    const p=Math.min(100,(n-t0)/DUR*100);
    el.pf.style.width=p+'%';
    if(p<100)pa=requestAnimationFrame(tk);
    else next();
}
function startProg2(){t0=performance.now();el.pf.style.transition='none';el.pf.style.width='0%';pa=requestAnimationFrame(tk)}
function next(){if(isPaused)return;cur=(cur+1)%4;apply(cur);startProg2()}

function togglePP(){
    isPaused=!isPaused;
    ppI.innerHTML=isPaused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 4h4v16H6zm8 0h4v16h-4z"/>';
    if(!isPaused){
        t0=performance.now() - (parseFloat(el.pf.style.width||0)/100*DUR);
        pa=requestAnimationFrame(tk);
    }
}

ctrBs.forEach(b=>{
    b.onclick=()=>{
        isPaused=true;
        ppI.innerHTML='<path d="M8 5v14l11-7z"/>';
        apply(parseInt(b.dataset.i));
        el.pf.style.width='0%';
    }
});

ppB.onclick=togglePP;

apply(0);
startProg2();

document.addEventListener('visibilitychange',()=>{
    if(document.hidden){cancelAnimationFrame(pa);}
    else if(!isPaused){t0=performance.now() - (parseFloat(el.pf.style.width||0)/100*DUR);pa=requestAnimationFrame(tk);}
});
</script>
</body>
</html>
