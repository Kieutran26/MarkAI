<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Radius Demo — Vibecode Glossary</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f0f12;
      --bg-card: #16161b;
      --fg: #e8e4dc;
      --muted: #6e6e7a;
      --accent: #e88c2e;
      --accent-soft: rgba(207, 92, 38, .12);
      --accent-border: rgba(207, 92, 38, .3);
      --border: #282830;
      --surface: #1c1c23;
      --success: #3a9e5c;
      --success-soft: rgba(58, 158, 92, .12);
      --warning: #c49030;
      --warning-soft: rgba(196, 144, 48, .1);
      --bar-d: #2a2a34;
      --bar-m: #44444f;
      --shape-lt: #33333d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Space Grotesk', sans-serif;
      min-height: auto;
      line-height: 1.6;
    }

    .entry {
      position: relative;
      z-index: 1;
      max-width: 940px;
      margin: 0 auto;
      padding: 24px 24px 40px
    }

    .th {
      margin-bottom: 28px
    }

    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    .th h1 {
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.08
    }

    .th .sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px
    }

    .sec-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sec-lbl::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    /* ========== SIM CARDS ========== */
    .sim-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px
    }

    @media(max-width:720px) {
      .sim-grid {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    .sc {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 20px 14px 18px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color .3s, background .3s;
    }

    .sc::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .35s ease;
    }

    .sc:hover {
      border-color: var(--accent-border)
    }

    .sc.on {
      border-color: var(--accent);
      background: var(--surface)
    }

    .sc.on::before {
      transform: scaleX(1)
    }

    .sc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px
    }

    .sc-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px
    }

    .sc-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      transition: color .3s;
    }

    .sc.on .sc-tag {
      color: var(--accent)
    }

    .sc-shapes {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      min-height: 110px;
      justify-content: center
    }

    .shape-row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .sh {
      transition: border-radius .5s cubic-bezier(.4, 0, .2, 1), background .3s;
      flex-shrink: 0;
      position: relative;
    }

    .sh.lg {
      width: 100%;
      height: 36px;
      background: var(--shape-lt)
    }

    .sh.md {
      width: 52px;
      height: 36px;
      background: var(--shape-lt)
    }

    .sh.ac {
      width: 36px;
      height: 36px;
      background: var(--accent);
      opacity: .8
    }

    .sh.sm {
      width: 28px;
      height: 28px;
      background: var(--bar-m);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--muted)
    }

    .sh.pill {
      height: 28px;
      padding: 0 12px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      display: flex;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--accent);
      letter-spacing: .5px;
    }

    .arc-wrap {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transition: opacity .4s ease;
    }

    .sc.on .arc-wrap {
      opacity: 1
    }

    .arc-svg {
      overflow: visible
    }

    .sc-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      transition: color .3s, font-weight .3s;
    }

    .sc.on .sc-val {
      color: var(--accent);
      font-weight: 600
    }

    .ins {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 18px 22px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 0;
    }

    .ins-i {
      color: var(--accent);
      font-size: 13px;
      margin-top: 3px;
      flex-shrink: 0
    }

    .ins-t {
      font-size: 14px;
      color: var(--fg);
      opacity: .85;
      line-height: 1.65;
      transition: opacity .25s, transform .25s
    }

    .ins-t.fading {
      opacity: 0;
      transform: translateY(6px)
    }
  </style>
</head>

<body>

  <div class="entry" id="app-root">

    <section aria-label="Mô phỏng border radius">
      <div class="sec-lbl">01 — Mô phỏng</div>
      <div class="sim-grid" id="simGrid"></div>
      <div class="ins">
        <i class="fa-solid fa-lightbulb ins-i"></i>
        <p class="ins-t" id="insT">Nhấn vào một mức radius để xem giải thích.</p>
      </div>
    </section>
  </div>

  <script>
    const presets = [
      {
        num: '01', name: 'Sharp', val: 0,
        ins: 'Góc vuông hoàn toàn — sắc, cứng, "tool". Thường thấy trong dashboard, data table, terminal, code editor. Mang cảm giác control và precision. Không phải là "lỗi" — là lựa chọn có chủ đích.'
      },
      {
        num: '02', name: 'Subtle', val: 4,
        ins: 'Bo rất nhẹ — vừa đủ để bớt "gai" nhưng vẫn giữ cảm giác technical. Đây là mức default của nhiều design system cho button, input, card. An toàn, không sai vibe.'
      },
      {
        num: '03', name: 'Rounded', val: 8,
        ins: 'Bo rõ — bắt đầu có cảm giác "friendly". Phổ biến cho button trên mobile, chip/tag, toast notification. Mức này là ranh giới giữa technical và casual.'
      },
      {
        num: '04', name: 'Pill', val: 16,
        ins: 'Bo lớn — mềm mại, thân thiện, "consumer app". Dùng cho pill button, avatar, badge. Nhưng dùng cho card hoặc modal → nhìn "trẻ con". Context quyết định mọi thứ.'
      }
    ];

    const simGrid = document.getElementById('simGrid');
    const insT = document.getElementById('insT');

    function arcSVG(size) {
      if (size < 1) return '';
      const s = Math.min(size, 20);
      return `<svg width="${s + 2}" height="${s + 2}" viewBox="0 0 ${s + 2} ${s + 2}" class="arc-svg">
      <line x1="1" y1="${s + 1}" x2="${s + 1}" y2="${s + 1}" stroke="rgba(207,92,38,0.3)" stroke-width="1"/>
      <line x1="${s + 1}" y1="1" x2="${s + 1}" y2="${s + 1}" stroke="rgba(207,92,38,0.3)" stroke-width="1"/>
      <path d="M 1 ${s + 1} A ${s} ${s} 0 0 1 ${s + 1} 1" fill="none" stroke="rgba(207,92,38,0.6)" stroke-width="1"/>
      <circle cx="1" cy="${s + 1}" r="2" fill="rgba(207,92,38,0.5)"/>
    </svg>`;
    }

    function renderSim() {
      simGrid.innerHTML = presets.map((p, ci) => {
        const r = p.val;
        return `
        <div class="sc" data-i="${ci}" tabindex="0" role="button">
          <div class="sc-top">
            <span class="sc-num">${p.num}</span>
            <span class="sc-tag">Radius ${r}</span>
          </div>
          <div class="sc-shapes">
            <div class="shape-row">
              <div class="sh lg" style="border-radius:${r}px;position:relative">
                ${r > 0 ? `<div class="arc-wrap" style="top:-2px;left:-2px">${arcSVG(r)}</div>` : ''}
              </div>
            </div>
            <div class="shape-row">
              <div class="sh md" style="border-radius:${r}px;position:relative">
                ${r > 0 ? `<div class="arc-wrap" style="top:-2px;left:-2px">${arcSVG(Math.min(r, 14))}</div>` : ''}
              </div>
              <div class="sh ac" style="border-radius:${r}px"></div>
              <div class="sh sm" style="border-radius:${r}px">+</div>
            </div>
            <div class="shape-row">
              <div class="sh pill" style="border-radius:${r}px">LABEL</div>
            </div>
          </div>
          <div class="sc-val">${r}px</div>
        </div>`;
      }).join('');

      simGrid.querySelectorAll('.sc').forEach(c => {
        c.onclick = () => activateCard(+c.dataset.i);
      });
    }

    let activeI = -1;
    function activateCard(i) {
      simGrid.querySelectorAll('.sc').forEach(c => c.classList.remove('on'));
      if (activeI === i) { activeI = -1; setIns('Nhấn vào một mức radius để xem giải thích.'); return; }
      activeI = i;
      simGrid.querySelector(`[data-i="${i}"]`).classList.add('on');
      setIns(presets[i].ins);
    }

    function setIns(t) {
      insT.classList.add('fading');
      setTimeout(() => { insT.textContent = t; insT.classList.remove('fading'); }, 250);
    }

    renderSim();
  </script>
</body>

</html>
