<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Radius Practice — Vibecode Glossary</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #0f0f12;
      --bg-card: #16161b;
      --fg: #e8e4dc;
      --muted: #6e6e7a;
      --accent: #e88c2e;
      --accent-soft: rgba(207, 92, 38, .12);
      --accent-border: rgba(207, 92, 38, .3);
      --border: #282830;
      --surface: #1c1c23;
      --success: #3a9e5c;
      --success-soft: rgba(58, 158, 92, .12);
      --warning: #c49030;
      --warning-soft: rgba(196, 144, 48, .1);
      --bar-d: #2a2a34;
      --bar-m: #44444f;
      --shape-lt: #33333d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Space Grotesk', sans-serif;
      min-height: auto;
      line-height: 1.6;
    }

    .entry {
      position: relative;
      z-index: 1;
      max-width: 940px;
      margin: 0 auto;
      padding: 24px 24px 40px
    }

    .th {
      margin-bottom: 28px
    }

    .badge {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      padding: 4px 12px;
      margin-bottom: 16px;
    }

    .th h1 {
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1.08
    }

    .th .sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px
    }

    .dv {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 30px
    }

    .dv::before,
    .dv::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border)
    }

    .dv span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ========== PRACTICE ========== */
    .pg {
      font-size: 15px;
      color: var(--fg);
      opacity: .8;
      margin-bottom: 22px;
      line-height: 1.6
    }

    .pg span {
      color: var(--accent);
      font-weight: 600
    }

    .ctx-r {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 26px
    }

    .ctx-b {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all .25s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctx-b:hover {
      border-color: var(--accent-border);
      color: var(--fg)
    }

    .ctx-b.on {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft)
    }

    .ctx-b .cd {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      opacity: .6
    }

    .ctx-b.on .cd {
      opacity: 1;
      color: var(--accent)
    }

    /* Slider */
    .sl-sec {
      margin-bottom: 28px
    }

    .sl-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px
    }

    .sl-lbl {
      font-size: 12px;
      color: var(--muted)
    }

    .sl-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 600;
      color: var(--accent);
      transition: color .3s;
    }

    .sl-val.ok {
      color: var(--success)
    }

    .sl-wrap {
      position: relative;
      height: 34px
    }

    .sl-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 4px;
      background: var(--border);
      z-index: 0
    }

    .sl-zone {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 4px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      z-index: 1;
      pointer-events: none;
      transition: left .4s ease, width .4s ease, background .3s, border-color .3s;
    }

    .sl-zone.hit {
      background: var(--success-soft);
      border-color: rgba(58, 158, 92, .35)
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 34px;
      background: transparent;
      outline: none;
      cursor: pointer;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: var(--accent);
      border: 2px solid var(--bg);
      margin-top: -7px;
      cursor: grab;
      transition: box-shadow .2s, background .2s;
    }

    input[type=range]::-moz-range-track {
      height: 4px;
      background: transparent;
      border: none
    }

    input[type=range]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border: 2px solid var(--bg);
      cursor: grab;
      border-radius: 0;
    }

    input[type=range].ok::-webkit-slider-thumb {
      background: var(--success);
      box-shadow: 0 0 14px rgba(58, 158, 92, .3)
    }

    input[type=range].ok::-moz-range-thumb {
      background: var(--success);
      box-shadow: 0 0 14px rgba(58, 158, 92, .3)
    }

    input[type=range]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 0
    }

    .sl-ticks {
      display: flex;
      justify-content: space-between;
      padding: 5px 0 0
    }

    .sl-ticks span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      opacity: .4
    }

    /* Preview area */
    .prev {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 40px 28px;
      margin-bottom: 18px;
      min-height: 180px;
      transition: border-color .3s;
      position: relative;
      overflow: visible;
    }

    .prev::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, .007) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .007) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
      z-index: 0;
    }

    .prev.ok-b {
      border-color: rgba(58, 158, 92, .25)
    }

    .prev-lbl {
      position: absolute;
      top: 10px;
      left: 14px;
      z-index: 2;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: .4;
    }

    /* Preview content layout */
    .prev-content {
      position: relative;
      z-index: 1
    }

    /* Main shape with corner arcs */
    .main-shape-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px
    }

    .main-shape {
      width: 200px;
      height: 80px;
      background: var(--shape-lt);
      transition: border-radius .15s ease;
    }

    @media(max-width:480px) {
      .main-shape {
        width: 160px;
        height: 64px
      }
    }

    /* Corner radius arc overlay */
    .corner-arcs {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .c-arc {
      position: absolute;
      opacity: 0;
      transition: opacity .3s ease
    }

    .c-arc.show {
      opacity: 1
    }

    .c-arc svg {
      overflow: visible
    }

    /* Secondary shapes row */
    .sec-shapes {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap
    }

    .prev-btn {
      padding: 10px 22px;
      background: var(--accent);
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      border: none;
      transition: border-radius .15s ease;
      cursor: default;
    }

    .prev-chip {
      padding: 6px 14px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: .5px;
      transition: border-radius .15s ease;
    }

    .prev-circle {
      width: 40px;
      height: 40px;
      background: var(--bar-m);
      transition: border-radius .15s ease;
    }

    .prev-input {
      width: 140px;
      height: 36px;
      background: transparent;
      border: 1px solid var(--border);
      padding: 0 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      transition: border-radius .15s ease, border-color .3s;
    }

    .prev-input::placeholder {
      color: var(--muted);
      opacity: .4
    }

    /* Radius label near shape */
    .r-label {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--accent);
      opacity: 0;
      transition: opacity .3s;
      white-space: nowrap;
    }

    .r-label.show {
      opacity: .8
    }

    /* Feedback */
    .fb {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--bg-card);
      transition: all .3s;
    }

    .fb.ok {
      border-color: rgba(58, 158, 92, .4);
      color: var(--success);
      background: var(--success-soft)
    }

    .fb.no {
      border-color: rgba(196, 144, 48, .3);
      color: var(--warning);
      background: var(--warning-soft)
    }

    .fb i {
      font-size: 11px
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      opacity: .5;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 6px
    }

    .hint i {
      font-size: 10px;
      color: var(--accent)
    }
  </style>
</head>

<body>

  <div class="entry" id="app-root">

    <section aria-label="Thực hành border radius">
      <p class="pg">
        <span>Mục tiêu:</span> Kéo slider vào vùng cam — đó là radius phù hợp cho loại element đã chọn. Chú ý xem cùng
        một giá trị radius tác động khác nhau lên mỗi loại hình.
      </p>

      <div class="ctx-r" id="ctxR"></div>

      <div class="sl-sec">
        <div class="sl-head">
          <span class="sl-lbl">border-radius</span>
          <span class="sl-val" id="sV">0px</span>
        </div>
        <div class="sl-wrap">
          <div class="sl-track"></div>
          <div class="sl-zone" id="sZ"></div>
          <input type="range" id="sR" min="0" max="40" step="1" value="0" aria-label="Điều chỉnh border-radius">
        </div>
        <div class="sl-ticks">
          <span>0</span><span>8</span><span>16</span><span>24</span><span>32</span><span>40</span>
        </div>
      </div>

      <div class="prev" id="prevBox">
        <span class="prev-lbl" id="prevLbl">BUTTON</span>
        <div class="prev-content" id="prevContent"></div>
      </div>

      <div class="fb" id="fb">
        <i class="fa-solid fa-circle-info"></i>
        <span>Chọn loại element rồi kéo slider</span>
      </div>
      <p class="hint" id="hintE">
        <i class="fa-solid fa-arrow-up-right"></i>
        Cùng giá trị radius nhưng nhìn khác nhau trên button vs card vs avatar
      </p>
    </section>
  </div>

  <script>
    /* === DỮ LIỆU === */
    const ctxs = [
      {
        id: 'button', name: 'Button', desc: 'Nút bấm', range: [6, 10],
        hint: 'Button cần bo vừa phải — đủ mềm để chạm, không quá tròn để nghiêm túc'
      },
      {
        id: 'card', name: 'Card', desc: 'Thẻ nội dung', range: [8, 14],
        hint: 'Card bo nhẹ hơn button — quá tròn nhìn như toy, quá vuông nhìn như data cell'
      },
      {
        id: 'avatar', name: 'Avatar', desc: 'Ảnh đại diện', range: [50, 50],
        hint: 'Avatar luôn là 50% (hình tròn) — đây là convention phổ biến nhất'
      },
      {
        id: 'input', name: 'Input', desc: 'Ô nhập liệu', range: [4, 8],
        hint: 'Input cần bo rất nhẹ — nó là "công cụ", không phải "nội dung"'
      },
      {
        id: 'badge', name: 'Badge', desc: 'Nhãn nhỏ', range: [12, 20],
        hint: 'Badge/Chip bo lớn hoặc pill — nhỏ mà bo ít nhìn "cứng ngắc"'
      },
      {
        id: 'modal', name: 'Modal', desc: 'Cửa sổ popup', range: [12, 18],
        hint: 'Modal bo vừa — đủ mềm để nổi lên trên nền, không quá tròn để giữ sự nghiêm túc'
      }
    ];

    /* === DOM === */
    const ctxR = document.getElementById('ctxR');
    const sR = document.getElementById('sR');
    const sV = document.getElementById('sV');
    const sZ = document.getElementById('sZ');
    const prevContent = document.getElementById('prevContent');
    const prevLbl = document.getElementById('prevLbl');
    const prevBox = document.getElementById('prevBox');
    const fb = document.getElementById('fb');
    const hintE = document.getElementById('hintE');

    let curCtx = ctxs[0];

    /* === RENDER CTX === */
    function renderCtx() {
      ctxR.innerHTML = ctxs.map((c, i) => `
      <button class="ctx-b${i === 0 ? ' on' : ''}" data-id="${c.id}" aria-pressed="${i === 0}">
        ${c.name}<span class="cd">${c.desc}</span>
      </button>`).join('');
      ctxR.querySelectorAll('.ctx-b').forEach(b => {
        b.addEventListener('click', () => pickCtx(b.dataset.id));
      });
    }

    /* === RENDER PREVIEW === */
    function renderPreview(r) {
      const id = curCtx.id;
      const rStr = id === 'avatar' ? '50%' : r + 'px';
      prevLbl.textContent = id.toUpperCase();

      let html = '';
      switch (id) {
        case 'button':
          html = `
          <div class="main-shape-wrap">
            <div class="main-shape" style="border-radius:${rStr}"></div>
            <div class="corner-arcs" id="cArcs">${renderCorners(r, 200, 80)}</div>
            <div class="r-label${r > 0 ? ' show' : ''}" id="rLabel">border-radius: ${r}px</div>
          </div>
          <div class="sec-shapes">
            <button class="prev-btn" style="border-radius:${rStr}">Submit</button>
            <button class="prev-btn" style="border-radius:${rStr};background:var(--shape-lt);color:var(--muted)">Cancel</button>
            <div class="prev-chip" style="border-radius:${rStr}">v2.0</div>
          </div>`;
          break;
        case 'card':
          html = `
          <div class="main-shape-wrap">
            <div class="main-shape" style="border-radius:${rStr};width:240px;height:100px"></div>
            <div class="corner-arcs" id="cArcs">${renderCorners(r, 240, 100)}</div>
            <div class="r-label${r > 0 ? ' show' : ''}" id="rLabel">border-radius: ${r}px</div>
          </div>
          <div class="sec-shapes">
            <div style="width:100px;height:60px;background:var(--shape-lt);border-radius:${rStr}"></div>
            <div style="width:100px;height:60px;background:var(--shape-lt);border-radius:${rStr}"></div>
          </div>`;
          break;
        case 'avatar':
          html = `
          <div style="display:flex;gap:16px;align-items:center;margin-bottom:20px">
            <div class="prev-circle" style="border-radius:${rStr};width:64px;height:64px;background:var(--bar-m)"></div>
            <div class="prev-circle" style="border-radius:${rStr};width:48px;height:48px;background:var(--bar-m)"></div>
            <div class="prev-circle" style="border-radius:${rStr};width:36px;height:36px;background:var(--bar-m)"></div>
            <div class="prev-circle" style="border-radius:${rStr};width:28px;height:28px;background:var(--bar-m)"></div>
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);opacity:.6">
            border-radius: ${rStr} — ${r >= 50 ? 'hình tròn' : 'chưa tròn'}
          </div>`;
          break;
        case 'input':
          html = `
          <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
            <div class="prev-input" style="border-radius:${rStr}" placeholder="Email address"></div>
            <div class="prev-input" style="border-radius:${rStr}" placeholder="Password"></div>
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);opacity:.6">
            border-radius: ${r}px
          </div>`;
          break;
        case 'badge':
          html = `
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
            <div class="prev-chip" style="border-radius:${rStr}">Design</div>
            <div class="prev-chip" style="border-radius:${rStr}">Marketing</div>
            <div class="prev-chip" style="border-radius:${rStr}">Engineering</div>
            <div class="prev-chip" style="border-radius:${rStr}">v3.1 Beta</div>
            <div class="prev-chip" style="border-radius:${rStr}">New</div>
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);opacity:.6">
            border-radius: ${r}px
          </div>`;
          break;
        case 'modal':
          html = `
          <div class="main-shape-wrap">
            <div class="main-shape" style="border-radius:${rStr};width:220px;height:140px"></div>
            <div class="corner-arcs" id="cArcs">${renderCorners(r, 220, 140)}</div>
            <div class="r-label${r > 0 ? ' show' : ''}" id="rLabel">border-radius: ${r}px</div>
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);opacity:.6">
            Popup / Dialog container
          </div>`;
          break;
      }
      prevContent.innerHTML = html;
    }

    /* === RENDER CORNER ARC INDICATORS === */
    function renderCorners(r, w, h) {
      if (r < 1) return '';
      const eff = Math.min(r, w / 2, h / 2);
      const s = Math.min(eff, 24);
      const corners = [
        { x: 0, y: 0, flip: 'scale(1,1)', tx: s + 3, ty: 3 },
        { x: w, y: 0, flip: 'scale(-1,1)', tx: w - s - 3, ty: 3 },
        { x: 0, y: h, flip: 'scale(1,-1)', tx: s + 3, ty: h - 3 },
        { x: w, y: h, flip: 'scale(-1,-1)', tx: w - s - 3, ty: h - 3 }
      ];
      return corners.map(c => `
      <div class="c-arc show" style="position:absolute;left:${c.tx}px;top:${c.ty}px;transform:${c.flip}">
        <svg width="${s + 2}" height="${s + 2}" viewBox="0 0 ${s + 2} ${s + 2}" overflow="visible">
          <line x1="1" y1="${s + 1}" x2="${s + 1}" y2="${s + 1}" stroke="rgba(207,92,38,0.25)" stroke-width="1"/>
          <line x1="${s + 1}" y1="1" x2="${s + 1}" y2="${s + 1}" stroke="rgba(207,92,38,0.25)" stroke-width="1"/>
          <path d="M 1 ${s + 1} A ${s} ${s} 0 0 1 ${s + 1} 1" fill="none" stroke="rgba(207,92,38,0.5)" stroke-width="1"/>
          <circle cx="1" cy="${s + 1}" r="1.5" fill="rgba(207,92,38,0.45)"/>
        </svg>
      </div>`).join('');
    }

    /* === PICK CONTEXT === */
    function pickCtx(id) {
      curCtx = ctxs.find(c => c.id === id);
      ctxR.querySelectorAll('.ctx-b').forEach(b => {
        const on = b.dataset.id === id;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on);
      });
      updateZone();
      const v = parseInt(sR.value);
      renderPreview(v);
      checkZone();
      hintE.innerHTML = `<i class="fa-solid fa-arrow-up-right"></i> ${curCtx.hint}`;
    }

    /* === ZONE === */
    function updateZone() {
      const lo = 0, hi = 40, span = hi - lo;
      const zl = curCtx.range[0], zh = curCtx.range[1];
      sZ.style.left = ((zl - lo) / span * 100) + '%';
      sZ.style.width = ((zh - zl) / span * 100) + '%';
      sZ.classList.remove('hit');
    }

    /* === CHECK ZONE === */
    function checkZone() {
      const v = parseInt(sR.value);
      const inZ = v >= curCtx.range[0] && v <= curCtx.range[1];
      sR.classList.toggle('ok', inZ);
      sV.classList.toggle('ok', inZ);
      sZ.classList.toggle('hit', inZ);
      prevBox.classList.toggle('ok-b', inZ);

      document.querySelectorAll('.c-arc path').forEach(p => {
        p.setAttribute('stroke', inZ ? 'rgba(58,158,92,0.5)' : 'rgba(207,92,38,0.5)');
      });
      document.querySelectorAll('.c-arc circle').forEach(c => {
        c.setAttribute('fill', inZ ? 'rgba(58,158,92,0.45)' : 'rgba(207,92,38,0.45)');
      });

      if (inZ) {
        fb.className = 'fb ok';
        fb.innerHTML = `<i class="fa-solid fa-check"></i><span>Phù hợp với ${curCtx.name.toLowerCase()} — đúng vibe rồi</span>`;
      } else {
        fb.className = 'fb no';
        fb.innerHTML = `<i class="fa-solid fa-xmark"></i><span>Radius này thường không dùng cho ${curCtx.name.toLowerCase()}</span>`;
      }
    }

    /* === SLIDER === */
    sR.addEventListener('input', () => {
      const v = parseInt(sR.value);
      sV.textContent = v + 'px';
      renderPreview(v);
      checkZone();
    });

    /* === INIT === */
    renderCtx();
    pickCtx('button');
    sR.value = 0;
    sV.textContent = '0px';
    renderPreview(0);
    checkZone();
  </script>
</body>

</html>
