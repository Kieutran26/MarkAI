<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Border Radius Practice — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f12;--bg-card:#16161b;--bg-el:#222;--border:#282830;
  --border-active:#e88c2e;--accent:#e88c2e;
  --accent-glow:rgba(232,140,46,.18);--accent-soft:rgba(232,140,46,.07);
  --cream:#EDE4D8;--text:#D8D0C8;--muted:#777770;
  --success:#3a9e5c;--success-soft:rgba(58,158,92,.12);
  --warning:#c49030;--warning-soft:rgba(196,144,48,.1);
  --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;z-index:0}

#app-root{position:relative;z-index:1;padding:24px 16px}

.pg{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:20px}
.pg span{color:var(--accent);font-weight:700}

.ctx-r{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.ctx-b{
  font-family:var(--sans);font-size:13px;font-weight:600;
  padding:8px 14px;border:1px solid var(--border);background:var(--bg-card);
  color:var(--muted);cursor:pointer;transition:all .25s;
}
.ctx-b:hover{border-color:var(--accent);color:var(--text)}
.ctx-b.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.sl-sec{margin-bottom:28px}
.sl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sl-lbl{font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px}
.sl-val{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--accent)}
.sl-val.ok{color:var(--success)}

.sl-wrap{position:relative;height:34px}
.sl-track{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:4px;background:var(--border)}
.sl-zone{
  position:absolute;top:50%;transform:translateY(-50%);
  height:4px;background:var(--accent-soft);border:1px solid var(--accent-border);
  z-index:1;pointer-events:none;transition:all .3s ease;
}
.sl-zone.hit{background:var(--success-soft);border-color:rgba(58,158,92,.35)}

input[type=range]{
  -webkit-appearance:none;width:100%;height:34px;background:transparent;
  outline:none;cursor:pointer;position:absolute;top:0;left:0;z-index:2;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;background:var(--accent);
  border:2px solid var(--bg);cursor:grab;
}
input[type=range].ok::-webkit-slider-thumb{background:var(--success)}

/* Preview area */
.prev-box{
  background:var(--bg-card);border:1px solid var(--border);
  padding:32px 24px;margin-bottom:18px;position:relative;
  transition:border-color .3s;
}
.prev-box.ok-b{border-color:rgba(58,158,92,.3)}

/* Element Card */
.el-card{width:280px;margin:0 auto;background:var(--bg);border:1px solid var(--border);padding:16px;transition:border-radius .2s}
.el-badge{display:inline-block;padding:2px 8px;background:var(--accent);color:#000;font-family:var(--mono);font-size:9px;font-weight:800;margin-bottom:10px;transition:border-radius .2s}
.el-h3{font-size:16px;font-weight:700;color:var(--cream);margin-bottom:4px}
.el-p{font-size:11px;color:var(--muted);line-height:1.45;margin-bottom:12px}
.el-input{width:100%;height:32px;background:var(--bg-card);border:1px solid var(--border);margin-bottom:12px;transition:border-radius .2s}
.el-btn{width:100%;height:36px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;transition:border-radius .2s}

.fb{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;border:1px solid var(--border);background:var(--bg-card)}
.fb.ok{border-color:var(--success);color:var(--success);background:var(--success-soft)}
.fb.no{border-color:var(--warning);color:var(--warning);background:var(--warning-soft)}

@media(max-width:480px){ .el-card{width:100%} }
</style>
</head>
<body>
<div id="app-root">
    <p class="pg"><span>Mục tiêu:</span> Kéo slider để điều chỉnh radius cho toàn bộ card bên dưới. Hãy tìm mức radius phù hợp cho <span>thành phần đang chọn</span>.</p>

    <div class="ctx-r" id="ctxR"></div>

    <div class="sl-sec">
      <div class="sl-head">
        <span class="sl-lbl">Border Radius</span>
        <span class="sl-val" id="sV">0px</span>
      </div>
      <div class="sl-wrap">
        <div class="sl-track"></div>
        <div class="sl-zone" id="sZ"></div>
        <input type="range" id="sR" min="0" max="40" step="1" value="0">
      </div>
    </div>

    <div class="prev-box" id="pBox">
      <div class="el-card" id="eCard">
        <div class="el-badge" id="eBadge">PROMPT</div>
        <div class="el-h3">Giao diện sạch</div>
        <div class="el-p">Mọi element đều chịu ảnh hưởng của radius.</div>
        <div class="el-input" id="eInput"></div>
        <div class="el-btn" id="eBtn">ACTION</div>
      </div>
    </div>

    <div class="fb" id="fb">Chọn một loại element để bắt đầu</div>
</div>

<script>
  const ctxs = [
    { id:'button', name:'Button', range:[6,12], hint:'Button cần bo vừa phải — thân thiện nhưng chuyên nghiệp.' },
    { id:'card', name:'Card', range:[8,16], hint:'Card thường bo nhiều hơn button một chút để tạo khối.' },
    { id:'input', name:'Input', range:[4,8], hint:'Input cần bo rất nhẹ — giữ sự ngay ngắn cho form.' },
    { id:'badge', name:'Badge', range:[16,24], hint:'Badge/Tag thường bo mạnh (pill) để tách biệt với khối.' }
  ];

  const ctxR=document.getElementById('ctxR'), sR=document.getElementById('sR'), sV=document.getElementById('sV'), sZ=document.getElementById('sZ');
  const pBox=document.getElementById('pBox'), fb=document.getElementById('fb');
  const eCard=document.getElementById('eCard'), eBadge=document.getElementById('eBadge'), eInput=document.getElementById('eInput'), eBtn=document.getElementById('eBtn');

  let curCtx = ctxs[0];

  function renderCtx(){
    ctxR.innerHTML = ctxs.map(function(c,i){
      return '<button class="ctx-b'+(i===0?' on':'')+'" data-id="'+c.id+'">'+c.name+'</button>';
    }).join('');
    ctxR.querySelectorAll('.ctx-b').forEach(function(b){
      b.onclick=function(){
        curCtx=ctxs.find(function(x){return x.id===b.dataset.id});
        ctxR.querySelectorAll('.ctx-b').forEach(function(x){x.classList.toggle('on',x===b)});
        update();
      };
    });
  }

  function update(){
    const v = parseInt(sR.value);
    sV.textContent = v + 'px';
    
    /* Update all elements radius */
    eCard.style.borderRadius = v + 'px';
    eInput.style.borderRadius = Math.min(v, 8) + 'px'; // Input usually capped
    eBtn.style.borderRadius = v + 'px';
    eBadge.style.borderRadius = v + 'px';

    /* Check zone */
    const lo=0, hi=40, span=hi-lo;
    const zl=curCtx.range[0], zh=curCtx.range[1];
    sZ.style.left = ((zl-lo)/span*100)+'%';
    sZ.style.width = ((zh-zl)/span*100)+'%';

    const inZ = v >= zl && v <= zh;
    sR.classList.toggle('ok', inZ);
    sV.classList.toggle('ok', inZ);
    sZ.classList.toggle('hit', inZ);
    pBox.classList.toggle('ok-b', inZ);

    if(inZ){
      fb.className='fb ok';
      fb.innerHTML='<strong>✓ Phù hợp!</strong> '+curCtx.hint;
    } else {
      fb.className='fb no';
      fb.innerHTML='<strong>× Chưa khớp.</strong> Kéo slider vào vùng cam của '+curCtx.name;
    }
  }

  sR.oninput = update;
  renderCtx();
  update();
</script>
</body>
</html>
