<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar Demo — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f12;--bg-card:#16161b;--bg-el:#222;--border:#282830;
  --border-active:#e88c2e;--accent:#e88c2e;
  --accent-glow:rgba(232,140,46,.18);--accent-soft:rgba(232,140,46,.07);
  --cream:#EDE4D8;--text:#D8D0C8;--muted:#777770;
  --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;z-index:0}

#app-root{position:relative;z-index:1;padding:20px 16px}

/* sim grid */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sp{
  border:1px solid var(--border);
  background:var(--bg-card);
  padding:14px 10px 12px;
  transition:all .4s cubic-bezier(0.23, 1, 0.32, 1);
  min-height:180px;
  position:relative;
  cursor:pointer;
}
.sp:hover{border-color:rgba(232,140,46,0.3);background:rgba(255,255,255,0.02)}
.sp.active{
  border-color:var(--border-active);
  background:var(--accent-soft);
  transform:scale(1.02);
  box-shadow:0 10px 30px -10px var(--accent-glow);
  z-index:10;
}
.sp:not(.active){opacity:.4}

.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sn{font-family:var(--mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);transition:color .4s}
.sp.active .sn{color:var(--accent)}
.ssub{font-size:8px;color:var(--muted);text-transform:uppercase}

/* mini layout */
.ml{display:flex;border:1px solid var(--border);height:72px;overflow:hidden;margin-bottom:10px;transition:border-color .5s;position:relative}
.sp.active .ml{border-color:rgba(232,140,46,.3)}
.ml-sb{background:var(--bg-el);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:4px 3px;gap:2px;transition:width .4s;flex-shrink:0;overflow:hidden}
.ml-sb.right{border-right:none;border-left:1px solid var(--border)}
.ml-sb-i{width:100%;height:3px;background:var(--border);transition:background .4s}
.sp.active .ml-sb-i{background:var(--muted)}
.ml-sb-i.active-i{background:var(--accent)!important}
.ml-ct{flex:1;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ml-ct-b{width:60%;height:4px;background:var(--border);transition:background .4s}
.sp.active .ml-ct-b{background:var(--muted)}
.ml-ct-b.w80{width:80%}
.ml-ct-b.w40{width:40%}
.ml-ct-chart{flex:1;background:var(--bg-el);border:1px solid var(--border);position:relative;overflow:hidden}
.ml-ct-chart::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(transparent,var(--accent-glow));opacity:.4}

/* overlay specific */
.ml-overlay .ml-sb{position:absolute;left:0;top:0;bottom:0;z-index:2;width:35%!important;box-shadow:4px 0 8px rgba(0,0,0,.4)}

/* spec */
.sspec{display:flex;flex-direction:column;gap:3px}
.ssr{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px}
.ssk{color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.ssv{font-weight:600;color:var(--cream)}
.ssv.ac{color:var(--accent)}

/* insight */
.ibar{margin-top:16px;padding:12px 14px;background:var(--bg-card);border:1px solid var(--border);font-size:12px;color:var(--muted);line-height:1.6;min-height:48px;transition:opacity .3s}
.ibar.fading{opacity:0}
.ibar strong{color:var(--cream);font-weight:600}

.ptrack{display:flex;gap:4px;padding:12px 0 10px}
.pseg{flex:1;height:3px;background:var(--border);transition:background .4s}
.pseg.on{background:var(--accent)}

@media(max-width:768px){ .sg{grid-template-columns:repeat(2,1fr)} }
@media(max-width:420px){ .sg{gap:6px} }
</style>
</head>
<body>
<div id="app-root">
    <div class="sg" id="sg"></div>
    <div class="ibar" id="ibar"></div>
    <div class="ptrack" id="ptrack"></div>
</div>

<script>
var D=[
  {name:'STATIC',sub:'always visible',
   sbW:28,sbRight:false,overlay:false,collapse:false,
   behavior:'Always visible',width:'240px',use:'Dashboard, admin',
   ins:'<strong>Static sidebar = luôn hiện, không ẩn.</strong> Content area bị sidebar "ăn" một phần width cố định. Phổ biến nhất cho dashboard, nơi user cần nav mọi lúc.'},
  {name:'COLLAPSIBLE',sub:'icon + expand',
   sbW:12,sbRight:false,overlay:false,collapse:true,
   behavior:'Icon → expand',width:'60px → 240px',use:'IDE, email, tools',
   ins:'<strong>Collapsible = mặc định chỉ hiện icon, hover/phím mở rộng.</strong> Tiết kiệm không gian nhưng vẫn giữ nav reachable. Dùng cho tool cần maximize content area.'},
  {name:'OVERLAY',sub:'off-canvas',
   sbW:35,sbRight:false,overlay:true,collapse:false,
   behavior:'Slide over content',width:'280px (overlay)',use:'Mobile, settings',
   ins:'<strong>Overlay = sidebar trượt che content, không đẩy layout.</strong> Content không đổi width, sidebar "nằm trên". Dùng cho mobile hoặc drawer tạm thời.'},
  {name:'RIGHT',sub:'contextual',
   sbW:30,sbRight:true,overlay:false,collapse:false,
   behavior:'Right side detail',width:'320px',use:'Order info, properties',
   ins:'<strong>Right sidebar = hiển thị chi tiết của item đang chọn.</strong> Không phải navigation — mà là context. Dùng cho master-detail pattern.'}
];

var sg=document.getElementById('sg');
D.forEach(function(d,i){
  var el=document.createElement('div');
  el.className='sp';el.dataset.i=i;

  var cls=d.overlay?'ml-overlay':'';
  var sbCls=d.sbRight?'ml-sb right':'ml-sb';
  var sbStyle='width:'+d.sbW+'%';

  var items='';
  for(var j=0;j<5;j++){
    var ac=j===0?'active-i':'';
    items+='<div class="ml-sb-i '+ac+'"></div>';
  }

  el.innerHTML=
    '<div class="sh"><span class="sn">'+d.name+'</span><span class="ssub">'+d.sub+'</span></div>'+
    '<div class="ml '+cls+'">'+
      '<div class="'+sbCls+'" style="'+sbStyle+'">'+items+'</div>'+
      '<div class="ml-ct">'+
        '<div class="ml-ct-b w80"></div>'+
        '<div class="ml-ct-b w40"></div>'+
        '<div class="ml-ct-chart"></div>'+
      '</div>'+
    '</div>'+
    '<div class="sspec">'+
      '<div class="ssr"><span class="ssk">Behavior</span><span class="ssv">'+d.behavior+'</span></div>'+
      '<div class="ssr"><span class="ssk">Width</span><span class="ssv ac">'+d.width+'</span></div>'+
      '<div class="ssr"><span class="ssk">Use case</span><span class="ssv">'+d.use+'</span></div>'+
    '</div>';
  sg.appendChild(el);
});

var pt=document.getElementById('ptrack');
for(var i=0;i<4;i++){var s=document.createElement('div');s.className='pseg';pt.appendChild(s)}

var cur=0,timer=null;
var ibar=document.getElementById('ibar');
var panels=sg.querySelectorAll('.sp');
var segs=pt.querySelectorAll('.pseg');

function setAct(idx){
  cur=idx;
  for(var i=0;i<panels.length;i++){
    panels[i].classList.toggle('active',i===idx);
    segs[i].classList.toggle('on',i<=idx);
  }
  ibar.classList.add('fading');
  setTimeout(function(){ibar.innerHTML=D[idx].ins;ibar.classList.remove('fading')},280);
}

function startLoop(){
  if(timer) clearInterval(timer);
  timer=setInterval(function(){setAct((cur+1)%4)},4000);
}

panels.forEach(function(p, i){
  p.onclick=function(){
    setAct(i);
    clearInterval(timer);
    timer=setInterval(function(){setAct((cur+1)%4)},6000); // Resume after manual click
  };
});

setAct(0);
startLoop();
</script>
</body>
</html>
