<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacing Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0e0e11;
    --bg-card: #17171c;
    --fg: #f0ece4;
    --muted: #6b6b78;
    --accent: #e8753a;
    --accent-light: #f4a261;
    --bar-dark: #2a2a33;
    --bar-mid: #4a4a58;
    --border: #2a2a33;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px),
      radial-gradient(circle at top right, rgba(232,117,58,0.06), transparent 35%),
      #0e0e11;
    background-size: 60px 60px, 60px 60px, auto, auto;
    color: var(--fg);
    font-family: 'Space Grotesk', sans-serif;
  }
  .shell { max-width: 980px; margin: 0 auto; padding: 28px 24px 20px; }
  h1 { text-align: center; font-size: clamp(34px, 5vw, 58px); line-height: 1.05; font-weight: 700; }
  h1 span { color: var(--accent); }
  .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
  .tab-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    transition: all .25s ease;
  }
  .tab-btn.active { border-color: var(--accent); color: var(--fg); background: rgba(232,117,58,0.1); }
  .tab-btn .num { color: var(--accent); margin-right: 6px; }
  .panel {
    margin-top: 18px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--bg-card);
    padding: 28px 30px;
    display: flex;
    gap: 38px;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,117,58,0.3), transparent);
  }
  .square {
    width: 120px;
    height: 120px;
    flex-shrink: 0;
    border-radius: 8px;
    background: repeating-linear-gradient(45deg, var(--accent), var(--accent) 4px, rgba(232,117,58,0.35) 4px, rgba(232,117,58,0.35) 8px);
    box-shadow: 0 10px 36px rgba(232,117,58,0.15);
  }
  .bars { flex: 1; min-height: 145px; display: flex; flex-direction: column; justify-content: center; }
  .bar-row { display: flex; align-items: center; gap: 16px; opacity: 0; transform: translateX(-18px); transition: all .45s ease; }
  .bar-row.visible { opacity: 1; transform: translateX(0); }
  .bar {
    height: 12px;
    border-radius: 999px;
    background: var(--bar-mid);
    transition: width .6s ease;
  }
  .bar.dark { background: var(--bar-dark); }
  .bar-label { min-width: 52px; text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--accent-light); font-size: 12px; }
  .style-info { position: absolute; left: 22px; top: 16px; display: flex; align-items: baseline; gap: 10px; z-index: 2; }
  .style-info .label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .style-info .value { color: var(--accent); font-size: 14px; font-weight: 600; }
  .indicator { position: absolute; right: 14px; top: 18px; bottom: 18px; display: flex; flex-direction: column; justify-content: space-between; }
  .indicator span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .controls { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
  .ctrl-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
  }
  .ctrl-btn i { font-size: 12px; }
  .track { width: 200px; height: 3px; align-self: center; background: var(--border); border-radius: 999px; overflow: hidden; }
  .fill { width: 0%; height: 100%; background: var(--accent); transition: width .08s linear; }
  .toast {
    position: fixed; top: 18px; right: 18px; border: 1px solid var(--border); background: var(--bg-card);
    color: var(--fg); padding: 12px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transform: translateY(-18px);
    transition: all .25s ease;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast span { color: var(--accent); font-weight: 600; }
  @media (max-width: 800px) {
    .shell { padding: 22px 16px 18px; }
    .panel { flex-direction: column; align-items: stretch; gap: 24px; padding: 22px 18px 88px; }
    .square { width: 108px; height: 108px; }
  }
</style>
</head>
<body>
<div id="app-root">
<div class="shell">
  <h1>4 Kiểu <span>Spacing</span></h1>
  <div class="tabs">
    <button class="tab-btn active" data-index="0"><span class="num">01</span>Tight</button>
    <button class="tab-btn" data-index="1"><span class="num">02</span>Comfortable</button>
    <button class="tab-btn" data-index="2"><span class="num">03</span>Loose</button>
    <button class="tab-btn" data-index="3"><span class="num">04</span>Extra Loose</button>
  </div>

  <section class="panel">
    <div class="square"></div>
    <div class="bars" id="barsArea"></div>
    <div class="indicator"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="style-info">
      <div class="label">Khoảng cách</div>
      <div class="value" id="styleValue">4 — 8px</div>
    </div>
  </section>

  <div class="controls">
    <button class="ctrl-btn" id="autoPlayBtn"><i class="fa-solid fa-play"></i>Tự động</button>
    <div class="track"><div class="fill" id="progressFill"></div></div>
    <button class="ctrl-btn" id="resetBtn"><i class="fa-solid fa-rotate-left"></i>Đặt lại</button>
  </div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
  const spacingStyles = [
    { name: 'Tight Spacing', num: '01', range: '4 — 8px', gaps: [4, 6, 4, 8, 6], barWidths: ['85%', '100%', '65%', '90%', '75%'], barColors: ['dark', 'mid', 'dark', 'mid', 'dark'], barLabels: ['4', '6', '4', '8', '6'] },
    { name: 'Comfortable Spacing', num: '02', range: '8 — 16px', gaps: [8, 12, 8, 16, 12], barWidths: ['90%', '70%', '100%', '80%', '95%'], barColors: ['mid', 'dark', 'mid', 'dark', 'mid'], barLabels: ['8', '12', '8', '16', '12'] },
    { name: 'Loose Spacing', num: '03', range: '24 — 32px', gaps: [24, 32, 24, 28, 32], barWidths: ['75%', '100%', '85%', '95%', '60%'], barColors: ['dark', 'mid', 'dark', 'mid', 'dark'], barLabels: ['24', '32', '24', '28', '32'] },
    { name: 'Extra Loose Spacing', num: '04', range: '40 — 56px', gaps: [40, 48, 40, 56, 48], barWidths: ['100%', '80%', '90%', '65%', '95%'], barColors: ['mid', 'dark', 'mid', 'dark', 'mid'], barLabels: ['40', '48', '40', '56', '48'] },
  ];

  let currentIndex = 0;
  let autoPlaying = false;
  let autoTimer = null;
  let progressTimer = null;
  let progressValue = 0;
  const AUTO_INTERVAL = 3000;

  const barsArea = document.getElementById('barsArea');
  const styleValue = document.getElementById('styleValue');
  const autoPlayBtn = document.getElementById('autoPlayBtn');
  const resetBtn = document.getElementById('resetBtn');
  const progressFill = document.getElementById('progressFill');
  const toastEl = document.getElementById('toast');
  const tabBtns = document.querySelectorAll('.tab-btn');

  function renderBars(style, animate = true) {
    barsArea.innerHTML = '';
    style.barWidths.forEach((width, index) => {
      const row = document.createElement('div');
      const marginBottom = index < style.gaps.length - 1 ? style.gaps[index] : 0;
      row.className = 'bar-row';
      row.style.marginBottom = animate ? '0px' : `${marginBottom}px`;
      row.innerHTML = `<div class="bar ${style.barColors[index]}" style="width:${animate ? '0%' : width}"></div><div class="bar-label">${style.barLabels[index]}px</div>`;
      barsArea.appendChild(row);
      if (animate) {
        setTimeout(() => {
          row.classList.add('visible');
          row.style.marginBottom = `${marginBottom}px`;
          row.querySelector('.bar').style.width = width;
        }, 60 + index * 100);
      } else {
        row.classList.add('visible');
      }
    });

    setTimeout(() => {
      styleValue.textContent = style.range;
    }, animate ? 180 : 0);
  }

  function syncTabs() {
    tabBtns.forEach((btn, index) => btn.classList.toggle('active', index === currentIndex));
  }

  function showToast(text) {
    clearTimeout(showToast.timer);
    toastEl.innerHTML = text;
    toastEl.classList.add('show');
    showToast.timer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function switchTo(index) {
    if (index === currentIndex) return;
    currentIndex = index;
    syncTabs();
    renderBars(spacingStyles[index], true);
    showToast(`<span>${spacingStyles[index].num}</span> — ${spacingStyles[index].name}`);
  }

  function stopAutoPlay() {
    autoPlaying = false;
    clearInterval(autoTimer);
    clearInterval(progressTimer);
    progressFill.style.width = '0%';
    progressValue = 0;
    autoPlayBtn.textContent = 'Tự động';
  }

  function startAutoPlay() {
    autoPlaying = true;
    autoPlayBtn.textContent = 'Tạm dừng';
    progressTimer = setInterval(() => {
      progressValue += 100 / (AUTO_INTERVAL / 30);
      progressFill.style.width = `${Math.min(progressValue, 100)}%`;
    }, 30);
    autoTimer = setInterval(() => {
      progressValue = 0;
      progressFill.style.width = '0%';
      switchTo((currentIndex + 1) % spacingStyles.length);
    }, AUTO_INTERVAL);
  }

  autoPlayBtn.addEventListener('click', () => {
    if (autoPlaying) stopAutoPlay();
    else startAutoPlay();
  });

  resetBtn.addEventListener('click', () => {
    stopAutoPlay();
    currentIndex = 0;
    syncTabs();
    renderBars(spacingStyles[0], true);
    showToast('<span>00</span> — Đã đặt lại');
  });

  tabBtns.forEach((btn) => btn.addEventListener('click', () => switchTo(Number(btn.dataset.index))));

  document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight') switchTo((currentIndex + 1) % spacingStyles.length);
    if (event.key === 'ArrowLeft') switchTo((currentIndex - 1 + spacingStyles.length) % spacingStyles.length);
  });

  syncTabs();
  renderBars(spacingStyles[0], false);
  setTimeout(() => renderBars(spacingStyles[0], true), 500);
</script>
</body>
</html>
