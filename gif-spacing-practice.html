<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacing Practice — Vibecode Glossary</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg: #101010;
      --bgc: #181818;
      --bgi: #131313;
      --bd: #272727;
      --tx: #e0e0e0;
      --txm: #707070;
      --txd: #3a3a3a;
      --ac: #E88C2E;
      --acl: #f59e0b;
      --abg: rgba(232, 140, 46, .08);
      --abg2: rgba(232, 140, 46, .18);
      --success: #3a9e5c;
      --success-soft: rgba(58, 158, 92, .12);
      --warning: #c49030;
      --warning-soft: rgba(196, 144, 48, .1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--bg);
      background-image:
        linear-gradient(rgba(255, 255, 255, .018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .018) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--tx);
      padding: 20px 16px;
    }

    .pra {
      max-width: 940px;
      margin: 0 auto;
      background: var(--bgc);
      border: 1px solid var(--bd);
      border-radius: 3px;
      padding: 22px;
    }

    .ch {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .ch .n {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--ac);
      background: var(--abg);
      border: 1px solid var(--abg2);
      padding: 1px 6px;
      border-radius: 2px;
    }

    .ch h2 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.3px;
      text-transform: uppercase;
    }

    .pra-goal {
      font-size: 12.5px;
      color: var(--txm);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .pra-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
    }

    @media(max-width: 800px) {
      .pra-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Control Panel */
    .ctrl-group {
      margin-bottom: 24px;
    }

    .ctrl-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--txd);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 12px;
      display: block;
    }

    .ctx-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 10px 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--bd);
      background: var(--bgi);
      color: var(--txm);
      border-radius: 2px;
      cursor: pointer;
      transition: all .2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn:hover {
      border-color: var(--ac);
      color: var(--tx);
    }

    .btn.active {
      border-color: var(--ac);
      background: var(--abg);
      color: var(--ac);
      font-weight: 600;
    }

    .btn .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      opacity: .6;
    }

    /* Slider */
    .sl-wrap {
      position: relative;
      height: 32px;
      margin-bottom: 10px;
    }

    .sl-track {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: var(--bd);
    }

    .sl-zone {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 3px;
      background: var(--abg2);
      border: 1px solid var(--ac);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .sl-zone.hit {
      background: var(--success-soft);
      border-color: var(--success);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 32px;
      background: transparent;
      outline: none;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: var(--ac);
      border: 2px solid var(--bg);
      cursor: grab;
    }

    .sl-info {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--txm);
    }

    .val-cur {
      color: var(--ac);
      font-weight: 700;
      font-size: 14px;
    }

    /* Preview Area */
    .preview-box {
      background: #000;
      border: 1px solid var(--bd);
      border-radius: 3px;
      min-height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    .preview-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, .03) 1px, transparent 1px);
      background-size: 16px 16px;
      pointer-events: none;
    }

    .prev-lbl {
      position: absolute;
      top: 10px;
      left: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--txd);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .content-canvas {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Components */
    .mock-btn {
      display: flex;
      align-items: center;
      background: var(--ac);
      color: #fff;
      padding: 10px 20px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 14px;
    }

    .mock-card {
      width: 240px;
      background: var(--bgi);
      border: 1px solid var(--bd);
      border-radius: 8px;
      position: relative;
    }

    .mock-list {
      width: 220px;
      display: flex;
      flex-direction: column;
    }

    .mock-item {
      height: 36px;
      background: var(--bgi);
      border: 1px solid var(--bd);
      border-radius: 4px;
    }

    .mock-sec {
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .mock-block {
      height: 50px;
      background: var(--bgi);
      border: 1px solid var(--bd);
      display: flex;
      align-items: center;
      padding-left: 12px;
      color: var(--txd);
      font-size: 11px;
      text-transform: uppercase;
    }

    /* Indicators */
    .ind {
      background: rgba(232, 140, 46, 0.15);
      border: 1px dashed var(--ac);
      position: relative;
      transition: all 0.2s;
    }

    .ind-val {
      position: absolute;
      background: var(--bg);
      border: 1px solid var(--ac);
      color: var(--ac);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      padding: 1px 3px;
      pointer-events: none;
      z-index: 5;
    }

    /* Prompt Box */
    .pr-box {
      background: var(--bgi);
      border: 1px solid var(--bd);
      border-radius: 3px;
      padding: 14px;
      margin-top: 18px;
    }

    .pr-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--txd);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .pr-txt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--ac);
      line-height: 1.6;
    }

    .fb {
      margin-top: 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fb.ok {
      color: var(--success);
    }

    .fb.no {
      color: var(--warning);
    }
  </style>
</head>

<body>

  <section class="pra">
    <div class="ch"><span class="n">PRACTICE</span>
      <h2>Spacing Laboratory</h2>
    </div>
    <p class="pra-goal">Thực hành tinh chỉnh khoảng cách cho các thành phần UI khác nhau. Chọn một loại component và kéo slider để cảm nhận "vibe".</p>

    <div class="pra-grid">
      <!-- Controls -->
      <div>
        <div class="ctrl-group">
          <span class="ctrl-label">Chọn thành phần (Context)</span>
          <div class="ctx-list" id="ctxList"></div>
        </div>

        <div class="ctrl-group">
          <div class="sl-info">
            <span class="ctrl-label">Giá trị (Value)</span>
            <span class="val-cur" id="valCur">0px</span>
          </div>
          <div class="sl-wrap">
            <div class="sl-track"></div>
            <div class="sl-zone" id="slZone"></div>
            <input type="range" id="slRange" min="0" max="80" value="0">
          </div>
          <div class="sl-info">
            <span>0px</span>
            <span>40px</span>
            <span>80px</span>
          </div>
        </div>

        <div class="fb" id="fb"></div>
      </div>

      <!-- Preview -->
      <div>
        <div class="preview-box">
          <span class="prev-lbl" id="prevLbl">PREVIEW</span>
          <div class="content-canvas" id="canvas"></div>
        </div>

        <div class="pr-box">
          <span class="pr-label">Vibecode Prompt</span>
          <div class="pr-txt" id="promptTxt"></div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const ctxs = [
      { id: 'button', name: 'Button', tag: 'Gap', range: [4, 10], hint: 'Khoảng cách icon & text' },
      { id: 'card', name: 'Card', tag: 'Padding', range: [16, 24], hint: 'Khoảng thở trong card' },
      { id: 'list', name: 'List Items', tag: 'Gap', range: [8, 16], hint: 'Khoảng cách danh sách' },
      { id: 'section', name: 'Section', tag: 'Margin', range: [48, 72], hint: 'Khoảng cách giữa các khối' }
    ];

    const ctxList = document.getElementById('ctxList');
    const slRange = document.getElementById('slRange');
    const slZone = document.getElementById('slZone');
    const valCur = document.getElementById('valCur');
    const canvas = document.getElementById('canvas');
    const prevLbl = document.getElementById('prevLbl');
    const promptTxt = document.getElementById('promptTxt');
    const fb = document.getElementById('fb');

    let cur = ctxs[0];

    function renderCtx() {
      ctxList.innerHTML = ctxs.map(c => `
        <button class="btn ${c.id === cur.id ? 'active' : ''}" data-id="${c.id}">
          ${c.name} <span class="tag">${c.tag}</span>
        </button>
      `).join('');
      
      ctxList.querySelectorAll('.btn').forEach(b => {
        b.addEventListener('click', () => {
          cur = ctxs.find(x => x.id === b.dataset.id);
          renderCtx();
          update();
        });
      });
    }

    function update() {
      const v = parseInt(slRange.value);
      valCur.innerText = v + 'px';
      prevLbl.innerText = cur.name.toUpperCase();
      
      // Update Zone
      const min = 0, max = 80;
      const left = (cur.range[0] / max) * 100;
      const width = ((cur.range[1] - cur.range[0]) / max) * 100;
      slZone.style.left = left + '%';
      slZone.style.width = width + '%';
      
      const isOk = v >= cur.range[0] && v <= cur.range[1];
      slZone.classList.toggle('hit', isOk);
      
      // Feedback
      if (isOk) {
        fb.innerHTML = `<i class="fa-solid fa-check-circle"></i> Khoảng cách lý tưởng cho ${cur.name.toLowerCase()}`;
        fb.className = 'fb ok';
      } else {
        fb.innerHTML = `<i class="fa-solid fa-circle-info"></i> ${v < cur.range[0] ? 'Hơi chật chội' : 'Hơi loãng'}`;
        fb.className = 'fb no';
      }

      // Prompt
      promptTxt.innerText = `Chỉnh ${cur.tag.toLowerCase()} của ${cur.name.toLowerCase()} thành ${v}px để giao diện trông ${isOk ? 'chuyên nghiệp' : 'phù hợp'} hơn.`;

      // Canvas
      let html = '';
      switch(cur.id) {
        case 'button':
          html = `
            <div class="mock-btn">
              <i class="fa-solid fa-bolt"></i>
              <div class="ind" style="width:${v}px;height:12px;margin:0 2px">
                ${v > 0 ? `<div class="ind-val" style="top:-18px;left:50%;transform:translateX(-50%)">${v}</div>` : ''}
              </div>
              <span>Action</span>
            </div>`;
          break;
        case 'card':
          html = `
            <div class="mock-card" style="padding:${v}px">
              <div style="height:14px;background:var(--txd);width:40%;margin-bottom:12px"></div>
              <div style="height:8px;background:var(--txm);width:90%;margin-bottom:6px;opacity:.3"></div>
              <div style="height:8px;background:var(--txm);width:100%;opacity:.3"></div>
              <!-- Indicators -->
              <div class="ind" style="position:absolute;top:0;left:0;width:100%;height:${v}px;border-bottom:none;border-left:none;border-right:none"></div>
              <div class="ind" style="position:absolute;bottom:0;left:0;width:100%;height:${v}px;border-top:none;border-left:none;border-right:none"></div>
              <div class="ind" style="position:absolute;top:0;left:0;height:100%;width:${v}px;border-right:none;border-top:none;border-bottom:none"></div>
              <div class="ind" style="position:absolute;top:0;right:0;height:100%;width:${v}px;border-left:none;border-top:none;border-bottom:none"></div>
            </div>`;
          break;
        case 'list':
          html = `
            <div class="mock-list">
              <div class="mock-item"></div>
              <div class="ind" style="height:${v}px;width:100%">
                 ${v > 10 ? `<div class="ind-val" style="right:-30px;top:50%;transform:translateY(-50%)">${v}</div>` : ''}
              </div>
              <div class="mock-item"></div>
              <div class="ind" style="height:${v}px;width:100%"></div>
              <div class="mock-item"></div>
            </div>`;
          break;
        case 'section':
          html = `
            <div class="mock-sec">
              <div class="mock-block">Section A</div>
              <div class="ind" style="height:${v}px;width:100%">
                ${v > 20 ? `<div class="ind-val" style="right:10px;top:50%;transform:translateY(-50%)">${v}px margin</div>` : ''}
              </div>
              <div class="mock-block">Section B</div>
            </div>`;
          break;
      }
      canvas.innerHTML = html;
    }

    slRange.addEventListener('input', update);
    renderCtx();
    update();
  </script>
</body>

</html>
