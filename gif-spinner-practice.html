<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spinner Practice</title>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --bg2: #131315;
      --fg: #ece8e1;
      --muted: #706b64;
      --accent: #e88c2e;
      --card: #1a1a1e;
      --border: #26262a;
      --mono: 'Space Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: radial-gradient(rgba(255, 255, 255, .01) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .wrap {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 20px
    }

    .hd-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px
    }

    .stag {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(207, 92, 39, .35);
      display: inline-block;
      padding: 1px 6px
    }

    .sdesc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
      line-height: 1.55
    }

    /* Spinner animation */
    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .sp {
      border-radius: 50%;
      animation: spin .8s linear infinite;
      border-style: solid;
      border-color: rgba(255, 255, 255, .1);
      border-top-color: var(--accent);
      flex-shrink: 0
    }

    .sp-sm {
      width: 16px;
      height: 16px;
      border-width: 2px
    }

    .sp-xl {
      width: 40px;
      height: 40px;
      border-width: 3.5px
    }

    /* State buttons */
    .sb-group {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      width: fit-content;
      background: var(--bg)
    }

    .sb-btn {
      padding: 6px 12px;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .12em;
      text-transform: uppercase;
      background: none;
      border: none;
      cursor: pointer;
      transition: all .2s;
      color: var(--muted);
      border-right: 1px solid var(--border)
    }

    .sb-btn:last-child {
      border-right: none
    }

    .sb-btn:hover {
      background: rgba(255, 255, 255, .02);
      color: var(--fg)
    }

    .sb-btn.on {
      background: rgba(207, 92, 39, .1);
      color: var(--accent)
    }

    /* Mock card */
    .mc {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, .02);
      width: 100%
    }

    .mc-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .01)
    }

    .mc-title {
      font-size: 12px;
      font-weight: 600
    }

    .mc-status {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .08em;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid transparent
    }

    .mc-status.idle {
      color: var(--muted);
      background: rgba(255, 255, 255, .03);
      border-color: var(--border)
    }

    .mc-status.loading {
      color: var(--accent);
      background: rgba(207, 92, 39, .08);
      border-color: rgba(207, 92, 39, .2)
    }

    .mc-status.loaded {
      color: #4a9a6a;
      background: rgba(74, 154, 106, .08);
      border-color: rgba(74, 154, 106, .2)
    }

    .mc-status.error {
      color: #9a5a5a;
      background: rgba(154, 90, 90, .08);
      border-color: rgba(154, 90, 90, .2)
    }

    .mc-body {
      padding: 24px 14px;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .mc-idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-align: center
    }

    .mc-idle-icon {
      font-size: 24px;
      opacity: .2
    }

    .mc-idle-txt {
      font-size: 11px
    }

    .mc-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px
    }

    .mc-loading-txt {
      font-size: 11px;
      color: var(--muted)
    }

    .mc-loaded {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%
    }

    .mc-loaded-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0
    }

    .mc-loaded-row:not(:last-child) {
      border-bottom: 1px solid var(--border)
    }

    .mc-loaded-lbl {
      font-size: 10px;
      color: var(--muted)
    }

    .mc-loaded-val {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--fg)
    }

    .mc-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center
    }

    .mc-error-icon {
      font-size: 24px;
      color: #9a5a5a;
      font-weight: 700
    }

    .mc-error-txt {
      font-size: 11px;
      color: var(--muted)
    }

    .mc-error-hint {
      font-family: var(--mono);
      font-size: 8px;
      color: rgba(255, 255, 255, .2)
    }

    .mc-foot {
      display: flex;
      justify-content: flex-end;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      gap: 6px;
      background: rgba(255, 255, 255, .01)
    }

    .mc-fbtn {
      padding: 6px 16px;
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .08em;
      border: none;
      cursor: pointer;
      transition: all .2s
    }

    .mc-fbtn.pri {
      background: var(--accent);
      color: #000
    }

    .mc-fbtn.sec {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted)
    }

    .mc-fbtn:hover:not(:disabled) {
      filter: brightness(1.1)
    }

    .mc-fbtn:disabled {
      opacity: .3;
      cursor: default
    }

    .fb {
      margin-top: 16px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      line-height: 1.7;
      min-height: 36px;
      border-left: 2px solid var(--border);
      padding-left: 12px
    }

    .fb em {
      color: var(--fg);
      font-style: normal
    }

    .fb .w {
      color: var(--accent)
    }

    @media(max-width:480px) {
      .wrap {
        padding: 16px
      }

      .sb-btn {
        padding: 6px 10px;
        font-size: 8px
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="hd-row">
      <span class="stag">thực hành</span>
    </div>
    <p class="sdesc"><strong>Chuyển qua 4 trạng thái</strong> để thấy spinner xuất hiện và biến mất trong luồng công
      việc thực tế.</p>

    <div class="sb-group" id="sbGroup">
      <button class="sb-btn on" data-s="idle">IDLE</button>
      <button class="sb-btn" data-s="loading">LOADING</button>
      <button class="sb-btn" data-s="loaded">LOADED</button>
      <button class="sb-btn" data-s="error">ERROR</button>
    </div>

    <div class="mc">
      <div class="mc-hdr">
        <div class="mc-title">Revenue Report</div>
        <div class="mc-status idle" id="mcStatus">
          <span id="mcStatusIcon"></span>
          <span id="mcStatusTxt">IDLE</span>
        </div>
      </div>
      <div class="mc-body" id="mcBody"></div>
      <div class="mc-foot">
        <button class="mc-fbtn sec" id="mcCancel" disabled>CANCEL</button>
        <button class="mc-fbtn pri" id="mcAction">LOAD DATA</button>
      </div>
    </div>

    <div class="fb" id="pfb"></div>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    const STATE_CONTENT = {
      idle: `
    <div class="mc-idle">
      <div class="mc-idle-icon">□</div>
      <div class="mc-idle-txt">No data loaded yet</div>
    </div>`,
      loading: `
    <div class="mc-loading">
      <div class="sp sp-xl"></div>
      <div class="mc-loading-txt">Fetching revenue data...</div>
    </div>`,
      loaded: `
    <div class="mc-loaded">
      <div class="mc-loaded-row"><span class="mc-loaded-lbl">Total Revenue</span><span class="mc-loaded-val">$24,780.00</span></div>
      <div class="mc-loaded-row"><span class="mc-loaded-lbl">This Month</span><span class="mc-loaded-val" style="color:#4a9a6a">+12.5%</span></div>
      <div class="mc-loaded-row"><span class="mc-loaded-lbl">Transactions</span><span class="mc-loaded-val">1,204</span></div>
      <div class="mc-loaded-row"><span class="mc-loaded-lbl">Avg. Order Value</span><span class="mc-loaded-val">$20.58</span></div>
      <div class="mc-loaded-row"><span class="mc-loaded-lbl">Top Channel</span><span class="mc-loaded-val">Organic Search</span></div>
    </div>`,
      error: `
    <div class="mc-error">
      <div class="mc-error-icon">!</div>
      <div class="mc-error-txt">Failed to load data</div>
      <div class="mc-error-hint">Check your connection and try again.</div>
    </div>`
    };

    let currentState = 'idle';

    function applyState(s) {
      currentState = s;
      document.querySelectorAll('#sbGroup .sb-btn').forEach(b => b.classList.toggle('on', b.dataset.s === s));

      const status = $('mcStatus');
      status.className = 'mc-status ' + s;
      $('mcStatusTxt').textContent = s.toUpperCase();

      const icon = $('mcStatusIcon');
      if (s === 'idle') { icon.innerHTML = ''; icon.className = '' }
      else if (s === 'loading') { icon.innerHTML = '<div class="sp sp-sm"></div>'; icon.className = '' }
      else if (s === 'loaded') { icon.innerHTML = '✓'; icon.className = '' }
      else { icon.innerHTML = '!'; icon.className = '' }

      $('mcBody').innerHTML = STATE_CONTENT[s];

      const action = $('mcAction'), cancel = $('mcCancel');
      if (s === 'idle') {
        action.textContent = 'LOAD DATA'; action.disabled = false;
        cancel.disabled = true;
      } else if (s === 'loading') {
        action.textContent = 'LOADING...'; action.disabled = true;
        cancel.disabled = false;
      } else if (s === 'loaded') {
        action.textContent = 'REFRESH'; action.disabled = false;
        cancel.disabled = true;
      } else {
        action.textContent = 'RETRY'; action.disabled = false;
        cancel.disabled = true;
      }
      updateFB(s);
    }

    function updateFB(s) {
      const fb = $('pfb');
      const lines = [];
      if (s === 'idle') {
        lines.push('<em>Idle</em> — Chưa có gì xảy ra. Nhấn "LOAD DATA" để bắt đầu.');
      } else if (s === 'loading') {
        lines.push('<em>Loading</em> — Spinner xuất hiện, thay thế nội dung. Nút bấm bị <span class="w">disabled</span> để tránh gửi request trùng.');
      } else if (s === 'loaded') {
        lines.push('<em>Loaded</em> — Dữ liệu đã tải xong. Spinner biến mất để nhường chỗ cho thông tin thực tế.');
      } else {
        lines.push('<em>Error</em> — Lỗi xảy ra. Luôn cần có thông báo lỗi thay vì để spinner quay vô hạn.');
      }
      fb.innerHTML = lines.join(' ');
    }

    document.querySelectorAll('#sbGroup .sb-btn').forEach(b => b.addEventListener('click', () => applyState(b.dataset.s)));

    $('mcAction').addEventListener('click', () => {
      if (currentState === 'idle' || currentState === 'error' || currentState === 'loaded') {
        applyState('loading');
        setTimeout(() => {
          if (currentState === 'loading') {
            if (Math.random() > .2) applyState('loaded');
            else applyState('error');
          }
        }, 2000);
      }
    });

    $('mcCancel').addEventListener('click', () => applyState('idle'));

    applyState('idle');
  </script>
</body>

</html>
