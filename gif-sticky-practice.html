<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sticky Strategist — Vibecode</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f0f12;
  --card-bg: #16161b;
  --accent: #E88C2E;
  --text: #e8e4dc;
  --text-muted: #707070;
  --border: #282830;
  --success: #50fa7b;
  --error: #ff5555;
  --font-main: 'Space Grotesk', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-main);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding: 24px;
  display: flex;
  justify-content: center;
}

.w {
  width: 100%;
  max-width: 940px;
}

.header {
  border-left: 2px solid var(--accent);
  padding-left: 16px;
  margin-bottom: 32px;
}

.header h1 {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 2px;
  font-weight: 700;
}

.header p {
  font-size: 14px;
  color: var(--text-muted);
  margin-top: 6px;
}

.game-container {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 24px;
}

@media (max-width: 850px) {
  .game-container { grid-template-columns: 1fr; }
}

/* Sidebar: Scenarios */
.scenarios-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.scenario-item {
  background: var(--card-bg);
  border: 1px solid var(--border);
  padding: 18px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.scenario-item:hover {
  border-color: #444;
  transform: translateX(4px);
}

.scenario-item.active {
  border-color: var(--accent);
  background: rgba(232, 140, 46, 0.04);
}

.scenario-item.completed {
  border-color: var(--success);
}

.scenario-item.completed::after {
  content: '✓';
  position: absolute;
  top: 12px;
  right: 12px;
  color: var(--success);
  font-weight: 700;
  font-size: 14px;
}

.scenario-title {
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
}

.scenario-brief {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Main Panel */
.main-panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.main-panel::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: var(--accent);
  z-index: 10;
}

.viewport-wrapper {
  flex: 1;
  min-height: 280px;
  background: #0d0d10;
  padding: 20px;
  border-bottom: 1px solid var(--border);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.viewport-label {
  position: absolute;
  top: 12px;
  left: 16px;
  font-family: var(--font-mono);
  font-size: 8px;
  color: #444;
  text-transform: uppercase;
  z-index: 20;
}

.preview-viewport {
  width: 220px;
  height: 240px;
  background: #000;
  border: 1px solid #222;
  border-radius: 4px;
  overflow-y: auto;
  scrollbar-width: none;
  position: relative;
}
.preview-viewport::-webkit-scrollbar { display: none; }

.scroll-hint {
  position: absolute;
  bottom: 30px;
  right: 30px;
  font-size: 8px;
  color: #444;
  font-family: var(--font-mono);
  pointer-events: none;
}

/* Components for Preview */
.mock-nav { height: 24px; background: var(--accent); color: #000; font-weight: 700; font-size: 8px; display: flex; align-items: center; padding: 0 8px; width: 100%; }
.mock-subnav { height: 18px; background: #1a1a20; border-bottom: 1px solid #222; display: flex; align-items: center; padding: 0 8px; gap: 6px; font-size: 6px; color: #666; width: 100%; }
.mock-content { padding: 8px; display: flex; gap: 8px; }
.mock-main { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.mock-box { height: 30px; background: #1c1c22; border: 1px solid #222; border-radius: 2px; }
.mock-sidebar { width: 40px; height: 80px; background: #131318; border: 1px dashed var(--accent); border-radius: 2px; }
.mock-footer { height: 30px; background: #1a1a20; border-top: 1px solid var(--accent); display: flex; align-items: center; padding: 0 6px; width: 100%; }
.cta-btn { width: 100%; height: 16px; background: var(--accent); border-radius: 1px; }

.section-header { background: #2a2a30; border-bottom: 1px solid #444; padding: 2px 8px; font-size: 6px; color: var(--accent); font-family: var(--font-mono); }
.section-content { height: 60px; padding: 6px; }

/* Interaction Area */
.actions-panel { padding: 24px; }
.panel-title { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
.options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

.choice-btn {
  background: #1e1e24;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 12px 16px;
  text-align: left;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}

.choice-btn:hover:not(.disabled) { border-color: #555; color: var(--text); background: #25252d; }
.choice-btn.selected { background: rgba(232, 140, 46, 0.1); border-color: var(--accent); color: var(--accent); }
.choice-btn strong { display: block; font-size: 13px; margin-bottom: 2px; }
.choice-btn span { font-size: 10px; opacity: 0.6; }

/* Status & Feedback */
.status-area { padding: 16px 24px; font-size: 13px; line-height: 1.6; border-top: 1px solid var(--border); min-height: 80px; display: flex; align-items: center; background: #121217; }
.status-area.correct { color: var(--success); border-top-color: var(--success); }
.status-area.wrong { color: var(--error); border-top-color: var(--error); }

.progress-track { height: 4px; background: #222; border-radius: 2px; margin-top: 32px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); box-shadow: 0 0 10px var(--accent); }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: fadeInUp 0.4s ease forwards; }

/* Hint Badge */
.btn-hint {
  position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #fff; font-family: var(--font-mono); font-size: 8px; padding: 2px 6px; border-radius: 2px; white-space: nowrap; pointer-events: none; animation: pulseHint 2s infinite; z-index: 999;
}
.btn-hint::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 4px solid var(--accent); }
@keyframes pulseHint { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.1); } 100% { transform: translateX(-50%) scale(1); } }
</style>
</head>
<body>

<div class="w">
  <div class="header">
    <h1>Sticky Strategist</h1>
    <p>Giải quyết các thách thức về bố cục bằng cách áp dụng các kỹ thuật Sticky phù hợp.</p>
  </div>

  <div class="game-container">
    <div class="scenarios-list" id="scenarios-root"></div>

    <div class="main-panel">
      <div class="viewport-wrapper">
        <div class="viewport-label">Interaction Stage</div>
        <div class="preview-viewport" id="vp">
           <div style="padding: 20px; color: #444; font-size: 10px; font-family: var(--font-mono); text-align: center;">[ Chọn kịch bản để bắt đầu ]</div>
        </div>
        <div id="context-hint" style="margin-top: 16px; font-size: 11px; color: var(--text-muted); text-align: center; max-width: 300px; font-style: italic;"></div>
        <div class="scroll-hint">SCROLL PREVIEW ↓</div>
      </div>

      <div class="actions-panel">
        <div class="panel-title">Chọn giải pháp Sticky:</div>
        <div class="options-grid">
          <button class="choice-btn" data-variant="header">
            <strong>Sticky Header</strong>
            <span>Dính ở trên cùng (Top)</span>
          </button>
          <button class="choice-btn" data-variant="sidebar">
            <strong>Sticky Sidebar</strong>
            <span>Dính bên cạnh nội dung</span>
          </button>
          <button class="choice-btn" data-variant="footer">
            <strong>Sticky Footer</strong>
            <span>Dính ở dưới cùng (Bottom)</span>
          </button>
          <button class="choice-btn" data-variant="stacking">
            <strong>Stacking Sections</strong>
            <span>Xếp chồng nhiều tiêu đề</span>
          </button>
        </div>
      </div>

      <div class="status-area" id="feedback-log">
        Vui lòng chọn một kịch bản giao diện bên trái để bắt đầu bài thực hành.
      </div>
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-bar" id="progress-indicator"></div>
  </div>

  <div style="margin-top: 16px; display: flex; justify-content: flex-start;">
    <button id="reset-game" style="background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-family: var(--font-main); font-size: 10px; padding: 4px 12px; cursor: pointer; border-radius: 2px;">LÀM LẠI</button>
  </div>
</div>

<script>
const data = [
  {
    id: 's1',
    title: "Blog & Mục lục",
    brief: "Người dùng đọc bài blog dài và cần luôn thấy mục lục (Table of Contents) để chuyển phần nhanh.",
    target: "sidebar",
    hint: "Thành phần này nằm bên phải nội dung và nên 'đi theo' người dùng khi họ cuộn xuống.",
    correctLog: "<strong>Chính xác!</strong> Sticky Sidebar giúp giữ các thông tin bổ trợ luôn trong tầm mắt khi nội dung chính quá dài."
  },
  {
    id: 's2',
    title: "Trang sản phẩm Mobile",
    brief: "Trên màn hình điện thoại hẹp, nút 'Thêm vào giỏ hàng' phải luôn xuất hiện để người dùng mua bất cứ lúc nào.",
    target: "footer",
    hint: "Hãy đặt nó ở vị trí dễ bấm nhất bằng ngón cái — ngay sát cạnh dưới màn hình.",
    correctLog: "<strong>Đúng rồi!</strong> Sticky Footer (Action Bar) là chìa khóa để tăng tỉ lệ chuyển đổi trên thiết bị di động."
  },
  {
    id: 's3',
    title: "Danh sách Email",
    brief: "Ứng dụng Mail cần hiển thị các tiêu đề nhóm như 'Hôm nay', 'Hôm qua' đẩy nhau đi khi cuộn.",
    target: "stacking",
    hint: "Mỗi phần nội dung có một tiêu đề riêng, và tiêu đề mới sẽ thay thế tiêu đề cũ ở đỉnh khung nhìn.",
    correctLog: "<strong>Tuyệt vời!</strong> Stacking Sections giúp phân loại dữ liệu cực kỳ rõ ràng trong các danh sách dài."
  },
  {
    id: 's4',
    title: "Website Doanh nghiệp",
    brief: "Logo và thanh menu chính cần được truy cập tức thì mà không yêu cầu người dùng cuộn ngược lên.",
    target: "header",
    hint: "Đây là vị trí truyền thống nhất cho Sticky — ngay đỉnh của trang web.",
    correctLog: "<strong>Chuẩn xác!</strong> Sticky Header là tiêu chuẩn UX cho các trang web hiện đại để cải thiện khả năng điều hướng."
  }
];

let activeIdx = -1;
let solved = new Set();

const root = document.getElementById('scenarios-root');
const vp = document.getElementById('vp');
const hint = document.getElementById('context-hint');
const log = document.getElementById('feedback-log');
const progress = document.getElementById('progress-indicator');

function renderList() {
  root.innerHTML = '';
  data.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = `scenario-item ${activeIdx === i ? 'active' : ''} ${solved.has(i) ? 'completed' : ''}`;
    
    let hintHtml = '';
    if (i === 0 && activeIdx === -1) {
      hintHtml = '<div class="btn-hint" id="first-hint">Bắt đầu tại đây</div>';
    }
    
    div.innerHTML = `
      ${hintHtml}
      <div class="scenario-title">${s.title}</div>
      <div class="scenario-brief">${s.brief}</div>
    `;
    div.onclick = () => {
      const h = document.getElementById('first-hint');
      if (h) h.style.display = 'none';
      selectScenario(i);
    };
    root.appendChild(div);
  });
}

function selectScenario(index) {
  activeIdx = index;
  const s = data[index];
  renderList();
  
  vp.innerHTML = `<div style="padding: 20px; color: #666; font-family: var(--font-mono); font-size: 10px; text-align: center;">[ Stage Ready: ${s.title} ]</div>`;
  hint.textContent = `Gợi ý: ${s.hint}`;
  log.className = 'status-area';
  log.innerHTML = `Kịch bản: <strong>${s.title}</strong>. Hãy chọn giải pháp Sticky tối ưu nhất.`;
  
  document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
  vp.scrollTop = 0;
}

document.querySelectorAll('.choice-btn').forEach(btn => {
  btn.onclick = () => {
    if (activeIdx === -1) return;
    
    const variant = btn.dataset.variant;
    const s = data[activeIdx];
    
    document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    
    renderPreview(variant);
    
    if (variant === s.target) {
      log.className = 'status-area correct animate-in';
      log.innerHTML = s.correctLog;
      solved.add(activeIdx);
      updateProgress();
      renderList();
    } else {
      log.className = 'status-area wrong animate-in';
      log.innerHTML = "Giải pháp này có thể hoạt động nhưng không phải là lựa chọn tối ưu cho kịch bản này. Hãy thử lại!";
    }
  };
});

function renderPreview(variant) {
  let html = '';
  const isSticky = (v) => variant === v ? 'position: sticky;' : 'position: static;';

  if (variant === 'stacking') {
    html = `
      <div style="height: 600px;">
        <div style="${isSticky('stacking')} top: 0;" class="section-header">TODAY</div>
        <div class="section-content"><div class="mock-box"></div></div>
        <div style="${isSticky('stacking')} top: 0;" class="section-header">YESTERDAY</div>
        <div class="section-content"><div class="mock-box"></div></div>
        <div style="${isSticky('stacking')} top: 0;" class="section-header">LAST WEEK</div>
        <div class="section-content"><div class="mock-box"></div></div>
      </div>
    `;
  } else {
    html = `
      <div class="mock-nav" style="${isSticky('header')} top: 0;">NAVBAR</div>
      <div class="mock-content">
        <div class="mock-main">
          <div class="mock-box" style="height: 100px"></div>
          <div class="mock-box"></div>
          <div class="mock-box"></div>
          <div class="mock-box"></div>
          <div class="mock-box"></div>
        </div>
        <div class="mock-sidebar" style="${isSticky('sidebar')} top: 8px;"></div>
      </div>
      <div class="mock-footer" style="${isSticky('footer')} bottom: 0;">
        <div class="cta-btn"></div>
      </div>
    `;
  }
  vp.innerHTML = html;
  
  // Auto scroll a bit to show effect
  setTimeout(() => {
    vp.scrollTo({ top: 40, behavior: 'smooth' });
  }, 300);
}

function updateProgress() {
  const p = (solved.size / data.length) * 100;
  progress.style.width = `${p}%`;
  if (solved.size === data.length) {
    setTimeout(() => {
      log.innerHTML = "<strong>CHÚC MỪNG!</strong> Bạn đã nắm vững chiến lược Sticky. Bạn đã sẵn sàng để tối ưu hóa trải nghiệm cuộn cho người dùng!";
    }, 600);
  }
}

document.getElementById('reset-game').onclick = () => {
  solved.clear();
  activeIdx = -1;
  renderList();
  vp.innerHTML = `<div style="padding: 20px; color: #444; font-size: 10px; font-family: var(--font-mono); text-align: center;">[ Stage Ready: Reset ]</div>`;
  hint.textContent = '';
  log.className = 'status-area';
  log.innerHTML = `Vui lòng chọn một kịch bản giao diện bên trái để bắt đầu bài thực hành.`;
  updateProgress();
};

renderList();
</script>
</body>
</html>
