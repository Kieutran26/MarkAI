<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Assembly — Build web không cần code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --bg2: #ede9e0;
  --bg3: #e4dfd5;
  --ink: #0d0d0d;
  --ink2: #444444;
  --muted: #888888;
  --border: #d4cfc5;
  --accent: #E88C2E;
  --accent-contrast: #0d0d0d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  margin:0;padding:0;overflow:hidden;
}
#app-root{width:100%;overflow:hidden}
.gif-frame{
  width:640px;max-width:none;
  overflow:hidden;background:var(--bg);
  transform-origin:top left;
}
.term-bar{
  display:flex;align-items:center;gap:8px;
  padding:10px 16px;background:var(--ink);
  border-bottom:2px solid var(--ink);
}
.td{width:10px;height:10px;border:1.5px solid #2a2a2a}
.td.r{background:#dc2626;border-color:#dc2626}
.td.y{background:#E88C2E;border-color:#E88C2E}
.td.g{background:#16a34a;border-color:#16a34a}
.tt{
  font-family:'DM Mono',monospace;font-size:11px;
  color:#555;margin-left:12px;letter-spacing:.05em;
}
.stage{position:relative;height:400px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;animation:loopFade .5s ease 10.5s forwards}

/* Background texture */
.dk{
  position:absolute;font-family:'DM Mono',monospace;
  color:var(--ink);opacity:.06;pointer-events:none;user-select:none;
}
.dd{
  position:absolute;border-radius:50%;
  background:var(--ink);opacity:.06;pointer-events:none;
}

/* === MEASUREMENTS === */
.mv{
  position:absolute;left:112px;top:36px;
  height:250px;width:22px;
  opacity:0;animation:fi .3s ease .3s forwards;
}
.mv-l{
  position:absolute;right:0;top:0;
  width:0;height:250px;border-right:1px solid var(--border);
  transform-origin:top center;
  opacity:0;animation:dV .5s ease .35s forwards;
}
.mv-t{
  position:absolute;right:0;width:10px;height:0;
  border-bottom:1px solid var(--border);
  opacity:0;animation:fi .15s ease forwards;
}
.mv-t.a{top:28px;animation-delay:.5s}
.mv-t.b{top:104px;animation-delay:.7s}
.mv-t.c{top:202px;animation-delay:.9s}
.mv-lbl{
  position:absolute;right:10px;top:0;height:250px;
  display:flex;align-items:center;
  font-family:'DM Mono',monospace;font-size:8px;
  color:var(--muted);writing-mode:vertical-lr;
  transform:rotate(180deg);letter-spacing:.12em;
}
.mh{
  position:absolute;left:130px;top:294px;
  height:18px;width:390px;
  opacity:0;animation:fi .3s ease .4s forwards;
}
.mh-l{
  position:absolute;top:0;left:0;
  width:390px;height:0;border-bottom:1px solid var(--border);
  transform-origin:left center;
  opacity:0;animation:dH .5s ease .45s forwards;
}
.mh-lbl{
  position:absolute;top:5px;left:0;width:390px;
  text-align:center;font-family:'DM Mono',monospace;
  font-size:8px;color:var(--muted);letter-spacing:.12em;
}

/* === GRID === */
.wg{
  position:absolute;left:130px;top:36px;
  width:390px;height:250px;
  border:2px solid var(--ink);
  opacity:0;animation:fi .3s ease .2s forwards;
}
.gl{position:absolute;opacity:0}
.gl-h{left:0;right:0;height:0;border-bottom:1px solid var(--border)}
.gl-v{width:0;border-right:1px solid var(--border)}
.gl-h.a{top:28px;animation:dH .2s ease .5s forwards}
.gl-h.b{top:104px;animation:dH .2s ease .7s forwards}
.gl-h.c{top:202px;animation:dH .2s ease .9s forwards}
.gl-v.a{left:130px;top:104px;height:98px;animation:dV .2s ease .6s forwards}
.gl-v.b{left:260px;top:104px;height:98px;animation:dV .2s ease .8s forwards}

/* === BLOCKS === */
.bk{
  position:absolute;opacity:0;
  animation:bSnap .45s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes bSnap{
  0%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.82)}
  60%{opacity:1;transform:translate(0,0) scale(1.04)}
  80%{transform:translate(0,0) scale(.97)}
  100%{opacity:1;transform:translate(0,0) scale(1)}
}

/* Nav */
.bk-nav{
  left:2px;top:2px;width:386px;height:24px;
  background:var(--bg2);--sx:0px;--sy:-90px;animation-delay:1.2s;
}
.nl{position:absolute;height:5px;background:var(--border);top:10px}
.nl:nth-child(1){left:14px;width:46px}
.nl:nth-child(2){left:68px;width:30px}
.nl:nth-child(3){left:106px;width:36px}

/* Hero */
.bk-hero{
  left:2px;top:30px;width:386px;height:72px;
  background:var(--bg2);--sx:-200px;--sy:0px;animation-delay:1.8s;
}
.hl{position:absolute;left:16px;height:8px;background:var(--border)}
.hl:nth-child(1){top:14px;width:150px}
.hl:nth-child(2){top:28px;width:100px;height:6px;background:var(--bg3)}
.hc{
  position:absolute;left:16px;top:42px;
  width:66px;height:20px;border:2px solid var(--border);
  overflow:hidden;
}
.hcf{
  position:absolute;left:0;top:0;
  width:0;height:100%;background:var(--accent);
  animation:ctaF .35s ease 5.6s forwards;
}

/* Columns */
.bk-col{width:126px;height:94px;background:var(--bg);top:106px}
.bk-c1{left:2px;--sx:-110px;--sy:70px;animation-delay:2.4s}
.bk-c2{left:132px;--sx:0px;--sy:90px;animation-delay:2.8s}
.bk-c3{left:262px;--sx:110px;--sy:70px;animation-delay:3.2s}
.cb{position:absolute;height:6px;background:var(--bg3)}
.bk-c1 .cb:nth-child(1){left:10px;top:14px;width:68px}
.bk-c1 .cb:nth-child(2){left:10px;top:28px;width:88px}
.bk-c1 .cb:nth-child(3){left:10px;top:42px;width:52px}
.bk-c2 .cb:nth-child(1){left:10px;top:14px;width:62px}
.bk-c2 .cb:nth-child(2){left:10px;top:28px;width:82px}
.bk-c2 .cb:nth-child(3){left:10px;top:42px;width:46px}
.bk-c3 .cb:nth-child(1){left:10px;top:14px;width:70px}
.bk-c3 .cb:nth-child(2){left:10px;top:78px;width:78px}
.bk-c3 .cb:nth-child(3){left:10px;top:42px;width:50px}

/* Footer */
.bk-ft{
  left:2px;top:204px;width:386px;height:44px;
  background:var(--bg2);--sx:0px;--sy:90px;animation-delay:3.6s;
}
.fb{position:absolute;left:16px;top:18px;width:180px;height:8px;background:var(--bg3)}

/* Block tags */
.bt{
  position:absolute;
  font-family:'DM Mono',monospace;font-size:7px;
  color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
  opacity:0;animation:fi .2s ease forwards;
}
.bk-nav .bt{right:8px;top:8px;animation-delay:1.55s}
.bk-hero .bt{right:8px;bottom:8px;animation-delay:2.15s}
.bk-c1 .bt{right:6px;bottom:6px;animation-delay:2.75s}
.bk-c2 .bt{right:6px;bottom:6px;animation-delay:3.15s}
.bk-c3 .bt{right:6px;bottom:6px;animation-delay:3.55s}
.bk-ft .bt{right:8px;top:8px;animation-delay:3.95s}

/* === LOCK FLASH === */
.lf{
  position:absolute;inset:-1px;
  border:2px solid var(--accent);
  opacity:0;pointer-events:none;
  animation:flashB .3s ease 4.15s forwards;
}
@keyframes flashB{0%,100%{opacity:0}40%{opacity:1}}

/* === ACCENT SWEEP === */
.asw{
  position:absolute;left:-80px;top:0;
  width:80px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(232,140,46,.12),transparent);
  opacity:0;pointer-events:none;
  animation:sweep .8s ease 5.2s forwards;
}
@keyframes sweep{0%{left:-80px;opacity:1}100%{left:calc(100% + 80px);opacity:1}}

/* === BURST DOTS === */
.bu{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:var(--accent);opacity:0;pointer-events:none;
  animation:buDot .5s ease forwards;
}
@keyframes buDot{
  0%{opacity:0;transform:translate(0,0) scale(0)}
  25%{opacity:1;transform:translate(0,0) scale(1.3)}
  100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(.2)}
}
.bu.a{left:30px;top:64px;--bx:-14px;--by:-10px;animation-delay:5.65s}
.bu.b{left:100px;top:62px;--bx:16px;--by:-12px;animation-delay:5.7s}
.bu.c{left:34px;top:92px;--bx:-10px;--by:14px;animation-delay:5.75s}
.bu.d{left:96px;top:90px;--bx:12px;--by:12px;animation-delay:5.8s}

/* === CORNER MARKERS (appear after build) === */
.cm{
  position:absolute;width:14px;height:14px;
  opacity:0;pointer-events:none;
  animation:fi .3s ease 5.4s forwards;
}
.cm.tl{top:-2px;left:-2px;border-top:2px solid var(--accent);border-left:2px solid var(--accent)}
.cm.tr{top:-2px;right:-2px;border-top:2px solid var(--accent);border-right:2px solid var(--accent)}
.cm.bl{bottom:-2px;left:-2px;border-bottom:2px solid var(--accent);border-left:2px solid var(--accent)}
.cm.br{bottom:-2px;right:-2px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent)}

/* === DONE BADGE === */
.dn{
  position:absolute;left:528px;top:36px;
  font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-contrast);background:var(--accent);
  padding:5px 12px;border:2px solid var(--ink);
  opacity:0;transform:translateY(5px);
  animation:stamp .3s ease 6.2s forwards;
}
@keyframes stamp{
  0%{opacity:0;transform:translateY(5px) scale(1.15)}
  55%{opacity:1;transform:translateY(-1px) scale(.96)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* === TEXT === */
.mg{
  position:absolute;left:0;right:0;text-align:center;
  opacity:0;animation:tUp .5s ease forwards;
}
.mg-1{
  top:320px;font-family:'Instrument Serif',serif;
  font-size:21px;color:var(--ink);animation-delay:7s;
}
.mg-2{
  top:350px;font-family:'Instrument Serif',serif;
  font-size:19px;font-style:italic;color:var(--accent);animation-delay:7.3s;
}
.mg-bar{
  position:absolute;left:50%;top:376px;
  width:30px;height:2px;background:var(--accent);
  margin-left:-15px;opacity:0;animation:fi .3s ease 7.6s forwards;
}

/* === BOTTOM BAR === */
.bb{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;background:var(--bg2);
  border-top:2px solid var(--ink);
  font-family:'DM Mono',monospace;font-size:10px;
  color:var(--muted);letter-spacing:.05em;
}
.ld{
  width:6px;height:6px;background:var(--accent);
  display:inline-block;margin-right:6px;
  animation:pulse 1.2s ease infinite;
}

/* === KEYFRAMES === */
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes dH{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes dV{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes ctaF{from{width:0}to{width:100%}}
@keyframes tUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes loopFade{to{opacity:0}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}
}
</style>
</head>
<body>

<div id="app-root">
  <div class="gif-frame" id="ab">
    <div class="term-bar">
      <div class="td r"></div>
      <div class="td y"></div>
      <div class="td g"></div>
      <span class="tt">grid-assembly — 640×400</span>
    </div>
    <div class="stage" id="stage">
      <div class="scene" id="scene">
        <!-- Texture -->
        <div class="dk" style="top:18px;left:565px;font-size:14px">+</div>
        <div class="dk" style="top:175px;left:32px;font-size:11px">+</div>
        <div class="dk" style="top:370px;left:582px;font-size:12px">+</div>
        <div class="dk" style="top:310px;left:52px;font-size:9px">+</div>
        <div class="dk" style="top:130px;left:58px;font-size:10px">+</div>
        <div class="dd" style="top:88px;left:582px;width:4px;height:4px"></div>
        <div class="dd" style="top:262px;left:42px;width:3px;height:3px"></div>
        <div class="dd" style="top:355px;left:300px;width:3px;height:3px"></div>
  
        <!-- Measurements -->
        <div class="mv">
          <div class="mv-l"></div>
          <div class="mv-lbl">250px</div>
          <div class="mv-t a"></div>
          <div class="mv-t b"></div>
          <div class="mv-t c"></div>
        </div>
        <div class="mh">
          <div class="mh-l"></div>
          <div class="mh-lbl">390px</div>
        </div>
  
        <!-- Grid -->
        <div class="wg">
          <div class="gl gl-h a"></div>
          <div class="gl gl-h b"></div>
          <div class="gl gl-h c"></div>
          <div class="gl gl-v a"></div>
          <div class="gl gl-v b"></div>
  
          <div class="bk bk-nav">
            <div class="nl"></div><div class="nl"></div><div class="nl"></div>
            <span class="bt">nav</span>
          </div>
          <div class="bk bk-hero">
            <div class="hl"></div><div class="hl"></div>
            <div class="hc"><div class="hcf"></div></div>
            <span class="bt">hero</span>
          </div>
          <div class="bk bk-col bk-c1">
            <div class="cb"></div><div class="cb"></div><div class="cb"></div>
            <span class="bt">col-1</span>
          </div>
          <div class="bk bk-col bk-c2">
            <div class="cb"></div><div class="cb"></div><div class="cb"></div>
            <span class="bt">col-2</span>
          </div>
          <div class="bk bk-col bk-c3">
            <div class="cb"></div><div class="cb"></div><div class="cb"></div>
            <span class="bt">col-3</span>
          </div>
          <div class="bk bk-ft">
            <div class="fb"></div>
            <span class="bt">footer</span>
          </div>
  
          <!-- Corner markers -->
          <div class="cm tl"></div>
          <div class="cm tr"></div>
          <div class="cm bl"></div>
          <div class="cm br"></div>
  
          <!-- Effects -->
          <div class="lf"></div>
          <div class="asw"></div>
          <div class="bu a"></div>
          <div class="bu b"></div>
          <div class="bu c"></div>
          <div class="bu d"></div>
        </div>
  
        <!-- Done badge -->
        <div class="dn">done</div>
  
        <!-- Text -->
        <div class="mg mg-1">Tự build web không cần lập trình.</div>
        <div class="mg mg-2">Chỉ cần ý tưởng</div>
        <div class="mg-bar"></div>
      </div>
    </div>
    <div class="bb">
      <span><span class="ld"></span>recording</span>
      <span>loop — 11s</span>
    </div>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const LOOP = 11000;

function html() {
  return `
    <div class="dk" style="top:18px;left:565px;font-size:14px">+</div>
    <div class="dk" style="top:175px;left:32px;font-size:11px">+</div>
    <div class="dk" style="top:370px;left:582px;font-size:12px">+</div>
    <div class="dk" style="top:310px;left:52px;font-size:9px">+</div>
    <div class="dk" style="top:130px;left:58px;font-size:10px">+</div>
    <div class="dd" style="top:88px;left:582px;width:4px;height:4px"></div>
    <div class="dd" style="top:262px;left:42px;width:3px;height:3px"></div>
    <div class="dd" style="top:355px;left:300px;width:3px;height:3px"></div>
    <div class="mv">
      <div class="mv-l"></div>
      <div class="mv-lbl">250px</div>
      <div class="mv-t a"></div>
      <div class="mv-t b"></div>
      <div class="mv-t c"></div>
    </div>
    <div class="mh">
      <div class="mh-l"></div>
      <div class="mh-lbl">390px</div>
    </div>
    <div class="wg">
      <div class="gl gl-h a"></div>
      <div class="gl gl-h b"></div>
      <div class="gl gl-h c"></div>
      <div class="gl gl-v a"></div>
      <div class="gl gl-v b"></div>
      <div class="bk bk-nav">
        <div class="nl"></div><div class="nl"></div><div class="nl"></div>
        <span class="bt">nav</span>
      </div>
      <div class="bk bk-hero">
        <div class="hl"></div><div class="hl"></div>
        <div class="hc"><div class="hcf"></div></div>
        <span class="bt">hero</span>
      </div>
      <div class="bk bk-col bk-c1">
        <div class="cb"></div><div class="cb"></div><div class="cb"></div>
        <span class="bt">col-1</span>
      </div>
      <div class="bk bk-col bk-c2">
        <div class="cb"></div><div class="cb"></div><div class="cb"></div>
        <span class="bt">col-2</span>
      </div>
      <div class="bk bk-col bk-c3">
        <div class="cb"></div><div class="cb"></div><div class="cb"></div>
        <span class="bt">col-3</span>
      </div>
      <div class="bk bk-ft">
        <div class="fb"></div>
        <span class="bt">footer</span>
      </div>
      <div class="cm tl"></div>
      <div class="cm tr"></div>
      <div class="cm bl"></div>
      <div class="cm br"></div>
      <div class="lf"></div>
      <div class="asw"></div>
      <div class="bu a"></div>
      <div class="bu b"></div>
      <div class="bu c"></div>
      <div class="bu d"></div>
    </div>
    <div class="dn">done</div>
    <div class="mg mg-1">T\u1ef1 build web kh\u00f4ng c\u1ea7n l\u1eadp tr\u00ecnh.</div>
    <div class="mg mg-2">Ch\u1ec9 c\u1ea7n \u00fd t\u01b0\u1edfng</div>
    <div class="mg-bar"></div>
  `;
}

setInterval(() => {
  const old = stage.querySelector('.scene');
  if (!old) return;
  const el = document.createElement('div');
  el.className = 'scene';
  el.innerHTML = html();
  stage.replaceChild(el, old);
}, LOOP);

function scale(){
  const bx=document.getElementById('ab');
  const s=window.innerWidth/640;
  bx.style.transform='scale('+s+')';
}
window.addEventListener('resize',scale);
requestAnimationFrame(scale);
</script>
</body>
</html>
</body>
</html>
