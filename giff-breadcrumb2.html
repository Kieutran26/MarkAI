<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breadcrumb — Animated</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#131110;--fg:#e8e0d4;--muted:#706b64;--accent:#d4712a;--accent-dim:#8b3a1a;--card:#1c1a18;--card-alt:#242120;--border:#302c28;--border-hi:#44403a;--c1:#4a5a8a;--c2:#4a8a5a;--c3:#b89a2a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,rgba(212,113,42,.035) 0%,transparent 55%),radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 100%,16px 16px;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:'Space Grotesk',sans-serif;color:var(--fg);padding:12px;gap:16px}
.aw{width:min(700px,100%)}
.ab{width:700px;height:412px;background:var(--card);border:2px solid var(--border);transform-origin:top left;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.01)}
.hd-t{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2.5px}
.hd-f{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
.la{position:relative;width:100%;height:260px;background:linear-gradient(rgba(255,255,255,.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:30px 30px;overflow:hidden}
.fr{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s}.fr.show{opacity:1;pointer-events:auto}

/* Breadcrumb type badge */
.bt{position:absolute;top:10px;right:24px;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;letter-spacing:2px;color:var(--accent);border:1px solid var(--border);padding:2px 8px;opacity:0;transform:translateY(-3px);transition:opacity .3s,transform .3s}
.fr.show .bt{opacity:1;transform:translateY(0)}

/* Breadcrumb area */
.ba{padding:14px 24px 0;flex-shrink:0;position:relative}
.bc{display:flex;align-items:center;flex-wrap:wrap}
.bw{position:relative;height:22px}
.bc-f,.bc-c{position:absolute;inset:0;display:flex;align-items:center;transition:opacity .4s}.bc-c{opacity:0}
.bi{font-size:11px;opacity:0;transform:translateX(-5px);transition:opacity .25s,transform .25s;white-space:nowrap}
.fr.show .bi{opacity:1;transform:translateX(0)}
.bi.cur{color:var(--accent);font-weight:700}
.bi:not(.cur){color:var(--muted)}
.bi.dot{color:var(--accent);font-weight:700;letter-spacing:2px}
.bs{margin:0 6px;color:var(--border-hi);font-size:10px;opacity:0;transition:opacity .25s}
.fr.show .bs{opacity:1}
.bd{height:1px;background:var(--border);margin:8px 0 0;opacity:0;transition:opacity .3s}.fr.show .bd{opacity:1}

/* Content mockups */
.mc{flex:1;display:flex;align-items:center;justify-content:center;padding:0 24px 12px;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.fr.show .mc{opacity:1;transform:translateY(0)}

.mcp{display:flex;gap:10px;border:1px solid var(--border);padding:8px;background:var(--card-alt);max-width:380px;width:100%}
.mcpi{width:76px;height:68px;background:var(--card);border:1px solid var(--border);flex-shrink:0}
.mcpi.in{background:linear-gradient(135deg,var(--accent-dim),var(--card))}
.mci{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.mcn{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcpo{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent)}
.mcb{padding:0 10px;height:22px;background:var(--accent);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:600;display:inline-flex;align-items:center;align-self:flex-start;margin-top:2px;border:none}

.mcd{display:flex;flex-direction:column;gap:8px;max-width:400px;width:100%}
.mcm{display:flex;gap:8px}
.mcv{flex:1;border:1px solid var(--border);padding:8px;background:var(--card-alt)}
.mcvv{font-size:16px;font-weight:800}
.mcml{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);margin-top:2px}
.mcb2{display:flex;flex-direction:column;gap:5px;border:1px solid var(--border);padding:8px;background:var(--card-alt)}
.mcbi{height:10px;background:var(--border);position:relative;overflow:hidden}
.mcbf{height:100%;background:var(--accent);opacity:.5;transition:width .5s}
.mcbi:nth-child(1) .mcbf{width:78%}.mcbi:nth-child(2) .mcbf{width:55%}.mcbi:nth-child(3) .mcbf{width:42%}.mcbi:nth-child(4) .mcbf{width:68%}

.mca{max-width:400px;width:100%}
.mcat{font-size:15px;font-weight:700;margin-bottom:8px;line-height:1.3}
.mcal{height:4px;background:var(--border);margin-bottom:5px;border-radius:1px}
.mcal:nth-child(3){width:95%}.mcal:nth-child(4){width:82%}.mcal:nth-child(5){width:88%}.mcal:nth-child(6){width:60%}

/* Info */
.inf{padding:11px 14px;border-top:1px solid var(--border)}
.dn{font-size:17px;font-weight:800;line-height:1.15}
.ds{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);margin-top:2px}
.dd{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.di{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);opacity:.78}
.pt{height:2px;background:var(--border)}.pf{height:100%;background:var(--accent);width:0%}
.fdw{display:flex;gap:4px;justify-content:center;padding:8px 0}
.fdd{width:22px;height:2px;background:var(--border);transition:background .3s}.fdd.on{background:var(--accent)}

/* ===== PRACTICE ===== */
.pw{width:min(700px,100%);background:var(--card);border:2px solid var(--border);padding:20px 24px}
.pw-h{font-size:15px;font-weight:700;margin-bottom:2px}.pw-h span{color:var(--accent)}
.pw-s{font-size:11px;color:var(--muted);margin-bottom:14px}
.pr-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pr-b{padding:7px 14px;border:2px solid var(--border);background:var(--card-alt);font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:500;color:var(--fg);cursor:pointer;transition:all .2s}
.pr-b:hover{border-color:var(--border-hi);background:rgba(255,255,255,.02)}
.pr-b:active{transform:scale(.97)}
.pr-b.act{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.pr-prev{border:1px solid var(--border);background:var(--card-alt);overflow:hidden;margin-bottom:14px}
.pr-prev-h{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.01)}
.pr-prev-l{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px}
.pr-prev-t{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.5px;padding:1px 6px;border:1px solid var(--border);transition:color .2s,border-color .2s}
.pr-url{padding:8px 14px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);background:rgba(0,0,0,.15);word-break:break-all}
.pr-bc-area{padding:12px 14px;min-height:44px;display:flex;align-items:center}
.pr-bc{display:flex;align-items:center;flex-wrap:wrap}
.pr-bi{font-size:12px;opacity:0;transform:translateX(-4px);transition:all .2s;white-space:nowrap}.pr-bi.vis{opacity:1;transform:translateX(0)}
.pr-bi.cur{color:var(--accent);font-weight:700}.pr-bi:not(.cur){color:var(--muted)}
.pr-bi.dot{color:var(--accent);font-weight:700;letter-spacing:2px}
.pr-bs{margin:0 7px;color:var(--border-hi);font-size:11px;opacity:0;transition:opacity .2s}.pr-bs.vis{opacity:1}
.pr-fb{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);min-height:16px;margin-top:2px;line-height:1.4;transition:color .2s}
.pr-fb.w{color:var(--accent)}
.pr-ht{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);opacity:.6}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:520px){.pw{padding:16px}.pr-btns{gap:6px}.pr-b{padding:6px 10px;font-size:11px}}
</style>
</head>
<body>

<div class="aw">
<div class="ab" id="ab">
    <div class="hd"><span class="hd-t">BREADCRUMB</span><span class="hd-f" id="hf">01 / 04</span></div>
    <div class="la">
        <div class="fr" id="f0"></div>
        <div class="fr" id="f1"></div>
        <div class="fr" id="f2"></div>
        <div class="fr" id="f3"></div>
    </div>
    <div class="inf">
        <div class="dn" id="dn"></div>
        <div class="ds" id="ds"></div>
        <div class="dd" id="dd"></div>
        <div class="di" id="di"></div>
    </div>
    <div class="pt"><div class="pf" id="pf"></div></div>
    <div class="fdw"><div class="fdd on" id="d0"></div><div class="fdd" id="d1"></div><div class="fdd" id="d2"></div><div class="fdd" id="d3"></div></div>
</div>
</div>

<!-- ===== PRACTICE ===== -->
<div class="pw">
    <div class="pw-h">Thực hành — <span>URL thành Breadcrumb</span></div>
    <div class="pw-s">Chọn kịch bản để thấy URL biến thành breadcrumb thế nào</div>
    <div class="pr-btns" id="prBtns"></div>
    <div class="pr-prev">
        <div class="pr-prev-h">
            <span class="pr-prev-l">URL</span>
            <span class="pr-prev-t" id="prType"></span>
        </div>
        <div class="pr-url" id="prUrl"></div>
        <div class="pr-bc-area">
            <div class="pr-bc" id="prBc"></div>
        </div>
        <div style="padding:0 14px 10px"><div class="pr-fb" id="prFb">&nbsp;</div></div>
    </div>
    <div class="pr-ht">Hint: Chuyển giữa các kịch bản — chú ý số segment URL tương ứng với số breadcrumb item</div>
</div>

<script>
/* ===== FRAME DATA ===== */
const FRAMES=[
    {type:'HIERARCHY',sub:'E-COMMERCE',tc:'var(--accent)',
     items:[{t:'Home'},{t:'Laptops'},{t:'MacBook Pro 14',cur:true}],
     content:'product',
     nm:'Hierarchy',sz:'PHÂN CẤP — TỪ RỘNG ĐẾN HẸP',
     dc:'Đi từ danh mục lớn đến sản phẩm cụ thể — cho user biết vị trí trong cây phân loại',
     ins:'URL: /laptops/macbook-pro-14 → mỗi segment = 1 breadcrumb item'},
    {type:'LOCATION',sub:'APP NAVIGATION',tc:'var(--c1)',
     items:[{t:'Dashboard'},{t:'Sales'},{t:'Sales Overview',cur:true}],
     content:'dashboard',
     nm:'Location',sz:'VỊ TRÍ TRONG APP',
     dc:'Cho user biết mình đang ở trang nào trong cấu trúc ứng dụng',
     ins:'Không phải phân loại sản phẩm — mà là tọa độ trong app'},
    {type:'MULTI-LEVEL',sub:'CONTENT SITE',tc:'var(--c2)',
     items:[{t:'Blog'},{t:'UX Design'},{t:'Breadcrumb Best Practices',cur:true}],
     content:'article',
     nm:'Multi-level',sz:'NHIỀU CẤP — NỘI DUNG SÂU',
     dc:'Càng vào sâu, breadcrumb càng quan trọng để không bị mất phương hướng',
     ins:'Blog > Category > Article — 3 cấp là mức phổ biến cho content site'},
    {type:'COLLAPSED',sub:'ĐƯỜNG DẪN DÀI',tc:'var(--c3)',collapsed:true,
     full:[{t:'Home'},{t:'Electronics'},{t:'Accessories'},{t:'Cables'},{t:'Adapters'},{t:'USB-C Hub',cur:true}],
     items:[{t:'Home'},{t:'...',dot:true},{t:'USB-C Hub',cur:true}],
     content:'product2',
     nm:'Collapsed',sz:'THU GỌN KHI DÀI',
     dc:'Path quá dài → thu gọn phần giữa, chỉ giữ đầu và cuối',
     ins:'6 segment → quá rối → collapse thành: đầu · ... · đích đến'}
];

/* ===== CONTENT MOCKUPS ===== */
function contentHTML(type){
    if(type==='product') return '<div class="mcp"><div class="mcpi in"></div><div class="mci"><div class="mcn">MacBook Pro 14"</div><div class="mcpo">$2,499</div><button class="mcb">Add to Cart</button></div></div>';
    if(type==='dashboard') return '<div class="mcd"><div class="mcm"><div class="mcv"><div class="mcvv">$24.5K</div><div class="mcml">Revenue</div></div><div class="mcv"><div class="mcvv">1,204</div><div class="mcml">Orders</div></div></div><div class="mcb2"><div class="mcbi"><div class="mcbf"></div></div><div class="mcbi"><div class="mcbf"></div></div><div class="mcbi"><div class="mcbf"></div></div><div class="mcbi"><div class="mcbf"></div></div></div></div>';
    if(type==='article') return '<div class="mca"><div class="mcat">Breadcrumb Best Practices for UX Design</div><div class="mcal"></div><div class="mcal"></div><div class="mcal"></div><div class="mcal"></div></div>';
    if(type==='product2') return '<div class="mcp"><div class="mcpi"></div><div class="mci"><div class="mcn">USB-C Hub 7-in-1</div><div class="mcpo">$49.99</div><button class="mcb">Add to Cart</button></div></div>';
    return '';
}

/* ===== RENDER FRAME ===== */
function renderFrame(i){
    const fr=document.getElementById('f'+i);
    const d=FRAMES[i];
    let h='<div class="bt" style="color:'+d.tc+';border-color:'+d.tc+'">'+d.type+'</div>';
    h+='<div class="ba">';

    if(d.collapsed){
        /* Two-state breadcrumb for collapsed frame */
        h+='<div class="bw"><div class="bc bc-f" id="bcF">';
        d.full.forEach((it,j)=>{if(j>0)h+='<span class="bs">›</span>';h+='<span class="bi'+(it.cur?' cur':'')+'">'+it.t+'</span>'});
        h+='</div><div class="bc bc-c" id="bcC">';
        d.items.forEach((it,j)=>{if(j>0)h+='<span class="bs">›</span>';h+='<span class="bi'+(it.cur?' cur':'')+(it.dot?' dot':'')+'">'+it.t+'</span>'});
        h+='</div></div>';
    }else{
        h+='<div class="bc">';
        d.items.forEach((it,j)=>{if(j>0)h+='<span class="bs">›</span>';h+='<span class="bi'+(it.cur?' cur':'')+'">'+it.t+'</span>'});
        h+='</div>';
    }
    h+='<div class="bd"></div></div>';
    h+='<div class="mc">'+contentHTML(d.content)+'</div>';
    fr.innerHTML=h;
}

/* ===== ANIMATION ===== */
const frs=[0,1,2,3].map(i=>document.getElementById('f'+i));
const el={dn:document.getElementById('dn'),ds:document.getElementById('ds'),dd:document.getElementById('dd'),di:document.getElementById('di'),hf:document.getElementById('hf'),pf:document.getElementById('pf')};
const dts=[0,1,2,3].map(i=>document.getElementById('d'+i));
let cur=0,ft=null,pa=null,t0=0,colT=null;
const DUR=3200;

function apply(i){
    clearTimeout(colT);
    const d=FRAMES[i];
    el.dn.textContent=d.nm;el.ds.textContent=d.sz;el.dd.textContent=d.dc;el.di.textContent=d.ins;
    el.hf.textContent='0'+(i+1)+' / 04';
    dts.forEach((dd,j)=>dd.classList.toggle('on',j===i));

    /* Hide all, show target */
    frs.forEach(f=>f.classList.remove('show'));
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
        frs[i].classList.add('show');
        /* Stagger breadcrumb items */
        const items=frs[i].querySelectorAll('.bi,.bs');
        items.forEach((e,idx)=>{e.style.transitionDelay=(0.12+idx*0.08)+'s'});
        /* Stagger badge and content */
        const bt=frs[i].querySelector('.bt');if(bt)bt.style.transitionDelay='0.05s';
        const mc=frs[i].querySelector('.mc');if(mc)mc.style.transitionDelay=(0.12+items.length*0.08)+'s';
        const bd=frs[i].querySelector('.bd');if(bd)bd.style.transitionDelay=(0.08+items.length*0.08)+'s';

        /* Collapsed frame: trigger collapse after delay */
        if(i===3){
            const bcF=document.getElementById('bcF');
            const bcC=document.getElementById('bcC');
            if(bcF&&bcC){bcF.style.opacity='1';bcC.style.opacity='0';}
            colT=setTimeout(()=>{
                if(bcF&&bcC){bcF.style.opacity='0';bcC.style.opacity='1';}
            },1500);
        }
    }));
}

function startProg(){t0=performance.now();el.pf.style.transition='none';el.pf.style.width='0%';(function tk(n){const p=Math.min(100,(n-t0)/DUR*100);el.pf.style.width=p+'%';if(p<100)pa=requestAnimationFrame(tk)})(t0)}
function next(){cur=(cur+1)%4;apply(cur);startProg()}
function start(){apply(0);startProg();ft=setInterval(next,DUR)}
function scale(){const wr=document.querySelector('.aw'),bx=document.getElementById('ab'),s=wr.clientWidth/700;bx.style.transform='scale('+s+')';wr.style.height=Math.ceil(412*s)+'px'}

/* ===== PRACTICE ===== */
const SCENARIOS=[
    {label:'Sản phẩm',url:'/shop/laptops/macbook-pro-14',
     items:[{t:'Home'},{t:'Shop'},{t:'Laptops'},{t:'MacBook Pro 14',cur:true}],
     type:'HIERARCHY',sub:'E-COMMERCE',tc:'var(--accent)',
     fb:'4 segment URL → 4 breadcrumb item — mỗi segment = 1 bước điều hướng'},
    {label:'Dashboard',url:'/dashboard/sales/overview',
     items:[{t:'Dashboard'},{t:'Sales'},{t:'Sales Overview',cur:true}],
     type:'LOCATION',sub:'APP NAVIGATION',tc:'var(--c1)',
     fb:'Không phải phân loại — mà là tọa độ trong cấu trúc ứng dụng'},
    {label:'Blog',url:'/blog/ux-design/breadcrumb-guide',
     items:[{t:'Blog'},{t:'UX Design'},{t:'Breadcrumb Guide',cur:true}],
     type:'MULTI-LEVEL',sub:'CONTENT SITE',tc:'var(--c2)',
     fb:'3 cấp — mức phổ biến nhất cho blog và content site'},
    {label:'Sản phẩm sâu',url:'/shop/electronics/accessories/cables/adapters/usb-c-hub',
     items:[{t:'Home'},{t:'...',dot:true},{t:'USB-C Hub',cur:true}],
     type:'COLLAPSED',sub:'ĐƯỜNG DẪN DÀI',tc:'var(--c3)',
     fb:'6 segment → quá dài → thu gọn: giữ Home + ... + đích đến'}
];

const prBtns=document.getElementById('prBtns');
const prUrl=document.getElementById('prUrl');
const prBc=document.getElementById('prBc');
const prType=document.getElementById('prType');
const prFb=document.getElementById('prFb');
let activeSc=0;

/* Render buttons */
SCENARIOS.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='pr-b'+(i===0?' act':'');
    b.textContent=s.label;
    b.addEventListener('click',()=>renderPractice(i));
    prBtns.appendChild(b);
});

function renderPractice(idx){
    activeSc=idx;
    const s=SCENARIOS[idx];

    /* Buttons */
    prBtns.querySelectorAll('.pr-b').forEach((b,j)=>b.classList.toggle('act',j===idx));

    /* URL */
    prUrl.textContent=s.url;

    /* Type badge */
    prType.textContent=s.type+' · '+s.sub;
    prType.style.color=s.tc;
    prType.style.borderColor=s.tc;

    /* Breadcrumb */
    prBc.innerHTML='';
    s.items.forEach((it,i)=>{
        if(i>0){const sep=document.createElement('span');sep.className='pr-bs';sep.textContent='›';prBc.appendChild(sep)}
        const item=document.createElement('span');
        item.className='pr-bi'+(it.cur?' cur':'')+(it.dot?' dot':'');
        item.textContent=it.t;
        prBc.appendChild(item);
    });

    /* Animate items */
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{
        prBc.querySelectorAll('.pr-bi,.pr-bs').forEach((el,i)=>{el.style.transitionDelay=(i*0.05)+'s';el.classList.add('vis')})
    })});

    /* Feedback */
    prFb.textContent=s.fb;
    prFb.className='pr-fb w';
}

/* ===== INIT ===== */
FRAMES.forEach((_,i)=>renderFrame(i));
window.addEventListener('resize',scale);
requestAnimationFrame(()=>requestAnimationFrame(scale));
start();renderPractice(0);
document.addEventListener('visibilitychange',()=>{
    if(document.hidden){clearInterval(ft);cancelAnimationFrame(pa);clearTimeout(colT)}
    else{start()}
});
</script>
</body>
</html>
