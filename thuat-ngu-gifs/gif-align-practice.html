<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Align Practice — Vibecode Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101010;--bgc:#181818;--bgi:#131313;
  --bd:#272727;--tx:#e0e0e0;--txm:#707070;--txd:#3a3a3a;
  --ac:#E88C2E;--acl:#ffb05c;
  --abg:rgba(232,140,46,.08);--abg2:rgba(232,140,46,.18);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Space Grotesk',sans-serif;
  background-color:var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--tx);min-height:100vh;padding:24px 16px;
}
.pr{max-width:900px;margin:0 auto}
.pr-h{margin-bottom:24px;border-left:2px solid var(--ac);padding-left:16px}
.pr-g{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ac);font-weight:700;letter-spacing:1px;margin-bottom:4px}
.pr-d{font-size:13px;color:var(--txm)}

.pr-layout{display:grid;grid-template-columns:280px 1fr;gap:20px}
@media(max-width:800px){.pr-layout{grid-template-columns:1fr}}

.pr-ctrls{display:flex;flex-direction:column;gap:16px}
.ctrl-grp{background:var(--bgc);border:1px solid var(--bd);padding:14px;border-radius:3px}
.ctrl-l{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--txm);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:block}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn-grid.tr{grid-template-columns:1fr 1fr 1fr}

.pr-btn{font-family:'JetBrains Mono',monospace;font-size:10px;padding:8px;background:var(--bg);color:var(--txm);border:1px solid var(--bd);cursor:pointer;transition:all .2s;text-align:center;border-radius:2px}
.pr-btn:hover{border-color:var(--txd);color:var(--tx)}
.pr-btn.on{background:var(--abg2);color:var(--ac);border-color:var(--ac);font-weight:700}

.pr-prev{background:var(--bgc);border:1px solid var(--bd);position:relative;height:380px;display:flex;flex-direction:column;overflow:hidden;border-radius:3px}
.prev-cont{flex:1;display:flex;padding:20px;gap:12px;transition:all .4s ease;position:relative}
.prev-cont::before{content:'';position:absolute;inset:20px;border:1px dashed var(--txd);pointer-events:none}

.p-card{width:80px;height:100px;background:var(--bgi);border:1px solid var(--bd);display:flex;flex-direction:column;padding:8px;gap:6px;transition:all .4s;border-radius:2px}
.p-av{width:22px;height:22px;border-radius:50%;background:var(--txd)}
.p-t{height:6px;width:100%;background:var(--txd);border-radius:1px}
.p-b{height:12px;width:100%;background:var(--abg);border:1px solid rgba(232,140,46,.2);margin-top:auto}

.pr-f{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx);padding:14px 16px;margin-top:20px;background:var(--bgc);border:1px solid var(--bd);border-left:3px solid var(--ac);line-height:1.6}
.pr-f em{color:var(--acl);font-style:normal;font-weight:700}
</style>
</head>
<body>

<main class="pr">
  <div class="pr-h">
    <div class="pr-g">ALIGN LABORATORY</div>
    <p class="pr-d">Thử nghiệm các thuộc tính căn lề và phân bổ không gian trong Flexbox.</p>
  </div>

  <div class="pr-layout">
    <div class="pr-ctrls">
      <div class="ctrl-grp">
        <span class="ctrl-l">Justify Content (Ngang)</span>
        <div class="btn-grid tr">
          <button class="pr-btn on" data-prop="jc" data-val="flex-start">start</button>
          <button class="pr-btn" data-prop="jc" data-val="center">center</button>
          <button class="pr-btn" data-prop="jc" data-val="flex-end">end</button>
          <button class="pr-btn" data-prop="jc" data-val="space-between">between</button>
          <button class="pr-btn" data-prop="jc" data-val="space-around">around</button>
          <button class="pr-btn" data-prop="jc" data-val="space-evenly">evenly</button>
        </div>
      </div>

      <div class="ctrl-grp">
        <span class="ctrl-l">Align Items (Dọc)</span>
        <div class="btn-grid">
          <button class="pr-btn on" data-prop="ai" data-val="flex-start">top</button>
          <button class="pr-btn" data-prop="ai" data-val="center">middle</button>
          <button class="pr-btn" data-prop="ai" data-val="flex-end">bottom</button>
          <button class="pr-btn" data-prop="ai" data-val="stretch">stretch</button>
        </div>
      </div>

      <div class="ctrl-grp">
        <span class="ctrl-l">Card Content Align</span>
        <div class="btn-grid tr">
          <button class="pr-btn on" data-prop="ta" data-val="flex-start">left</button>
          <button class="pr-btn" data-prop="ta" data-val="center">center</button>
          <button class="pr-btn" data-prop="ta" data-val="flex-end">right</button>
        </div>
      </div>
    </div>

    <div class="pr-prev">
      <div class="prev-cont" id="pcont" style="justify-content: flex-start; align-items: flex-start;">
        <div class="p-card" style="align-items: flex-start;">
          <div class="p-av"></div>
          <div class="p-t" style="width: 80%"></div>
          <div class="p-t" style="width: 50%"></div>
          <div class="p-b"></div>
        </div>
        <div class="p-card" style="height: 120px; align-items: flex-start;">
          <div class="p-av"></div>
          <div class="p-t" style="width: 90%"></div>
          <div class="p-t" style="width: 60%"></div>
          <div class="p-b"></div>
        </div>
        <div class="p-card" style="align-items: flex-start;">
          <div class="p-av"></div>
          <div class="p-t" style="width: 70%"></div>
          <div class="p-t" style="width: 40%"></div>
          <div class="p-b"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="pr-f" id="pf">
    CSS: <em>mặc định (flex-start)</em>
  </div>
</main>

<script>
(function(){
    var pcont = document.getElementById('pcont');
    var cards = document.querySelectorAll('.p-card');
    var pf = document.getElementById('pf');
    var btns = document.querySelectorAll('.pr-btn');

    var state = {
        jc: 'flex-start',
        ai: 'flex-start',
        ta: 'flex-start'
    };

    function update() {
        pcont.style.justifyContent = state.jc;
        pcont.style.alignItems = state.ai;
        
        cards.forEach(function(card, idx){
            card.style.alignItems = state.ta;
            // Restore original heights if not stretch
            if(state.ai === 'stretch') {
                card.style.height = '100%';
            } else {
                card.style.height = (idx === 1) ? '120px' : '100px';
            }
        });

        var msg = "";
        if(state.jc !== 'flex-start') msg += "justify-content: " + state.jc + "; ";
        if(state.ai !== 'flex-start') msg += "align-items: " + state.ai + "; ";
        if(state.ta !== 'flex-start') msg += "content-align: " + state.ta + ";";

        pf.innerHTML = "CSS: <em>" + (msg || "mặc định (flex-start)") + "</em>";
    }

    btns.forEach(function(btn){
        btn.addEventListener('click', function(){
            var prop = btn.dataset.prop;
            var val = btn.dataset.val;
            state[prop] = val;

            document.querySelectorAll('.pr-btn[data-prop="'+prop+'"]').forEach(function(b){
                b.classList.remove('on');
            });
            btn.classList.add('on');

            update();
        });
    });

    update();
})();
</script>
</body>
</html>
