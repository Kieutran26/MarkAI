<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Icon Button Practice — Animated Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#101010;--bg-card:#181818;--bg-inner:#131313;
    --border:#272727;--border-hi:#d97706;
    --text:#e0e0e0;--text-m:#707070;--text-d:#3a3a3a;
    --accent:#d97706;--accent-l:#f59e0b;
    --accent-bg:rgba(217,119,6,.1);--accent-bg2:rgba(217,119,6,.2);
    --red:#ef4444;--green:#22c55e;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Space Grotesk',sans-serif;
    background-color:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:20px 20px;
    color:var(--text);min-height:auto;padding:12px 14px 4px;
  }

  /* ═══════════════════════════════════
     PRACTICE SECTION
     ═══════════════════════════════════ */
  .w{max-width:860px;margin:0 auto;padding:0 0 20px}
  .pg{font-size:13px;color:var(--text-m);line-height:1.55;margin-bottom:12px;max-width:620px}
  .pg strong{color:var(--text);font-weight:600}

  .practice-card{background:var(--bg-card);border:1px solid var(--border);border-radius:3px;padding:14px;position:relative;overflow:hidden;}

  .practice-body{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;}
  @media(max-width:640px){.practice-body{grid-template-columns:1fr;}}

  /* ── Controls ── */
  .ctrl-group{margin-bottom:12px;}
  .ctrl-group:last-child{margin-bottom:0;}
  .ctrl-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-d);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;display:block;}
  .ctrl-opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:5px 10px;border:1px solid var(--border);border-radius:2px;
    background:transparent;color:var(--text-m);cursor:pointer;
    transition:all .15s ease;white-space:nowrap;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .opt:hover{border-color:var(--text-m);color:var(--text);}
  .opt:active{transform:scale(.96);}
  .opt.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}

  /* ── Preview ── */
  .preview-box{background:var(--bg-inner);border:1px solid var(--border);border-radius:3px;padding:14px 12px;}
  .compare{display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:16px;}
  @media(max-width:380px){.compare{gap:14px;}}

  .cmp-col{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:80px;}
  .cmp-label{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-d);text-transform:uppercase;letter-spacing:.8px;}
  .cmp-label.is-target{color:var(--accent);}
  .cmp-desc{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-m);text-align:center;line-height:1.4;min-height:28px;}

  .cmp-vs{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-d);font-weight:700;flex-shrink:0;}

  /* ── Match indicators ── */
  .match-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;}
  .ind{display:inline-flex;align-items:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-d);transition:color .25s;}
  .ind::before{content:'';width:6px;height:6px;border-radius:1px;background:var(--border);transition:background .25s;}
  .ind.ok{color:var(--accent-l);}
  .ind.ok::before{background:var(--accent);}

  /* ── Feedback ── */
  .fb{text-align:center;font-size:12px;color:var(--text-m);padding:10px;border:1px solid var(--border);border-radius:2px;background:var(--bg);min-height:40px;display:flex;align-items:center;justify-content:center;line-height:1.5;transition:border-color .25s;}
  .fb.win{border-color:var(--accent);color:var(--accent-l);background:var(--accent-bg);}
  .fb strong{color:var(--text);font-weight:600;}

  /* ── Streak + new btn ── */
  .practice-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:10px;flex-wrap:wrap;}
  .streak{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-d);}
  .streak b{color:var(--accent);font-weight:700;}
  .new-btn{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    padding:7px 14px;border:1px solid var(--border);border-radius:2px;
    background:transparent;color:var(--text-m);cursor:pointer;
    transition:all .15s ease;
  }
  .new-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
  .new-btn:active{transform:scale(.97);}

  /* ── SUMMARY ── */
  .summary{max-width:880px;margin:24px auto 0;padding:16px 18px;border:1px solid var(--border);border-radius:3px;background:var(--bg-card);font-size:12.5px;color:var(--text-m);line-height:1.6;}
  .summary strong{color:var(--accent-l);font-weight:600;}

  /* ── REDUCED MOTION ── */
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;}}
</style>
</head>
<body>
<div class="w">
  <p class="pg"><strong>Mục tiêu:</strong> Nhận diện và cấu hình Icon Button dựa trên yêu cầu thiết kế. Chọn đúng 3 thuộc tính: Biến thể, Kích thước và Trạng thái.</p>

  <!-- PRACTICE SECTION -->
  <section class="practice-card">

  <div class="practice-body">
    <!-- Controls -->
    <div class="ctrl-panel">
      <div class="ctrl-group">
        <span class="ctrl-label">Biến thể</span>
        <div class="ctrl-opts" data-group="variant">
          <button class="opt active" data-val="filled">Filled</button>
          <button class="opt" data-val="tonal">Tonal</button>
          <button class="opt" data-val="outlined">Outlined</button>
          <button class="opt" data-val="text">Text</button>
        </div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Kích thước</span>
        <div class="ctrl-opts" data-group="size">
          <button class="opt" data-val="s">S · 24px</button>
          <button class="opt active" data-val="m">M · 32px</button>
          <button class="opt" data-val="l">L · 40px</button>
          <button class="opt" data-val="xl">XL · 56px</button>
        </div>
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Trạng thái</span>
        <div class="ctrl-opts" data-group="state">
          <button class="opt active" data-val="default">Default</button>
          <button class="opt" data-val="hover">Hover</button>
          <button class="opt" data-val="pressed">Pressed</button>
          <button class="opt" data-val="selected">Selected</button>
          <button class="opt" data-val="disabled">Disabled</button>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="preview-panel">
      <div class="preview-box">
        <div class="compare">
          <div class="cmp-col">
            <span class="cmp-label is-target">Yêu cầu</span>
            <div id="targetBtn"></div>
            <span class="cmp-desc" id="targetDesc"></span>
          </div>
          <span class="cmp-vs">VS</span>
          <div class="cmp-col">
            <span class="cmp-label">Của bạn</span>
            <div id="resultBtn"></div>
            <span class="cmp-desc" id="resultDesc"></span>
          </div>
        </div>

        <!-- Match indicators -->
        <div class="match-row">
          <span class="ind" id="ind-v">Biến thể</span>
          <span class="ind" id="ind-s">Kích thước</span>
          <span class="ind" id="ind-st">Trạng thái</span>
        </div>

        <!-- Feedback -->
        <div class="fb" id="feedback">
          Chọn đúng 3 thuộc tính để khớp với yêu cầu.
        </div>
      </div>

      <div class="practice-foot">
        <span class="streak">Hoàn thành: <b id="streakCount">0</b></span>
        <button class="new-btn" id="newBtn">Yêu cầu khác</button>
      </div>
    </div>
  </div>
    </div>
  </section>
</div>

<script>
  /* ── Dữ liệu thử thách ── */
  const CHALLENGES = [
    { variant:'filled',   size:'m',  state:'default',  desc:'Nút primary cỡ vừa, trạng thái mặc định' },
    { variant:'tonal',    size:'l',  state:'hover',    desc:'Nút secondary lớn, đang rê chuột' },
    { variant:'outlined', size:'s',  state:'default',  desc:'Nút viền nhỏ, bình thường' },
    { variant:'text',     size:'m',  state:'hover',    desc:'Nút chữ cỡ vừa, đang hover' },
    { variant:'filled',   size:'xl', state:'selected', desc:'Nút primary lớn, đang được chọn' },
    { variant:'tonal',    size:'s',  state:'disabled', desc:'Nút secondary nhỏ, bị vô hiệu hóa' },
    { variant:'outlined', size:'l',  state:'pressed',  desc:'Nút viền lớn, đang nhấn xuống' },
    { variant:'text',     size:'xl', state:'disabled', desc:'Nút chữ lớn, bị vô hiệu' },
    { variant:'filled',   size:'s',  state:'pressed',  desc:'Nút primary nhỏ, đang nhấn' },
    { variant:'tonal',    size:'xl', state:'selected', desc:'Nút secondary lớn, đang chọn' },
    { variant:'outlined', size:'m',  state:'hover',    desc:'Nút viền vừa, đang hover' },
    { variant:'text',     size:'l',  state:'default',  desc:'Nút chữ lớn, trạng thái bình thường' },
    { variant:'filled',   size:'l',  state:'disabled', desc:'Nút primary lớn, bị vô hiệu' },
    { variant:'tonal',    size:'m',  state:'pressed',  desc:'Nút secondary vừa, đang nhấn' },
    { variant:'outlined', size:'xl', state:'selected', desc:'Nút viền lớn, đang chọn' },
    { variant:'text',     size:'s',  state:'pressed',  desc:'Nút chữ nhỏ, đang nhấn' },
  ];

  /* ── State ── */
  let current = null;
  let user = { variant:'filled', size:'m', state:'default' };
  let streak = 0;
  let lastIndex = -1;

  /* ── Ánh xạ tên hiển thị ── */
  const VN = {
    variant:{ filled:'Filled', tonal:'Tonal', outlined:'Outlined', text:'Text' },
    size:{ s:'S', m:'M', l:'L', xl:'XL' },
    state:{ default:'Default', hover:'Hover', pressed:'Pressed', selected:'Selected', disabled:'Disabled' }
  };

  /* ── Render một icon button theo config ── */
  function renderBtn(c) {
    const sizeMap  = { s:32, m:40, l:48, xl:56 };
    const iconMap  = { s:16, m:20, l:24, xl:28 };
    const cs = sizeMap[c.size], is = iconMap[c.size];

    let bg='transparent', brd='none', sc='#d97706', fc='none', op=1, sc2=1, sh='none';

    /* Biến thể cơ bản */
    switch(c.variant) {
      case 'filled':   bg='#d97706'; brd='none'; sc='#fff'; break;
      case 'tonal':    bg='rgba(217,119,6,.18)'; brd='none'; sc='#d97706'; break;
      case 'outlined': bg='transparent'; brd='1.5px solid #d97706'; sc='#d97706'; break;
      case 'text':     bg='transparent'; brd='none'; sc='#d97706'; break;
    }

    /* Trạng thái ghi đè */
    switch(c.state) {
      case 'hover':
        sc2=1.05; sh='0 0 14px rgba(217,119,6,.25)';
        if(c.variant==='filled') bg='#f59e0b';
        else if(c.variant==='tonal') bg='rgba(217,119,6,.3)';
        else if(c.variant==='outlined') brd='1.5px solid #f59e0b';
        break;
      case 'pressed':
        sc2=0.94;
        if(c.variant==='filled') bg='#b45309';
        else if(c.variant==='tonal') bg='rgba(217,119,6,.08)';
        break;
      case 'selected':
        fc = c.variant==='filled' ? '#fff' : '#d97706';
        sc = c.variant==='filled' ? '#fff' : '#d97706';
        if(c.variant==='tonal') bg='rgba(217,119,6,.28)';
        if(c.variant==='outlined') { brd='1.5px solid #d97706'; bg='rgba(217,119,6,.08)'; }
        if(c.variant==='text') bg='rgba(217,119,6,.08)';
        break;
      case 'disabled':
        op=0.3; break;
    }

    return '<div style="width:'+cs+'px;height:'+cs+'px;display:flex;align-items:center;justify-content:center;background:'+bg+';border:'+brd+';border-radius:4px;opacity:'+op+';transform:scale('+sc2+');box-shadow:'+sh+';transition:all .2s ease;">' +
      '<svg width="'+is+'" height="'+is+'" viewBox="0 0 24 24" fill="'+fc+'" stroke="'+sc+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
      '<polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>' +
      '</svg></div>';
  }

  /* ── Cập nhật preview của user ── */
  function updateResult() {
    document.getElementById('resultBtn').innerHTML = renderBtn(user);
    document.getElementById('resultDesc').textContent =
      VN.variant[user.variant]+' · '+VN.size[user.size]+' · '+VN.state[user.state];
  }

  /* ── Kiểm tra khớp ── */
  function check() {
    const v  = user.variant === current.variant;
    const s  = user.size    === current.size;
    const st = user.state   === current.state;

    document.getElementById('ind-v').className  = 'ind' + (v  ? ' ok' : '');
    document.getElementById('ind-s').className  = 'ind' + (s  ? ' ok' : '');
    document.getElementById('ind-st').className = 'ind' + (st ? ' ok' : '');

    const fb = document.getElementById('feedback');
    if (v && s && st) {
      streak++;
      document.getElementById('streakCount').textContent = streak;
      fb.className = 'fb win';
      fb.textContent = 'Khớp hoàn toàn! Bạn đã nhận diện đúng 3 thuộc tính.';
    } else {
      fb.className = 'fb';
      const wrong = [];
      if (!v)  wrong.push('biến thể');
      if (!s)  wrong.push('kích thước');
      if (!st) wrong.push('trạng thái');
      fb.innerHTML = 'Chưa khớp — kiểm tra lại: <strong>' + wrong.join(', ') + '</strong>';
    }
  }

  /* ── Tạo thử thách mới ── */
  function newChallenge() {
    let idx;
    do { idx = Math.floor(Math.random() * CHALLENGES.length); } while (idx === lastIndex && CHALLENGES.length > 1);
    lastIndex = idx;
    current = CHALLENGES[idx];

    document.getElementById('targetBtn').innerHTML = renderBtn(current);
    document.getElementById('targetDesc').textContent = current.desc;

    /* Reset user về mặc định */
    user = { variant:'filled', size:'m', state:'default' };
    resetOpts();
    updateResult();
    check();
    /* Reset feedback text */
    document.getElementById('feedback').className = 'fb';
    document.getElementById('feedback').textContent = 'Chọn đúng 3 thuộc tính để khớp với yêu cầu.';
  }

  /* ── Reset highlight trên chip ── */
  function resetOpts() {
    document.querySelectorAll('.ctrl-opts').forEach(g => {
      const grp = g.dataset.group;
      g.querySelectorAll('.opt').forEach(b => {
        b.classList.toggle('active', b.dataset.val === user[grp]);
      });
    });
  }

  /* ── Gán sự kiện ── */
  document.querySelectorAll('.ctrl-opts').forEach(group => {
    const grp = group.dataset.group;
    group.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => {
        group.querySelectorAll('.opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        user[grp] = btn.dataset.val;
        updateResult();
        check();
      });
    });
  });

  document.getElementById('newBtn').addEventListener('click', newChallenge);

  /* ── Khởi tạo ── */
  newChallenge();
</script>
</body>
</html>
