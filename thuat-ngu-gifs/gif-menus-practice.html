<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menus Practice — Vibecode</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a1a;--bg-card:#222;--accent:#d97706;--accent-dim:#92400e;
  --accent-glow:rgba(217,119,6,.12);--fg:#e8e4df;--fg-muted:#8a8580;
  --fg-dim:#5a5550;--border:#3a3a3a;--border-accent:#d97706;
  --success:#22c55e;--success-bg:rgba(34,197,94,.1);
  --error:#ef4444;--error-bg:rgba(239,68,68,.1);
  --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;--radius:2px;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;min-height:100vh;
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:24px 24px}
.page-wrapper{max-width:960px;margin:0 auto;padding:0 20px 40px} /* Reduced top padding since it's embedded */

/* ===== PRACTICE ===== */
.practice-card{padding:12px;margin-bottom:20px}
.practice-goal{font-family:var(--mono);font-size:11px;color:var(--fg-muted);margin-bottom:20px;line-height:1.6;padding-left:12px;border-left:2px solid var(--accent-dim)}
.practice-goal strong{color:var(--fg);font-weight:600}
.hint-bar{margin-top:12px;padding:6px 12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:9px;color:var(--fg-dim);letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.hint-bar::before{content:'?';display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;background:var(--border);color:var(--fg-muted);font-size:9px;font-weight:700;border-radius:var(--radius);flex-shrink:0}

/* ===== MENU BUILDER ===== */
.ws-workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.ws-workspace{grid-template-columns:1fr}}
.ws-panel{background:#141414;border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.ws-panel-title{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--fg-dim);margin-bottom:16px}
.style-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.style-opt{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.5px;color:var(--fg-dim);background:transparent;border:1px solid var(--border);padding:5px 10px;border-radius:var(--radius);cursor:pointer;transition:all .25s}
.style-opt:hover{border-color:var(--fg-dim);color:var(--fg-muted)}
.style-opt.active{border-color:var(--border-accent);background:var(--accent-glow);color:var(--accent)}
.item-list{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto}
.item-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;color:var(--fg-muted);transition:all .3s}
.item-row:hover{border-color:var(--fg-dim)}
.item-row-input{font-family:var(--mono);font-size:10px;color:var(--fg);background:transparent;border:none;outline:none;flex:1;min-width:0}
.item-row-input::placeholder{color:var(--fg-dim)}
.item-row-del{font-family:var(--mono);font-size:11px;color:var(--fg-dim);cursor:pointer;padding:0 4px;transition:color .2s;border:none;background:none}
.item-row-del:hover{color:var(--error)}
.add-item-btn{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--fg-dim);background:transparent;border:1px dashed var(--border);padding:6px 10px;border-radius:var(--radius);cursor:pointer;transition:all .25s;width:100%;text-align:center;margin-top:6px}
.add-item-btn:hover{border-color:var(--fg-dim);color:var(--fg-muted)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.toggle-label{font-family:var(--mono);font-size:10px;color:var(--fg-muted)}
.toggle-switch{width:36px;height:20px;background:var(--border);border-radius:10px;cursor:pointer;position:relative;transition:background .3s;border:none;padding:0;flex-shrink:0}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--fg-dim);border-radius:50%;transition:all .3s}
.toggle-switch.on{background:var(--accent-dim)}
.toggle-switch.on::after{left:19px;background:var(--accent)}
.group-input{font-family:var(--mono);font-size:10px;color:var(--fg);background:rgba(255,255,255,.04);border:1px solid var(--border);padding:6px 10px;border-radius:var(--radius);width:100%;outline:none;transition:border-color .3s;margin-top:4px}
.group-input:focus{border-color:var(--border-accent)}
.group-input::placeholder{color:var(--fg-dim)}

/* ===== PREVIEW COMPONENTS ===== */
.menu-trigger{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.5px;color:var(--fg-muted);cursor:default;transition:all .3s}
.menu-trigger.active{border-color:var(--border-accent);color:var(--fg);background:var(--accent-glow)}
.trigger-arrow{font-size:8px;transition:transform .3s}
.dropdown{background:#2a2a2a;border:1px solid var(--border);border-radius:var(--radius);padding:4px 0;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.dd-item{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:11px;color:var(--fg-muted);transition:all .2s;cursor:default}
.dd-item-icon{width:16px;text-align:center;font-size:12px;color:var(--fg-dim)}
.dd-sep{height:1px;background:var(--border);margin:4px 0}
.ctx-menu{background:#2a2a2a;border:1px solid var(--border);border-radius:var(--radius);padding:4px 0;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.mega-panel{background:#2a2a2a;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.mega-col{flex:1;padding:0 12px;border-right:1px solid var(--border)}
.mega-col:last-child{border-right:none;padding-right:0}
.mega-col:first-child{padding-left:0}
.mega-col-title{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.mega-link{display:block;font-size:11px;color:var(--fg-muted);padding:4px 0}
.grp-header{font-family:var(--mono);font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--fg-dim);padding:8px 14px 4px}
.grp-sep{height:1px;background:var(--border);margin:2px 0}

.code-output{margin-top:12px;padding:10px 12px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:10px;color:var(--fg-dim);line-height:1.7;white-space:pre;overflow-x:auto;max-height:180px;overflow-y:auto}
.code-output .tag{color:var(--error)}.code-output .attr{color:var(--accent)}.code-output .val{color:var(--success)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="page-wrapper">
  <!-- ==================== THỰC HÀNH ==================== -->


  <!-- PRACTICE B: MENU BUILDER -->
  <div class="practice-card">
    <div class="practice-goal">
      <strong>Mục tiêu:</strong> Tự cấu hình menu (type, items, groups) — thấy ngay mỗi loại menu phù hợp với cấu trúc nào.
    </div>
    <div class="ws-workspace">
      <div class="ws-panel">
        <div class="ws-panel-title">Cấu hình</div>
        <div class="style-picker" id="builder-type">
          <button class="style-opt active" data-type="dropdown">Dropdown</button>
          <button class="style-opt" data-type="context">Ngữ cảnh</button>
          <button class="style-opt" data-type="mega">Mega</button>
          <button class="style-opt" data-type="grouped">Phân nhóm</button>
        </div>
        <div style="font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg-dim);margin-bottom:8px">Danh sách mục</div>
        <div class="item-list" id="builder-items"></div>
        <button class="add-item-btn" id="add-item-btn">+ Thêm mục</button>
        <div id="group-options" style="display:none;margin-top:12px">
          <div class="toggle-row">
            <span class="toggle-label">Hiện tiêu đề nhóm</span>
            <button class="toggle-switch" id="grp-toggle"></button>
          </div>
          <input type="text" class="group-input" id="grp-name" placeholder="Tên nhóm: Tài khoản, Nhóm...">
        </div>
        <div id="mega-options" style="display:none;margin-top:12px">
          <div class="toggle-row">
            <span class="toggle-label">Hiện nhiều cột</span>
            <button class="toggle-switch on" id="col-toggle"></button>
          </div>
        </div>
      </div>
      <div>
        <div class="ws-panel" style="margin-bottom:12px">
          <div class="ws-panel-title">Xem trước</div>
          <div id="builder-preview" style="min-height:200px;padding:16px;background:rgba(255,255,255,.01);border:1px solid var(--border);border-radius:var(--radius)"></div>
        </div>
        <div class="code-output" id="builder-code"></div>
      </div>
    </div>
    <div class="hint-bar">Đổi type → xem preview thay đổi format. Thêm item → thấy menu dài ra. Bật groups → thấy structure xuất hiện.</div>
  </div>
</div>

<script>


// =============================================
// PRACTICE B: MENU BUILDER
// =============================================
(function(){
  const state = {
    type: 'dropdown',
    items: ['Hồ sơ', 'Cài đặt', 'Trợ giúp', 'Đăng xuất'],
    showGroups: false,
    groupName: 'Tài khoản',
    showColumns: true
  };

  const typePicker = document.getElementById('builder-type');
  const itemsEl = document.getElementById('builder-items');
  const previewEl = document.getElementById('builder-preview');
  const codeEl = document.getElementById('builder-code');
  const addBtn = document.getElementById('add-item-btn');
  const groupOpts = document.getElementById('group-options');
  const megaOpts = document.getElementById('mega-options');
  const grpToggle = document.getElementById('grp-toggle');
  const colToggle = document.getElementById('col-toggle');
  const grpName = document.getElementById('grp-name');

  function renderItems() {
    itemsEl.innerHTML = state.items.map((item, i) => `
      <div class="item-row">
        <span style="font-family:var(--mono);font-size:9px;color:var(--fg-dim);width:16px;text-align:center">${i + 1}</span>
        <input type="text" class="item-row-input" value="${item}" data-idx="${i}">
        <button class="item-row-del" data-idx="${i}">&times;</button>
      </div>
    `).join('');

    itemsEl.querySelectorAll('.item-row-input').forEach(inp => {
      inp.addEventListener('input', function() {
        state.items[parseInt(this.dataset.idx)] = this.value;
        renderPreview();
        renderCode();
      });
    });

    itemsEl.querySelectorAll('.item-row-del').forEach(btn => {
      btn.addEventListener('click', function() {
        if (state.items.length <= 1) return;
        state.items.splice(parseInt(this.dataset.idx), 1);
        renderItems();
        renderPreview();
        renderCode();
      });
    });
  }

  function renderPreview() {
    const t = state.type;
    let html = '';

    if (t === 'dropdown') {
      html = `<div style="position:relative;display:inline-block">
        <div class="menu-trigger active">Menu <span class="trigger-arrow">&#9660;</span></div>
        <div class="dropdown open" style="position:relative;top:4px;transform:none;opacity:1;pointer-events:auto">
          ${state.items.map(item => `<div class="dd-item"><span class="dd-item-icon">&#9679;</span>${item || '...'}</div>`).join('')}
        </div>
      </div>`;
    } else if (t === 'context') {
      html = `<div style="position:relative">
        <div style="padding:8px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;color:var(--fg-muted);display:inline-block">file.pdf</div>
        <div class="ctx-menu open" style="position:relative;top:8px;left:0;transform:none;opacity:1;pointer-events:auto">
          ${state.items.map(item => `<div class="dd-item"><span class="dd-item-icon">&#9679;</span>${item || '...'}</div>`).join('')}
        </div>
      </div>`;
    } else if (t === 'mega') {
      const cols = state.showColumns ? 3 : 1;
      const perCol = Math.ceil(state.items.length / cols);
      let colsHtml = '';
      for (let c = 0; c < cols; c++) {
        const colItems = state.items.slice(c * perCol, (c + 1) * perCol);
        colsHtml += `<div class="mega-col">
          <div class="mega-col-title">Column ${c + 1}</div>
          ${colItems.map(item => `<div class="mega-link">${item || '...'}</div>`).join('')}
        </div>`;
      }
      html = `<div style="position:relative">
        <div class="menu-trigger active" style="font-size:9px">Nav <span class="trigger-arrow">&#9660;</span></div>
        <div class="mega-panel open" style="position:relative;top:6px;transform:none;opacity:1;pointer-events:auto">
          <div style="display:flex">${colsHtml}</div>
        </div>
      </div>`;
    } else if (t === 'grouped') {
      const gName = state.showGroups ? (grpName.value || 'Group') : '';
      const half = Math.ceil(state.items.length / 2);
      const group1 = state.items.slice(0, half);
      const group2 = state.items.slice(half);
      html = `<div style="display:inline-block;min-width:180px">
        <div style="background:#2a2a2a;border:1px solid var(--border);border-radius:var(--radius);padding:4px 0">
          ${state.showGroups ? `<div class="grp-header">${gName} A</div>` : ''}
          ${group1.map(item => `<div class="dd-item"><span class="dd-item-icon">&#9679;</span>${item || '...'}</div>`).join('')}
          ${state.showGroups ? `<div class="grp-sep"></div><div class="grp-header">${gName} B</div>` : ''}
          ${group2.map(item => `<div class="dd-item"><span class="dd-item-icon">&#9679;</span>${item || '...'}</div>`).join('')}
        </div>
      </div>`;
    }

    previewEl.innerHTML = html;
  }

  function renderCode() {
    const t = state.type;
    const itemCount = state.items.length;
    let code = '';

    if (t === 'dropdown') {
      code = `<span class="tag">&lt;Dropdown</span>
  <span class="attr">trigger</span>=<span class="val">"Menu"</span>
  <span class="attr">items</span>=<span class="val">{${itemCount} mục}</span>
<span class="tag">/&gt;</span>
  <span class="attr">// ${itemCount} mục: nên ≤ 7</span>
  <span class="attr">// click vào nút → mở</span>
  <span class="attr">// click ra ngoài → đóng</span>`;
    } else if (t === 'context') {
      code = `<span class="tag">&lt;ContextMenu</span>
  <span class="attr">target</span>=<span class="val">"file.pdf"</span>
  <span class="attr">items</span>=<span class="val">{${itemCount} hành động}</span>
<span class="tag">/&gt;</span>
  <span class="attr">// chuột phải → xuất hiện</span>
  <span class="attr">// click khác → đóng</span>
  <span class="attr">// vị trí = con trỏ</span>`;
    } else if (t === 'mega') {
      const cols = state.showColumns ? 3 : 1;
      code = `<span class="tag">&lt;MegaMenu</span>
  <span class="attr">trigger</span>=<span class="val">"Nav"</span>
  <span class="attr">columns</span>=<span class="val">${cols}</span>
  <span class="attr">items</span>=<span class="val">{${itemCount} mục}</span>
<span class="tag">/&gt;</span>
  <span class="attr">// rê chuột → mở</span>
  <span class="attr">// ${cols} cột phân loại</span>
  <span class="attr">// nên ≥ 10 mục</span>`;
    } else if (t === 'grouped') {
      const gName = state.showGroups ? (grpName.value || 'Nhóm') : '';
      code = `<span class="tag">&lt;GroupedMenu</span>
  <span class="attr">items</span>=<span class="val">{${itemCount} mục}</span>
  <span class="attr">groups</span>=<span class="val">${state.showGroups ? '"' + gName + ' A", "' + gName + ' B"' : 'không có'}</span>
<span class="tag">/&gt;</span>
  <span class="attr">// tiêu đề nhóm = mục lục</span>
  <span class="attr">// đường kẻ phân cách nhóm</span>
  <span class="attr">// nên ≥ 7 mục</span>`;
    }

    codeEl.innerHTML = code;
  }

  // Bind type picker
  typePicker.querySelectorAll('.style-opt').forEach(btn => {
    btn.addEventListener('click', function() {
      state.type = this.dataset.type;
      typePicker.querySelectorAll('.style-opt').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      groupOpts.style.display = state.type === 'grouped' ? '' : 'none';
      megaOpts.style.display = state.type === 'mega' ? '' : 'none';
      renderPreview();
      renderCode();
    });
  });

  // Bind add item
  addBtn.addEventListener('click', () => {
    if (state.items.length >= 12) return;
    state.items.push('New item');
    renderItems();
    renderPreview();
    renderCode();
  });

  // Bind group toggle
  grpToggle.addEventListener('click', function() {
    state.showGroups = !state.showGroups;
    this.classList.toggle('on', state.showGroups);
    renderPreview();
    renderCode();
  });

  // Bind column toggle
  colToggle.addEventListener('click', function() {
    state.showColumns = !state.showColumns;
    this.classList.toggle('on', state.showColumns);
    renderPreview();
    renderCode();
  });

  // Bind group name
  grpName.addEventListener('input', () => { renderPreview(); renderCode(); });

  // Init
  renderItems();
  renderPreview();
  renderCode();
})();
</script>

</body>
</html>
