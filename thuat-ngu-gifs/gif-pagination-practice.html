<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pagination — Practice</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#131110;--fg:#e8e0d4;--muted:#706b64;--accent:#d4712a;--card:#1c1a18;--card-alt:#242120;--border:#302c28;--border-hi:#44403a;--ok:#4a8a5a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 25% 15%,rgba(212,113,42,.035) 0%,transparent 55%),radial-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 100%,16px 16px;display:block;font-family:'Space Grotesk',sans-serif;color:var(--fg);padding:12px 16px 0;min-height:auto;overflow:hidden}

/* ===== PRACTICE ===== */
.pw{width:100%;background:var(--card);border:2px solid var(--border);padding:20px 24px}
.pw-h{font-size:15px;font-weight:700;margin-bottom:2px}.pw-h span{color:var(--accent)}
.pw-s{font-size:11px;color:var(--muted);margin-bottom:14px}
.mbs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.mb{padding:6px 12px;border:2px solid var(--border);background:var(--card-alt);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);cursor:pointer;transition:all .2s}.mb:hover{border-color:var(--border-hi)}.mb.on{border-color:var(--accent);color:var(--accent);background:rgba(212,113,42,.08)}
.pp{border:1px solid var(--border);background:var(--card-alt);overflow:hidden;margin-bottom:8px}
.pp-lbl{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:2px;padding:6px 14px 0;opacity:.4}
.pp-inner{padding:6px 14px 10px}
.pp-tb{width:100%;border-collapse:collapse}
.pp-tb th{font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;color:var(--muted);letter-spacing:1px;text-align:left;padding:4px 5px;border-bottom:1px solid var(--border);text-transform:uppercase}
.pp-tb td{font-size:9px;padding:3px 5px;border-bottom:1px solid rgba(48,44,40,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.pp-tb tr.ch td{opacity:.25}
.ppg{display:flex;align-items:center;gap:4px;justify-content:center;padding:6px 0 0}
.ppn{min-width:26px;height:26px;border:1px solid var(--border);background:var(--card-alt);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);cursor:pointer;transition:all .2s;user-select:none}.ppn:hover{border-color:var(--border-hi)}.ppn.act{background:var(--accent);border-color:var(--accent);color:#fff}
.ppa{min-width:auto;padding:0 10px;font-size:9px;font-family:'Space Grotesk',sans-serif;font-weight:600;cursor:pointer}
.ppgi{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);padding:0 6px}
.pplm{padding:0 20px;height:30px;border:2px solid var(--border);background:var(--card-alt);font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;color:var(--fg);cursor:pointer;transition:all .2s;user-select:none;display:block;margin:6px auto 0}.pplm:hover{border-color:var(--border-hi)}.pplm.flash{border-color:var(--accent);color:var(--accent)}
.pfb{font-family:'JetBrains Mono',monospace;font-size:11px;min-height:18px;color:var(--muted);transition:color .2s;line-height:1.4}.pfb.w{color:var(--accent)}
.pht{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);opacity:.65}

.st-b{display:inline-block;padding:1px 5px;font-family:'JetBrains Mono',monospace;font-size:7px;font-weight:700;border:1px solid var(--border)}
.st-a{background:rgba(74,138,90,.12);border-color:var(--ok);color:var(--ok)}
.st-i{color:var(--muted)}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:520px){.pw{padding:16px}.mbs{gap:4px}.mb{padding:5px 8px;font-size:9px}.pp-tb td,.pp-tb th{padding:3px 4px;font-size:8px}}
.pw>:last-child{margin-bottom:0}
</style>
</head>
<body>

<div class="pw">
  <div class="pw-h">Thực hành — <span>Chế độ Pagination</span></div>
  <div class="pw-s">Chọn kiểu → click để điều hướng qua các trang</div>
  <div class="mbs" id="mbs">
    <button class="mb on" data-m="0">Numeric</button>
    <button class="mb" data-m="1">Prev / Next</button>
    <button class="mb" data-m="2">First / Last</button>
    <button class="mb" data-m="3">Load More</button>
  </div>
  <div class="pp">
    <div class="pp-lbl">PREVIEW</div>
    <div class="pp-inner">
      <table class="pp-tb"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody id="pBody"></tbody></table>
      <div id="pCtrl"></div>
    </div>
  </div>
  <div class="pfb" id="pfb">Numeric — click số trang để nhảy trực tiếp</div>
  <div class="pht">Hint: Chuyển chế độ → để ý cách điều hướng khác nhau, Load More không có trang</div>
</div>

<script>
/* ===== DATA ===== */
const ROWS=[
  {n:'Linh Nguyen',e:'linh@brand.co',r:'Designer',s:'a'},
  {n:'Minh Tran',e:'minh@brand.co',r:'Developer',s:'a'},
  {n:'Hoa Pham',e:'hoa@brand.co',r:'Manager',s:'i'},
  {n:'Tuan Le',e:'tuan@brand.co',r:'Marketer',s:'a'},
  {n:'Mai Vu',e:'mai@brand.co',r:'Analyst',s:'i'},
  {n:'Hung Dao',e:'hung@brand.co',r:'Designer',s:'a'},
  {n:'Yen Ngo',e:'yen@brand.co',r:'Developer',s:'a'},
  {n:'Son Bui',e:'son@brand.co',r:'Support',s:'i'},
  {n:'Lan Ho',e:'lan@brand.co',r:'Sales',s:'a'},
  {n:'Khoa Dinh',e:'khoa@brand.co',r:'PM',s:'a'},
  {n:'Trang Ly',e:'trang@brand.co',r:'Designer',s:'a'},
  {n:'Phuc Vo',e:'phuc@brand.co',r:'Developer',s:'i'},
  {n:'Thao Tran',e:'thao@brand.co',r:'Marketing',s:'a'},
  {n:'Duc Nguyen',e:'duc@brand.co',r:'Analyst',s:'a'},
  {n:'Gia Bui',e:'gia@brand.co',r:'Sales',s:'i'},
  {n:'Ngoc Pham',e:'ngoc@brand.co',r:'Support',s:'a'},
  {n:'Hai Vu',e:'hai@brand.co',r:'Developer',s:'a'},
  {n:'Nhi Le',e:'nhi@brand.co',r:'Designer',s:'i'},
  {n:'Bao Tran',e:'bao@brand.co',r:'PM',s:'a'},
  {n:'Cam Dao',e:'cam@brand.co',r:'Marketing',s:'a'}
];
const PP=4,TP=Math.ceil(ROWS.length/PP);

function statusBadge(s){return `<span class="st-b ${s==='a'?'st-a':'st-i'}">${s==='a'?'Active':'Inactive'}</span>`}

/* ===== PRACTICE ===== */
let pm=0,pp2=0,loaded=PP;
const pBody=document.getElementById('pBody');
const pCtrl=document.getElementById('pCtrl');
const pfb=document.getElementById('pfb');
const MODES=['Numeric — click số trang để nhảy trực tiếp','Prev / Next — chỉ tiến/lùi 1 trang mỗi lần','First / Last — nhảy đầu/cuối + tiến/lùi','Load More — bấm thêm data, không chia trang'];

function renderP(){
  if(pm===3){
    const rows=ROWS.slice(0,loaded).map(r=>`<tr><td>${r.n}</td><td>${r.e}</td><td>${r.r}</td><td>${statusBadge(r.s)}</td></tr>`).join('');
    pBody.innerHTML=rows;
    pCtrl.innerHTML=loaded>=ROWS.length?'<div style="text-align:center;padding:6px 0;font-family:JetBrains Mono,monospace;font-size:9px;color:var(--muted)">All '+ROWS.length+' items loaded</div>':'<button class="pplm" id="plm">Load more ('+loaded+'/'+ROWS.length+')</button>';
    const lm=document.getElementById('plm');
    if(lm)lm.addEventListener('click',()=>{
      lm.classList.add('flash');setTimeout(()=>lm.classList.remove('flash'),300);
      loaded=Math.min(loaded+PP,ROWS.length);
      renderP();
    });
  }else{
    const start=pp2*PP;
    pBody.innerHTML=ROWS.slice(start,start+PP).map(r=>`<tr><td>${r.n}</td><td>${r.e}</td><td>${r.r}</td><td>${statusBadge(r.s)}</td></tr>`).join('');
    if(pm===0){
      let h='<div class="ppg">';
      for(let i=0;i<TP;i++)h+=`<span class="ppn${i===pp2?' act':''}" data-p="${i}">${i+1}</span>`;
      h+='</div>';pCtrl.innerHTML=h;
      pCtrl.querySelectorAll('.ppn').forEach(n=>n.addEventListener('click',()=>{pp2=+n.dataset.p;renderP()}));
    }else if(pm===1){
      pCtrl.innerHTML=`<div class="ppg"><span class="ppn ppa${pp2===0?' style="opacity:.3;pointer-events:none"':''}" id="pprev">&lsaquo; Previous</span><span class="ppgi">Page ${pp2+1} of ${TP}</span><span class="ppn ppa${pp2>=TP-1?' style="opacity:.3;pointer-events:none"':''}" id="pnext">Next &rsaquo;</span></div>`;
      const pv=document.getElementById('pprev'),nx=document.getElementById('pnext');
      if(pv&&!pv.style.opacity)pv.addEventListener('click',()=>{if(pp2>0){pp2--;renderP()}});
      if(nx&&!nx.style.opacity)nx.addEventListener('click',()=>{if(pp2<TP-1){pp2++;renderP()}});
    }else{
      pCtrl.innerHTML=`<div class="ppg"><span class="ppn ppa${pp2===0?' style="opacity:.3;pointer-events:none"':''}" id="pfirst">&laquo; First</span><span class="ppn ppa${pp2===0?' style="opacity:.3;pointer-events:none"':''}" id="pprev">&lsaquo; Prev</span><span class="ppgi">Page ${pp2+1} of ${TP}</span><span class="ppn ppa${pp2>=TP-1?' style="opacity:.3;pointer-events:none"':''}" id="pnext">Next &rsaquo;</span><span class="ppn ppa${pp2>=TP-1?' style="opacity:.3;pointer-events:none"':''}" id="plast">Last &raquo;</span></div>`;
      const f=document.getElementById('pfirst'),pv=document.getElementById('pprev'),nx=document.getElementById('pnext'),l=document.getElementById('plast');
      if(f&&!f.style.opacity)f.addEventListener('click',()=>{pp2=0;renderP()});
      if(pv&&!pv.style.opacity)pv.addEventListener('click',()=>{if(pp2>0){pp2--;renderP()}});
      if(nx&&!nx.style.opacity)nx.addEventListener('click',()=>{if(pp2<TP-1){pp2++;renderP()}});
      if(l&&!l.style.opacity)l.addEventListener('click',()=>{pp2=TP-1;renderP()});
    }
  }
  pfb.textContent=MODES[pm]+(pm!==3?' — đang xem trang '+(pp2+1)+' / '+TP:' — đã tải '+loaded+' / '+ROWS.length);
  pfb.className='pfb'+(pm===3&&loaded>=ROWS.length?' w':'');
}

document.getElementById('mbs').addEventListener('click',e=>{
  const b=e.target.closest('.mb');if(!b)return;
  const m=+b.dataset.m;if(m===pm)return;
  document.querySelectorAll('.mb').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  pm=m;pp2=0;loaded=PP;renderP();
});

renderP();
</script>
</body>
</html>
