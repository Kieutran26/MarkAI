<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Bar Practice</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0c0c0e;
      --bg2: #131315;
      --fg: #ece8e1;
      --muted: #706b64;
      --accent: #e88c2e;
      --card: #1a1a1e;
      --border: #26262a;
      --mono: 'Space Mono', monospace;
      --sans: 'Space Grotesk', sans-serif
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 16px;
      background-image: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(207, 92, 39, .04) 0%, transparent 100%), linear-gradient(rgba(255, 255, 255, .016) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .016) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px, 28px 28px
    }

    .wrap {
      width: 100%;
      max-width: 880px
    }

    /* === Progress bar base === */
    .pb-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, .06);
      position: relative;
      overflow: hidden
    }

    .pb-fill {
      height: 100%;
      background: var(--accent);
      transition: width .8s cubic-bezier(.4, 0, .2, 1);
      position: relative
    }

    .pb-fill.animated::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .15), transparent);
      animation: shimmer 1.5s infinite
    }

    @keyframes shimmer {
      0% {
        transform: translateX(-100%)
      }

      100% {
        transform: translateX(100%)
      }
    }

    /* Circular progress */
    .cprog {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .cprog svg {
      transform: rotate(-90deg)
    }

    .cprog-track {
      fill: none;
      stroke: rgba(255, 255, 255, .06);
      stroke-width: 4px
    }

    .cprog-fill {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4px;
      stroke-linecap: butt;
      transition: stroke-dashoffset .3s
    }

    .cprog-center {
      position: absolute;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--fg)
    }

    /* === PRACTICE ========== */
    .prac {
      width: 100%
    }

    .cp {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap
    }

    .cp-item {
      flex: 1;
      min-width: 180px
    }

    .cp-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between
    }

    .cp-label b {
      color: var(--accent);
      font-weight: 400
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 3px;
      background: var(--border);
      outline: none;
      cursor: pointer
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border: none;
      cursor: pointer
    }

    input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: var(--accent);
      border: none;
      cursor: pointer;
      border-radius: 0
    }

    /* Practice preview */
    .pp {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .pp-sec {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .pp-sec-lbl {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-bottom: 4px
    }

    /* Practice linear */
    .pp-lin-row {
      display: flex;
      align-items: center;
      gap: 16px
    }

    .pp-lin-info {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px
    }

    .pp-lin-track {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, .06);
      overflow: hidden
    }

    .pp-lin-fill {
      height: 100%;
      background: var(--accent);
      transition: width .15s
    }

    .pp-lin-track.sec {
      height: 6px
    }

    .pp-lin-fill.sec {
      background: rgba(255, 255, 255, .15)
    }

    /* Practice circular */
    .pp-circ-row {
      display: flex;
      gap: 40px;
      justify-content: center;
      align-items: center
    }

    .pp-circ-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px
    }

    /* Practice steps */
    .pp-step-row {
      display: flex;
      align-items: flex-start;
      gap: 0;
      position: relative
    }

    .pp-step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      position: relative;
      z-index: 2
    }

    .pp-step-dot {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      background: var(--bg2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 700;
      color: var(--muted);
      transition: all .3s
    }

    .pp-step-dot.done {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--bg)
    }

    .pp-step-dot.active {
      border-color: var(--accent);
      color: var(--accent)
    }

    .pp-step-line {
      position: absolute;
      top: 10px;
      height: 2px;
      background: var(--border);
      z-index: 1;
      transition: background .3s
    }

    .pp-step-line.done {
      background: var(--accent)
    }

    .pp-step-lbl {
      font-family: var(--mono);
      font-size: 7px;
      color: var(--muted);
      letter-spacing: .06em;
      margin-top: 4px;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      transition: color .3s
    }

    .pp-step-lbl.done {
      color: var(--accent)
    }

    .pp-step-lbl.active {
      color: var(--fg)
    }

    /* Practice tasks */
    .pp-task-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline
    }

    .pp-task-frac {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700
    }

    .pp-task-frac span {
      color: var(--accent)
    }

    .pp-task-list {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .pp-task-row {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .pp-task-name {
      font-size: 10px;
      color: var(--muted);
      flex: 1
    }

    .pp-task-pbar {
      width: 100px;
      height: 6px;
      background: rgba(255, 255, 255, .06);
      overflow: hidden
    }

    .pp-task-pfill {
      height: 100%;
      background: var(--accent);
      transition: width .15s
    }

    .pp-task-val {
      font-family: var(--mono);
      font-size: 8px;
      color: var(--muted);
      min-width: 30px;
      text-align: right
    }

    /* Feedback */
    .fb {
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      line-height: 1.7;
      min-height: 16px;
      transition: opacity .25s
    }

    .fb em {
      color: var(--fg);
      font-style: normal
    }

    .fb .w {
      color: var(--accent)
    }

    @media(max-width:640px) {
      body {
        padding: 14px 10px 36px
      }

      .pp-circ-row {
        gap: 10px
      }

      .cp {
        flex-direction: column;
        gap: 8px
      }

      .cp-item {
        min-width: 0
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .pb-fill.animated::after {
        animation: none !important
      }

      *,
      *::before,
      *::after {
        transition-duration: .01ms !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap" id="app-root">
    <div class="prac">
      <div class="cp">
        <div class="cp-item">
          <div class="cp-label">PROGRESS <b id="pvVal">65%</b></div>
          <input type="range" id="pvSlider" min="0" max="100" step="1" value="65">
        </div>
      </div>

      <div class="pp">
        <div class="pp-sec">
          <div class="pp-sec-lbl">Linear Progress</div>
          <div class="pp-lin-row">
            <div class="pp-lin-info" style="min-width:80px"><span style="font-size:10px;color:var(--fg)">Upload</span>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;gap:4px">
              <div class="pp-lin-track">
                <div class="pp-lin-fill" id="plf"></div>
              </div>
              <div class="pp-lin-track sec">
                <div class="pp-lin-fill sec" id="pls"></div>
              </div>
            </div>
            <span style="font-family:var(--mono);font-size:9px;color:var(--accent);min-width:32px;text-align:right"
              id="plv">65%</span>
          </div>
        </div>

        <div class="pp-sec">
          <div class="pp-sec-lbl">Circular Progress</div>
          <div class="pp-circ-row">
            <div class="pp-circ-item">
              <div class="cprog"><svg width="60" height="60" viewBox="0 0 36 36">
                  <circle class="cprog-track" cx="18" cy="18" r="15" />
                  <circle class="cprog-fill" id="pcf" cx="18" cy="18" r="15" stroke-dasharray="94.25"
                    stroke-dashoffset="23.56" />
                </svg>
                <div class="cprog-center" id="pcc">75%</div>
              </div>
              <span style="font-family:var(--mono);font-size:7px;color:var(--muted);letter-spacing:.06em">STORAGE</span>
            </div>
            <div class="pp-circ-item">
              <div class="cprog"><svg width="60" height="60" viewBox="0 0 36 36">
                  <circle class="cprog-track" cx="18" cy="18" r="15" />
                  <circle class="cprog-fill" id="pcf2" cx="18" cy="18" r="15" stroke-dasharray="94.25"
                    stroke-dashoffset="47.13" />
                </svg>
                <div class="cprog-center" id="pcc2">50%</div>
              </div>
              <span style="font-family:var(--mono);font-size:7px;color:var(--muted);letter-spacing:.06em">CPU</span>
            </div>
          </div>
        </div>

        <div class="pp-sec">
          <div class="pp-sec-lbl">Step Progress</div>
          <div class="pp-step-row" id="pStepRow">
            <div class="pp-step-item">
              <div class="pp-step-dot" id="psd0">1</div>
              <div class="pp-step-lbl" id="psl0">Account</div>
            </div>
            <div class="pp-step-line" id="psl0_line" style="left:12.5%;right:62.5%"></div>
            <div class="pp-step-item">
              <div class="pp-step-dot" id="psd1">2</div>
              <div class="pp-step-lbl" id="psl1">Profile</div>
            </div>
            <div class="pp-step-line" id="psl1_line" style="left:37.5%;right:37.5%"></div>
            <div class="pp-step-item">
              <div class="pp-step-dot" id="psd2">3</div>
              <div class="pp-step-lbl" id="psl2">Billing</div>
            </div>
            <div class="pp-step-line" id="psl2_line" style="left:62.5%;right:12.5%"></div>
            <div class="pp-step-item">
              <div class="pp-step-dot" id="psd3">4</div>
              <div class="pp-step-lbl" id="psl3">Confirm</div>
            </div>
          </div>
        </div>

        <div class="pp-sec">
          <div class="pp-sec-lbl">Task Progress</div>
          <div class="pp-task-header">
            <div class="pp-task-frac"><span id="ptDone">2</span> of 4 tasks</div><span
              style="font-family:var(--mono);font-size:8px;color:var(--accent)" id="ptPct">50% overall</span>
          </div>
          <div class="pb-track" style="height:6px;margin-bottom:6px">
            <div class="pp-lin-fill" id="ptf"></div>
          </div>
          <div class="pp-task-list">
            <div class="pp-task-row"><span class="pp-task-name">Design UI</span>
              <div class="pp-task-pbar">
                <div class="pp-task-pfill" id="ptpf0"></div>
              </div><span class="pp-task-val" id="ptpv0">0%</span>
            </div>
            <div class="pp-task-row"><span class="pp-task-name">Build API</span>
              <div class="pp-task-pbar">
                <div class="pp-task-pfill" id="ptpf1"></div>
              </div><span class="pp-task-val" id="ptpv1">0%</span>
            </div>
            <div class="pp-task-row"><span class="pp-task-name">Write Tests</span>
              <div class="pp-task-pbar">
                <div class="pp-task-pfill" id="ptpf2"></div>
              </div><span class="pp-task-val" id="ptpv2">0%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="fb" id="pfb"><em>65%</em> — thanh filled 65%, shimmer animation cho thấy đang "đang tải".</div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const CIRC = 94.248;

    function setCircle(fillEl, centerEl, pct) {
      const offset = CIRC - (CIRC * pct / 100);
      fillEl.setAttribute('stroke-dashoffset', offset);
      fillEl.style.opacity = pct === 0 ? '0' : '1';
      centerEl.textContent = pct === 0 ? '--' : pct + '%';
      centerEl.style.opacity = pct === 0 ? '.2' : '1';
    }

    let pv = 65;

    function updatePractice() {
      const v = pv;
      $('pvVal').textContent = v + '%';
      $('pvSlider').value = v;

      /* Linear */
      $('plf').style.width = v + '%';
      $('plv').textContent = v + '%';
      $('pls').style.width = Math.round(Math.min(100, v * 0.8)) + '%';

      /* Circular */
      const cv = Math.round(v * .75), cv2 = Math.round(v * .5);
      setCircle($('pcf'), $('pcc'), cv); setCircle($('pcf2'), $('pcc2'), cv2);

      /* Steps */
      const steps = 4, activeStep = Math.min(steps, Math.floor(v / 25));
      [0, 1, 2, 3].forEach(i => {
        const d = $('psd' + i), l = $('psl' + i);
        d.className = 'pp-step-dot'; l.className = 'pp-step-lbl';
        if (i < activeStep) { d.classList.add('done'); d.textContent = '✓'; l.classList.add('done') }
        else if (i === activeStep) { d.classList.add('active'); d.textContent = (i + 1); l.classList.add('active') }
        else { d.textContent = (i + 1) }
        if (i < 3) $('psl' + i + '_line').className = 'pp-step-line' + (i < activeStep ? ' done' : '');
      });

      /* Tasks */
      const tasks = [Math.min(100, v * 1.6), Math.min(100, v * 1.2), Math.round(v * .7)];
      const done = tasks.filter(x => x >= 100).length;
      const avg = Math.round(tasks.reduce((a, b) => a + b, 0) / tasks.length);

      tasks.forEach((t, i) => {
        $('ptpf' + i).style.width = t + '%';
        $('ptpv' + i).textContent = Math.round(t) + '%';
        $('ptpv' + i).className = 'pp-task-val' + (t >= 100 ? ' done' : '');
      });
      $('ptf').style.width = avg + '%';
      $('ptDone').textContent = done;
      $('ptPct').textContent = avg + '% overall';

      /* Feedback */
      const fb = $('pfb'), lines = [];
      if (v === 0) lines.push('<em>0%</em> — thanh rỗng, không có progress. User không biết chuyện gì đang diễn ra.');
      else if (v < 30) lines.push('<em>' + v + '%</em> — mới bắt đầu. Shimmer animation cho thấy "đang tải".');
      else if (v < 70) lines.push('<em>' + v + '%</em> — đang tiến triển tốt. User thấy tiến độ rõ ràng.');
      else if (v < 100) lines.push('<em>' + v + '%</em> — sắp xong. User cảm thấy "gần rồi", kiên nhẫn chờ.');
      else lines.push('<em>100%</em> — hoàn thành. Progress bar nên biến mất hoặc chuyển sang trạng thái success.');
      fb.innerHTML = lines.join(' ');
    }

    $('pvSlider').addEventListener('input', e => { pv = +e.target.value; updatePractice() });
    updatePractice();
  </script>
</body>

</html>
