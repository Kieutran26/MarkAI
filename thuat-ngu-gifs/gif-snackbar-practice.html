<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snackbar Practice</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a1a;--bg-card:#222;--accent:#d97706;--accent-dim:#92400e;
  --accent-glow:rgba(217,119,6,.12);--fg:#e8e4df;--fg-muted:#8a8580;
  --fg-dim:#5a5550;--border:#3a3a3a;--border-accent:#d97706;
  --success:#22c55e;--success-bg:rgba(34,197,94,.15);
  --error:#ef4444;--error-bg:rgba(239,68,68,.15);
  --info:#64748b;--info-bg:rgba(100,116,139,.2);
  --warning:#d97706;--warning-bg:rgba(217,119,6,.15);
  --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;--radius:2px;
}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;padding:10px;
  background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:24px 24px}

.practice-card{background:transparent;border:none;border-radius:var(--radius);padding:0;margin-bottom:12px}
.practice-goal{font-family:var(--mono);font-size:11px;color:var(--fg-muted);margin-bottom:14px;line-height:1.6;padding-left:12px;border-left:2px solid var(--accent-dim)}
.practice-goal strong{color:var(--fg);font-weight:600}
.hint-bar{margin-top:12px;padding:6px 12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:9px;color:var(--fg-dim);letter-spacing:.3px;display:flex;align-items:center;gap:6px}
.hint-bar::before{content:'?';display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;background:var(--border);color:var(--fg-muted);font-size:9px;font-weight:700;border-radius:var(--radius);flex-shrink:0}

/* ===== BUILDER ===== */
.ws-workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.ws-workspace{grid-template-columns:1fr}}
.ws-controls{background:#141414;border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.control-group label{display:block;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg-dim);margin-bottom:6px}
.style-picker{display:flex;gap:6px;flex-wrap:wrap}
.style-opt{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.5px;color:var(--fg-dim);background:transparent;border:1px solid var(--border);padding:5px 10px;border-radius:var(--radius);cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:4px}
.style-opt:hover{border-color:var(--fg-dim);color:var(--fg-muted)}
.style-opt.active{border-color:var(--border-accent);background:var(--accent-glow);color:var(--accent)}
.style-opt-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.text-input{font-family:var(--mono);font-size:11px;color:var(--fg);background:rgba(255,255,255,.04);border:1px solid var(--border);padding:7px 10px;border-radius:var(--radius);width:100%;outline:none;transition:border-color .3s}
.range-slider{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--border);border-radius:1px;outline:none}
.range-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--accent);border-radius:var(--radius);cursor:pointer;border:2px solid var(--bg)}
.toggle-row{display:flex;align-items:center;justify-content:space-between}
.toggle-label{font-family:var(--mono);font-size:10px;color:var(--fg-muted)}
.toggle-switch{width:36px;height:20px;background:var(--border);border-radius:10px;cursor:pointer;position:relative;transition:background .3s;border:none;padding:0;flex-shrink:0}
.toggle-switch::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--fg-dim);border-radius:50%;transition:all .3s}
.toggle-switch.on{background:var(--accent-dim)}
.toggle-switch.on::after{left:19px;background:var(--accent)}
.show-btn{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--bg);background:var(--accent);border:none;padding:8px 16px;border-radius:var(--radius);cursor:pointer;transition:all .25s;width:100%}
.ws-preview-panel{background:#141414;border:1px solid var(--border);border-radius:var(--radius);min-height:220px;position:relative;overflow:hidden}
.ws-preview-label{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--fg-dim);position:absolute;top:10px;left:12px;z-index:6}
.code-output{margin-top:12px;padding:10px 12px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:10px;color:var(--fg-dim);line-height:1.7;white-space:pre;overflow-x:auto}
.code-output .tag{color:var(--error)}.code-output .attr{color:var(--accent)}.code-output .val{color:var(--success)}
.value-display{float:right;color:var(--accent)}

/* ===== MINI APP SCREEN (for preview) ===== */
.mini-screen{width:100%;height:100%;min-height:160px;padding:12px;position:relative}
.mini-nav{height:12px;display:flex;gap:4px;margin-bottom:8px}
.mini-nav-dot{width:5px;height:5px;border-radius:50%;background:var(--fg-dim)}
.mini-heading{height:10px;width:55%;background:var(--fg-dim);border-radius:1px;margin-bottom:8px}
.mini-text{height:5px;background:var(--border);border-radius:1px;margin-bottom:4px}
.mini-block{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:6px}

/* ===== SNACKBAR ===== */
.snackbar{
  position:absolute;bottom:14px;left:14px;right:14px;
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-radius:var(--radius);
  font-size:12px;font-family:var(--sans);color:#fff;
  transform:translateY(calc(100% + 20px));opacity:0;
  transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s;
  z-index:5;overflow:hidden;
}
.snackbar.visible{transform:translateY(0);opacity:1}
.snackbar-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.snackbar-icon svg{width:16px;height:16px}
.snackbar-body{flex:1;min-width:0}
.snackbar-title{font-weight:600;font-size:11px;font-family:var(--mono);letter-spacing:.5px;text-transform:uppercase;margin-bottom:1px}
.snackbar-msg{font-size:11px;opacity:.85;line-height:1.3}
.snackbar-action{
  font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;
  background:rgba(255,255,255,.15);border:none;color:#fff;
  padding:4px 10px;border-radius:var(--radius);cursor:default;flex-shrink:0;
}
.snackbar-progress{
  position:absolute;bottom:0;left:0;height:2px;
  background:rgba(255,255,255,.35);border-radius:0 0 var(--radius) var(--radius);
  width:0%;transition:width linear;
}
.sb-success{background:#166534}
.sb-error{background:#991b1b}
.sb-info{background:#334155}
.sb-warning{background:#78350f}
</style>
</head>
<body>


<div class="practice-card">
  <div class="practice-goal">
    <strong>Mục tiêu:</strong> Cấu hình snackbar (type, message, duration, action) → thấy trực tiếp kết quả và code tương ứng.
  </div>
  <div class="ws-workspace">
    <div class="ws-controls" id="sb-controls"></div>
    <div>
      <div class="ws-preview-panel" id="sb-preview-panel">
        <div class="ws-preview-label">Preview</div>
        <div class="mini-screen">
          <div class="mini-nav"><div class="mini-nav-dot"></div><div class="mini-nav-dot"></div><div class="mini-nav-dot"></div></div>
          <div class="mini-heading"></div>
          <div class="mini-text" style="width:75%"></div>
          <div class="mini-text" style="width:55%"></div>
          <div class="mini-block" style="margin-top:6px"><div class="mini-text" style="width:40%"></div></div>
          <div class="snackbar" id="sb-user">
            <div class="snackbar-icon" id="sb-user-icon"></div>
            <div class="snackbar-body">
              <div class="snackbar-title" id="sb-user-title">Success</div>
              <div class="snackbar-msg" id="sb-user-msg">Item saved.</div>
            </div>
            <div class="snackbar-action" id="sb-user-action">Undo</div>
            <div class="snackbar-progress" id="sb-user-progress"></div>
          </div>
        </div>
      </div>
      <div class="code-output" id="sb-code"></div>
    </div>
  </div>
  <div class="hint-bar" style="margin-top:8px">Đổi type → nhìn màu đổi. Bật/tắt action → thấy snackbar dài/ngắn khác nhau. Kéo duration → thấy progress chạy nhanh/chậm.</div>
</div>

<script>
const SB_ICONS = {
  success: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#4ade80" stroke-width="1.5"/><path d="M5 8l2 2 4-4" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  error: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#f87171" stroke-width="1.5"/><path d="M6 6l4 4M10 6l-4 4" stroke="#f87171" stroke-width="1.5" stroke-linecap="round"/></svg>',
  info: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#94a3b8" stroke-width="1.5"/><path d="M8 7v4M8 5v.5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/></svg>',
  warning: '<svg viewBox="0 0 16 16" fill="none"><path d="M8 1L1 14h14L8 1z" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 6v3M8 11.5v.5" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/></svg>'
};

const SB_COLORS = {
  success: { bg: '#166534', cls: 'sb-success' },
  error: { bg: '#991b1b', cls: 'sb-error' },
  info: { bg: '#334155', cls: 'sb-info' },
  warning: { bg: '#78350f', cls: 'sb-warning' }
};


// PRACTICE B: SNACKBAR BUILDER
(function(){
  const state = { type: 'success', message: 'Item saved successfully.', duration: 4, showAction: true };
  const actions = { success: 'Undo', error: 'Retry', info: 'Learn more', warning: 'Dismiss' };
  const titles = { success: 'Success', error: 'Error', info: 'Info', warning: 'Warning' };

  const controlsEl = document.getElementById('sb-controls');
  const sb = document.getElementById('sb-user');
  const sbIcon = document.getElementById('sb-user-icon');
  const sbTitle = document.getElementById('sb-user-title');
  const sbMsg = document.getElementById('sb-user-msg');
  const sbAction = document.getElementById('sb-user-action');
  const sbProg = document.getElementById('sb-user-progress');
  const codeEl = document.getElementById('sb-code');

  let showTimer = null;

  function renderControls() {
    controlsEl.innerHTML = `
      <div class="control-group">
        <label>Type</label>
        <div class="style-picker">
          <button class="style-opt active" data-type="success"><span class="style-opt-dot" style="background:#22c55e"></span>Success</button>
          <button class="style-opt" data-type="error"><span class="style-opt-dot" style="background:#ef4444"></span>Error</button>
          <button class="style-opt" data-type="info"><span class="style-opt-dot" style="background:#64748b"></span>Info</button>
          <button class="style-opt" data-type="warning"><span class="style-opt-dot" style="background:#d97706"></span>Warning</button>
        </div>
      </div>
      <div class="control-group">
        <label>Message</label>
        <input type="text" class="text-input" id="sb-msg-input" value="${state.message}">
      </div>
      <div class="control-group">
        <label>Duration <span class="value-display" id="sb-dur-val">${state.duration}s</span></label>
        <input type="range" class="range-slider" min="2" max="8" step="0.5" value="${state.duration}" id="sb-dur-slider">
      </div>
      <div class="control-group">
        <div class="toggle-row">
          <span class="toggle-label">Hiện action button</span>
          <button class="toggle-switch ${state.showAction?'on':''}" id="sb-action-toggle"></button>
        </div>
      </div>
      <button class="show-btn" id="sb-show-btn">Show Snackbar</button>
    `;

    controlsEl.querySelectorAll('.style-opt').forEach(btn => {
      btn.addEventListener('click', function() {
        state.type = this.dataset.type;
        controlsEl.querySelectorAll('.style-opt').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        updatePreview(); updateCode();
      });
    });

    document.getElementById('sb-msg-input').addEventListener('input', function() {
      state.message = this.value;
      updatePreview(); updateCode();
    });

    document.getElementById('sb-dur-slider').addEventListener('input', function() {
      state.duration = parseFloat(this.value);
      document.getElementById('sb-dur-val').textContent = state.duration + 's';
      updateCode();
    });

    document.getElementById('sb-action-toggle').addEventListener('click', function() {
      state.showAction = !state.showAction;
      this.classList.toggle('on', state.showAction);
      updatePreview(); updateCode();
    });

    document.getElementById('sb-show-btn').addEventListener('click', showSnackbar);
  }

  function updatePreview() {
    const c = SB_COLORS[state.type];
    sb.className = 'snackbar ' + c.cls;
    sbIcon.innerHTML = SB_ICONS[state.type];
    sbTitle.textContent = titles[state.type];
    sbMsg.textContent = state.message || '...';
    sbAction.textContent = actions[state.type];
    sbAction.style.display = state.showAction ? '' : 'none';
  }

  function updateCode() {
    const actionLine = state.showAction ? `\n  <span class="tag">action</span>=<span class="val">"${actions[state.type]}"</span>` : '';
    codeEl.innerHTML = `<span class="tag">&lt;Snackbar</span>
  <span class="attr">type</span>=<span class="val">"${state.type}"</span>
  <span class="attr">message</span>=<span class="val">"${state.message || '...'}"</span>
  <span class="attr">duration</span>=<span class="val">${state.duration}s</span>${actionLine}
<span class="tag">/&gt;</span>`;
  }

  function showSnackbar() {
    if (showTimer) return;
    const btn = document.getElementById('sb-show-btn');
    btn.disabled = true;
    const durationMs = state.duration * 1000;
    const appearMs = 400;
    const dismissMs = 400;
    const visibleMs = durationMs - appearMs - dismissMs;

    sb.classList.add('visible');
    sbProg.style.width = '0%';
    let start = Date.now();

    function animate() {
      const elapsed = Date.now() - start;
      if (elapsed < appearMs) {
        sbProg.style.width = '0%';
      } else if (elapsed < appearMs + visibleMs) {
        const pct = ((elapsed - appearMs) / visibleMs) * 100;
        sbProg.style.transition = 'width 0.1s linear';
        sbProg.style.width = pct + '%';
      }
      if (elapsed < durationMs) {
        showTimer = requestAnimationFrame(animate);
      } else {
        sb.classList.remove('visible');
        sbProg.style.width = '0%';
        btn.disabled = false;
        showTimer = null;
      }
    }
    showTimer = requestAnimationFrame(animate);
  }

  renderControls(); updatePreview(); updateCode();
})();
</script>
</body>
</html>
