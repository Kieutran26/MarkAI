<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split Button Practice — markAI</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#131110;--bg-card:#1c1a18;--bg-el:#242120;--border:#302c28;
  --border-active:#d97706;--accent:#d97706;
  --accent-glow:rgba(217,119,6,0.15);--accent-soft:rgba(217,119,6,0.05);
  --fg:#e8e0d4;--muted:#706b64;
  --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;
  --danger:#ef4444;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow-x:hidden;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);
  background-size:20px 20px;pointer-events:none;z-index:0}

#app-root{position:relative;z-index:1;padding:20px; display:flex; flex-direction:column; align-items:center; width:100%; max-width:960px; margin:0 auto;}

.pg{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:20px; width:100%; max-width:960px;}
.pg span{color:var(--accent);font-weight:700}

/* practice area */
.practice-container{
    width:100%;
    max-width:960px;
    background:var(--bg-card);
    border:1px solid var(--border);
    padding:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

.preview-area{
    height: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
    background: var(--accent-soft);
    border: 1px dashed var(--border);
    border-radius: 4px;
}

.split-btn{
    display: flex;
    border-radius: 4px;
    overflow: visible;
    height: 40px;
    position: relative;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3);
}
.main-btn{
    background: var(--accent);
    color: #000;
    border: none;
    padding: 0 24px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.2s;
    border-top-left-radius: 4px;
    border-bottom-left-radius: 4px;
}
.main-btn:hover{ background: #f59e0b; }
.main-btn:active{ transform: scale(0.98); }

.dropdown-btn{
    background: var(--accent);
    color: #000;
    border: none;
    border-left: 1px solid rgba(0,0,0,0.1);
    width: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    border-top-right-radius: 4px;
    border-bottom-right-radius: 4px;
}
.dropdown-btn:hover{ background: #f59e0b; }
.dropdown-btn.open{ background: var(--accent-dim); color: #fff; }

.menu-box{
    position: absolute;
    top: 48px;
    right: 0;
    background: #222;
    border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    border: 1px solid var(--border);
    width: 180px;
    padding: 6px;
    display: none;
    z-index: 100;
}
.menu-box.show{ display: block; animation: slideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes slideIn {
    from { opacity:0; transform: translateY(-10px) scale(0.98); }
    to { opacity:1; transform: translateY(0) scale(1); }
}

.menu-item{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    font-size: 13px;
    color: #ccc;
    border-radius: 2px;
    cursor: pointer;
}
.menu-item:hover{ background: var(--accent); color: #000; }

/* Controls */
.controls-grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    width: 100%;
}

.ctrl-group{
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.ctrl-label{
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 2px;
}
.input-text{
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 10px 14px;
    font-family: var(--sans);
    font-size: 14px;
    border-radius: 4px;
    transition: all 0.2s;
}
.input-text:focus{ outline: none; border-color: var(--accent); background: rgba(0,0,0,0.4); }

.checkbox-row{
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    user-select: none;
    padding: 8px 0;
}
.check-box{
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    border-radius: 2px;
}
.check-box.on{ background: var(--accent); border-color: var(--accent); }
.check-box svg{ display: none; color: #000; }
.check-box.on svg{ display: block; }

.log-area{
    width: 100%;
    height: 80px;
    background: #000;
    border-radius: 4px;
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    overflow-y: auto;
    border: 1px solid var(--border);
    line-height: 1.6;
}

.disabled-state .main-btn, .disabled-state .dropdown-btn{
    background: #333 !important;
    color: #666 !important;
    cursor: not-allowed !important;
    pointer-events: none;
    border-left-color: #222 !important;
}

@media(max-width:480px){
  .practice-container{padding: 24px;}
}
</style>
</head>
<body>
<div id="app-root">
    <p class="pg"><span>Thử thách:</span> Tùy chỉnh Split Button của bạn. Kiểm tra cách các trạng thái <span>Disabled</span> và <span>Icons</span> ảnh hưởng đến trải nghiệm người dùng.</p>

    <div class="practice-container">
        <div class="preview-area">
            <div class="split-btn" id="splitBtn">
                <button class="main-btn" id="mainBtn">
                    <svg id="mainIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    <span id="btnLabel">Download</span>
                </button>
                <button class="dropdown-btn" id="dropBtn">▾</button>
                <div class="menu-box" id="menuBox">
                    <div class="menu-item">Save as PDF</div>
                    <div class="menu-item">Save as PNG</div>
                    <div style="height:1px; background:var(--border); margin:4px 0;"></div>
                    <div class="menu-item">Print...</div>
                </div>
            </div>
        </div>

        <div class="controls-grid">
            <div class="ctrl-group">
                <span class="ctrl-label">Main Label</span>
                <input type="text" class="input-text" id="labelInput" value="Download">
            </div>
            <div class="ctrl-group" style="justify-content: center;">
                <label class="checkbox-row" id="toggleIcon">
                    <div class="check-box"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg></div>
                    <span class="ctrl-label">Show Icon</span>
                </label>
            </div>
            <div class="ctrl-group">
                <span class="ctrl-label">Theme Color</span>
                <div style="display:flex; gap:10px;">
                    <button class="input-text" style="background:#d97706; border:none; width:34px; height:34px; padding:0;" onclick="setColor('#d97706')"></button>
                    <button class="input-text" style="background:#2563eb; border:none; width:34px; height:34px; padding:0;" onclick="setColor('#2563eb')"></button>
                    <button class="input-text" style="background:#059669; border:none; width:34px; height:34px; padding:0;" onclick="setColor('#059669')"></button>
                    <button class="input-text" style="background:#7c3aed; border:none; width:34px; height:34px; padding:0;" onclick="setColor('#7c3aed')"></button>
                </div>
            </div>
            <div class="ctrl-group" style="justify-content: center;">
                <label class="checkbox-row" id="toggleDisabled">
                    <div class="check-box"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="4"><polyline points="20 6 9 17 4 12"/></svg></div>
                    <span class="ctrl-label">Disabled</span>
                </label>
            </div>
        </div>

        <div class="log-area" id="logArea">
            > Ready for testing...
        </div>
    </div>
</div>

<script>
var labelInput = document.getElementById('labelInput');
var btnLabel = document.getElementById('btnLabel');
var toggleIcon = document.getElementById('toggleIcon');
var mainIcon = document.getElementById('mainIcon');
var toggleDisabled = document.getElementById('toggleDisabled');
var splitBtn = document.getElementById('splitBtn');
var mainBtn = document.getElementById('mainBtn');
var dropBtn = document.getElementById('dropBtn');
var menuBox = document.getElementById('menuBox');
var logArea = document.getElementById('logArea');

var isIcon = false;
var isDisabled = false;
var currentTheme = '#d97706';

function log(msg){
    var time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    var div = document.createElement('div');
    div.textContent = `[${time}] > ${msg}`;
    logArea.prepend(div);
}

labelInput.oninput = function(){
    btnLabel.textContent = this.value || 'Button';
};

toggleIcon.onclick = function(){
    isIcon = !isIcon;
    this.querySelector('.check-box').classList.toggle('on', isIcon);
    mainIcon.style.display = isIcon ? 'block' : 'none';
};

toggleDisabled.onclick = function(){
    isDisabled = !isDisabled;
    this.querySelector('.check-box').classList.toggle('on', isDisabled);
    splitBtn.classList.toggle('disabled-state', isDisabled);
};

function setColor(color){
    currentTheme = color;
    mainBtn.style.background = color;
    dropBtn.style.background = color;
    document.documentElement.style.setProperty('--accent', color);
}

mainBtn.onclick = function(e){
    if(isDisabled) return;
    log(`PRIMARY: ${btnLabel.textContent}`);
};

dropBtn.onclick = function(e){
    if(isDisabled) return;
    e.stopPropagation();
    var isOpen = menuBox.classList.contains('show');
    if(!isOpen){
        menuBox.classList.add('show');
        dropBtn.classList.add('open');
        log('MENU: Opened');
    } else {
        closeMenu();
    }
};

function closeMenu(){
    menuBox.classList.remove('show');
    dropBtn.classList.remove('open');
}

window.onclick = closeMenu;

document.querySelectorAll('.menu-item').forEach(item => {
    item.onclick = function(e){
        e.stopPropagation();
        log(`ACTION: ${this.textContent}`);
        closeMenu();
    };
});

</script>
</body>
</html>
